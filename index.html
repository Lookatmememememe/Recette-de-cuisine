s et noix de pécan (recette végétarienne)", "source": "site de recettes d'hiver (14 octobre 2016)", "portions": "4 personnes", "type": "Plat", "ing": ["La courge", "2 petites courges poivrées", "1 c. à s. huile d'olive", "sel, poivre", "1 c. à s. sauce soja", "2 c. à s. sirop d'érable", "¼ c. à s. vinaigre. [« càs » = cuillère à soupe]", "Le couscous", "125 g couscous demi-complet", "1 cube de bouillon de légumes", "1 c. à s. huile d'olive", "2 gousses d'ail hachées", "2 petits poireaux blancs en rondelles", "1 carotte en rondelles", "4 champignons en rondelles", "80 g pois chiches secs", "30 g noix de pécan grillées, hachées", "¼ c. à s. thym séché", "sel, poivre"], "etapes": ["La veille, mettre à tremper les pois chiches dans un saladier d'eau froide au réfrigérateur. Le jour même, les cuire 30 minutes. Préchauffer le four à 200 °C. Couper les courges en deux et évider les graines. Enduire la courge (à l'intérieur seulement) avec de l'huile d'olive, saupoudrer de sel et poivre. Cuire au four 40 minutes, côté intérieur vers le haut. Mélanger la sauce soja, le sirop d'érable et le vinaigre. Badigeonner légèrement la courge avec ce mélange et faire cuire 5-10 min. Conserver la sauce restante. Couscous : cuire la semoule dans du bouillon de légumes selon les instructions du paquet. Saler. Chauffer l'huile à feu moyen-élevé, ajouter l'ail, les poireaux et les carottes, cuire jusqu'à ce que les carottes soient presque tendres. Ajouter les champignons et cuire jusqu'à tendreté. Saler. Ajouter les pois chiches, les noix de pécan, la semoule cuite, le thym et le reste du mélange soja/sirop d'érable/vinaigre. Bien mélanger, mettre de côté jusqu'à la fin de cuisson de la courge. Une fois la courge cuite, évider un peu de chair de chaque demi-courge. Ajouter tous les légumes (dont la chair de courge) à la semoule, réchauffer si nécessaire. Mettre le couscous dans chaque moitié de courge. Assaisonner et servir."]}, {"titre": "Lasagnes à la courge musquée, ricotta et parmesan", "source": "feuille imprimée dont le titre est hors cadre (nom exact non lisible :", "portions": "", "type": "Plat", "ing": ["600 g courge musquée", "1 pot de ricotta", "100 g parmesan", "2 c. à c. moutarde à l'ancienne", "10 cl crème fleurette légère", "feuilles de lasagnes précuites (ou maison)", "suffisamment de lait pour recouvrir le fond du plat", "sel, poivre, graines de moutarde"], "etapes": ["Ustensiles : un plat allant au four, un plat à gratin, un petit saladier.", "Laver la courge et la poser sur un plat allant au four.", "Saupoudrer de sel, poivre et éventuellement de graines de moutarde.", "Cuire à 200 °C jusqu'à ce que la courge soit bien tendre.", "Récupérer la chair à la cuillère et la laisser égoutter dans une passoire fine.", "Mélanger chair de courge, ricotta et 50 g de parmesan.", "Saler, poivrer.", "Préparer un plat à gratin, verser du lait dans le fond (pour recouvrir le fond).", "Disposer 2 épaisseurs de feuilles de lasagne.", "Verser la préparation à la courge puis encore 2 épaisseurs de lasagnes, et ainsi de suite jusqu'à la fin de la farce, en terminant par des feuilles de lasagnes.", "Dans un petit saladier, mélanger la crème, le reste du parmesan et la moutarde.", "Verser sur le dessus des lasagnes, cuire 20 minutes à four chaud (180-200 °C).", "Servir avec une salade relevée à l'huile de noix et moutarde à l'ancienne."]}, {"titre": "Sabayon d'huîtres", "source": "Marie France (décembre 2014), note manuscrite « SUPER RECETTE »", "portions": "6 personnes", "type": "Poisson / fruits de mer", "ing": ["30 huîtres", "5 jaunes d'œufs", "25 cl vin blanc", "25 cl court-bouillon", "1 c. à soupe baies roses concassées", "cerfeuil", "sel et poivre"], "etapes": ["Ouvrir et décoquiller les huîtres, réserver au frais.", "Verser le court-bouillon et le vin blanc dans une casserole, réduire de moitié sur feu vif. Mettre les jaunes d'œufs dans une autre casserole, ajouter 4 c. à soupe d'eau froide et fouetter jusqu'à ce qu'ils soient blancs et mousseux.", "Placer la casserole dans un bain-marie à feu doux et incorporer tout doucement la réduction de bouillon au vin blanc en fouettant sans arrêt. La sauce doit être très mousseuse et onctueuse.", "Répartir le sabayon dans 6 assiettes avec les huîtres. Enfourner et faire gratiner 2 minutes, porte du four entrouverte. Parsemer de baies roses et décorer d'une pluche de cerfeuil. Servir aussitôt."]}, {"titre": "Saint-Jacques et tatin d'endives", "source": "Marie France (décembre 2014 ; année lue « …2014 » en bas, partielle)", "portions": "6 personnes", "type": "Poisson / fruits de mer", "ing": ["Tatins d'endives", "8 endives", "1 citron (jus)", "2 rouleaux de pâte feuilletée", "30 g beurre + 20 g pour les moules", "1 c. à soupe + 6 c. à café de miel", "sel et poivre", "Saint-Jacques", "18 noix de coquilles Saint-Jacques", "1 mandarine", "50 g beurre", "2 c. à soupe huile d'olive à la mandarine", "fleur de sel", "sel et poivre"], "etapes": ["Préparer les tatins. Préchauffer le four à 210 °C (th. 7). Presser le citron. Couper les endives en deux dans la longueur. Dans une sauteuse, faire fondre 30 g de beurre avec 1 c. à soupe de miel. Coucher les endives sur la partie plate. Arroser de jus de citron. Ajouter un filet d'eau et cuire sans couvrir 20 min à feu très doux, en les retournant.", "Beurrer 6 moules à tarte individuels puis découper 6 disques dans la pâte feuilletée à la dimension des moules. Disposer les endives au fond des moules. Additionner 1 c. à café de miel et couvrir de pâte. Enfourner les tatins 25 à 30 min. Réserver dans le four éteint, recouvertes de papier aluminium.", "Préparer les noix de saint-jacques. Laver et sécher la mandarine, râper le zeste, prélever le jus. Faire fondre le beurre dans une poêle et saisir les saint-jacques 1 min sur chaque face. Saler, poivrer. Déglacer à feu vif avec le jus de mandarine.", "Retourner les tatins sur 6 assiettes. Poser 3 saint-jacques sur chacune et saupoudrer de fleur de sel. Arroser d'un filet d'huile d'olive à la mandarine et décorer de zeste de mandarine. Faire un trait de jus de cuisson dans les assiettes. Servir aussitôt."]}, {"titre": "Succès aux marrons", "source": "Marie France (même série)", "portions": "6 personnes", "type": "Dessert", "ing": ["Pour les disques", "250 g poudre d'amande", "350 g sucre en poudre", "50 g fécule", "8 blancs d'œufs", "Pour la garniture", "1 pot de crème de marron", "20 marrons glacés", "30 g amandes effilées", "2 c. à soupe sucre glace", "20 cl crème liquide"], "etapes": ["Préchauffer le four à 180 °C (th. 6). Mélanger poudre d'amande, sucre en poudre et fécule dans un saladier. Monter les blancs en neige très ferme, les incorporer très délicatement au mélange.", "Recouvrir la plaque de papier sulfurisé. Avec la pâte, réaliser 3 disques égaux d'environ 20 cm de diamètre et 1 cm d'épaisseur. Enfourner environ 45 minutes, porte du four entrouverte. Sortir les disques, laisser refroidir sur une grille après les avoir décollés du papier.", "Quand les disques de meringue sont froids, monter la crème liquide en chantilly en ajoutant le sucre glace quand elle est bien ferme.", "Poser un premier disque dans un plat de service. Étaler dessus une couche de crème de marrons en laissant une marge de 2 cm tout autour. Ajouter la moitié des marrons glacés et remplir la marge de chantilly. Recouvrir d'un deuxième disque et procéder de la même façon. Poser enfin le dernier disque, décorer d'un peu de chantilly et d'un ou deux marrons glacés. Faire griller les amandes effilées et en parsemer le succès. Servir bien frais."]}, {"titre": "Röstis de poulet au curry", "source": "Papa en Cuisine (papaencuisine.com)", "portions": "6 galettes", "type": "Viande", "ing": ["2 pommes de terre", "2 blancs de poulet", "1 oignon", "1 œuf", "2 CS flocons d'avoine", "1 CS curry en poudre", "sel et poivre"], "etapes": ["Instructions :", "Éplucher et râper les pommes de terre et l'oignon.", "Ajouter l'œuf, les flocons d'avoine, bien mélanger.", "Détailler les blancs de poulet, les faire revenir dans 1 CS d'huile d'olive avec le curry.", "Les hacher au couteau.", "Ajouter le poulet aux légumes râpés, bien mélanger.", "Placer un cercle dans la poêle et le garnir de préparation sur 1,5 cm d'épaisseur.", "Colorer 5 minutes les galettes sur cette première face.", "Les retourner quand elles commencent à griller et poursuivre la coloration 5 minutes (ou moins).", "Placer les galettes sur une grille et enfourner 10 minutes à 180°."]}, {"titre": "Couteaux farcis", "source": "meilleurduchef.com (Chef Philippe), impression 2/02/15", "portions": "2 personnes", "type": "Poisson / fruits de mer", "ing": ["24 couteaux. Beurre persillé : ¼ botte de persil plat", "2 gousses d'ail", "1 échalote", "1 citron jaune ou vert", "3 c. à soupe poudre d'amandes", "150 g beurre pommade", "sel fin", "poivre du moulin", "piment d'Espelette. Finition : 100 g chapelure"], "etapes": ["Étapes :", "Préparer tous les ingrédients.", "Mettre à tremper les couteaux dans une grande quantité d'eau pendant 1 heure minimum, afin de les dessabler.", "Égoutter les couteaux et les placer sur une plaque à pâtisserie creuse, les mettre à four chaud 5 minutes pour les ouvrir.", "Les sortir du four et les laisser refroidir.", "Pendant ce temps, ciseler le persil finement.", "Éplucher et ciseler finement l'ail et l'échalote.", "Placer le beurre ramolli dans la cuve du mixeur.", "Le faire tourner à vide pour obtenir un beurre pommade sans aucun morceau.", "Y ajouter tous les ingrédients (persil haché, ail et échalote ciselés, sel fin, poivre, piment d'Espelette, amande en poudre).", "Refermer la cuve.", "Mixer finement jusqu'à obtenir un beurre homogène.", "Ajouter enfin le jus d'un citron. Réserver.", "Prendre les couteaux refroidis et les farcir avec une petite spatule métallique.", "Faire de même avec tous les couteaux, les ranger sur une plaque.", "Les tremper délicatement dans la chapelure pour les paner.", "Les placer sur une plaque et les réserver au frais. Ces couteaux peuvent être préparés à l'avance et mis au congélateur ; le jour de la dégustation, les sortir et les placer au four sous le grill ou à la salamandre quelques minutes, le temps que le beurre fonde et que la chapelure gratine.", "Le jour de la dégustation : placer les couteaux sur une plaque sous le grill du four ou une salamandre.", "Lorsque les couteaux sont bien grillés et le beurre entièrement fondu, les retirer… 19. …laisser refroidir très [légèrement] [mot coupé par le bord de la photo] 20. …avant de les dresser sur une assiette en les faisant se chevaucher.", "(Visuel « Saint Valentin » en bas de page 29 : décor, non recette.)"]}, {"titre": "Courgettes farcies", "source": "marmiton.org (1/09/17)", "portions": "", "type": "Plat", "ing": ["2 courgettes", "600 g de porc (annoté à la main : « ou bœuf »)", "poivre", "sel", "50 g huile d'olive", "1 oignon", "20 cl coulis de tomate", "50 g fromage râpé"], "etapes": ["Laver les courgettes, ne pas les peler. Les couper en deux dans le sens de la longueur pour obtenir 4 barquettes. Évider chaque barquette avec une petite cuillère et conserver la chair à part. Faire revenir la chair de courgette dans la moitié de l'huile d'olive avec l'oignon émincé. Ajouter ensuite la viande hachée et faire revenir à nouveau en mélangeant avec une fourchette afin de bien égrener la viande hachée. Dans un plat allant au four, disposer les barquettes de courgettes l'une à côté de l'autre, les remplir de la farce courgette-viande et arroser le tout avec le coulis de tomate ou une boîte de tomates pelées (selon que l'on désire plus ou moins de jus). Mettre au four 200 °C pendant environ 30 à 40 minutes. Quelques minutes avant la fin de la cuisson, parsemer le plat de fromage râpé et poursuivre les dernières minutes de cuisson (le fromage fond). Pour un véritable doré, passer le plat au grill quelques instants.", "Note : Notes manuscrites : « Ajouter du GARAM MASALA à la viande. » ; « pas mis d'huile ».", "Note : Note de l'auteur : Ce plat fait merveille servi avec des pâtes ou du riz (la sauce étant mijotée avec les courgettes farcies, c'est un délice). Choisir dans ce cas le coulis de tomate pour avoir plus de jus."]}, {"titre": "Gâteau invisible courgettes, safran & parmesan", "source": "blog Eryn Folle Cuisine (eryn­follecuisine.canalblog.com, 29 octobre 2", "portions": "6 beaux", "type": "Plat", "ing": ["700 à 750 g courgettes (4 courgettes moyennes)", "2 œufs", "100 g lait", "70 g farine", "20 g beurre fondu", "11 g levure chimique (1 sachet)", "4 à 8 g sel (au goût, goûter à cru)", "1 belle pincée de filaments de safran", "10 g parmesan fraîchement râpé"], "etapes": ["1/ Réduire le safran en poudre au mortier puis le mélanger avec le lait. Laisser infuser le temps de préparer le reste. 2/ Tamiser ensemble la farine et la levure chimique, verser dessus le sel. Parallèlement, battre les œufs dans un saladier jusqu'à ce qu'ils pâlissent et moussent. Ajouter le beurre préalablement fondu, puis le lait parfumé au safran, fouetter. Ajouter progressivement le mélange de farine, sans cesser de battre. 3/ Préchauffer le four à 200 °C. Laver les courgettes, les sécher, puis les peler une lamelle sur deux. Couper de très fines rondelles à la mandoline, les jeter dans le saladier de préparation safranée au fur et à mesure, en remuant délicatement à la cuillère afin de toutes les imbiber entre chaque ajout. 4/ Verser dans le plat carré beurré et fariné, lisser en tassant bien, puis poudrer légèrement de parmesan râpé toute la surface. Enfourner à 200 °C pour 40 minutes. Laisser totalement refroidir dans le moule, réfrigérer puis couper en carrés. Se dégustent froids, ou tiédis au micro-ondes.", "Note : Conseils de l'auteur : se déguste tiède juste après cuisson, mais pour de beaux carrés il faut attendre le complet refroidissement, voire une réfrigération ; le safran s'utilise avec parcimonie ; remplaçable par d'autres épices."]}, {"titre": "Crêpes (pour canard laqué / plats asiatiques — usage non précisé)", "source": "feuille imprimée sans nom de site, photo à 90° (rotation)", "portions": "", "type": "Autre", "ing": ["500 ml (2 tasses) farine tout usage", "2,5 ml (½ c. à thé) sel", "180 ml (¾ tasse) eau bouillante", "15 ml (1 c. à soupe) huile de sésame"], "etapes": ["Dans un bol, déposer la farine, le sel et faire un puits au centre. Ajouter l'eau bouillante et l'huile. Mélanger à la cuillère de bois. Pétrir avec les mains au moins 5 minutes, jusqu'à ce que la pâte soit lisse. Faire un rouleau et laisser reposer 30 minutes. Couper le rouleau en 20 petites boules.", "Les aplatir et les abaisser le plus finement possible, et ce, sans farine. Dans une poêle anti-adhésive sans corps gras, cuire les crêpes à feu doux-moyen environ une minute de chaque côté. Réserver dans une feuille d'aluminium pour éviter qu'elles ne s'assèchent. Servir immédiatement avec le canard et ses garnitures.", "Si vous préparez les crêpes à l'avance, au fur et à mesure de la cuisson, déposez-les sur une assiette tapissée d'un carré de papier parchemin suffisamment grand. Ensuite, séparer chaque crêpe d'un papier parchemin de même dimension. Maintenir l'assiette bien couverte dans une feuille d'aluminium en tout temps, les crêpes séchent rapidement. Réserver. Au moment de servir, réchauffer les crêpes au four."]}, {"titre": "Salade de kale cru et courge butternut rôtie aux noix, sauce citronnée au sésame", "source": "Les recettes de Juliette (lesrecettesdejuliette.fr)", "portions": "4 personnes", "type": "Salade", "ing": ["1 courge butternut", "1 botte de kale", "100 g cerneaux de noix", "1 poignée de graines de sésame", "2 gousses d'ail", "1 échalote", "1 citron (zeste + jus)", "huile d'olive", "sel gris de mer", "poivre du moulin"], "etapes": ["Préchauffer le four à 210 °C (th. 7). Éplucher la courge et la couper en dés. Les placer dans un plat couvert de papier cuisson. Ajouter l'ail en chemise (écrasé avec la peau), verser de l'huile d'olive, saler, poivrer et enfourner à 210 °C pour 15 minutes. Sortir et laisser refroidir. Assaisonnement : mélanger le jus du citron avec 5 c. à s. d'huile d'olive. Saler, poivrer. Laver le kale, couper les feuilles en petits morceaux. Dans un saladier, placer le kale, verser la sauce au citron et masser 2-3 minutes. Laisser reposer 15-20 minutes. Faire torréfier les noix à feu vif 3-4 minutes en les retournant. Laisser refroidir. Émincer l'échalote. Phase finale : verser les dés de courge dans le saladier contenant le kale. Ajouter les noix, les graines de sésame, le zeste de citron et l'échalote émincée. Déguster bien frais.", "Note : Note manuscrite (rose) : « Aussi à voir : Salade avocat / chou kalé / grenade ; Nouilles soba, chou kalé et furikake shiitaké. »"]}, {"titre": "Tarte tatin aux endives et chavignol", "source": "marmiton.org (17/03/17), proposée par dilou", "portions": "4 personnes", "type": "Plat", "ing": ["1 rouleau de pâte feuilletée", "5 endives", "2 crottins de Chavignol", "50 g beurre", "1 c. à café herbes de Provence", "1 c. à soupe sucre", "sel et poivre"], "etapes": ["Couper en quatre les endives dans le sens de la longueur. Les disposer dans une sauteuse et les faire revenir dans la moitié du beurre, à feu doux 25 min ; elles doivent prendre une belle coloration blonde. Dans un moule à manqué, verser l'autre moitié du beurre fondu et saupoudrer de la cuillère à soupe de sucre. Préchauffer le four à 200 °C (th. 6-7). Disposer les quartiers d'endives en rosace au fond du moule (cœur au centre). Couper les crottins de chèvre en tranches fines, les disposer sur les endives, saupoudrer de la moitié de la cuillère d'herbes de Provence ; saler, poivrer. Recouvrir de pâte feuilletée, le bord de la pâte doit glisser entre le moule et les endives. Enfourner 20 min, la pâte doit se soulever et prendre une belle couleur blonde. Prendre une assiette légèrement plus grande que le moule, la poser dessus, retourner d'un geste. Attendre 5 ou 6 secondes, soulever délicatement le moule. Pour finir, saupoudrer avec la moitié des herbes de Provence restantes."]}, {"titre": "Frittata aux blettes & aux champignons", "source": "blog MP Cuisine (mpcuisine.canalblog.com, 2012), version imprimable", "portions": "", "type": "Plat", "ing": ["1 botte de blettes", "4 gros champignons de Paris (200 g)", "3 œufs + 3 blancs d'œuf", "1 oignon", "2 gousses d'ail (dans la version « Manue »)", "80 ml lait", "40 g semoule de blé fine", "20 g beurre (dans la version « Manue »)", "sel et poivre (en mettre pas mal, c'est assez fade)"], "etapes": ["Version de Gaëlle : Laver et rincer les blettes, réserver les feuilles pour une autre utilisation. Tronçonner finement les côtes. Faire suer l'oignon émincé et les côtes de blettes dans une sauteuse jusqu'à tendreté. En fin de cuisson, ajouter les champignons en lamelles. Saler, poivrer. Battre les œufs entiers avec les blancs et le lait. Verser sur les légumes cuits une fois le feu coupé. Mélanger, verser la semoule en pluie et mélanger à nouveau. Verser dans un moule à manqué en silicone. Enfourner environ 30 minutes jusqu'à ce que la pâte soit prise.", "Version de Manue (à tester) : Égoutter les blettes sur du papier absorbant. Faire fondre le beurre dans une sauteuse, y faire revenir l'ail et l'oignon émincés. Ajouter les champignons en lamelles et poursuivre jusqu'à tendreté. Ajouter les blettes et la semoule, cuire encore 5 minutes puis, hors du feu, ajouter le lait, les œufs + les blancs légèrement battus, mélanger bien. Déposer dans un moule en silicone, enfourner 35 minutes. La frittata doit être dorée.", "(Remarque de l'auteur : les feuilles de blettes sont préférables aux côtes, qui ont un goût de terre.) [Température du four non précisée sur la photo.]"]}, {"titre": "Cannelloni de saumon aux poireaux", "source": "Papa en Cuisine (papaencuisine.com), 4/12/15", "portions": "2 personnes", "type": "Poisson / fruits de mer", "ing": ["1 avocat coupé en lamelles", "1 carotte râpée", "2 blancs de poireaux", "4 tranches de saumon fumé (ou de truite fumée)"], "etapes": ["Instructions :", "Enlever la première peau des poireaux et les cuire 30 minutes à la vapeur.", "Les réserver pour les laisser refroidir.", "Enrouler les blancs de poireaux dans les tranches de saumon fumé.", "Tailler en biseau des tronçons de 3 cm de large.", "Disposer les crudités dans l'assiette avec les tronçons saumon-poireaux.", "Assaisonner de vinaigrette balsamique."]}, {"titre": "Tarte rustique au brocoli, bacon et cheddar", "source": "blog KiyaKuisine (kiyakuisine.canalblog.com, 2013), version imprimable", "portions": "4 personnes", "type": "Plat", "ing": ["Pâte", "100 g farine complète", "120 g farine d'épeautre", "1 œuf", "4 c. à s. huile d'olive", "une pincée de sel", "eau", "Garniture", "une petite tête de brocoli", "100 g cheddar", "5 tranches de bacon", "10 cl crème liquide", "2 œufs", "sel et poivre"], "etapes": ["Dans un saladier, mélanger les farines et le sel, former un puits, y mettre l'huile et l'œuf, mélanger grossièrement, et ajouter de l'eau de façon à pouvoir former une boule de pâte homogène. Réserver au frais. Récupérer les fleurettes du brocoli, mettre la tige de côté pour une autre fois (dans une soupe, par exemple). Hacher les fleurettes grossièrement. Faire chauffer un peu d'huile dans une poêle, y mettre à chauffer le brocoli 5 min, jusqu'à ce qu'il soit cuit mais encore croquant. Réserver. Râper le cheddar, ou le couper en petits morceaux. Faire chauffer une poêle sans matière grasse, y cuire le bacon jusqu'à ce qu'il soit croustillant. Le mettre à égoutter sur du papier absorbant et jeter le gras. Couper les tranches en petits morceaux. Dans un saladier, battre les œufs et la crème, ajouter le cheddar râpé, le brocoli et le bacon, saler et poivrer. Préchauffer le four à 200°. Étaler la pâte et la disposer dans un moule à tarte, verser la garniture dessus et l'étaler de manière régulière. Enfourner pour 30 min, déguster immédiatement avec une salade."]}, {"titre": "Gaufre à la purée de carotte", "source": "mamancadeborde.com (26/09/2015). Note manuscrite : « CAROTTE ».", "portions": "", "type": "Autre", "ing": ["750 g carottes", "5 œufs", "220 g farine", "60 g beurre", "1 sachet levure", "75 g fromage de chèvre frais (type Petit Billy)", "150 g bacon", "1 c. à soupe persil ciselé", "sel, poivre", "Nota", "en fonction de la garniture, ajuster la quantité de farine (plus d'ingrédients liquides = plus de farine", "avec gruyère râpé ou bûche de chèvre plutôt que chèvre frais, réduire la farine)"], "etapes": ["Éplucher et laver les carottes. Les cuire 25 à 30 minutes dans une casserole d'eau bouillante. Égoutter puis mixer en purée bien lisse. Ajouter le beurre. Incorporer les œufs, la levure et la farine, bien mélanger. Couper le bacon en lanières et l'ajouter délicatement à la préparation avec le fromage de chèvre émietté. Saler, poivrer, ajouter 1 c. à soupe de persil ciselé. Bien mélanger. Huiler légèrement à l'aide d'un pinceau les moules du gaufrier. Déposer une c. à soupe de pâte dans chaque moule et laisser cuire quelques minutes."]}, {"titre": "Risotto aux champignons sauvages, aux herbes et à la moutarde aux cèpes et brisures de truffe noire", "source": "maille.com (recette Maille), imprimé 4/10/16", "portions": "", "type": "Plat", "ing": ["Risotto", "15 g champignons secs de votre choix", "1 litre bouillon de légumes de bonne qualité", "2 c. à soupe huile d'olive", "1 oignon finement émincé", "100 g champignons de Paris émincés", "200 g riz carnaroli ou arborio", "2 branches d'estragon frais", "150 ml vin blanc sec ou vermouth", "sel et poivre fraîchement moulu", "½ c. à soupe moutarde aux cèpes et aux brisures de truffe noire Maille", "le zeste d'un citron", "15 g beurre doux", "50 g parmesan râpé (plus 20 g au moment de servir)", "Garniture de champignons", "150 g chanterelles et cèpes frais lavés", "20 g beurre", "1 c. à soupe huile d'olive", "une poignée d'estragon frais finement haché"], "etapes": ["Tremper les champignons secs dans de l'eau chaude (non bouillante) 20 min. Égoutter et couper en réservant le liquide.", "Mélanger l'eau des champignons à 1 litre de bouillon de légumes pour obtenir 1,25 litre. Chauffer et laisser frémir à feux très doux.", "Dans une sauteuse, faire revenir les oignons 10 min avec un peu d'huile d'olive jusqu'à peine dorés.", "Ajouter les champignons de Paris, faire revenir quelques minutes.", "Augmenter le feu avant de verser le riz, mélanger pour enrober le riz d'huile 1 minute environ, puis ajouter 2 branches d'estragon.", "Verser le vin blanc ou le vermouth, mélanger jusqu'à ce qu'il s'évapore.", "Ajouter une louche de bouillon, réduire le feu au minimum et mélanger jusqu'à ce que le bouillon ait totalement réduit. Continuer louche par louche en veillant à bien mélanger.", "Ajouter les champignons réhydratés et émincés. Laisser cuire à feux doux 30 minutes.", "Dans une autre poêle, faire revenir chanterelles et cèpes dans 20 g de beurre et 1 c. à soupe d'huile 5 minutes. Saler, poivrer, ajouter les herbes hachées, mélanger à feu doux. Réserver au chaud.", "Ajouter au risotto la moutarde aux cèpes et brisures de truffe, le zeste de citron et une dernière louche de bouillon, mélanger jusqu'à absorption.", "Ajouter le beurre et le parmesan. Couvrir, laisser reposer 1 minute, puis mélanger énergiquement 2 minutes.", "Servir le risotto dressé avec les champignons sautés et une touche de parmesan râpé. Saler et poivrer."]}, {"titre": "Pressé de jeunes poireaux aux gambas rôties", "source": "maille.com, imprimé 4/10/16", "portions": "", "type": "Poisson / fruits de mer", "ing": ["12 poireaux crayons ou poireaux fins", "250 cl bouillon de volaille [« 250cl » tel qu'imprimé, probablement 250 ml]", "2 feuilles de gélatine", "12 gambas décortiquées", "40 ml vinaigre balsamique Maille", "sel", "fleur de sel", "poivre du moulin", "Vinaigrette", "5 c. à soupe huile d'olive aromatisée truffe", "40 ml vinaigre balsamique Maille", "1 c. à café moutarde de Dijon"], "etapes": ["Préparation — la veille :", "Laver les poireaux à l'eau tiède.", "Les cuire dans l'eau bouillante salée une dizaine de minutes, les retirer dans l'eau glacée, puis les égoutter sur un linge.", "Chauffer le bouillon de volaille, incorporer la gélatine ramollie et le vinaigre balsamique.", "Dans une petite terrine, disposer les poireaux en longueur en les superposant, et en incorporant entre chaque étage une louche de bouillon de volaille.", "Fermer la terrine avec du film et la déposer au réfrigérateur jusqu'au lendemain.", "Le lendemain :", "Réaliser la vinaigrette en mélangeant la moutarde, le sel, le poivre et le vinaigre balsamique. Incorporer l'huile d'olive aromatisée truffe au fouet, réserver.", "Démouler le pressé, tailler avec un couteau aiguisé 6 belles tranches et les disposer dans un plat.", "Dans une poêle antiadhésive, poêler les gambas avec une pointe d'huile d'olive truffe, assaisonner de sel et poivre et les disposer autour du pressé.", "Arroser généreusement les tranches de vinaigrette et servir le reste en saucière."]}, {"titre": "Blinis", "source": "Papa en Cuisine (papaencuisine.com/blinis), 4/12/15", "portions": "", "type": "Autre", "ing": ["1 yaourt grec (ou bulgare, ou normal)", "1 pot du yaourt de farine", "1 œuf", "½ sachet de levure et une pincée de sel"], "etapes": ["Instructions :", "Tout mélanger et reposer au frigo 1 h (c'est mieux).", "Mettre 1 CS de pâte dans une poêle bien chaude et retourner quand les trous apparaissent."]}, {"titre": "Crumpets", "source": "Papa en Cuisine (papaencuisine.com/crumpets)", "portions": "", "type": "Autre", "ing": ["450 ml eau tiède", "250 ml lait", "375 g farine", "3 CS sucre (environ 50 g)", "1 sachet de levure déshydratée", "1 pincée de sel"], "etapes": ["Instructions :", "Diluer la levure dans l'eau tiède, mais surtout pas chaude.", "Ajouter le reste des ingrédients et mixer.", "Laisser pousser la pâte, elle va doubler de volume et devenir mousseuse.", "Disposer des cercles graissés sur une poêle huilée et bien chaude.", "Remplir à hauteur de 2 cm et laisser cuire doucement.", "Lorsque les premières bulles apparaissent, enlever le cercle et retourner le crumpet.", "Servir ouvert en deux, accompagné de confiture, de miel, de pâte à tartiner."]}, {"titre": "Carré d'agneau mariné à l'ail", "source": "magazine (rubrique « Le thème de juillet », « Du filet non désossé »)", "portions": "4 personnes", "type": "Viande", "ing": ["1 petite tête d'ail frais", "2 c. à c. sel", "2 c. à s. jus de citron", "2 c. à s. huile d'olive", "2 carrés d'agneau, 800 g env.", "2-3 branchettes de thym"], "etapes": ["1 Éplucher l'ail et le mixer avec le sel en une purée lisse. Ajouter le jus de citron et l'huile d'olive, puis mixer brièvement le tout. En badigeonner la viande et laisser mariner 1-2 heures. 2 Préchauffer le four à 220 °C. Parsemer la viande de feuilles de thym et faire cuire 10 minutes au milieu du four. Réduire la température à 180 °C et poursuivre la cuisson 20-25 minutes. Laisser reposer 10 minutes avant de trancher. Accompagner de la salade au pain de la page 14 [page non photographiée].", "Note : Note manuscrite en haut de la photo (coupée) : « …ion 40 minutes » [illisible]."]}, {"titre": "Chou-fleur rôti caramélisé d'Hélène", "source": "ricardocuisine.com (imprimé 20/01/14)", "portions": "", "type": "Plat", "ing": ["10 ml (2 c. à thé) sucre", "2,5 à 5 ml (½ à 1 c. à thé) sel", "2,5 ml (½ c. à thé) curcuma moulu", "2,5 ml paprika", "2,5 ml poudre d'oignon", "2,5 ml poudre d'ail", "90 ml (6 c. à soupe) huile d'olive, selon la grosseur du chou-fleur", "1 chou-fleur coupé en petits bouquets"], "etapes": ["Placer la grille au centre du four. Préchauffer à 230 °C (450 °F). Chemiser une plaque à biscuits de papier parchemin.", "Dans un bol, mélanger le sucre, le sel, les épices et l'huile. Enrober les bouquets de chou-fleur. Cuire au four environ 25 minutes ou jusqu'à ce que le chou-fleur soit cuit et doré."]}, {"titre": "Tajine d'agneau et de potiron au miel et safran", "source": "épicurien.be (10.09.2006)", "portions": "4 personnes", "type": "Viande", "ing": ["1 épaule d'agneau désossée d'environ 800 g", "800 g potiron", "3 oignons", "50 ml huile d'arachide ou de tournesol", "1 c. à café de chacun : cumin, coriandre, gingembre, paprika, en poudre", "½ c. à café cannelle", "safran", "30 g beurre", "2 c. à soupe miel liquide", "sel et poivre", "1 botte de coriandre fraîche"], "etapes": ["Faire infuser le safran dans de l'eau tiède, au moins une heure avant. Couper la viande en cubes. Éplucher et émincer les oignons. Éplucher le potiron et le couper en tranches assez épaisses. Préchauffer le four à 160°. Ciseler les feuilles de coriandre. Cuisson : Dans un récipient, mélanger intimement les cubes de viande, les épices et le sel. Dans une poêle, chauffer la moitié de l'huile et y faire revenir les morceaux de viande jusqu'à ce qu'ils soient dorés. Les retirer et les mettre dans le plat à tagine ; faire revenir les oignons émincés dans la poêle en rajoutant de l'huile. Ajouter les oignons à la viande dans le plat à tagine, y verser 2 verres d'eau et cuire au four pendant 1 heure. Dans une poêle, faire dorer sur ses 2 faces le potiron dans le beurre, ajouter le miel et en napper les tranches de potiron. Ajouter à la viande et cuire encore ½ heure. Au moment de servir, mettre la coriandre ciselée sur la viande et le potiron. Servir chaud.", "Suggestions : accompagner de couscous, boulgour ou céréales. (⚠ Contient de la coriandre fraîche et en poudre.)"]}, {"titre": "Croustillants d'agneau (feuilles de brick)", "source": "magazine (rubrique « Beau et bon », « On s'emballe pour les… »)", "portions": "", "type": "Viande", "ing": ["700 g selle d'agneau désossée", "4 feuilles de brick", "1 gousse d'ail", "2 c. à soupe huile d'olive", "50 g beurre", "1 c. à soupe pastis", "1 c. à café herbes de Provence", "4 brins de persil", "sel, poivre"], "etapes": ["Mélanger l'ail pressé, le persil haché et les herbes de Provence avec l'huile, le pastis, sel et poivre. Découper l'agneau en quatre dans la longueur puis le mélanger à la préparation. Enduire les feuilles de brick de beurre fondu des deux côtés. Dans une poêle très chaude, saisir les morceaux d'agneau 1 min sur toutes les faces. Les enrouler dans les feuilles de brick. Enfourner 20 min à 210 °C (th. 7). Couper les rouleaux en biseau et servir bien chaud."]}, {"titre": "Crumble d'agneau aux pommes", "source": "magazine Prima (p", "portions": "4 personnes", "type": "Viande", "ing": ["Viande", "400 g épaule d'agneau cuite ou reste d'un gigot", "150 g lard fumé", "600 g pommes reinettes", "50 g raisins secs", "2 c. à soupe calvados (ou cognac ou porto)", "40 g beurre", "cannelle en poudre", "noix muscade", "sel, poivre", "Crumble", "85 g farine", "75 g flocons d'avoine", "125 g beurre mou", "sel"], "etapes": ["Dans une terrine, mélanger la farine avec 2 pincées de sel et les flocons d'avoine. Incorporer le beurre en morceaux en frottant la pâte entre vos mains pour la consistance d'un gros sable. Laisser durcir 1 h au frais. Arroser les raisins secs avec le calvados pour les faire gonfler. Découper l'agneau cuit en petits morceaux. Découenner, puis hacher le lard. Peler et épépiner les pommes, les couper en lamelles. Faire dorer le lard à sec, réserver-le. Jeter le gras rendu, le remplacer par 40 g de beurre, ajouter les lamelles de pommes et cuire 10 min en remuant souvent. Les mélanger avec les viandes, puis ajouter les raisins au calvados. Saupoudrer d'un peu de cannelle et de noix muscade râpée. Préchauffer le four th. 6-7 (200 °C). Étaler la préparation à l'agneau dans une tourtière à bord amovible. Recouvrir de la pâte à crumble, puis enfourner 25 min environ. Le dessus doit être bien doré et croustillant. Servir avec une salade mélangée (roquette, trévise, frisée) bien relevée.", "Encadré « Le nez du vin » : Château de Montguéret, saumur blanc 1999 (accord suggéré).", "Note : Variante : ajouter à l'agneau un reste de pot-au-feu, quelques dés de céleri et des petits oignons (préalablement blanchis)."]}, {"titre": "Tagine d'agneau aux noix", "source": "manuscrit", "portions": "4 pers", "type": "Viande", "ing": ["800 g d'agneau", "2-3 c. à soupe d'huile d'olive", "2 gros oignons coupés en 4", "gingembre, cannelle, coriandre, cumin", "4 morceaux d'écorce d'orange", "1 pièce de cannelle", "1 c. à soupe de cassonade", "bouillon de poulet ou d'agneau", "10 figues sèches", "12 noix"], "etapes": ["Four 180 °C. Saler, poivrer l'agneau, le faire colorer dans la cocotte puis réserver.", "Poser l'oignon au fond, redéposer l'agneau. Ajouter toutes les épices, la cannelle et le sucre.", "Ajouter 500 ml d'eau ou de bouillon (assaisonné si c'est de l'eau), en ajouter pour remplir ⅓.", "Couvrir, enfourner 3 h ; ajouter les noix et les figues 1 h avant la fin. Si servi le lendemain : ≈ 45 min au four.", "Note : Manuscrit : quelques mots interprétés (« écorce d'orange », « cassonade », « remplisse ⅓ »)."]}, {"titre": "Filet d'agneau en croûte de noix", "source": "découpe de magazine ; préparation 10 min + marinade 2-3 jours ; cuisson 50 min", "portions": "4 pers", "type": "Viande", "ing": ["4 filets d'agneau (200 g)", "5 dl de babeurre nature", "50 g de noix", "½ petit pain au lait", "1 à 3 gousses d'ail", "quelques feuilles de sauge", "½ c. à s. de moutarde", "huile ou beurre", "sel et poivre du moulin"], "etapes": ["Badigeonner les filets avec la moutarde, les ranger côte à côte dans un récipient.", "Peler l'ail et le couper en tranches, hacher la sauge.", "Marinade : mélanger le babeurre, l'ail et la sauge, en arroser la viande, laisser mariner 2 à 3 jours à couvert au frais.", "Le jour même, retirer la viande, essuyer l'excès de marinade, saler, poivrer.", "Préchauffer le four et le plat à viande à 80 °.", "Hacher finement petit pain et noix, tourner la viande dans ce mélange en pressant bien.", "Chauffer l'huile ou le beurre, réduire la chaleur, saisir la viande 3-4 min de chaque côté, la poser sur le plat et laisser reposer ≈ 45 min dans le four à 80 °.", "Note : Note manuscrite : « + citron »."]}, {"titre": "Poulet rôti délicieux au four", "source": "site de recettes québécois (auteur chaton416, 2013-03-22)", "portions": "", "type": "Viande", "ing": ["1 poulet entier de 1,5 kg", "2 c. à soupe beurre", "1 c. à thé sel ou au goût", "2 c. à soupe poudre d'ail", "1 c. à soupe paprika", "1 c. à soupe thym", "1 c. à soupe basilic", "1 c. à soupe origan", "1 cube de bouillon de poulet", "eau (quantité selon le cube)"], "etapes": ["Déposer le poulet dans un plat allant au four.", "Badigeonner la peau de beurre.", "Mélanger toutes les épices.", "Parsemer le mélange sur le poulet.", "Verser le bouillon de poulet dans le fond du plat.", "Cuire au four à 250 °C pendant 1 heure à couvert, puis 30 minutes à découvert afin que la peau prenne couleur.", "Commentaire de l'auteur : parfois, des légumes (carottes, pommes de terre…) sont ajoutés au fond du plat.", "Note : Note manuscrite en bas (suite sur photo 53) : « poudre d'ail, paprika [un mot barré], thym, … » puis, en haut de la photo 53 : « …et tournesol [?], laurier et sel ». ⚠ Liste manuscrite coupée entre deux photos et en partie illisible : à vérifier."]}, {"titre": "Gaspacho", "source": "manuscrit, très bref", "portions": "", "type": "Curry / soupe", "ing": ["concombre", "tomate concassée", "huile d'olive", "poivrons (selon goût)", "citron ou vinaigre", "eau (si trop sirupeux)", "croûtons (tranches)"], "etapes": ["Mixer le concombre, la tomate concassée et l'huile d'olive. Ajouter des poivrons selon le goût.", "Assaisonner avec du citron ou du vinaigre.", "Si c'est trop épais (« sirupeux »), ajouter de l'eau.", "Servir avec des croûtons (tranches de pain).", "Note : Fiche manuscrite très brève, sans quantités (normal)."]}, {"titre": "Coquilles Saint-Jacques rôties aux herbes et parmesan", "source": "magazine", "portions": "", "type": "Poisson / fruits de mer", "ing": ["30 noix de saint-jacques fraîches ou surgelées", "50 g parmesan fraîchement râpé", "50 g beurre mou", "huile d'olive", "2 c. à soupe de fines herbes hachées", "2 pincées de piment d'Espelette", "poivre blanc du moulin", "sel"], "etapes": ["Allumer le four position gril. Sortir la plaque en tôle, la tapisser d'une feuille sulfurisée huilée et poser les noix de saint-jacques dessus. Mélanger le beurre mou, les herbes hachées, le piment, du sel, du poivre et 2 ou 3 c. à soupe d'huile d'olive et étaler cette pâte sur les noix. Saupoudrer de parmesan et faire cuire sous le gril, à environ 15-20 cm, pendant 5 à 6 min. Servir aussitôt en nappant les noix dans les assiettes d'un peu de jus de cuisson.", "À table + : si vous utilisez des noix de saint-jacques surgelées, mettez-les dans le lait le temps de les décongeler.", "Note : Début d'une autre recette à droite de la photo (velouté de pois cassés), non transcrit."]}, {"titre": "Gigot d'agneau farci chèvre et menthe", "source": "Cuisine Actuelle (p", "portions": "6 personnes", "type": "Viande", "ing": ["1 gigot d'agneau désossé d'1,5 kg", "1 bûche de chèvre", "1 bouquet de menthe", "50 g beurre demi-sel mou", "1 c. à s. de cumin", "sel et poivre du moulin"], "etapes": ["Préchauffer le four à 200 °C (th. 7). Dérouler le gigot. Saler et poivrer. Parsemer de la moitié du cumin et des feuilles de menthe. Couper la bûche en deux et placer sur la moitié du gigot. Fermer et ficeler. Saler, poivrer et poser dans un plat à four. Étaler dessus le beurre et parsemer du reste de cumin. Verser 3 c. d'eau dans le plat et mettre au four 45 min. Arroser souvent. Retirer le gigot, couvrir de papier alu. Poser le plat sur le feu, verser 15 cl d'eau chaude en remuant pour décoller les sucs, saler, poivrer. Servir la viande tranchée, avec son jus et des haricots verts ou en grains.", "Note : Le conseil de Sophie : remplacer le gigot par une épaule d'agneau, et le chèvre par du saint-marcellin ou du gorgonzola."]}, {"titre": "Tortilla aux épinards", "source": "magazine (« À table – Coaching en famille »)", "portions": "", "type": "Plat", "ing": ["450 g épinards surgelés", "6 œufs", "20 cl crème fraîche liquide", "8 feuilles de basilic", "100 g fromage râpé (tome de brebis ou comté)"], "etapes": ["Préchauffer le four à th. 6 / 180 °. Cuire les épinards comme indiqué sur le paquet (environ 10 min au micro-ondes). Dans un grand bol, battre 6 œufs avec 20 cl de crème fraîche liquide. Ajouter le fromage râpé, les épinards bien égouttés, le basilic lavé, séché et ciselé. Saler et poivrer. Verser la préparation dans un moule anti-adhésif et enfourner 30 min. Servir froid, coupé en parts ou en cubes."]}, {"titre": "Nems au crabe et au chou frisé", "source": "blog « Mes découvertes gourmandes et œnophiles… » (29 août 2008)", "portions": "6 nems", "type": "Poisson / fruits de mer", "ing": ["6 galettes de riz", "1 boîte de miettes de crabe", "1 carotte râpée", "6 c. à soupe de chou frisé émincé et blanchi", "50 g fromage frais", "1 pincée de gingembre", "2 c. à soupe de sauce aigre-douce", "1 c. à soupe de sauce soja", "huile d'olive"], "etapes": ["Mélanger la chair de crabe avec le jus de citron [le citron n'est pas dans la liste d'ingrédients], le gingembre, la sauce aigre-douce et la sauce soja.", "Assouplir les galettes en les trempant dans une assiette d'eau chaude, les essuyer avec du papier absorbant.", "Garnir chaque galette avec de la chair de crabe, une noisette de fromage frais, un peu de carotte et un peu de chou. Replier les bords de la galette et rouler serré.", "Dans une poêle, chauffer de l'huile d'olive. Faire cuire les nems 1 à 2 minutes. Les déposer sur du papier absorbant. Servir avec un peu de sauce soja."]}, {"titre": "P'tite marmite du pêcheur en croûte feuilletée", "source": "blog « Un p'tit tour dans ma cuisine ». Pour 3 personnes.", "portions": "3 personnes", "type": "Curry / soupe", "ing": ["1 rouleau de pâte feuilletée", "1 boîte de bisque de homard (300 g)", "150 g cabillaud sans peau ni arêtes", "150 g saumon sans peau ni arêtes", "100 g crevettes roses cuites et décortiquées", "10 cl crème fraîche liquide (15 % MG)", "1 blanc de poireau", "1 petite carotte", "10 cl eau", "1 jaune d'œuf", "huile d'olive", "sel, poivre"], "etapes": ["Préchauffer le four à 200 °C. Laver et couper le poireau en fines rondelles, les faire fondre à feu doux dans une poêle avec un léger filet d'huile d'olive et un peu d'eau. Saler, poivrer. Remuer de temps en temps. Peler, laver et râper la carotte. Couper les poissons en petits morceaux. Répartir dans les bols les crevettes, les morceaux de poisson, le poireau et la carotte râpée. Saler légèrement, poivrer. Mélanger. Dans une petite casserole, chauffer la bisque de homard, l'eau et la crème. Verser dans les bols. Étaler la pâte feuilletée et, à l'aide d'un bol de diamètre supérieur, découper 3 disques de pâte. Dessiner un quadrillage avec le dos du couteau. Humecter légèrement les bords et la poser sur les bols en appuyant doucement. Dans un bol, mélanger le jaune d'œuf avec un peu d'eau, l'étaler sur la pâte au pinceau. Faire un petit trou au centre pour laisser s'échapper la vapeur. Enfourner pour [temps coupé par le bord de la photo — « … minutes environ »] en baissant la température du four à 180 °C."]}, {"titre": "Cailles farcies aux raisins et cognac", "source": "site de recettes (« Par Paul T » ; note 3,7/5)", "portions": "", "type": "Viande", "ing": ["4 belles cailles", "3 grappes de raisin ou 150 g de raisins secs", "6 cl cognac", "vinaigre de vin", "beurre", "huile d'olive", "romarin", "sel & poivre"], "etapes": ["Étape 1 : faire macérer un quart d'heure les raisins en morceaux avec le vinaigre, le sel et le poivre, et un peu de cognac. Étape 2 : en farcir les cailles vidées. Les faire saisir à feu vif dans du beurre et de l'huile dans une cocotte, sur toutes les faces. Étape 3 : faire mijoter 15 minutes, à couvert, puis flamber au cognac. Étape 4 : ajouter le mélange de raisins marinés et le romarin dans la cocotte. Faire cuire de nouveau 10 minutes à feu plus fort et à découvert."]}, {"titre": "Saucisson brioché", "source": "manuscrit", "portions": "", "type": "Autre", "ing": ["200 g farine", "15 g levure de boulanger ou de boulangerie [« de boulanger ou Briochin » : lecture incertaine]", "4 c. à soupe de lait tiède", "1 pincée de sel", "3 c. à soupe de sucre", "3 œufs", "100 g beurre fondu. (Un trait vertical englobe ces ingrédients et les trois premières étapes.)"], "etapes": ["Mettre 3 œufs dans un saladier, les battre, y ajouter la levure délayée dans le lait tiède, puis le beurre, la farine et le sucre. Mélangez le tout. Laissez reposer 2 h au moins. Faire cuire le saucisson en 1er [d'abord], enlever la peau. Beurrer un moule à cake, mettre un peu de pâte au fond + le saucisson, et verser le reste dessus. Cuire 20 à 25 min à four 180°."]}, {"titre": "Raie au beurre noisette", "source": "magazine, recettes Sandrine Giacobetti, photos Jérôme Bilic ; prép. 20 min, cuisson 20 min", "portions": "4 pers", "type": "Poisson / fruits de mer", "ing": ["1 aile de raie de 1,5 kg (ou 2 petites ailes)", "2 c. à soupe de vinaigre de vin blanc", "100 g de beurre", "4 c. à soupe de câpres au vinaigre", "sel, poivre", "pommes vapeur (accompagnement)"], "etapes": ["Laver soigneusement la raie, la mettre dans un faitout avec le vinaigre, couvrir d'eau froide, porter à ébullition, cuire 15 min à petits frémissements.", "Chauffer 100 g de beurre dans une grande poêle, le retirer du feu dès qu'il se colore et sent la noisette. Ajouter les câpres égouttées, réserver sur feu très doux.", "Peler la raie, la couper en 4, la réchauffer doucement dans la poêle. Saler, poivrer, répartir sur 4 assiettes, arroser de beurre noisette, servir aussitôt avec des pommes vapeur.", "Note : À table + : demander au poissonnier de retirer la peau à cru ; cuire alors la raie à la poêle avec un peu de beurre et l'arroser au dernier moment du beurre noisette aux câpres.", "Note : En savoir + : rincer la raie à plusieurs eaux (mucosités) ; pas d'arêtes mais un cartilage ; bien la cuire et la servir vite, sinon elle devient gélatineuse."]}, {"titre": "Raie au beurre citronné et gingembre", "source": "magazine, recettes Sandrine Giacobetti, photos Jérôme Bilic ; prép. 20 min, cuisson 20 min", "portions": "4 pers", "type": "Poisson / fruits de mer", "ing": ["1,5 kg d'aile de raie", "3 cm de gingembre frais", "1 citron", "125 g de beurre demi-sel", "1 poireau", "3 branches de thym", "1 feuille de laurier", "quelques brins de ciboulette", "pommes de terre (accompagnement)", "2 l d'eau salée"], "etapes": ["Porter à ébullition 2 l d'eau salée dans un faitout avec le jus d'½ citron, le poireau, le laurier et le thym, 10 min.", "Laver la raie dans plusieurs eaux, la poser dans le court-bouillon, laisser frémir, couvrir, cuire doucement 10 min.", "Faire fondre le beurre avec le jus de l'½ citron restant. Peler le gingembre et le râper au-dessus du beurre fondu, poivrer. Hors du feu, ajouter la ciboulette en gros tronçons.", "Servir la raie sur des pommes de terre grossièrement écrasées, arrosée de beurre de gingembre."]}, {"titre": "Salade de raie, frisée et vinaigrette tiède", "source": "magazine, recettes Sandrine Giacobetti, photos Jérôme Bilic ; prép. 25 min, cuisson 15 min", "portions": "4 pers", "type": "Salade", "ing": ["1 kg de raie", "½ citron", "1 cœur de salade frisée", "20 tomates-cerises", "1 c. à soupe de câpres", "3 c. à soupe d'huile de tournesol", "1 c. à soupe de vinaigre de cidre", "1 c. à café de moutarde à l'ancienne", "2 pincées de curry en poudre", "6 brins de persil plat", "sel, poivre"], "etapes": ["Laver la raie, la mettre dans un faitout avec le jus du citron, couvrir d'eau froide, porter à ébullition, cuire 15 min à petits frémissements.", "Laver, sécher et émincer la salade. Égoutter la raie, la peler, l'émincer.", "Vinaigrette : mélanger moutarde et vinaigre, ajouter l'huile, faire tiédir. Hors du feu, ajouter curry et persil haché, saler, poivrer.", "Déposer sur 4 assiettes la salade, la raie émincée, les câpres égouttées, les tomates-cerises coupées en 2. Arroser de vinaigrette tiède, poivrer, servir aussitôt.", "Note : À table + : ajouter des pommes de terre tièdes en rondelles ; remplacer le persil par de la ciboulette."]}, {"titre": "Tarte au bleu et aux endives", "source": "fiche Tarte en Or feuilletée (Herta) / lait concentré Gloria", "portions": "4 portions", "type": "Plat", "ing": ["1 pâte feuilletée prête à dérouler Herta", "2 endives", "1 briquette de 20 cl de lait concentré non sucré Gloria", "2 œufs", "1 grosse tomate", "50 g fromage bleu d'Auvergne", "5 brins de cerfeuil", "1 c. à soupe farine", "sel, poivre"], "etapes": ["Préchauffer le four Th.7 (220 °C).", "Dans un saladier, battre œufs et farine, ajouter le lait Gloria, saler, poivrer.", "Laver et couper la tomate en dés.", "Essuyer et émincer les endives.", "Couper le bleu en dés.", "Dérouler la pâte dans un moule à tarte en gardant la feuille de cuisson, piquer à la fourchette.", "Répartir les endives dessus.", "Verser l'appareil, répartir bleu et tomates, saupoudrer de cerfeuil.", "Cuire environ 25 min.", "Suggestion : remplacer les endives par du poireau."]}, {"titre": "Aubergines à la parmesane", "source": "coupure de presse (non identifiée). 4 personnes.", "portions": "", "type": "Plat", "ing": ["800 g aubergines bien fermes", "400 g tomates", "150 g jambon de Parme en fines tranches (facultatif)", "2 mozzarellas de bufflonne", "100 g parmigiano reggiano fraîchement râpé", "½ bouquet de basilic", "huile pour friture (bassine)", "sel, poivre noir du moulin", "gros sel", "huile"], "etapes": ["Laver les aubergines sans les peler, les couper en fines tranches dans la longueur, les disposer dans une passoire, parsemer de gros sel, laisser dégorger 1 h. Entailler les tomates en croix, les plonger 15 s dans l'eau bouillante puis dans l'eau froide, les peler, les couper en rondelles pas trop fines. Couper la mozzarella en tranches d'environ ½ cm. Ciseler 2 c. à soupe de feuilles de basilic. Essuyer les aubergines au papier de cuisine, les frire à la friteuse, les égoutter sur papier, les saler. Préchauffer le four à 180 °C (th 5). Huiler un plat à gratin. Ranger une couche de tomates, puis d'aubergines, puis tomates, mozzarella et jambon de Parme ; saler, poivrer légèrement entre chaque couche, continuer dans le même ordre. Parsemer de basilic, recouvrir de parmesan râpé. Enfourner 30 min au milieu du four. Servir bien chaud."]}, {"titre": "Cake à la feta et aux herbes fraîches", "source": "fiche imprimée (non identifiée)", "portions": "", "type": "Entrée", "ing": ["180 g farine", "1 sachet de levure", "3 œufs", "100 g gruyère râpé", "10 cl huile d'olive", "4 c. à café huile végétale", "10 cl lait", "200 g feta", "2-3 poignées d'herbes fraîches (basilic, persil, ciboulette)", "1 noix de beurre", "1 pincée de sel", "poivre"], "etapes": ["Préchauffer le four à 180 °C (th 6). Dans une jatte, mélanger levure et farine. Dans un autre récipient, battre au fouet les œufs entiers, l'huile et le lait ; saler, poivrer.", "Verser la préparation aux œufs sur la farine, mélanger délicatement, ajouter le gruyère râpé, incorporer la feta coupée en dés et les herbes ciselées.", "Verser dans un moule à cake beurré et légèrement fariné. Cuire environ 50 min. Laisser refroidir avant de démouler."]}, {"titre": "Cake au roquefort, noix et poire (ou lard)", "source": "Fusion : fiche imprimée (photo 65) et « Les Cakes de Sophie », p. 118 (photo 150) – adaptée par Lud", "portions": "", "type": "Entrée", "ing": ["180 g farine", "1 sachet levure", "3 œufs", "100 g gruyère râpé", "10 cl huile végétale", "4 c. à soupe huile de noix", "10 cl lait", "150 g roquefort", "100 g cerneaux de noix", "2 poires (optionnel)", "50 g de lard en lamelles (optionnel)", "1 c. à c. d'huile de tournesol (pour le lard)", "1 noix de beurre", "1 pincée de sel", "poivre"], "etapes": ["Préchauffer le four à 180 °C (th 6). Mélanger levure et farine. Battre au fouet œufs entiers, huile et lait ; saler, poivrer.", "Verser l'appareil aux œufs sur la farine, ajouter le gruyère, mélanger avec précaution.", "Incorporer roquefort, noix et poires (si utilisées), le tout préalablement coupé en morceaux.", "Variante lard : couper le lard en lamelles, le faire revenir 2 min à feu vif avec 1 c. à c. d'huile, ajouter les noix concassées, laisser rissoler 5 min à feu doux ; émietter le roquefort dessus, mélanger, incorporer à la pâte.", "Verser dans un moule à cake beurré et légèrement fariné. Cuire environ 50 min. Laisser refroidir avant de démouler.", "Note : Décision Lud (9.10) : une seule fiche ; poire ou lard = optionnels.", "Note : Variante du livre (photo 150) : bleu d'Auvergne (200 g) + 50 g de noix concassées à la place du roquefort.", "Note : Cuisson : 180 °C, 45 à 50 min."]}, {"titre": "Cake au pesto et aux pignons", "source": "même série de fiches.", "portions": "", "type": "Entrée", "ing": ["180 g farine", "1 sachet levure", "3 œufs", "100 g gruyère râpé", "5 cl huile d'olive", "10 cl lait", "1 poignée de pignons", "1 pincée de sel", "poivre", "Pour 150 g de pesto", "3 grands bouquets de basilic frais", "3 gousses d'ail", "50 g pignons de pin", "4 c. à soupe parmesan fraîchement râpé", "10 cl huile d'olive", "gros sel"], "etapes": ["Pesto : passer au mixeur sel, feuilles de basilic, ail et pignons. Mêler le parmesan à la fourchette. Verser l'huile en battant à la fourchette.", "Préchauffer le four à 180 °C (th 6). Dans une grande jatte, mélanger levure et farine. Dans un autre récipient, battre au fouet œufs entiers, sel, huile et lait ; poivrer.", "Verser l'appareil sur la farine, mélanger délicatement, ajouter le gruyère, incorporer pesto et pignons.", "Verser dans un moule à cake beurré et fariné, cuire environ 50 min. Vérifier avec la pointe d'un couteau (ressort non collante). Laisser refroidir avant de démouler."]}, {"titre": "Cake aux figues et au jambon cru", "source": "même série de fiches.", "portions": "", "type": "Entrée", "ing": ["180 g farine", "1 sachet levure", "3 œufs", "100 g gruyère râpé", "10 cl huile d'olive", "10 cl lait", "200 g figues", "100 g jambon cru", "1 pincée de sel", "poivre"], "etapes": ["Préchauffer le four à 180 °C (th 6). Dans une jatte, mélanger avec douceur levure et farine.", "Dans un autre récipient, battre au fouet œufs entiers, sel, huile et lait ; poivrer.", "Incorporer le mélange à la farine en remuant avec précaution. Ajouter le gruyère, les figues (entières ou pas) et le jambon découpé.", "Verser dans un moule à cake beurré et légèrement fariné. Cuire 50 min. Laisser refroidir avant de démouler."]}, {"titre": "Dessert semoule et caramel (moule à charlotte)", "source": "manuscrit (sans titre)", "portions": "", "type": "Dessert", "ing": ["1 l de lait", "1 sachet de sucre vanillé Oetker", "150 g de sucre en poudre", "6 c. à soupe de semoule fine", "Caramel : 50 g de sucre en poudre", "½ verre d'eau"], "etapes": ["Chauffer le lait avec le sucre vanillé et 150 g de sucre (10 min), ajouter la semoule fine, brasser jusqu'à épaississement.", "Caramel : cuire 50 g de sucre avec ½ verre d'eau.", "Moule à charlotte : verser le caramel puis la semoule ; réserver au froid.", "Note : Manuscrit : « ¼ verre d'eau » à vérifier."]}, {"titre": "Farcement", "source": "manuscrit", "portions": "", "type": "Plat", "ing": ["1 kg de pommes de terre râpées", "200 g de pruneaux", "100 g de poires tapées (râpées ?)", "50 g de raisins secs", "1 œuf", "30 g de farine", "beurre pour graisser le moule", "50 g de poitrine fumée (pour tapisser)"], "etapes": ["Couper les pruneaux. Mélanger pommes de terre, farine et œuf, incorporer pruneaux, poires et raisins.", "Bien graisser le moule, tapisser le fond de poitrine fumée, verser le mélange de pommes de terre, recouvrir de poitrine fumée.", "Cuire au bain-marie au four, fond + papier alu, 180 °, 4 heures. Bien surveiller l'eau."]}, {"titre": "Tian de courgettes au riz (manuscrit)", "source": "Mes recettes (photos)", "portions": "", "type": "Plat", "ing": ["courgettes en tronçons de 3 cm", "1 grosse mirepoix", "ail écrasé", "huile d'olive", "riz rincé", "œufs", "lait", "crème", "sel, poivre, muscade", "fromage"], "etapes": ["Dans une casserole : huile d'olive et ail écrasé, suer l'ail sans le colorer. Ajouter les courgettes, couvrir, saler, poivrer ; cuire al dente.", "Ajouter le riz rincé : il cuit dans l'eau rendue par les courgettes.", "Quand le riz est cuit, mettre dans un plat à gratin.", "Dans un cul-de-poule, mélanger œufs, lait, crème, sel, poivre, muscade. Verser l'appareil sur le tian, ajouter le fromage.", "Note : Carte « SODILIM Caves du Châtelet ». Quantités, temps et température du four absents de la fiche (normal)."]}, {"titre": "Rouille de rouget en gelée de bouillabaisse", "source": "fiche imprimée (papier saumon)", "portions": "6-8 personnes", "type": "Entrée", "ing": ["Rouille", "1 grosse pomme de terre", "2 dl bouillon de bouillabaisse", "1 pointe de safran", "1 bonne c. à café d'ail haché", "2 jaunes d'œufs", "1 dl huile d'olive", "sel, poivre", "Bouillon de bouillabaisse", "3-4 carcasses de rouget barbet", "1 c. à soupe huile d'olive", "100 g mirepoix (oignons, carottes, céleris, fenouil, céleri)", "1 c. à soupe ail haché", "1 prise de thym", "3 étoiles d'anis", "1 feuille de laurier", "2 clous de girofle", "1 bonne c. à soupe de tomate concentrée", "1 pointe de safran", "3 c. à soupe de Pastis", "1 dl vin blanc", "1 l et demi d'eau", "sel, poivre", "Pour la gelée", "1 l de bouillon de bouillabaisse", "16 [?] feuilles de gélatine (⚠ « 16 » raturé/« 8 » : à vérifier)", "100 g brunoise de légumes (carottes, céleris, fenouil)", "Filets de rougets marinés", "6-8 filets de rougets", "1 dl vin blanc", "2 dl huile d'olive", "1 dl bouillon de volaille", "½ dl vinaigre de xérès", "jus d'un citron", "1 c. à soupe échalotes hachées", "1 c. à café ail haché", "1 prise de thym", "1 c. à café curry", "sel, poivre"], "etapes": ["", "- Filets marinés : écailler puis lever les filets, garder les carcasses, les désarêter, saler/poivrer, les poêler à l'huile d'olive bien chaude 10 s de chaque côté, les débarrasser dans un plat, recouvrir de la marinade tiède. Marinade : cuire tous les ingrédients ~20 min dans une casserole, laisser tiédir, verser sur les rougets, laisser reposer au moins une nuit au frigo.", "- Bouillon : suer la mirepoix à l'huile d'olive, ajouter la tomate concentrée, bien laisser revenir, puis carcasses, ail, épices, safran ; déglacer au pastis et au vin blanc, mouiller à l'eau, saler, poivrer, cuire à petit feu 45 min. Filtrer à l'étamine ou passoire très fine. Garder 2 dl pour la rouille et récupérer 1 l dans lequel cuire la brunoise de légumes ; ajouter la gélatine préalablement trempée dans l'eau froide → gelée de bouillabaisse. Réserver au frais.", "- Rouille : cuire la pomme de terre en cubes dans le bouillon avec safran et ail haché, saler, poivrer. Égoutter, passer au tamis, puis dans un cul-de-poule ajouter les jaunes d'œufs, bien fouetter, monter comme une mayonnaise avec l'huile d'olive, détendre avec le fond de cuisson, rectifier l'assaisonnement, réserver.", "- Dressage : dans un verre, un peu de rouille, quelques morceaux de filets de rougets marinés, recouvrir de gelée aux légumes. Prendre au frigo, servir bien frais."]}, {"titre": "Œufs cocotte au safran, mouillettes tomate et tapenade", "source": "magazine, recette Jean-Blaise Hall", "portions": "", "type": "Plat", "ing": ["8 œufs", "30 cl crème fraîche", "2 doses de safran", "1 petit pot de tapenade", "6 tomates séchées", "1 c. à soupe huile d'olive", "1 brin de romarin", "8 tranches de pain", "100 g beurre", "À table +", "utiliser de préférence le safran en filaments (plus joli et plus goûteux)", "le blanc de l'œuf doit être pris et le jaune mou"], "etapes": ["Recouvrir d'eau les tomates séchées et les cuire 30 s au micro-ondes avec le romarin. Ôter le romarin, mixer avec l'huile d'olive pour obtenir une pâte à tartiner. Préchauffer le four th. 6/180 °.", "Mélanger la crème avec le safran, saler, poivrer. Beurrer les ramequins et y verser 1 c. de crème safranée dans le fond. Casser délicatement un œuf dans chaque ramequin, saler, poivrer.", "Poser les ramequins dans un plat d'eau chaude et cuire au bain-marie 8 min.", "Pendant ce temps, faire griller les tranches de pain. Étaler la tapenade sur 4 tranches et la pâte de tomates sur les 4 autres. Découper des mouillettes et servir avec les œufs."]}, {"titre": "Sauce au vinaigre balsamique et à l'orange", "source": "coupure de magazine (non identifiée).", "portions": "", "type": "Base / sauce", "ing": ["0,25 dl jus d'orange", "0,5 dl vinaigre balsamique invecchiato", "sel, poivre du moulin", "1 c. à café moutarde à l'orange (ou moutarde de Dijon)", "0,5 dl huile d'olive extra vierge"], "etapes": ["Mélanger tous les ingrédients au fouet.", "Note : Note : 1 c. à soupe de sauce ≈ 3 g lipides, < 1 g glucides, 110 kJ / 25 kcal. « Excellent avec du fenouil cru raboté en fines tranches et des pignons grillés. »"]}, {"titre": "Amuse-gueule : tartare (tartelettes de thon)", "source": "livre (page 119, titre de livre non visible → à vérifier)", "portions": "4 personnes", "type": "Entrée", "ing": ["4 tranches de pain de pommes de terre", "120 g thon ultra frais débité en dés de 0,5 cm", "10 g (1 c. à s.) huile d'olive", "2 g (¼ c. à c.) Tabasco", "5 g (1 c. à c.) vinaigre de vin rouge", "quelques brins de ciboulette ciselés", "3 g (½ c. à c.) sauce soja", "1 petite échalote émincée", "sel, poivre", "crème fraîche", "caviar (optionnel)"], "etapes": ["Se servir du côté non tranchant d'un emporte-pièce rond de 7,5 cm pour découper un cercle de pain parfait. À l'aide d'une conserve de dimension standard (6 cm de diamètre), marquer un léger creux au centre du pain pour obtenir un fond semblable à celui d'une mini-pizza. Placer les tartelettes sur une assiette et les recouvrir d'un film plastique jusqu'à utilisation (elles peuvent être préparées quelques heures à l'avance : un moyen très simple de faire une tarte sans fabriquer de pâte). Dans un bol, mélanger le thon avec l'huile d'olive, le Tabasco, le vinaigre de vin rouge, la ciboulette, la sauce soja et l'échalote. Assaisonner de sel et de poivre. Avant de servir, toaster les tartelettes (au grill ou au grille-pain) des deux côtés. Remuer la garniture, remplir le centre des tartelettes avec le tartare, recouvrir d'une bonne cuillerée de crème fraîche et de caviar."]}, {"titre": "Soupe de tomates au basilic et vinaigre balsamique", "source": "article de magazine (non identifié, ouvrage « soupes » ; texte de gauc", "portions": "", "type": "Curry / soupe", "ing": ["Pour la soupe", "6 grosses tomates mûres", "1 petite boîte de pelati (230 g)", "2 oignons fanes", "3 gousses d'ail hachées", "10 feuilles de basilic", "2 c. à café de purée de piments (sambal oelek par ex.)", "2 cl vinaigre balsamique (selon goût)", "2 dl bouillon de légumes", "0,5 dl huile d'olive", "sel, sucre", "Garniture", "200 g feta coupée en dés", "lamelles d'oignons fanes", "graines de sésame noir et blanc", "pignons grillés", "huile de persil"], "etapes": ["Mixer tous les ingrédients destinés à la soupe. Réserver au frais. Au moment de servir, parsemer des différents éléments de la garniture."]}, {"titre": "Crème de courgettes à la menthe, tapenade d'olives noires", "source": "même article/fiche jaune que photo 74 (non identifié).", "portions": "", "type": "Entrée", "ing": ["Pour la soupe", "1 kg courgettes émincées avec la peau", "2 échalotes pelées et émincées", "3 gousses d'ail pelées et hachées", "1 petit piment vert épépiné et émincé", "10 feuilles de menthe", "1 l bouillon de légumes", "2 c. à soupe crème acidulée", "Pour la tapenade", "200 g olives noires à la grecque", "1 gousse d'ail pelée et hachée", "1 filet d'anchois à l'huile", "1 c. à soupe herbes fraîches (basilic, cerfeuil, persil, ciboulette, etc.)", "2 c. à soupe huile d'olive", "1 c. à soupe pignons grillés", "Garniture", "ciboulette ciselée", "pousses de betteraves germées", "quelques traits d'huile de persil", "quelques traits d'huile d'olive", "gomasio (1) additionné de curcuma"], "etapes": ["Faire suer les échalotes émincées et l'ail haché dans l'huile d'olive. Ajouter les courgettes et le piment émincés. Mouiller avec le bouillon. Mijoter 15 min. Mixer le tout avec la menthe, rectifier l'assaisonnement et, si nécessaire, la consistance en ajoutant un peu de bouillon. Ajouter la crème acidulée et réserver au frais. Tapenade : mixer ensemble tous les ingrédients sauf les pignons, ajouter les pignons dans un deuxième temps et mixer brièvement. Servir la soupe dans les assiettes, garnir d'une quenelle de tapenade, puis égayer avec la garniture.", "(1) gomasio = sésame grillé additionné de sel et mixé."]}, {"titre": "Œufs de caille en gelée et mousse de champignons", "source": "magazine « M&T » p", "portions": "", "type": "Entrée", "ing": ["6 œufs de caille", "200 g champignons de Paris", "jus d'½ citron jaune", "½ botte de ciboulette", "1 sachet de gelée au porto", "sel", "poivre blanc"], "etapes": ["Cuire les œufs 2 min à l'eau bouillante, puis les rafraîchir sous l'eau froide. Nettoyer les champignons, les mixer avec le jus de citron, la moitié de la ciboulette ciselée, sel et poivre. Préparer la gelée selon les instructions du paquet. Écaler les œufs de caille et les déposer dans six petits moules (ou verres). Verser de la gelée dessus et faire prendre 30 min au réfrigérateur. Ajouter la mousse de champignons sur les œufs en gelée, finir en recouvrant d'un peu de gelée, remettre au réfrigérateur. Au moment de servir, passer les moules rapidement sous l'eau chaude et démouler sur un lit de ciboulette.", "(La page voisine, à droite, est coupée : ne pas confondre.)"]}, {"titre": "Faux crumble salé au chèvre en verrine", "source": "manuscrit", "portions": "", "type": "Entrée", "ing": ["100 g farine", "25 g poudre de noisettes", "25 g parmesan", "50 g beurre salé", "1 petit billy [chèvre frais type « Petit Billy »]", "1 gousse d'ail", "persil plat, ciboulette, huile d'olive, sel, poivre"], "etapes": ["Mélanger la farine, la poudre de noisettes et le parmesan. Mélanger les poudres avec le beurre (obtenir des grains fins). Déposer la pâte sur une plaque, 10 à 15 min au four (⚠ température non indiquée). Une fois cuit, le réduire très fin. Mélanger le chèvre, la gousse d'ail réduite en purée, les herbes et l'huile d'olive. Dresser les verrines (dégustation à température ambiante) : d'abord le crumble, puis le chèvre ; sur le dessus : salade, mousse de tomate.", "Mousse de tomate : 20 g de feuilles de gélatine à faire tremper dans de l'eau froide ; 750 g de tomates émondées en purée ; hacher finement 1 échalote, 1 bouquet de basilic et un peu de persil, mélanger à la purée de tomates. Faire chauffer 2 cuillères de purée avec la gélatine pour la dissoudre, puis verser le reste de la purée ; laisser refroidir 4 h dans des petits moules."]}, {"titre": "Pavé (au café, avec petits-beurres)", "source": "en-tête imprimé « FTVI / Futur TV / Gourmet TV / ATPF » ; écriture ble", "portions": "", "type": "Dessert", "ing": ["Version de base", "60 g beurre", "70 g [corrigé de « 70 g »] cuill. à soupe de sucre semoule (⚠ « 70 g / cuill » ambigu : à vérifier)", "1 jaune d'œuf", "1 blanc battu en neige", "Nescafé (quantité non indiquée)"], "etapes": ["Travailler le beurre fondu + sucre + jaune, y ajouter le blanc + Nescafé. Tremper les petits-beurres dans du café fort. Annotation rose : « quantité parfaite pour le moule carré à rebords ».", "Pour un plateau blanc (grande quantité) : 72 biscuits (corrigé de « 36 ») ; 160 g de beurre fondu (corrigé de « 120 ») ; 180 g de sucre (corrigé de « 135 ») ; 3 jaunes (corrigé de « 3 œufs ») ; 3 blancs. Annotation : « il y a pile juste de crème. Ne pas faire moins ! »"]}, {"titre": "Les cannelés comme chez Baillardran", "source": "blog www.encoreungateau.com (impression)", "portions": "12 cannelés", "type": "Dessert", "ing": ["500 ml lait entier", "2 gousses de vanille", "250 g sucre en poudre", "125 g farine", "6 jaunes d'œufs", "50 g beurre à température ambiante", "50 ml rhum (« oui c'est beaucoup mais c'est bon ! »)"], "etapes": ["La veille :", "Fendre les gousses de vanille en deux, gratter les graines.", "Faire bouillir le lait avec gousses et graines.", "Dans un cul-de-poule, mélanger sucre et farine.", "Ajouter les jaunes, mélanger.", "Retirer les gousses du lait chaud et le verser en remuant sur le mélange.", "Incorporer le beurre mou, mélanger pour le faire fondre, ajouter le rhum, mélanger.", "Filmer, laisser refroidir à température ambiante puis réserver au réfrigérateur 24 h (étape importante : le repos fait diffuser les arômes).", "Cuisson :", "Le jour J, préchauffer le four à 220 °C (th 7/8) chaleur tournante.", "Bien mélanger la préparation.", "Graisser les moules, verser la pâte.", "Poser les moules sur une plaque en métal perforée recouverte de papier sulfurisé.", "Enfourner 1 h, démouler chaud.", "Note : Note de l'autrice du blog : 1 h à 220 °C était trop pour son four (1re fournée trop cuite) ; ensuite « à 220° puis baissé la température à 200° à mi-cuisson, c'était parfait. À vous de trouver le bon réglage avec votre four » (photo 80 : seule la fin de la phrase est visible, début coupé → lecture partielle)."]}, {"titre": "Cannelés bordelais (La Cuisine de Bernard, impression du 30/08/13)", "source": "http://www.lacuinedebernard.com → URL exacte lue : lacuisinedebernard.", "portions": "22 grands", "type": "Dessert", "ing": ["1 litre de lait entier frais", "2 œufs entiers", "4 jaunes d'œufs", "280 g farine", "475 g sucre", "50 g beurre doux", "10 cl rhum brun", "2 c. à soupe vanille liquide", "2 gousses de vanille"], "etapes": ["Préparation (blog) : Faire bouillir le lait avec le beurre, le rhum, la vanille liquide et les gousses fendues en deux dans la longueur. À ébullition, arrêter le feu et laisser infuser 15 min. Dans un autre récipient, blanchir au fouet les œufs et les jaunes avec le sucre. Enlever les gousses du lait, ajouter l'intérieur dans le mélange jaunes/sucre en grattant au pouce, remettre les gousses vidées dans le lait. Réchauffer le lait infusé jusqu'à frémissement, couper le feu, laisser 2 min, en verser une petite partie (au moins un cinquième) sur le mélange sucre + œufs, bien mélanger, ajouter toute la farine, mélanger, finir avec le reste du lait (évite les grumeaux). Conseil de Bernard : verser le lait très chaud (pas bouillant) pour pré-cuire légèrement la pâte. Laisser reposer 24 h (à température ambiante, remuer de temps en temps pour faire retomber la mousse ; ⚠ phrase partiellement lue : « Je ne la mets même pas au [frigo] »). Le lendemain : bien mélanger la pâte 2 min au fouet pour réintégrer le beurre.", "Cuisson : préchauffer le four à 275 °C (très chaud) ; cuisson en deux temps : d'abord très chaud pour figer la pâte, puis plus doux pour cuire l'intérieur (si le four ne monte pas à au moins 250 °C le cannelé sort du moule). Recommande moules en cuivre ou aluminium doublé téflon, pas silicone. Moules parfaitement propres. Graisse : pas de beurre ; bombe de graisse de démoulage « One Spray » (agents de démoulage, lécithine de soja), vaporiser l'intérieur, retourner sur papier absorbant. Remplir les moules jusqu'à 1 mm du bord. ⚠ Températures/temps finaux de cuisson (photos suivantes, 86+) pas encore lus.", "Cuisson testée par l'auteur : 15 min à 275 °C, puis sans arrêter le four, baisser à 200 °C pour 35 min supplémentaires (chaque four a sa puissance). Démouler aussitôt sur une grille à l'envers, laisser refroidir. Mettre tous les moules sur une plaque à pâtisserie, enfourner sur une grille au milieu du four.", "Septembre 2011 — méthode traditionnelle, moules en cuivre : graisser avec de la cire d'abeilles alimentaire : on fait fondre 120 g de beurre pour 80 g de cire d'abeilles. Passer une couche de beurre à la cire au pinceau (le mélange refroidit vite). Quand tous les moules sont prêts, verser la pâte (entonnoir à piston pratique). Cuire comme indiqué en haut ; secret : forte chaleur pendant les 10 premières minutes ; « j'ai cuit à 290 °C pendant 8-10 minutes et on voit bien les cannelés ne gonflent pas ». ⚠ Le temps total en moule cuivre après ces 8-10 min n'est pas lu sur cette photo.", "Note : Annotations roses de Lud (quantités augmentées, « 1,25 l ; 2,5 œufs ; 5 jaunes ; 358 g farine ; 593 g sucre ; 62 g beurre ; 12 cl rhum ») : ⚠ lecture « 2,5 œufs », « 358 g » et « 12 cl (15?) » à vérifier. Note rose en haut : « …celle au dos de la pochette ».", "Note : Annotations de cuisson de Lud : « Dans petits moules silicones : 8 min à 210 °, puis 20-25 min à 180 °. Bien surveiller. Les sortir du moule et les faire recuire 12 à 14 minutes. » ; « Dans moules en cuivre : 8 min à 210 ° puis 30 à 35 min à 180 °. Bien surveiller la 1re fournée. »"]}, {"titre": "Tiramisu (Evelyn)", "source": "recette d'Evelyn (« Bon appétit ! Evelyn »)", "portions": "", "type": "Dessert", "ing": ["2 jaunes d'œufs", "2 c. à soupe de sucre", "1 sachet de sucre vanillé", "250 ml de crème (fouettée)", "2 blancs d'œufs (montés séparément)", "200 g de mascarpone", "250 ml de crème aigre (sour cream)", "biscuits à la cuillère", "café froid", "cacao en poudre"], "etapes": ["Mélanger les 2 jaunes avec 2 c. à soupe de sucre + 1 sachet de sucre vanillé. Fouetter séparément 250 ml de crème. Monter séparément les 2 blancs. Ajouter 200 g de mascarpone + 250 ml de crème aigre au mélange jaunes/sucre, mélanger. Ajouter blancs + crème, mélanger uniquement à la cuillère. Monter : 1 couche de biscuits à la cuillère trempés dans du café froid, 1 couche de crème, 1 couche de biscuits, 1 couche de crème. Cacao en poudre sur le dessus."]}, {"titre": "Mousse de Génépi + appareil à tuile", "source": "manuscrit", "portions": "", "type": "Dessert", "ing": ["Mousse de Génépi", "lait ½ l", "crème ½ l", "œufs (jaunes) 4", "farine 50 g", "sucre 150 g", "génépi 20 cl env.", "gélatine (feuilles) 2"], "etapes": ["Effectuer une pâtissière (jaunes + sucre + farine + génépi). Verser le lait chaud puis cuire la crème. Ajouter 2 feuilles de gélatine encore chaud. Laisser refroidir. Monter la crème fouettée puis l'incorporer dans la crème pâtissière.", "Appareil à tuile : autant de blanc, de farine, de sucre glace, de beurre fondu, puis l'extrait d'alcool souhaité. Étaler au pinceau sur plaque de cuisson. Rouler aussitôt sorti du four (« très chaud »). ⚠ Température/temps de cuisson non indiqués."]}, {"titre": "Millionaire shortbreads (La Cuisine de Bernard, impression du 8/11/13)", "source": "lacuisinedebernard.com/2013/02/les-millionaire-shortbreads.html", "portions": "", "type": "Dessert", "ing": ["- Shortbread", "60 g sucre", "120 g beurre salé", "180 g farine", "- Caramel", "150 g sucre de canne blond (vergeoise blonde)", "25 g miel", "175 g beurre", "1 boîte de lait concentré sucré (397 g)", "¼ c. à café de sel"], "etapes": ["- Dessus : 200 g chocolat au lait tempéré (« ou non mais c'est plus joli ! »).", "Préchauffer le four à 180 °C. Mettre le beurre salé mou et le sucre dans un bol. Bien mélanger pour obtenir une crème (avec la feuille, le « K » si robot). Ajouter la farine, bien mélanger et ramener la pâte en boule sans la travailler de façon excessive. Mettre la boule dans un moule de 21 × 21 cm garni de papier sulfurisé, étaler uniformément à la main puis avec le dos d'une cuillère à soupe. Cuire au four 25 min (l'auteur laisse la pâte assez blanche ; Lud : « elle doit être légèrement colorée » = plus dorée sur le dessus). Caramel : mettre le sucre de canne blond et le beurre dans une casserole, ajouter le miel, porter à ébullition sur feu doux, laisser bouillir 3-4 min, ajouter la boîte de lait concentré sucré, bien mélanger et laisser 8-10 min à partir de l'ébullition sur feu doux en mélangeant constamment. Verser le caramel sur la pâte cuite. Laisser refroidir totalement puis mettre au frais 2 heures avant de mettre le chocolat. Fondre le chocolat au bain-marie ou au micro-ondes (⚠ suite de la recette — étalement du chocolat, découpe — sur photos suivantes).", "Chocolat : pour cette recette, l'auteur préfère le tempérer (méthode du beurre de cacao Mycryo, expliquée sur son blog) pour éviter les traces blanches. Verser le chocolat tempéré sur le caramel. Bien répartir à la spatule, soit pour avoir des petites vagues sur le dessus, soit en remuant le moule pour une surface lisse. Quand le chocolat commence à prendre mais n'est pas encore dur (10 min après versement), couper des parts avec une lame bien coupante en 16 parts."]}, {"titre": "Tiramisu aux framboises (« Arthur »/« pour verrines », manuscrit annoté rose)", "source": "fiche d'Arthur (⚠ prénom en haut à gauche lu « Arthur », à vérifier)", "portions": "", "type": "Dessert", "ing": ["1 paquet de pèlerines (1 couche)", "2,5 dl de crème entière (à fouetter)", "1 c. à soupe de sucre vanillé", "150 g de sucre (à mélanger)", "2 yaourts vanille fermes", "1 paquet de framboises non sucrées (congelées)"], "etapes": ["Fouetter la crème entière avec le sucre vanillé ; mélanger avec le sucre et les yaourts pour obtenir la crème.", "Montage en 3 couches : 1re couche : pèlerines ; 2e couche : framboises ; 3e couche : mélange crème.", "Note : Version verrines (Lud, annotations roses) : quantités divisées par deux : 1,25 dl de crème, 75 g de sucre, 1 yaourt."]}, {"titre": "Paris-Brest façon chou-chou (blog « Ma Toque », 13 nov. 2014)", "source": "blog (titre partiellement lu « …Ma Toque »), recette du « Paris-Brest ", "portions": "8 choux", "type": "Dessert", "ing": ["Pâte à choux", "125 g eau", "50 g beurre", "80 g farine T55", "2 œufs", "1 pincée de sucre", "1 pincée de sel", "Craquelin (Christophe Michalak)", "40 g beurre demi-sel à température ambiante", "50 g cassonade", "50 g farine", "Crème pâtissière au pralin", "25 cl lait", "30 g sucre", "2 jaunes d'œuf", "30 g farine ou fécule", "20 g beurre", "140 g praliné", "Crème mousseline pralinée", "150 g beurre à température ambiante", "¼ de l (= 25 cl) de crème pâtissière", "Montage", "sucre glace", "praliné", "feuille d'or"], "etapes": ["Préparation (crème pâtissière pralinée) : Porter le lait à ébullition dans une casserole. Pendant ce temps, blanchir jaunes et sucre au fouet dans un cul-de-poule, ajouter la farine, fouetter jusqu'à un mélange homogène. Verser la moitié du lait chaud sur le mélange, détendre au fouet, puis verser le tout dans la casserole sur feu moyen. Ne plus quitter le fouet : la crème épaissit lentement, toujours gratter les parois de la casserole (fouetter en dessinant un 8). Quand la crème est prête (épaisse, commence à frémir à la surface), continuer à battre 50 secondes et retirer du feu. Ajouter le praliné et le beurre en petits morceaux, fouetter pour incorporer.", "Crème pâtissière : la verser dans un cul-de-poule propre et sec, filmer au contact, percer le film à la pointe du couteau pour laisser la buée s'échapper, placer le cul-de-poule dans un récipient d'eau glacée pour faire redescendre la température rapidement, laisser au frais 2 h.", "Craquelin : mettre le beurre coupé en petits morceaux dans un récipient, battre au fouet ou à la feuille du robot pour obtenir un beurre pommade. Ajouter tous les ingrédients, malaxer à la main pour former une boule. Étaler au rouleau entre deux feuilles de papier sulfurisé sur 2/3 cm d'épaisseur [⚠ lu « 2/3 cm » : probablement 2-3 mm, à vérifier]. Détailler en cercles du même diamètre que les choux (8/9 cm et 2/3 cm) à l'aide d'une douille. Replacer la feuille sur le craquelin, laisser prendre au frais pendant la réalisation de la pâte à choux.", "Pâte à choux : dans une casserole verser l'eau, le sucre, le sel et le beurre en petits morceaux. Porter à ébullition, retirer du feu, ajouter la farine en une seule fois. Hors du feu et sans attendre, mélanger rapidement à la spatule (pâte épaisse sans grumeaux). Replacer sur feu doux, continuer à mélanger pour chasser l'humidité (écraser la pâte contre les parois). Dessécher la panade quelques minutes. Pâte prête : film à peine visible au fond de la casserole, boule qui se détache des parois. Débarrasser dans un cul-de-poul
