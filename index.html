 sauce de poisson", "1 c. à café de sucre de palme râpé", "Sel", "Huile végétale pour badigeonner"], "etapes": ["Préchauffer un barbecue ou un gril à feu vif.", "Sauce : mélanger dans un bol ail, piments, gingembre, jus de citron et sauce de poisson, puis dissoudre le sucre de palme.", "Nettoyer les calmars (détacher les tentacules, ôter nageoires, membrane, bec et poche d'encre ; ouvrir le tube), les sécher, les saler et les poivrer au poivre blanc.", "Huiler le gril et cuire les calmars 90 s côté non incisé, puis 60 s côté incisé ; servir avec la sauce au piment vert et à l'ail."]}, {"n": 60, "titre": "Côtes de porc grillées et salade d'herbes aromatiques", "meta": ["Livre thaï (titre non visible)  ·  Viande  ·  page 78", "Pour 4  ·  préparation 10 min  ·  cuisson 8 min", "Marinade 1 h", "Protéine : Côtes de porc ×4  (par personne : 1 côte)"], "ing": ["2 gousses d'ail", "4 cm de gingembre", "4 côtes de porc", "3 brins de menthe", "3 brins de coriandre", "3 brins de basilic", "2 c. à soupe de germes de soja", "2 ciboules", "Le jus de 2 citrons verts + quartiers", "1 c. à soupe d'huile de sésame grillé", "1 c. à soupe de graines de coriandre", "1 c. à soupe de graines de fenouil", "1 c. à café de curcuma en poudre", "1 c. à café de cinq-épices", "½ c. à café de flocons de piment séché", "Poivre noir", "1 c. à soupe d'huile végétale", "Sel"], "etapes": ["Piler au mortier les graines de coriandre et de fenouil, ajouter l'ail et le gingembre et broyer en pâte ; la mélanger dans un plat au curcuma, cinq-épices, piment séché, poivre noir et huile ; y enrober les côtes de porc et laisser mariner 1 h minimum au frais.", "Chauffer très fort un barbecue ou une plancha ; saler les côtes juste avant et les griller 8 min en les retournant toutes les 2 min.", "Salade : mélanger dans un bol les herbes, les germes de soja et les ciboules, arroser de jus de citron vert et d'huile de sésame.", "Laisser reposer le porc 5 min, verser son jus dans la salade et servir avec des quartiers de citron vert."]}, {"n": 61, "titre": "Champignons braisés au gingembre et au piment", "meta": ["Livre thaï (titre non visible)  ·  Accompagnement  ·  page 162", "Pour 4  ·  préparation 10 min  ·  cuisson 10 min", "Cuisson 8-10 min"], "ing": ["3 racines de coriandre", "2 gousses d'ail", "1 piment rouge", "4 cm de gingembre", "400 g de pleurotes", "100 g d'asperges", "Le jus de 1 citron vert", "2 brins de coriandre", "½ c. à café de cannelle en poudre", "½ c. à café de cinq-épices", "½ c. à café de coriandre en poudre", "Poivre noir", "2 c. à soupe d'huile végétale", "100 ml d'alcool de riz", "1 c. à soupe de sauce soja claire", "1 c. à soupe de graines de sésame grillées", "Sel"], "etapes": ["Mélanger racines de coriandre, ail, piment rouge et gingembre.", "Les faire revenir dans l'huile jusqu'à ce qu'ils embaument.", "Ajouter les pleurotes et cuire à feu vif 3 à 4 min jusqu'à odeur de noisette et légère coloration.", "Ajouter les épices, poivrer, saler généreusement ; verser alcool de riz, sauce soja et asperges, couvrir et mijoter 4 min jusqu'à absorption du liquide.", "Ajouter le jus de citron vert, parsemer de coriandre et de sésame grillé, mélanger et goûter."]}, {"n": 62, "titre": "Épinards sautés à l'ail et au poivre noir", "meta": ["Livre thaï (titre non visible)  ·  Accompagnement  ·  page 164", "Pour 4  ·  préparation 5 min  ·  cuisson 1 min"], "ing": ["3 petites gousses d'ail", "1 piment rouge", "3 cm de gingembre", "500 g d'épinards (ou bettes ou un mélange des deux)", "Le jus de 1 citron", "Poivre noir", "2 c. à soupe d'huile végétale", "2 c. à soupe de sauce de poisson", "Sel"], "etapes": ["Faire revenir 30 s à feu moyen dans l'huile l'ail, le piment et le gingembre jusqu'à dorure.", "Ajouter les épinards et les sauter à feu vif jusqu'à ce qu'ils soient enrobés.", "Saler, poivrer généreusement, ajouter la sauce de poisson et le jus de citron, sauter 30 s de plus ; servir aussitôt."]}, {"n": 63, "titre": "Légumes verts sautés à la sauce d'huître", "meta": ["Livre thaï (titre non visible)  ·  Accompagnement  ·  page 166", "Pour 4  ·  préparation 5 min  ·  cuisson 3 min"], "ing": ["2 petites gousses d'ail", "500 g de légumes verts mélangés (brocolis, haricots verts, asperges, pois gourmands)", "Le jus de 1 citron", "1 pincée de flocons de piment séché", "Poivre noir", "2 c. à soupe d'huile végétale", "2 c. à soupe de sauce d'huître", "Sel", "2 c. à soupe de graines de sésame grillées", "3 brins de coriandre"], "etapes": ["Faire dorer l'ail 30 s dans l'huile à feu moyen ; ajouter les légumes verts avec un filet d'eau et les sauter 2 min à feu vif.", "Ajouter la sauce d'huître et le piment séché, sauter encore 30 s, saler, poivrer, arroser de jus de citron ; parsemer de sésame grillé et de coriandre."]}, {"n": 64, "titre": "Pâte de curry Geng Gari", "meta": ["Livre thaï (titre non visible)  ·  Base / sauce  ·  page 194", "Pour 4-6 (3 portions)  ·  préparation 10 min  ·  cuisson 40 min", "Cuisson 35-40 min"], "ing": ["3 cm de gingembre", "4 piments rouges", "3 tiges de citronnelle", "6 gousses d'ail", "3 oignons rouges", "Le jus de 2 citrons verts", "1 c. à café de cumin en poudre", "1 c. à café de coriandre en poudre", "1 c. à café de cannelle en poudre", "1 c. à café de noix de muscade râpée", "1 c. à café de curcuma en poudre", "1 c. à café de sel", "1 c. à soupe d'huile végétale", "660 ml de crème de coco", "1 c. à soupe de pulpe de tamarin", "2 c. à soupe de sauce soja claire"], "etapes": ["Réduire en purée au blender gingembre, piments, citronnelle, ail et sel ; ajouter l'oignon, mixer à nouveau avec un peu d'eau pour une pâte homogène.", "Chauffer l'huile, y faire revenir les épices 2 min, ajouter la pâte et cuire lentement 25 à 30 min à feu doux en remuant souvent.", "Verser la crème de coco et laisser frémir environ 5 min jusqu'à réduction de moitié.", "Incorporer jus de citron vert, tamarin et sauce soja ; rectifier.", "Diviser en 3 portions : à cuisiner avec viande, poisson ou légumes, ou à congeler (1 semaine au frigo, 3 mois au congélateur)."]}, {"n": 65, "titre": "Pâte de curry orange", "meta": ["Livre thaï (titre non visible)  ·  Base / sauce  ·  page 195", "Pour 4-6 (3 portions)  ·  préparation 10 min  ·  cuisson 60 min", "Cuisson 1 heure"], "ing": ["4 tiges de citronnelle", "6 racines de coriandre", "4 cm de gingembre", "5 piments rouges", "4 gousses d'ail", "2 oignons rouges", "1 poivron rouge", "4 feuilles de citron kaffir", "Le jus de 3 citrons verts", "2 c. à café de curcuma en poudre", "1 c. à café de sel", "1 c. à soupe d'huile végétale", "660 ml de crème de coco", "3 c. à soupe de pulpe de tamarin", "2 c. à soupe de sauce de poisson"], "etapes": ["Réduire en purée citronnelle, racines de coriandre, gingembre, piments, ail et sel ; ajouter oignons et poivron, mixer à nouveau avec un peu d'eau.", "Chauffer l'huile, cuire la pâte 20 à 30 min en remuant pour qu'elle n'accroche pas ; ajouter curcuma et feuilles de kaffir, poursuivre 30 min à feu doux jusqu'à ce que la pâte embaume.", "Verser la crème de coco, laisser frémir 5 min jusqu'à réduction de moitié ; ajouter jus de citron vert, tamarin et sauce de poisson ; rectifier.", "Diviser en 3 portions : à cuisiner avec viande, poisson ou légumes (ex. curry orange au saumon, p. 138) ou à congeler."]}, {"n": 66, "titre": "Pâte de curry Massaman aux cacahuètes", "meta": ["Livre thaï (titre non visible)  ·  Base / sauce  ·  page ~196-197", "Pour 8 (3 portions)  ·  préparation 20 min  ·  cuisson 30 min", "Trempage 30 min"], "ing": ["3 longs piments rouges séchés", "2 c. à café de graines de coriandre", "1 c. à café de graines de cumin", "4 clous de girofle", "½ c. à café de noix de muscade râpée", "1 bâtonnet de cannelle de 2 cm", "4 capsules de cardamome verte", "3 feuilles de laurier", "2 oignons rouges hachés", "6 gousses d'ail", "5 cm de gingembre", "4 racines de coriandre", "3 tiges de citronnelle", "100 g de cacahuètes sans la peau", "Huile végétale", "1-2 c. à soupe de sucre de palme râpé", "2 c. à soupe de sauce de poisson", "2 c. à soupe de pulpe de tamarin", "100 ml de jus d'ananas", "1 c. à café de sel"], "etapes": ["Faire tremper les piments séchés 30 min dans l'eau bouillante, les épépiner et les hacher finement.", "Griller à sec les cacahuètes jusqu'à dorure ; faire revenir toutes les épices 3 à 4 min à sec jusqu'à ce qu'elles embaument ; les piler en poudre fine et les passer au tamis.", "Chauffer 1 c. à soupe d'huile dans un wok, y faire revenir 10 min piments, oignons, ail, gingembre, racines de coriandre et citronnelle.", "Mixer le tout au robot avec le sel, les épices tamisées et les cacahuètes pour obtenir une purée.", "Chauffer un peu d'huile dans une casserole, cuire la pâte environ 10 min en remuant (un filet d'eau si elle accroche) ; ajouter le sucre, cuire 5 min ; ajouter sauce de poisson, tamarin et jus d'ananas, cuire 5 min de plus.", "Diviser en 3 portions : à cuisiner avec viande, poisson ou légumes (p. 140) ou à congeler (3 mois)."]}, {"n": 67, "titre": "Dip à la cacahuète", "meta": ["Livre thaï (titre non visible)  ·  Base / sauce  ·  page 210", "Pour 4-6  ·  préparation 10 min  ·  cuisson 10 min"], "ing": ["3 racines de coriandre", "1 gousse d'ail", "1 piment rouge", "4 échalotes", "Le jus de 1 citron vert", "Les feuilles ciselées de 2 brins de coriandre", "Poivre noir", "2 c. à soupe d'huile végétale", "2 c. à café de sucre de palme râpé", "4 c. à soupe de cacahuètes mondées grillées", "1 c. à soupe de sauce soja claire", "Sel"], "etapes": ["Piler au mortier les racines de coriandre, l'ail et une pincée de sel, puis ajouter piment et échalotes pour une pâte lisse.", "Faire revenir cette pâte 2 min dans la moitié de l'huile jusqu'à ce qu'elle embaume ; ajouter le sucre de palme et cuire 4 min jusqu'à caramélisation.", "Ajouter les cacahuètes grillées et cuire 3 à 4 min jusqu'à dorure (un peu d'eau si le sucre brûle).", "Retirer du feu, transvaser au mortier et piler en pâte presque lisse.", "Incorporer le reste d'huile, la sauce soja et le jus de citron vert ; détendre avec environ 3 c. à soupe d'eau, ajouter la coriandre ; servir avec du porc laqué ou du poulet au saté.", "Se conserve environ 1 semaine au réfrigérateur."]}, {"n": 68, "titre": "Tomate compressée, eau fermentée et condiments", "meta": ["French Riviera  ·  Entrée  ·  page 15", "Pour 4  ·  préparation 35 min  ·  cuisson 5 min", "Chapitre Cassis · repos 2 h + fermentation 24 à 48 h"], "ing": ["Tomate compressée", "4 tranches épaisses de tomate ananas", "1 c. à soupe d'huile d'olive", "1 c. à café de vinaigre de xérès", "Sel fin, poivre blanc", "Espuma d'eau de tomate fermentée", "50 cl d'eau de tomate (jus récupéré après avoir pressé des tomates mûres)", "1 g de sel", "1 g de sucre", "2 g de lactobacilles (ou 1 c. à soupe de jus de choucroute)", "1 feuille de gélatine (ou 2 g de lécithine de soja)", "Vinaigrette tomate-huile d'olive", "5 cl de jus de tomate frais", "3 cl d'huile d'olive extra-vierge", "1 c. à café de vinaigre balsamique blanc", "Sel, poivre", "Condiment anchois et olives", "4 filets d'anchois marinés", "50 g d'olives noires dénoyautées", "1 c. à soupe d'huile d'olive", "Dressage", "Herbes fraîches de saison (basilic, aneth, pourpier, coriandre)", "Poudre de piment d'Espelette", "Matériel", "1 machine sous vide et ses sachets", "1 siphon à espuma avec 1 cartouche de gaz"], "etapes": ["Tomate compressée : assaisonner les tranches de tomate (huile d'olive, vinaigre de xérès, sel, poivre blanc), les mettre sous vide et laisser 2 h au frais.", "Espuma : mélanger l'eau de tomate, le sel, le sucre et les lactobacilles (ou le jus de choucroute) ; laisser fermenter 24 à 48 h à température ambiante jusqu'à une acidité perceptible. Filtrer, chauffer légèrement, ajouter la gélatine ramollie, verser dans un siphon avec une cartouche et garder au frais.", "Vinaigrette : émulsionner jus de tomate, huile d'olive, vinaigre balsamique blanc, sel et poivre ; frais.", "Condiment : hacher finement anchois et olives noires, mélanger à l'huile d'olive en pâte légèrement granuleuse.", "Dressage : tranche de tomate au centre, touches de condiment autour, filet de vinaigrette, quenelle d'espuma dessus, herbes fraîches et piment d'Espelette."]}, {"n": 69, "titre": "Mon aigo boulido (ravioles, bouillon ail-sauge)", "meta": ["French Riviera  ·  Entrée  ·  page 16", "Pour 4  ·  préparation 45 min  ·  cuisson 30 min", "Chapitre Cassis · repos 30 min"], "ing": ["Pâte à ravioles", "200 g de farine", "1 pincée de sel", "2 œufs", "1 c. à soupe d'huile d'olive", "Béchamel au pain grillé", "30 g de beurre", "30 g de farine", "30 cl de lait", "50 g de mie de pain grillée et mixée en chapelure fine", "1 pincée de muscade", "Sel, poivre", "Bouillon à l'ail et à la sauge", "1 litre d'eau", "6 gousses d'ail", "6 feuilles de sauge", "1 branche de thym", "1 c. à soupe d'huile d'olive", "Sel, poivre", "Dressage", "Quelques feuilles de sauge fraîches", "1 filet d'huile d'olive", "Copeaux de parmesan (optionnel)"], "etapes": ["Pâte : mélanger farine et sel, creuser un puits, ajouter œufs et huile, pétrir en pâte souple ; filmer et laisser 30 min au frais.", "Béchamel : faire un roux (beurre + farine, 1 min), ajouter le lait en fouettant, puis la chapelure de pain grillé, sel, poivre et muscade ; laisser refroidir.", "Bouillon : dorer sans coloration l'ail coupé en deux dans l'huile, ajouter l'eau, la sauge et le thym, frémir 15 min, filtrer, rectifier.", "Ravioles : abaisser la pâte à 1 mm, déposer de petites noix de béchamel espacées sur une moitié, recouvrir, souder autour des tas, détailler et laisser sécher un peu.", "Cuire les ravioles 1 à 2 min dans l'eau salée frémissante jusqu'à ce qu'elles remontent ; égoutter, dresser en assiette creuse, verser le bouillon chaud, ajouter sauge, huile d'olive et parmesan si on veut (un jaune d'œuf est possible)."]}, {"n": 70, "titre": "Denti mariné au sumac, clémentine et herbes marines", "meta": ["French Riviera  ·  Poisson / fruits de mer  ·  page 23", "Pour 4  ·  préparation 30 min", "Chapitre Cassis · pas de cuisson · repos 1 h", "Protéine : Filet de denti ultra-frais 400 g  (par personne : 100 g)"], "ing": ["Le denti", "400 g de filet de denti ultra-frais (sans peau ni arêtes)", "50 g de gros sel", "1 c. à soupe de sumac", "1 filet d'huile d'olive", "Accompagnement", "2 clémentines", "1 c. à soupe d'huile d'olive infusée au zeste des clémentines", "1 pincée de fleur de sel", "Poivre noir fraîchement moulu", "Herbes marines", "Quelques feuilles de criste-marine", "Salicorne (ou autres herbes marines disponibles)"], "etapes": ["Poser le filet de denti dans un plat sur le gros sel, le recouvrir et laisser 20 min au frais ; rincer, sécher soigneusement.", "Le rouler dans le sumac, le filmer serré et laisser 30 min au frais.", "Peler les clémentines à vif et prélever les suprêmes ; rincer criste-marine et salicorne.", "Huile : prélever le zeste d'une clémentine, le chauffer 5 min à feu doux avec l'huile d'olive sans coloration, laisser infuser 10 min hors du feu, filtrer.", "Trancher finement le denti, le disposer sur les assiettes avec les suprêmes, un filet d'huile de clémentine, la criste-marine et la salicorne."]}, {"n": 71, "titre": "Brousse du Rove, petits pois et févettes à l'huile d'estragon", "meta": ["French Riviera  ·  Entrée", "Pour 4  ·  préparation 25 min  ·  cuisson 5 min", "Chapitre Cassis · photo floue : quantités à vérifier dans le livre (brousse 120 g, estragon ½ botte, petits pois 200 ou 300 g)", "Protéine : Brousse du Rove 120 g (chiffre flou)  (par personne : ≈ 30 g (chiffre flou))"], "ing": ["120 g de brousse du Rove (ou autre brousse fraîche)", "½ botte d'estragon", "10 cl d'huile d'olive", "300 g de petits pois écossés (chiffre flou : 200 ou 300 g)", "200 g de fèves écossées", "1 cébette", "Fleurs d'ail", "Fleur de sel", "Poivre du moulin"], "etapes": ["Blanchir petits pois et févettes quelques minutes dans l'eau bouillante salée, refroidir à l'eau glacée, égoutter.", "Huile d'estragon : effeuiller l'estragon, le blanchir 6 min, le refroidir à l'eau glacée, l'égoutter, le mixer avec l'huile d'olive jusqu'à texture lisse, filtrer ; garder à température ambiante.", "Ciseler le blanc de la cébette, l'incorporer à la brousse, saler et poivrer.", "Dressage : cercle de brousse au centre d'un bol, petits pois et févettes autour, huile d'estragon, vert de cébette ciselé, fleurs d'ail et fleur de sel."]}, {"n": 88, "titre": "Pimientos de Padrón au thym", "meta": ["French Riviera  ·  Entrée", "Pour 4  ·  préparation 20 min  ·  cuisson 7 min", "Chapitre Cannes · cuisson 5 à 7 min"], "ing": ["300 g de pimientos de Padrón (petits poivrons verts)", "2 c. à soupe d'huile d'olive extra-vierge", "1 branche de thym frais", "Fleur de sel, poivre du moulin", "Piment d'Espelette (optionnel)"], "etapes": ["Laver et sécher les pimientos, les garder entiers avec leur tige.", "Mélanger huile d'olive, thym effeuillé, fleur de sel et poivre (piment d'Espelette si on veut).", "Barbecue à charbon à température moyenne-élevée, braises bien rouges et stables ; badigeonner les pimientos au thym et les griller 5 à 7 min en les retournant, jusqu'à ce qu'ils soient cloqués et légèrement noircis.", "Les disposer dans un plat, arroser d'un filet d'huile, ajouter fleur de sel et servir aussitôt à l'apéritif ou en garniture."]}, {"n": 72, "titre": "Girolles sautées, crémeux aux pignons de pin", "meta": ["French Riviera  ·  Entrée  ·  page 27", "Pour 4  ·  préparation 20 min  ·  cuisson 10 min", "Chapitre Cassis"], "ing": ["Crémeux de pignons de pin", "80 g de pignons de pin", "15 cl de crème liquide entière", "10 cl de bouillon de volaille ou de légumes", "1 c. à soupe de parmesan râpé", "Sel, poivre", "Girolles sautées", "400 g de girolles fraîches", "1 échalote", "1 gousse d'ail", "2 c. à soupe de beurre", "1 c. à soupe d'huile d'olive", "1 branche de thym", "Sel, poivre", "Finition", "Quelques pignons de pin torréfiés", "1 filet d'huile de noisette (ou d'olive)"], "etapes": ["Crémeux : torréfier les pignons à sec (en garder pour le dressage), mixer les autres avec la crème et le bouillon, ajouter parmesan, sel et poivre, chauffer doucement en une crème homogène ; garder au chaud.", "Girolles : les nettoyer au pinceau (sans eau courante) ; chauffer beurre et huile, suer l'échalote sans coloration, ajouter girolles, ail et thym, sauter 3 à 4 min à feu vif ; saler et poivrer en fin de cuisson.", "Dressage : girolles têtes vers le bas, pointes de crémeux, pignons torréfiés, filet d'huile de noisette."]}, {"n": 73, "titre": "Loup de Méditerranée mariné aux fraises, vinaigrette au jus fermenté", "meta": ["French Riviera  ·  Poisson / fruits de mer", "Pour 4  ·  préparation 30 min", "Chapitre Cassis (déduit : en-tête coupé sur la photo) · fermentation 48 h · marinade 15 à 20 min", "Protéine : Filet de loup 400 g  (par personne : 100 g)"], "ing": ["Poisson mariné", "400 g de filet de loup (sans peau ni arêtes)", "80 g de jus de fraise fermenté", "40 g d'huile d'olive", "20 g de vinaigre balsamique blanc", "Fleur de sel", "Poivre du moulin", "Jus de fraise fermenté", "200 g de fraises bien mûres", "4 g de sel", "Dressage", "80 g de fraises", "Quelques fleurs de saison", "Fleur de sel"], "etapes": ["Jus de fraise fermenté : couper les fraises en deux, les mélanger au sel dans un bocal propre, couvrir sans fermer hermétiquement, laisser fermenter 48 h à température ambiante, filtrer au tamis fin et garder au frais.", "Lever les filets de loup, ôter peau et arêtes, tailler en cubes réguliers.", "Mélanger jus de fraise fermenté, huile d'olive, vinaigre balsamique blanc, fleur de sel et poivre ; y ajouter le loup et mariner 15 à 20 min au frais.", "Dressage : cubes de loup, fraises coupées en deux, filet de vinaigrette de marinade, fleurs de saison et fleur de sel."]}, {"n": 74, "titre": "Thon rouge Wellington", "meta": ["French Riviera  ·  Poisson / fruits de mer  ·  page 31", "Pour 4  ·  préparation 40 min  ·  cuisson 12 min", "Chapitre Cassis · cuisson 10 à 12 min · repos 35 min", "Protéine : Thon rouge (pavé épais, sans peau) 400 g  (par personne : 100 g)"], "ing": ["Duxelles de champignons", "200 g de champignons de Paris (ou cèpes)", "1 c. à soupe de beurre", "1 c. à soupe d'huile d'olive", "Thon", "400 g de thon rouge (pavé épais, sans peau)", "2 c. à soupe de moutarde de Dijon", "Montage en rouleau", "100 g de feuilles d'épinards", "1 carré de pâte feuilletée pur beurre (env. 20 cm)", "1 jaune d'œuf (pour la dorure)", "30 g de truffe noire", "Fleur de sel", "Poivre noir du moulin"], "etapes": ["Duxelles : hacher finement les champignons, les cuire à feu doux dans beurre et huile, saler, poivrer, laisser compoter jusqu'à évaporation complète ; frais.", "Thon : assaisonner, saisir quelques secondes par face dans une poêle très chaude, refroidir complètement, badigeonner de moutarde de Dijon.", "Montage : blanchir les épinards quelques secondes, rafraîchir, sécher ; sur un film, les chevaucher, étaler la duxelles refroidie, poser le thon, rouler serré ; 30 min au frigo.", "Four à 200 °C. Retirer le film, enrouler le thon dans la pâte feuilletée en soudant les bords, dorer au jaune d'œuf, enfourner 10 à 12 min (cœur mi-cuit) ; reposer 5 min avant de trancher.", "Servir avec un jus de volaille à la truffe et un peu de truffe fraîche râpée."]}, {"n": 75, "titre": "Ravioles aux crevettes de Méditerranée", "meta": ["French Riviera  ·  Poisson / fruits de mer  ·  page 36", "Pour 4  ·  préparation 90 min", "Chapitre Cassis · « Repos : 30 h » confirmé tel qu'imprimé (2 photos)", "Protéine : Crevettes fraîches 200 g (farce) + 8 crevettes entières  (par personne : ≈ 50 g de farce + 2 crevettes entières)"], "ing": ["Pâte à ravioles", "200 g de farine", "2 œufs", "1 c. à soupe de concentré de tomates", "1 pincée de sel", "1 filet d'huile d'olive", "Farce aux crevettes", "200 g de crevettes fraîches de Méditerranée", "1 blanc d'œuf", "50 g de crème liquide", "Sel, poivre", "1 c. à café de zeste de citron", "Émulsion de crevettes", "Têtes et carapaces des crevettes", "1 échalote ciselée", "1 gousse d'ail", "1 c. à soupe de concentré de tomates", "10 cl de vin blanc", "30 cl de fumet de poisson", "20 cl de crème liquide", "50 g de beurre", "Pattes de crevettes croustillantes", "Pattes de crevettes", "Fécule de maïs", "Huile de friture", "Dressage", "8 crevettes entières", "Huile d'olive", "Sel, poivre"], "etapes": ["Pâte : mélanger farine, sel et concentré de tomates, ajouter œufs et huile, pétrir en pâte homogène ; filmer et laisser reposer 30 min au frais.", "Farce : décortiquer les crevettes en gardant têtes et pattes ; mixer la chair avec le blanc d'œuf, la crème, sel, poivre et zeste de citron ; frais.", "Émulsion : faire revenir têtes et carapaces avec échalote et ail, ajouter le concentré de tomates, déglacer au vin blanc, réduire, ajouter le fumet et cuire 20 min ; filtrer, incorporer la crème, monter au beurre et mixer en texture mousseuse.", "Pattes : les fariner de fécule et les frire dans l'huile chaude jusqu'à croustillant ; égoutter.", "Ravioles : abaisser la pâte en deux plaques fines, déposer des petits tas de farce sur l'une, recouvrir, chasser l'air, souder, détailler ; frais.", "Pocher les ravioles 2 à 3 min dans l'eau salée frémissante ; tiédir les crevettes entières à la salamandre ou au gril avec un filet d'huile ; dresser en assiette creuse avec l'émulsion chaude, les crevettes, les pattes croustillantes et un tour de poivre."]}, {"n": 76, "titre": "Espadon grillé, condiment à l'orange", "meta": ["French Riviera  ·  Poisson / fruits de mer", "Pour 4  ·  préparation 30 min  ·  cuisson 15 min", "Chapitre Cassis · cuisson 10 à 15 min", "Protéine : 4 pavés d'espadon (env. 150 g chacun)  (par personne : 150 g)"], "ing": ["Espadon", "4 pavés d'espadon (env. 150 g chacun)", "2 c. à soupe d'huile d'olive", "1 zeste d'orange finement râpé", "Sel fin", "Poivre blanc", "Condiment à l'orange", "2 oranges bio", "50 g d'olives vertes dénoyautées", "10 câpres (rincées si en saumure)", "1 petite échalote finement ciselée", "1 c. à soupe d'huile d'olive", "1 filet de jus de citron", "Réduction de vinaigre au jus d'orange", "20 cl de jus d'orange frais (pressé maison)", "5 cl de vinaigre balsamique", "1 c. à soupe de miel", "1 pincée de sel", "Finition", "Quelques fines tranches de cébette", "Huile d'olive"], "etapes": ["Réduction : faire réduire à feu doux 10 à 15 min le jus d'orange, le balsamique et le miel jusqu'à consistance sirupeuse ; pincée de sel ; laisser à température ambiante.", "Condiment : peler les oranges à vif, prélever et couper les suprêmes ; hacher olives et câpres ; mélanger le tout avec l'échalote, l'huile d'olive et quelques gouttes de citron ; frais.", "Espadon : badigeonner d'huile, assaisonner (sel, poivre blanc, zeste d'orange) et griller 1 à 2 min par face sur un gril très chaud ; il doit rester rosé au centre.", "Dressage : un pavé par assiette, une cuillère de condiment à l'orange, un filet de réduction, fines tranches de cébette et un peu d'huile d'olive."]}, {"n": 77, "titre": "Fisholata, lentilles vertes de Provence", "meta": ["French Riviera  ·  Poisson / fruits de mer", "Pour 4  ·  préparation 45 min  ·  cuisson 45 min", "Chapitre Cassis", "Protéine : Filet de poisson blanc 400 g (cabillaud, merlan ou lieu jaune), en saucisses  (par personne : 100 g)"], "ing": ["Saucisses de poisson", "400 g de filet de poisson blanc (cabillaud, merlan ou lieu jaune)", "1 blanc d'œuf", "10 cl de crème liquide", "1 c. à soupe de chapelure fine", "1 c. à café de moutarde douce", "1 gousse d'ail hachée", "1 c. à soupe de persil ou de ciboulette ciselée", "1 pincée de piment d'Espelette", "Sel, poivre", "Boyaux naturels (ou film alimentaire pour cuisson sous vide)", "Lentilles mijotées", "200 g de lentilles vertes du Puy", "1 carotte", "1 oignon", "1 branche de céleri", "2 gousses d'ail", "1 feuille de laurier", "1 branche de thym", "50 cl de bouillon de légumes ou de poisson", "1 c. à soupe d'huile d'olive", "Sel, poivre", "Finition", "Quelques lamelles d'oignons caramélisés", "Huile d'olive"], "etapes": ["Saucisses : mixer le poisson avec blanc d'œuf, crème et chapelure en farce lisse ; ajouter moutarde, ail, herbes, Espelette, sel, poivre. Remplir un boyau en pièces de 12 cm (ou rouler en boudin dans du film) et pocher 10 min dans l'eau frémissante salée ; égoutter.", "Lentilles : tailler carotte, oignon et céleri en petits dés, les faire revenir à l'huile d'olive ; ajouter lentilles, ail entier, laurier et thym, couvrir de bouillon et mijoter 30 min à feu doux ; saler, poivrer en fin de cuisson.", "Dorer les saucisses à la poêle avec un filet d'huile.", "Dressage : lentilles chaudes en assiette creuse, une saucisse dessus, quelques cuillerées de bouillon, oignons caramélisés et filet d'huile d'olive."]}, {"n": 78, "titre": "Ma bouillabaisse bourgeoise et sans arêtes", "meta": ["French Riviera  ·  Poisson / fruits de mer", "Pour 4  ·  préparation 60 min  ·  cuisson 45 min", "Chapitre Cassis", "Protéine : 4 morceaux de poisson (loup, chapon, vive, grondin ; env. 120 g par personne) + 1 kg de poissons de roche (soupe)  (par personne : 120 g (imprimé))"], "ing": ["Soupe de poissons de roche", "1 kg de poissons de roche (rascasse, grondin, vive, etc.)", "1 oignon", "2 gousses d'ail", "1 poireau", "2 c. à soupe d'huile d'olive", "2 tomates", "1 branche de fenouil", "1 pincée de safran", "10 cl de vin blanc sec", "1,5 l de fumet de poisson", "Pommes de terre safranées", "4 pommes de terre Charlotte", "1 pincée de safran", "Sel", "Poissons", "4 morceaux de poisson (loup, chapon, vive, grondin ; env. 120 g par personne)", "2 c. à soupe d'huile d'olive", "Fleur de sel", "Poivre du moulin", "Tuile de pain aux crevettes", "4 tranches fines de pain de campagne", "1 gousse d'ail", "1 c. à soupe d'huile d'olive", "50 g de mini-crevettes séchées"], "etapes": ["Soupe : faire revenir oignon, ail et poireau émincés dans l'huile d'olive, ajouter les poissons de roche et les colorer ; ajouter tomates, fenouil et safran, déglacer au vin blanc et réduire de moitié ; ajouter le fumet, mijoter 30 min, mixer et filtrer au chinois fin ; garder chaud.", "Pommes de terre : les éplucher, les couper en rondelles épaisses, les cuire doucement dans l'eau salée avec le safran jusqu'à tendreté ; égoutter.", "Tuile : four à 180 °C ; frotter le pain à l'ail, l'huiler, répartir les mini-crevettes séchées et enfourner 8 min jusqu'à croustillant.", "Poissons : saisir 2 min côté peau dans un filet d'huile, retourner 1 min ; fleur de sel, poivre.", "Dressage : rondelles de pomme de terre en assiette creuse, poisson côté peau visible, soupe émulsionnée autour, tuile de pain, quelques gouttes d'huile d'olive."]}, {"n": 79, "titre": "Navette provençale", "meta": ["French Riviera  ·  Dessert", "Pour 12  ·  préparation 20 min  ·  cuisson 15 min", "12 navettes · repos 30 min · cuisson 12 à 15 min"], "ing": ["250 g de farine", "70 g de sucre", "1 pincée de sel", "1 œuf", "50 g de beurre fondu", "2 c. à soupe d'eau de fleur d'oranger", "5 cl d'eau", "½ sachet de levure chimique (optionnel)"], "etapes": ["Mélanger farine, sucre et sel ; creuser un puits, ajouter œuf, beurre fondu, eau de fleur d'oranger et eau (levure facultative) ; mélanger puis pétrir en pâte souple ; former une boule, filmer, laisser 30 min à température ambiante.", "Four à 180 °C. Diviser la pâte en 12, former des boudins de 8 à 10 cm aux extrémités pincées et les inciser dans la longueur.", "Cuire 12 à 15 min sur plaque avec papier cuisson jusqu'à légère coloration ; refroidir sur grille. Elles se gardent plusieurs semaines en boîte hermétique et sont encore meilleures après quelques jours."]}, {"n": 80, "titre": "Rouget de roche, poulpe et crosne", "meta": ["French Riviera  ·  Poisson / fruits de mer", "Pour 4  ·  préparation 60 min  ·  cuisson 75 min", "Chapitre Saint-Tropez", "Protéine : 4 filets de rouget bien frais  (par personne : 1 filet)"], "ing": ["Rouget", "4 filets de rouget bien frais", "Fleur de sel, poivre noir", "Huile d'olive", "Purée de crosnes", "300 g de crosnes", "20 cl de crème liquide", "30 g de beurre", "Sel, poivre", "Crosnes glacés", "200 g de crosnes", "20 g de beurre", "1 pincée de sucre", "5 cl d'eau", "Sel", "Poulpe", "1 tentacule de poulpe cuit (idéalement confit dans son jus)", "1 c. à soupe d'huile d'olive", "1 gousse d'ail", "1 branche de thym", "Beurre au vin rouge", "30 cl de vin rouge corsé (syrah ou mourvèdre)", "1 échalote ciselée", "100 g de beurre froid coupé en dés", "Sel, poivre", "Dressage", "Quelques feuilles de criste-marine"], "etapes": ["Purée de crosnes : laver, cuire 15 min à l'eau bouillante salée, égoutter, mixer avec crème et beurre ; assaisonner ; garder au chaud.", "Crosnes glacés : fondre le beurre, ajouter crosnes, sucre, eau et une pincée de sel ; cuire doucement jusqu'à évaporation et glaçage brillant.", "Poulpe : chauffer l'huile avec ail et thym, dorer légèrement les tronçons sans les dessécher ; garder au chaud.", "Beurre au vin rouge : réduire le vin avec l'échalote à environ 5 cl ; hors du feu, monter au beurre froid en fouettant ; assaisonner, filtrer.", "Rouget : inciser la peau, saler, poivrer, brûler la peau au chalumeau jusqu'à croustillant et doré ; filet d'huile d'olive.", "Dressage : purée de crosnes, crosnes glacés et poulpe autour, filet de rouget peau visible, cuillère de beurre au vin rouge, criste-marine."]}, {"n": 81, "titre": "Poulet en croûte de sel", "meta": ["French Riviera  ·  Viande", "Pour 4  ·  préparation 15 min  ·  cuisson 90 min", "Chapitre La Ciotat · cuisson 1 h 15 à 1 h 30 · repos 10 min", "Protéine : 1 poulet fermier entier  (par personne : ≈ ¼ de poulet)"], "ing": ["Poulet", "1 poulet fermier entier", "50 g de beurre ramolli", "2 à 3 gousses d'ail écrasées", "2 à 3 branches de thym, romarin, sauge", "Poivre du moulin", "Croûte de sel", "1,5 kg de gros sel", "3 blancs d'œufs", "Un peu d'eau (si nécessaire)", "Quelques herbes fraîches (optionnel)", "Accompagnement", "Légumes rôtis, purée maison ou salade fraîche"], "etapes": ["Four à 200 °C. Mélanger le beurre ramolli avec l'ail écrasé, les herbes hachées et du poivre ; le glisser sous la peau du poulet (blancs et cuisses) ; garnir la cavité d'herbes et d'ail si on veut.", "Croûte : mélanger le gros sel et les blancs d'œufs (un peu d'eau si besoin) en texture humide et malléable ; étaler un lit de sel dans une cocotte, poser le poulet et le recouvrir de sel en tassant en croûte compacte.", "Enfourner 1 h 15 à 1 h 30 selon la taille ; laisser reposer 10 min ; casser la croûte avec précaution, ôter le sel restant (et la peau si elle est trop salée), découper.", "Servir avec légumes rôtis, purée maison ou salade."]}, {"n": 82, "titre": "Poulet fermier confit aux tomates et olives", "meta": ["French Riviera  ·  Viande  ·  page 72", "Pour 4  ·  préparation 20 min  ·  cuisson 55 min", "Chapitre La Ciotat · cuisson 50 à 55 min", "Protéine : 4 cuisses de poulet fermier  (par personne : 1 cuisse)"], "ing": ["4 cuisses de poulet fermier", "4 tomates bien mûres", "100 g d'olives noires (dénoyautées de préférence)", "3 gousses d'ail", "1 oignon rouge", "1 c. à soupe de concentré de tomates", "15 cl de vin blanc sec", "1 bouquet garni (thym, laurier, romarin)", "Huile d'olive", "Sel, poivre", "1 pincée de sucre (optionnel, selon l'acidité des tomates)"], "etapes": ["Hacher l'ail, émincer l'oignon, couper les tomates en morceaux si elles sont grosses (four à 180 °C si on finit au four).", "Dorer les cuisses 5 à 7 min sur toutes les faces dans un filet d'huile (cocotte) ; réserver. Dans la même cocotte, faire revenir oignon et ail jusqu'à translucidité, ajouter tomates et concentré, corriger l'acidité avec une pincée de sucre, mijoter 5 min.", "Déglacer au vin blanc en grattant les sucs, ajouter bouquet garni et olives, remettre les cuisses, saler, poivrer ; couvrir et mijoter 30 à 40 min à feu doux en remuant (ou finir au four couvert) ; retirer le bouquet garni.", "Servir chaud avec riz pilaf, pommes de terre rôties ou pain de campagne."]}, {"n": 83, "titre": "Abricots pochés en gelée anisée, crémeux au fenouil", "meta": ["French Riviera  ·  Dessert", "Pour 4  ·  préparation 45 min  ·  cuisson 15 min", "Chapitre La Ciotat · réfrigération 2 h 30"], "ing": ["Abricots pochés", "4 abricots bien mûrs", "50 cl d'eau", "100 g de sucre", "1 étoile de badiane (anis étoilé)", "1 gousse de vanille", "5 g de graines de fenouil", "6 feuilles de gélatine (ou 4 g d'agar-agar)", "Crémeux au fenouil", "20 cl de crème liquide entière", "10 cl de lait entier", "2 jaunes d'œufs", "50 g de sucre", "1 bulbe de fenouil", "2 feuilles de gélatine", "Finition", "Quelques feuilles d'aneth", "Petites pousses de fenouil", "Fleurs de fenouil (si disponible)", "Matériel", "Moules demi-sphère"], "etapes": ["Pochage : porter à ébullition eau, sucre, badiane, vanille fendue et graines de fenouil ; y plonger les abricots 3 à 5 min, jusqu'à ce qu'ils soient tendres mais fermes ; les égoutter (garder le sirop), les peler, les garder au frais.", "Gelée : filtrer le sirop, y fondre la gélatine ramollie (ou l'agar-agar) et laisser tiédir ; chemiser des moules demi-sphère de film, y répartir les abricots, couvrir de sirop gélifié ; au moins 2 h au frais.", "Crémeux : chauffer crème et lait avec le fenouil émincé, infuser 10 min hors du feu, mixer et filtrer ; fouetter jaunes et sucre, verser l'infusion chaude en filet, cuire à feu doux comme une crème anglaise (83 °C), incorporer la gélatine ramollie, mixer ; mettre en poche 30 min minimum au frais.", "Dressage : cuillère de crémeux, abricot en gelée dessus, aneth, pousses et fleurs de fenouil, points de crémeux."]}, {"n": 84, "titre": "Melon en deux façons, jus de sangria glacé", "meta": ["French Riviera  ·  Dessert", "Pour 4  ·  préparation 45 min", "Chapitre La Ciotat"], "ing": ["Billes de melon", "1 gros melon bien mûr", "1 c. à soupe de sucre (optionnel)", "1 c. à soupe de jus de citron", "Sorbet melon", "400 g de chair de melon", "10 cl d'eau", "50 g de sucre", "1 c. à soupe de jus de citron", "1 blanc d'œuf (optionnel)", "Jus glacé de sangria", "25 cl de vin rouge fruité (merlot, grenache, tempranillo)", "50 g de sucre", "1 bâton de cannelle", "1 clou de girofle", "1 étoile de badiane", "Zeste de 1 orange", "Zeste de 1 citron", "5 cl de jus d'orange", "2 cl de Grand Marnier ou Cointreau (optionnel)", "Quelques feuilles de menthe fraîche", "Matériel", "Sorbetière"], "etapes": ["Billes : couper le melon en deux, ôter les graines, former des billes à la cuillère parisienne, les mélanger avec le sucre et le citron ; frais.", "Sorbet : chauffer eau et sucre jusqu'à dissolution, refroidir, mixer avec la chair de melon et le citron en purée lisse (ajouter le blanc d'œuf si utilisé) ; turbiner en sorbetière, ou congeler en remuant toutes les 30 min.", "Jus de sangria : chauffer doucement vin, sucre, épices, zestes et jus d'orange, frémir 10 min ; hors du feu ajouter le Grand Marnier ; refroidir, filtrer, garder au frais.", "Dressage : billes de melon froides en assiette creuse, jus de sangria glacé, quenelle de sorbet, menthe. Version sans alcool : vin remplacé par du jus de raisin noir."]}, {"n": 85, "titre": "Huîtres aux mille perles", "meta": ["French Riviera  ·  Poisson / fruits de mer", "Pour 4  ·  préparation 25 min  ·  cuisson 12 min", "Chapitre Toulon · réfrigération 15 min", "Protéine : 12 huîtres fraîches  (par personne : 3 huîtres)"], "ing": ["Huîtres et garnitures", "12 huîtres fraîches (idéalement de la baie de Tamaris, maison Giol)", "40 g de petites perles de tapioca", "½ concombre", "½ radis blanc", "1 branche de céleri tendre", "1 pomme Granny Smith", "Jus de ½ citron", "Fleur de sel", "Poivre blanc du moulin", "Huile d'herbes anisées", "5 cl d'huile d'olive", "½ botte d'aneth", "½ botte d'estragon", "½ botte de cerfeuil", "½ c. à café de graines de fenouil"], "etapes": ["Perles de tapioca : bouillir 10 à 12 min dans l'eau jusqu'à translucidité, égoutter, rincer, laisser 10 à 15 min dans l'eau froide, égoutter.", "Huile d'herbes : mixer l'huile d'olive avec herbes fraîches et graines de fenouil jusqu'à un vert intense ; filtrer ; 10 min minimum au frais.", "Garnitures : former de mini-billes à la cuillère parisienne dans concombre, radis blanc, céleri et pomme ; arroser celles de pomme de jus de citron ; frais.", "Ouvrir les huîtres, récupérer et filtrer leur eau, l'incorporer aux perles de tapioca.", "Dressage : huîtres dans leurs coquilles nettoyées, 1 c. à café de perles, 2 à 3 billes, quelques gouttes d'huile d'herbes, fleur de sel et poivre blanc."]}, {"n": 86, "titre": "Fenouils en salade, olives vertes, poutargue et orange", "meta": ["French Riviera  ·  Entrée", "Pour 8  ·  préparation 20 min  ·  cuisson 10 min", "Chapitre Toulon · cuisson 8 à 10 min · infusion 15 min"], "ing": ["24 mini-fenouils", "3 oranges", "200 g d'olives vertes", "40 g de poutargue", "120 g d'huile d'olive", "Fleur de sel, poivre du moulin"], "etapes": ["Fenouils : retirer les pousses (les plonger dans l'eau glacée), blanchir les mini-fenouils 8 à 10 min à l'eau bouillante salée, puis les plonger dans l'eau glacée et égoutter.", "Huile d'orange : peler les oranges à vif, garder la peau d'une orange en fine julienne ; tiédir l'huile d'olive avec les zestes, infuser 10 à 15 min hors du feu ; prélever les suprêmes et récupérer le jus des membranes.", "Garnitures : dénoyauter les olives si besoin et les tailler en pétales ; trancher finement la poutargue.", "Dressage : assaisonner les fenouils (fleur de sel, poivre, jus d'orange, huile infusée), les répartir en assiettes creuses, ajouter pétales d'olives, poutargue, suprêmes et pousses de fenouil."]}, {"n": 87, "titre": "Pommes grenailles safranées, rouille et poutargue", "meta": ["French Riviera  ·  Accompagnement", "Pour 4  ·  préparation 30 min  ·  cuisson 20 min", "Chapitre Toulon · cuisson 15 à 20 min · réfrigération 10 min"], "ing": ["Pommes de terre safranées", "500 g de pommes de terre grenailles", "1 l d'eau", "1 dose de safran (0,1 g)", "10 g de sel fin", "Rouille", "2 jaunes d'œufs", "2 gousses d'ail dégermées, écrasées", "1 c. à soupe de moutarde", "15 cl d'huile d'olive", "1 c. à café de vinaigre de vin ou de jus de citron", "1 pincée de sel", "1 pincée de piment d'Espelette", "Dressage", "40 g de poutargue, tranchée très finement", "1 filet d'huile d'olive extra-vierge", "Quelques fleurs de fenouil"], "etapes": ["Éplucher les pommes de terre, rincer ; les cuire 15 à 20 min dans 1 l d'eau bouillante avec sel et safran, à feu moyen, jusqu'à tendreté (entières) ; égoutter et garder tièdes.", "Rouille : mélanger jaunes, ail écrasé, moutarde et une pincée de sel ; monter avec l'huile d'olive en filet comme une mayonnaise ; ajouter vinaigre (ou citron) et piment d'Espelette ; 10 min au frais.", "Dressage : pommes de terre tièdes, touches de rouille, poutargue finement tranchée, filet d'huile d'olive, fleurs de fenouil."]}, {"n": 89, "titre": "Baba aux tomates de couleurs, jus fermenté", "meta": ["French Riviera  ·  Entrée  ·  page 165", "Pour 4  ·  préparation 120 min  ·  cuisson 150 min", "Chapitre Cannes · cuisson 30 min + 1 h 30 à 2 h (tomates confites) · repos 1 h 25 · fermentation 3 à 5 jours"], "ing": ["Jus de tomate fermenté", "1 kg de tomates bien mûres", "15 g de sel marin non iodé", "1 feuille de laurier", "1 gousse d'ail écrasée", "1 c. à soupe de vinaigre de cidre (optionnel)", "Pâte à baba", "200 g de farine", "10 g de levure de boulanger fraîche", "3 œufs", "10 cl d'huile d'olive", "10 cl de lait tiède", "1 c. à soupe de sucre", "1 c. à café de sel", "80 g d'olives noires dénoyautées, hachées", "Tomates confites", "500 g de tomates cerises ou de tomates variées", "3 c. à soupe d'huile d'olive", "1 c. à café de sucre", "1 gousse d'ail hachée", "1 branche de thym", "Sel, poivre", "Garniture", "Tomates fraîches restantes", "Huile d'olive", "Sel, poivre", "Quelques feuilles de basilic ou de menthe (optionnel)"], "etapes": ["Jus fermenté (3 à 5 jours avant) : couper les tomates, les mettre dans un grand bocal avec sel, laurier et ail, couvrir d'eau si besoin, couvrir d'un linge et laisser fermenter 3 à 5 jours à température ambiante ; filtrer quand le liquide est légèrement acide (vinaigre de cidre pour renforcer l'acidité).", "Pâte : mélanger farine, sucre et sel ; délayer la levure dans le lait tiède 5 à 10 min ; ajouter œufs, huile et levure ; pétrir en pâte souple, incorporer les olives hachées ; laisser lever 1 h (elle double).", "Tomates confites : four à 120 °C ; tomates coupées en deux sur plaque avec huile, sucre, ail, thym, sel et poivre ; confire 1 h 30 à 2 h, refroidir.", "Cuisson : four à 180 °C ; beurrer un moule à baba, y verser la pâte, laisser détendre 15 min, cuire 25 à 30 min jusqu'à belle coloration ; démouler et tiédir.", "Assemblage : imbiber le baba de jus de tomate fermenté, laisser reposer 10 à 15 min, garnir de tomates confites puis de tomates fraîches en tranches ; servir frais ou tiède."]}, {"n": 90, "titre": "Calamars farcis, jus à l'encre de seiche", "meta": ["French Riviera  ·  Poisson / fruits de mer", "Pour 4  ·  préparation 45 min  ·  cuisson 50 min", "Chapitre Cannes · cuisson 40 à 50 min", "Protéine : 4 gros calamars (vidés, tentacules conservés)  (par personne : 1 calamar)"], "ing": ["Calamars farcis", "4 gros calamars (vidés, tentacules conservés)", "1 oignon", "2 gousses d'ail", "2 c. à soupe d'huile d'olive", "150 g de riz", "2 tomates concassées", "50 g de chorizo ou de pancetta (optionnel)", "1 c. à soupe de persil ciselé", "1 pincée de piment d'Espelette", "Sel, poivre", "Jus à l'encre", "2 sachets d'encre de seiche (ou 4 g d'encre fraîche)", "1 échalote", "1 c. à soupe d'huile d'olive", "10 cl de vin blanc sec", "20 cl de fumet de poisson", "1 noix de beurre"], "etapes": ["Farce : cuire le riz al dente, égoutter ; hacher oignon, ail et tentacules ; faire revenir oignon et ail dans 1 c. à soupe d'huile, ajouter tentacules, tomates concassées et chorizo, cuire 5 min ; incorporer riz, persil et piment, assaisonner, laisser tiédir.", "Remplir les calamars sans trop tasser, fermer au cure-dent ; les dorer 2 min par côté dans 1 c. à soupe d'huile, ajouter un peu de fumet, couvrir et mijoter 15 min à feu doux.", "Jus noir : suer l'échalote dans l'huile, déglacer au vin blanc, réduire de moitié ; ajouter le fumet, mijoter 10 min, incorporer l'encre de seiche et cuire 5 min ; hors du feu, ajouter une noix de beurre pour lier.", "Dressage : un calamar farci au centre de chaque assiette, nappé de jus noir."]}, {"n": 91, "titre": "Tourte à la courge de Mamie", "meta": ["French Riviera  ·  Plat", "Pour 4  ·  préparation 45 min  ·  cuisson 75 min", "Chapitre Cannes", "Protéine : Ricotta 250 g + parmesan 100 g  (par personne : ≈ 62 g ricotta + 25 g parmesan)"], "ing": ["Pâte à l'huile d'olive", "500 g de farine de blé (T55)", "10 cl d'huile d'olive extra-vierge", "20 cl d'eau tiède", "1 pincée de sel", "Farce", "800 g de courge (butternut ou musquée)", "150 g de riz arborio", "1 oignon", "2 c. à soupe d'huile d'olive, plus un peu pour la cuisson", "2 gousses d'ail", "200 g de jambon blanc en dés", "100 g de parmesan râpé", "250 g de ricotta", "2 œufs", "Sel, poivre, noix de muscade râpée"], "etapes": ["Pâte : mélanger farine et sel, creuser un puits, ajouter huile et eau tiède, pétrir 10 min en pâte souple ; boule filmée, repos 30 min minimum à température ambiante.", "Farce : cuire le riz 10 min à l'eau salée, égoutter ; faire revenir l'oignon haché à l'huile jusqu'à translucidité, ajouter ail et dés de courge, cuire 15 min à feu moyen jusqu'à tendreté, assaisonner (muscade), tiédir ; mélanger avec riz, jambon, parmesan, ricotta et œufs battus.", "Four à 180 °C. Diviser la pâte en deux (une part un peu plus grande) ; abaisser la grande à 3 mm et foncer un moule huilé en laissant dépasser ; verser la farce, lisser ; couvrir avec la seconde abaisse, replier et pincer les bords.", "Badigeonner d'huile d'olive, cuire 45 à 50 min jusqu'à belle dorure ; reposer 10 min avant de démouler."]}, {"n": 92, "titre": "Tarte aux fraises, crémeux citron et basilic", "meta": ["French Riviera  ·  Dessert  ·  page 194", "Pour 4  ·  préparation 90 min  ·  cuisson 20 min", "Chapitre Cannes · repos 1 h"], "ing": ["Pâte sucrée", "120 g de farine", "50 g de sucre glace", "1 pincée de sel", "60 g de beurre froid", "1 jaune d'œuf", "1 c. à soupe d'eau (si besoin)", "Crémeux citron", "2 citrons (jus + zestes)", "80 g de sucre", "2 œufs", "60 g de beurre", "1 c. à soupe de fécule de maïs (optionnel)", "Gelée citron", "10 cl de jus de citron", "20 g de sucre", "½ c. à café rase d'agar-agar", "Garniture", "250 à 300 g de fraises fraîches", "Feuilles de basilic frais", "Sirop simple ou nappage neutre (optionnel)"], "etapes": ["Pâte sucrée : mélanger farine, sucre glace et sel, sabler avec le beurre froid, incorporer le jaune et un peu d'eau ; boule filmée, 30 min au frais. Four à 180 °C ; étaler finement, foncer un moule, piquer, cuire 15 à 20 min ; refroidir.", "Crémeux : fouetter œufs, sucre, jus et zestes de citron ; chauffer à feu doux sans cesser de remuer jusqu'à épaississement ; hors du feu, ajouter le beurre (et la fécule) ; mixer ; 30 min au frais.", "Gelée : mélanger à froid jus, sucre et agar-agar, porter à ébullition, frémir 30 s en fouettant ; couler sur une plaque (2 à 3 mm), laisser prendre 15 à 20 min au frais ; découper en disques.", "Montage : crémeux sur le fond de tarte, fraises coupées, quelques disques de gelée, nappage léger si on veut ; décorer de basilic et servir bien frais."]}, {"n": 93, "titre": "Velouté de châtaigne, lard confit", "meta": ["French Riviera  ·  Viande", "Pour 4  ·  préparation 30 min  ·  cuisson 210 min", "Chapitre Antibes · cuisson 3 h 30 (dont 3 h pour le confit)", "Protéine : Poitrine de cochon (avec la couenne) 500 g  (par personne : 125 g)"], "ing": ["Poitrine de cochon confite", "500 g de poitrine de cochon (avec la couenne)", "2 branches de thym", "2 feuilles de laurier", "3 gousses d'ail écrasées", "Sel, poivre", "Velouté de châtaignes", "400 g de châtaignes cuites", "30 g de beurre", "1 oignon", "1 poireau (blanc uniquement)", "50 cl de bouillon de volaille", "20 cl de crème liquide", "Sel, poivre", "Lait au lard fumé", "20 cl de lait entier", "50 g de lard fumé coupé en morceaux", "Garniture", "50 g de châtaignes cuites, coupées en morceaux"], "etapes": ["Poitrine : four à 130 °C ; saler, poivrer, poser en cocotte avec thym, laurier et ail, couvrir et cuire 3 h jusqu'à fondante ; refroidir et découper ; la poêler à feu vif juste avant de servir pour une peau croustillante.", "Velouté : fondre le beurre, suer oignon et poireau émincés, ajouter les châtaignes, cuire quelques minutes, verser le bouillon, frémir 15 min, ajouter la crème et mixer finement ; rectifier.", "Lait fumé : chauffer le lait avec le lard fumé, infuser 10 min à feu doux, filtrer et émulsionner au mixeur plongeant.", "Dressage : poêler les châtaignes de garniture dans un peu de beurre ; velouté chaud en assiette creuse, morceaux de poitrine, châtaignes, filet de lait fumé émulsionné."]}, {"n": 94, "titre": "Morue en raito", "meta": ["French Riviera  ·  Poisson / fruits de mer", "Pour 4  ·  préparation 25 min  ·  cuisson 50 min", "Chapitre Toulon · dessalage 24 h", "Protéine : Morue salée 600 g (avant dessalage)  (par personne : 150 g)"], "ing": ["Morue confite", "600 g de morue salée", "40 cl d'huile d'olive", "2 gousses d'ail", "1 branche de thym", "1 feuille de laurier", "Sauce raito", "1 oignon", "2 gousses d'ail", "2 c. à soupe d'huile d'olive", "10 cl de vin rouge", "1 c. à soupe de vinaigre de vin rouge", "400 g de tomates concassées fraîches", "1 c. à soupe de concentré de tomates", "1 branche de thym", "1 feuille de laurier", "100 g d'olives vertes dénoyautées", "1 c. à soupe de câpres", "60 g de tomates cerises confites", "Poivre du moulin", "Finition", "1 cébette ciselée", "Quelques feuilles de basilic frais"], "etapes": ["La veille : tremper la morue 24 h dans un grand volume d'eau froide en changeant l'eau 3 à 4 fois ; égoutter, sécher, garder au frais.", "Confit : chauffer l'huile avec ail écrasé, thym et laurier à 60-70 °C sans frémir ; y plonger la morue et confire 30 min à feu très doux ; égoutter avec précaution (la laisser refroidir dans l'huile pour plus de moelleux).", "Sauce raito : faire revenir l'oignon 3 à 5 min à l'huile en cocotte, ajouter l'ail 1 min, déglacer au vin rouge et vinaigre et réduire ; ajouter tomates concassées, concentré, thym et laurier, mijoter 20 min ; ajouter olives, câpres et tomates confites ; poivrer, ne pas saler.", "Dressage : réchauffer doucement la morue, la disposer en pétales, napper de raito, ajouter cébette et basilic ; servir avec pommes de terre vapeur, polenta crémeuse ou pain grillé."]}, {"n": 95, "titre": "Petit épeautre à l'encre de seiche, moules de Tamaris et chorizo", "meta": ["French Riviera  ·  Poisson / fruits de mer", "Pour 4  ·  préparation 20 min  ·  cuisson 40 min", "Chapitre non visible sur la photo", "Protéine : Moules de Tamaris 400 g  (par personne : 100 g (avec coquilles))"], "ing": ["Moules de Tamaris", "400 g de moules de Tamaris", "1 c. à soupe d'huile d'olive", "1 gousse d'ail", "5 cl de vin blanc", "Poivre noir", "Risotto de petit épeautre à l'encre de seiche", "250 g de petit épeautre", "1 l de bouillon de légumes", "1 échalote", "1 gousse d'ail", "3 c. à soupe d'huile d'olive", "10 cl de vin blanc sec", "2 sachets d'encre de seiche (ou 4 g d'encre fraîche)", "40 g de parmesan râpé", "20 g de beurre", "Sel, poivre", "Cubes de chorizo", "80 g de chorizo ibérique (doux ou fort selon préférence)"], "etapes": ["Moules : faire revenir l'ail dans l'huile sans coloration, déglacer au vin blanc, ajouter les moules, couvrir et cuire environ 3 min jusqu'à ouverture ; égoutter, filtrer et garder le jus, décortiquer, garder au chaud.", "Chorizo : couper en petits dés et les dorer à sec dans une poêle chaude ; égoutter sur papier absorbant.", "Risotto : chauffer le bouillon avec le jus des moules ; suer échalote et ail dans 2 c. à soupe d'huile, ajouter le petit épeautre et le nacrer, déglacer au vin blanc et réduire ; ajouter le bouillon louche par louche en remuant jusqu'à cuisson complète (≈ 35 min) ; en fin de cuisson ajouter l'encre de seiche, puis hors du feu parmesan et beurre ; rectifier.", "Dressage : risotto noir en assiette creuse, moules et cubes de chorizo dessus, poivre, servir chaud."]}, {"n": 96, "titre": "Pompe à l'huile", "meta": ["French Riviera  ·  Dessert", "Pour 4  ·  préparation 20 min  ·  cuisson 20 min", "Chapitre Toulon · repos 3 h"], "ing": ["500 g de farine", "25 g de levure fraîche de boulanger (ou 8 g de levure sèche)", "10 cl d'eau tiède", "100 g de sucre (+ un peu pour saupoudrer avant cuisson)", "1 pincée de sel", "10 cl d'huile d'olive vierge extra", "1 œuf", "5 cl d'eau de fleur d'oranger"], "etapes": ["Pâte : délayer la levure dans l'eau tiède 10 min ; mélanger farine, sucre et sel, creuser un puits, ajouter levure, huile, œuf et eau de fleur d'oranger ; pétrir 10 min en pâte souple ; couvrir et laisser lever 2 h en lieu tiède.", "Dégazer la pâte, l'étaler en ovale ou rond de 1 à 1,5 cm, faire 5 à 6 entailles centrales et les écarter ; poser sur une plaque avec papier cuisson, couvrir et laisser lever 1 h près d'une source de chaleur.", "Four à 180 °C (chaleur tournante) ; badigeonner d'huile d'olive, saupoudrer de sucre semoule, cuire 15 à 20 min jusqu'à légère coloration.", "Laisser tiédir sur une grille ; traditionnellement on la rompt à la main (treize desserts de Noël)."]}, {"n": 97, "titre": "Sériole à la flamme, yaourt à l'huile de menthe, concombre", "meta": ["French Riviera  ·  Poisson / fruits de mer", "Pour 4  ·  préparation 40 min", "Chapitre Saint-Tropez", "Protéine : Filet de sériole 400 g  (par personne : 100 g)"], "ing": ["Sériole", "400 g de filet de sériole bien frais", "Fleur de sel", "Poivre noir fraîchement moulu", "Yaourt au concombre", "200 g de yaourt grec", "1 concombre", "1 c. à soupe de jus de citron", "Sel, poivre", "Huile de menthe", "50 ml d'huile d'olive extra-vierge", "10 feuilles de menthe fraîche", "Finition", "½ concombre coupé en fines tranches", "Quelques feuilles de menthe fraîche"], "etapes": ["Sériole : passer les filets au chalumeau pour colorer légèrement la surface, trancher épais, réserver.", "Yaourt : éplucher le concombre, le centrifuger avec le jus de citron, filtrer le jus à l'étamine, le mélanger au yaourt grec, saler, poivrer, garder au frais.", "Huile de menthe : blanchir les feuilles 45 s, refroidir à l'eau glacée, égoutter, mixer avec l'huile d'olive, filtrer si besoin.", "Dressage : morceaux de sériole, points de yaourt au concombre, fines tranches de concombre superposées, filet d'huile de menthe, feuilles de menthe, fleur de sel et poivre noir."]}, {"n": 98, "titre": "Esquinade, mayonnaise citronnée et jeunes poireaux", "meta": ["French Riviera  ·  Poisson / fruits de mer", "Pour 4  ·  préparation 45 min  ·  cuisson 30 min", "Chapitre Saint-Tropez · repos 2 h (prise de la gelée)", "Protéine : Chair d'esquinade (araignée de mer) 200 g  (par personne : 50 g)"], "ing": ["Gelée de carapaces", "500 g de carapaces de crabe ou d'araignée de mer", "1 carotte", "1 branche de céleri", "1 échalote", "1 gousse d'ail", "5 cl de vin blanc sec", "50 cl d'eau", "1 feuille de laurier", "5 grains de poivre noir", "5 feuilles de gélatine", "Chair d'esquinade", "200 g de chair d'esquinade (ou d'araignée de mer)", "1 c. à soupe de mayonnaise maison", "1 c. à café de moutarde douce", "1 c. à soupe de jus de citron", "Zestes fins de citron non traité, jaune et vert", "Sel fin, poivre blanc", "Mini-poireaux", "4 mini-poireaux", "1 c. à soupe d'huile d'olive", "Fleur de sel, poivre blanc", "Dressage", "4 têtes d'araignée de mer (nettoyées et séchées)", "Herbes marines (salicorne, criste-marine, fenouil marin)", "Huile d'olive", "Fleur de sel"], "etapes": ["Gelée : concasser les carapaces et les faire revenir à sec ; ajouter carotte, céleri, échalote et ail, déglacer au vin blanc et réduire de moitié ; ajouter eau, laurier et poivre, frémir 30 min ; filtrer, réduire un peu, incorporer la gélatine trempée ; laisser tiédir, couler dans un plat, prendre au moins 2 h au frais.", "Chair : vérifier l'absence de cartilage, mélanger avec mayonnaise, moutarde, jus et zestes de citron, sel et poivre blanc ; rectifier l'acidité ; frais.", "Mini-poireaux : les tailler en fines rondelles, blanchir 30 s, glacer, égoutter ; assaisonner d'huile, fleur de sel et poivre blanc.", "Dressage : chair dans chaque tête d'araignée, lamelle fine de gelée dessus, rondelles de poireau autour, herbes marines, fleur de sel et filet d'huile d'olive."]}, {"n": 99, "titre": "Artichauts violets à la barigoule", "meta": ["French Riviera  ·  Entrée", "Pour 4  ·  préparation 20 min  ·  cuisson 20 min", "Chapitre Saint-Tropez"], "ing": ["16 petits artichauts violets (poivrade)", "2 carottes", "1 oignon", "1 gousse d'ail", "5 cl d'huile d'olive", "100 g de lardons (optionnel)", "10 cl de vin blanc sec", "10 cl de bouillon de volaille ou de légumes", "1 branche de thym", "1 feuille de laurier", "Quelques câpres (à queue de préférence)", "Fleurs d'ail (ou fleurs d'ail sauvage)", "Sel, poivre", "Le jus de 1 citron"], "etapes": ["Artichauts : couper les tiges, retirer les feuilles extérieures dures, couper le haut des feuilles, fendre en deux, ôter le foin ; les plonger aussitôt dans de l'eau citronnée.", "Barigoule : éplucher carottes et oignon en petits dés, hacher l'ail ; chauffer l'huile en cocotte, faire revenir les lardons (si utilisés) puis oignon, ail et carottes 3 à 4 min.", "Ajouter les artichauts égouttés et bien les enrober ; verser le vin blanc et réduire, ajouter bouillon, thym, laurier, sel et poivre ; couvrir et mijoter 15 à 20 min à feu doux jusqu'à tendreté.", "Retirer thym et laurier, ajouter quelques câpres et des fleurs d'ail juste avant de servir, chaud ou tiède."]}, {"n": 100, "titre": "Fleur de courgette à la brousse de brebis, velouté glacé de courgettes violons", "meta": ["French Riviera  ·  Entrée", "Pour 4  ·  préparation 30 min  ·  cuisson 4 min", "Chapitre Saint-Tropez · cuisson 4 min + torréfaction", "Protéine : Brousse de brebis 200 g  (par personne : 50 g)"], "ing": ["Velouté glacé", "4 courgettes violons (uniquement la partie verte)", "50 cl d'eau de cuisson des courgettes", "3 c. à soupe d'huile d'olive extra-vierge", "Sel, poivre", "Quelques glaçons", "Fleurs de courgette farcies", "4 fleurs de courgette bien fraîches", "200 g de brousse de brebis", "1 c. à soupe de miel", "1 c. à soupe de zestes de citron", "1 c. à soupe de herbes fraîches hachées (basilic, ciboulette, menthe)", "Sel, poivre", "Finition", "Quelques rondelles fines de courgette crue", "Pignons de pin torréfiés", "Fleurs de fenouil (optionnel)", "Huile d'olive"], "etapes": ["Velouté glacé : blanchir les verts de courgette 3 à 4 min à l'eau bouillante salée, refroidir à l'eau glacée, égoutter (garder l'eau) ; mixer avec une partie de l'eau, les glaçons et l'huile d'olive en velouté fin et froid ; assaisonner, frais.", "Fleurs farcies : mélanger la brousse avec miel, zestes de citron, herbes hachées, sel et poivre ; ouvrir délicatement les fleurs, les garnir à la cuillère ou à la poche, refermer les pétales ; frais jusqu'au dressage.", "Dressage : velouté très froid en assiette creuse, une fleur farcie au centre, fines rondelles de courgette crue, pignons torréfiés, fleurs de fenouil et filet d'huile d'olive."]}, {"n": 101, "titre": "Carpaccio de crevettes, bisque réduite et crème safranée", "meta": ["French Riviera  ·  Poisson / fruits de mer  ·  page ~121", "Pour 4  ·  préparation 45 min  ·  cuisson 40 min", "Chapitre Saint-Tropez · repos 1 h · numéro de page partiellement visible", "Protéine : 12 crevettes carabineros ultra-fraîches  (par personne : 3 crevettes)"], "ing": ["Carpaccio de crevettes", "12 crevettes carabineros ultra-fraîches", "Fleur de sel", "Poivre blanc", "Zeste de citron", "Bisque réduite", "Têtes et carapaces des crevettes", "1 échalote", "1 gousse d'ail", "1 tomate bien mûre", "3 cl de cognac", "50 cl de fumet de poisson ou d'eau", "1 pincée de piment d'Espelette", "Huile d'olive", "Sel, poivre", "Huile de carapaces", "Carapaces de crevettes", "10 cl d'huile neutre (pépin de raisin ou tournesol)", "Crème safranée en quenelle", "10 cl de crème liquide entière", "5 cl de bisque réduite", "1 pincée de safran", "1 feuille de gélatine", "Finition", "Quelques pluches d'aneth", "Chips de crevette"], "etapes": ["Carpaccio : décortiquer les crevettes en gardant têtes et carapaces, les fendre en deux dans la longueur, ôter le boyau, les aplatir délicatement entre deux films ; frais.", "Bisque : faire revenir têtes et carapaces dans un filet d'huile jusqu'à belle coloration, ajouter échalote, ail et tomate en dés, déglacer au cognac et flamber ; ajouter le fumet (ou l'eau), mijoter 30 min, filtrer en pressant les têtes, ajouter l'Espelette et réduire jusqu'à texture nappante ; en réserver pour la crème.", "Huile de carapaces : torréfier légèrement les carapaces restantes, ajouter l'huile neutre, infuser 15 min à feu doux, filtrer.", "Crème safranée : chauffer la crème avec safran et bisque réduite, incorporer la gélatine ramollie, laisser refroidir, monter légèrement au fouet, former des quenelles.", "Dressage : carpaccio sur assiettes froides, assaisonné, filet de bisque réduite, gouttes d'huile de carapaces, quenelle de crème safranée, aneth et chips de crevette."]}, {"n": 102, "titre": "Nectarines blanches à la verveine fraîche", "meta": ["French Riviera  ·  Dessert", "Pour 4  ·  préparation 20 min  ·  cuisson 20 min", "Chapitre Saint-Tropez · infusion 10 min · cuisson 15 à 20 min"], "ing": ["4 nectarines blanches mûres mais fermes", "50 cl d'eau", "150 g de sucre", "1 bouquet de verveine fraîche", "½ citron (jus + zestes)", "1 gousse de vanille (optionnel, pour une note douce)"], "etapes": ["Sirop : chauffer eau, sucre, jus et zestes de citron avec la vanille fendue ; ébullition, frémir 5 min ; hors du feu ajouter la verveine, couvrir, infuser 10 min, filtrer.", "Inciser la peau des nectarines en croix, les plonger dans le sirop chaud mais non bouillant et pocher 10 à 12 min à feu très doux ; retirer, tiédir, ôter la peau.", "Dénoyauter, couper en quartiers, disposer dans des bols avec un filet de sirop refroidi et des feuilles de verveine."]}, {"n": 103, "titre": "Rhubarbe pochée au jus de fraise", "meta": ["French Riviera  ·  Dessert", "Pour 4  ·  préparation 30 min  ·  cuisson 15 min", "Chapitre Saint-Tropez · refroidissement 1 h minimum (2 à 3 h idéalement) · turbine 30 à 40 min"], "ing": ["Rhubarbe pochée", "4 tiges de rhubarbe", "250 g de fraises fraîches", "50 g de sucre", "25 cl d'eau", "1 gousse de vanille (ou 1 c. à café d'extrait)", "1 c. à soupe de jus de citron", "Glace vanille", "50 cl de lait entier", "25 cl de crème liquide", "100 g de sucre", "4 jaunes d'œufs", "1 gousse de vanille", "Matériel", "Sorbetière"], "etapes": ["Rhubarbe : laver, éplucher, couper en tronçons de 5 cm ; porter à ébullition eau, sucre, vanille et jus de citron ; mixer les fraises en jus, le verser dans le sirop chaud, baisser le feu ; pocher la rhubarbe 5 à 7 min (tendre sans se défaire) ; la refroidir dans le sirop.", "Glace : chauffer lait, crème et vanille ; fouetter jaunes et sucre jusqu'à blanchiment, verser le liquide chaud dessus en fouettant, remettre sur le feu et cuire doucement en remuant jusqu'à ce que la crème nappe la cuillère (sans bouillir) ; refroidir complètement, turbiner 30 à 40 min, garder au congélateur.", "Dressage : tronçons de rhubarbe en assiette creuse, filet de sirop réduit au jus de fraise, quenelle de glace vanille, menthe fraîche."]}, {"n": 104, "titre": "Mini-poireaux de plein champ, vinaigrette à l'œuf mollet", "meta": ["French Riviera  ·  Entrée", "Pour 4  ·  préparation 30 min  ·  cuisson 60 min", "Chapitre non visible sur la photo · cuisson 15 min + 45 min (sous vide)"], "ing": ["20 mini-poireaux", "10 cl d'huile d'olive", "Quelques fleurs de ciboulette, brins d'aneth", "Sel, poivre", "Vinaigrette", "1 œuf bio", "10 g de moutarde", "20 g de vinaigre", "4 cl d'huile de colza", "2 g de sel", "1 g de poivre", "Jaune d'œuf à tartiner", "4 jaunes d'œufs bio", "Matériel", "Machine sous vide"], "etapes": ["Poireaux : nettoyer (garder les parures), blanchir 6 min à l'eau bouillante salée, refroidir à l'eau glacée, égoutter, égaliser les pointes vertes.", "Huile verte : mixer les parures avec l'huile d'olive, passer au chinois doublé d'un linge.", "Vinaigrette : cuire l'œuf 6 min, rafraîchir, écaler, mixer avec moutarde et vinaigre, ajouter l'huile de colza en filet, assaisonner.", "Jaune à tartiner : mettre les jaunes en poche sous vide scellée, cuire à 64 °C pendant 45 min ; laisser tiédir.", "Dressage : poireaux en ligne, filet d'huile verte, sel, poivre, cuillerée de vinaigrette, touche de jaune, fleurs de ciboulette, aneth."]}, {"n": 105, "titre": "Loup de ligne cuit sur la peau, petits pois, huile de cosses", "meta": ["French Riviera  ·  Poisson / fruits de mer", "Pour 4  ·  préparation 30 min  ·  cuisson 10 min", "Chapitre Antibes · infusion 30 min", "Protéine : 4 dos de loup de ligne (200 g chacun, avec la peau)  (par personne : 200 g)"], "ing": ["Loup", "4 dos de loup de ligne (200 g chacun, avec la peau)", "Huile d'olive extra-vierge", "Fleur de sel", "Petits pois et huile de cosses", "400 g de petits pois frais (écossés)", "Les cosses des petits pois", "10 cl d'huile d'olive extra-vierge"], "etapes": ["Huile de cosses : blanchir les cosses 2 min à l'eau bouillante salée, refroidir à l'eau glacée, égoutter ; mixer avec l'huile d'olive en huile bien verte ; infuser 30 min, filtrer à l'étamine.", "Petits pois : cuire 2 à 3 min à l'eau bouillante salée (ils restent croquants), refroidir, égoutter.", "Loup : bien sécher la peau ; chauffer un filet d'huile à feu moyen, poser les dos côté peau et presser légèrement ; cuire 4 à 5 min sans bouger jusqu'à peau croustillante, retourner et cuire 30 s à 1 min ; saler.", "Dressage : réchauffer les petits pois avec un filet d'huile de cosses, en faire un lit dans l'assiette, poser le loup peau vers le haut et arroser d'huile verte."]}];

const VOCID = Object.fromEntries(VOC.map(v=>[v.id,v]));
const MASK = /sauce de poisson|sauce soja|sauce d'huitre|sauce huitre|sauce worcestershire|bouillon de poisson|fond de poisson|jus de citron|jus d'orange/g;

/* ---------- repérage des sauces ---------- */
const HEADER = /^(sauce|finition|dressage|materiel|houmous|garniture|accompagnement|pate a ravioles|falafels|sorbetiere|vinaigrette|marinade|assaisonnement|dressing)\b/;
const SAUCEHEAD = /^(sauce|houmous|vinaigrette|assaisonnement|dressing)\b/;
const INLINE = /\b(sauce|vinaigrette|houmous|pesto|dip|mayonnaise|aioli|tahini|coulis|creme fraiche)\b/;
const EXCL = /sauce soja|sauce de poisson|sauce d'huitre|sauce huitre|sauce worcestershire|sauce tamari|sauce teriyaki|houmous de/;
const QTY = /^[\d½¼¾⅓⅔\/.,\-–\s+]*(?:(?:le jus de|le zeste de|zeste de|jus de|kg|ml|cl|dl|g|l|c\. ?à ?(?:soupe|café)|c\. ?à ?[sc]|cuill?ères? à (?:soupe|café)|pincées?|poignées?|brins?|gousses?|tranches?|feuilles?|branches?|bottes?|boîtes?|sachets?|portions?|tiges?|quelques)(?![a-zà-ÿ]))?[\d½¼¾⅓⅔\/.,\s]*(?:de |d'|du |des )?/i;
function isHeader(l){ return !/\d/.test(l) && l.length<40 && HEADER.test(norm(l)); }
function cleanLine(l){ return cap(l.replace(/\([^)]*\)/g,'').replace(QTY,'').replace(/\s+/g,' ').trim()); }

function saucesOf(r){
  const out=[]; const seen=new Set(); r.sauceInfo={};
  const push=(label,raw)=>{ const k=norm(label); if(!label||seen.has(k)) return; seen.add(k); out.push(label); r.sauceInfo[label]=raw||[]; };
  let blk=null; const blocks=[];
  for(const l of r.ing){
    if(isHeader(l)){ blk = SAUCEHEAD.test(norm(l)) ? {name:l,items:[]} : null; if(blk) blocks.push(blk); continue; }
    if(blk) blk.items.push(l);
  }
  for(const b of blocks){
    const items=b.items.map(cleanLine).filter(x=>x && x.length>2 && !NOISE.test(norm(x)));
    const head=cap(b.name.toLowerCase());
    if(norm(b.name)==='houmous') push('Houmous'+(items.length?' ('+items.slice(0,3).join(', ').toLowerCase()+')':''), b.items);
    else push(head+(items.length?' : '+items.slice(0,3).join(', ').toLowerCase():''), b.items);
  }
  const inBlock=new Set(blocks.flatMap(b=>b.items));
  for(const l of r.ing){
    if(isHeader(l)||inBlock.has(l)) continue;
    const nl=norm(l);
    if(INLINE.test(nl)&&!EXCL.test(nl)) push(cleanLine(l),[l]);
  }
  const t=norm(r.titre).match(/(sauce|vinaigrette|houmous|pesto|dip|coulis|mayonnaise|creme)\b[^,&]*/);
  if(t&&!blocks.length&&!out.length){ const i=norm(r.titre).indexOf(t[0]); push(cap(r.titre.slice(i,i+t[0].length).trim())); }
  return out;
}

/* ---------- indexation ---------- */
function termsOf(r){
  const txt = norm(r.ing.join(' | ')).replace(MASK,' ');
  const ids=new Set();
  for(const v of VOC) if(v.re.test(txt)) ids.add(v.id);
  return ids;
}
function prep(r){
  r.type = (r.meta&&r.meta[0]) ? (r.meta[0].split(/\s*·\s*/)[1]||'') : (r.type||'');
  r.text = norm(r.titre+' | '+r.ing.join(' | '));
  r.terms = termsOf(r);
  r.sauces = saucesOf(r);
  return r;
}

lace du pistou maison"], "etapes": ["Laver tous les légumes. Gratter les carottes, peler les pommes de terre, ébouillanter et peler les tomates. Couper carottes, pommes de terre, tomates et courgettes en petits dés. Émincer les oignons en rondelles et le blanc de poireau. Équeuter les haricots verts, rincer les haricots rouges.", "Déposer les légumes et les haricots dans un grand faitout. Couvrir de bouillon de légumes (1 l) et d'eau à hauteur si besoin, poivrer, porter à ébullition et cuire à feu moyen, à couvert (cuisson totale : 1 h).", "Ajouter les petits pois, les haricots verts coupés en tronçons et les coquillettes pour les 10 dernières minutes.", "Le pistou : dans un mortier (ou un mixeur), écraser l'ail avec une pincée de sel. Ajouter les feuilles de basilic et piler en pâte. Incorporer le parmesan puis l'huile d'olive en filet, jusqu'à une sauce onctueuse (ou utiliser 3 c. à s. de pesto prêt).", "Retirer la soupe du feu, incorporer le pistou juste avant de servir. Servir bien chaud, dans des bols, avec un filet d'huile d'olive et un peu de parmesan.", "Note : Décision Lud (9.10) : une seule fiche, fusion des photos 10 et 323. Note manuscrite photo 10 : « Servir chaud »."]}, {"titre": "Poulet rôti au miel et mélange de 7 épices", "source": "gratinez.fr (impression, 30.08.17, pages 1 à 4 sur 7)", "portions": "4 personnes", "type": "Viande", "ing": ["1 beau poulet fermier d'1 kg 500 (demander au boucher de le préparer)", "100 g beurre demi-sel", "4 c. à soupe miel", "½ citron vert bio (lime)", "1 c. à café paprika doux en poudre", "1 c. à café curcuma en poudre", "1 c. à café cannelle en poudre", "1 c. à café graines de cumin (à défaut, en poudre)", "1 c. à café baies de Sichuan (à défaut, un poivre du moulin)", "1 c. à café graines de coriandre (à défaut, en poudre)", "1 badiane (anis étoilé)", "Vérifier la cuisson", "(1) pointe de couteau dans le gras des cuisses, appliquée sur le poignet : si chaleur ressentie, a priori cuit", "(2) thermomètre : 75 °C au cœur des chairs", "(3) faire couler le jus de l'intérieur : brun-translucide, sans trace sanguinolente = prêt, sinon encore rosé"], "etapes": ["Ramollir au micro-ondes le beurre mélangé au miel, rendre homogène. Moudre au mortier les graines de cumin et coriandre, baies de Sichuan (ou poivre) ; ajouter le reste des épices en poudre, mélanger. Ajouter les épices et la badiane au mélange beurre et miel. Ajouter le jus du ½ citron vert. Bien homogénéiser. NE PAS JETER LE CITRON : mettre le reste du citron dans le poulet, avec ses abats. Laisser reposer 10 min au frigo (le beurre se fige, crème plus facile à étaler). Pendant ce temps, préchauffer le four à 210 °C ; nettoyer la cavité et l'extérieur du poulet avec du papier essuie-tout. Après les 10 minutes, étaler la moitié de la préparation sur tout le poulet et une bonne cuillère à soupe à l'intérieur. Enfourner à 210 °C. Après 15 minutes, sortir le poulet et le napper du reste de la préparation. Remettre au four encore 1 h 15 environ. Tous les ¼ d'heure, le sortir et l'arroser de son jus de cuisson.", "Note : Notes manuscrites : « Mettre juste 99 baies [de Sichuan]. Une cuill. à café c'est trop. » (lecture « 99 » incertaine) ; minutage inversé sur la page 1 : « 1h47 → 1re cuisson ; 1h35 → ajout de la crème sur 1 face… ; 1h20 → retourner, crème sur l'autre face… ; 1h05 ✗ ; 50' → retourner ; 35' ; 20' » (compte à rebours avant le service ; lecture partielle, à vérifier)."]}, {"titre": "Salade de betterave, feta et framboises", "source": "fiche imprimée (produits Vom Fass). Pour 4 personnes.", "portions": "4 personnes", "type": "Salade", "ing": ["2 betteraves cuites", "250 g framboises", "100 g feuilles d'épinards", "2 tiges de menthe", "125 g feta", "1 c. à soupe vinaigre balsamique de framboise Vom Fass", "3 c. à soupe huile vierge de noisette Vom Fass", "sel et poivre (ligne raturée au feutre rose à côté de « sel et poivre », sans effet sur le texte)"], "etapes": ["Laver et essorer les feuilles d'épinards. Couper la feta en dés. Éplucher et tailler les betteraves en dés. Mélanger tous ces ingrédients dans un saladier avec les framboises et les feuilles de menthe. Émulsionner le vinaigre balsamique de framboise et l'huile vierge de noisettes, puis saler et poivrer. Verser cette vinaigrette sur la salade, mélanger et servir."]}, {"titre": "Taboulé au chou-fleur, pesto origan-noisettes et œuf mollet", "source": "Mes recettes (photos)", "portions": "", "type": "Salade", "ing": ["½ chou-fleur", "½ concombre moyen", "10 tomates séchées déshydratées", "80 g maïs en bocal", "50 feuilles d'origan (ou de basilic)", "10 noisettes", "4 œufs", "2 c. à soupe vinaigre de cidre", "2 c. à soupe huile d'olive bio", "fleur de sel"], "etapes": ["Taboulé au chou-fleur, pesto origan-noisettes et œuf mollet — pour 4 personnes.", "Recette : Réhydrater les tomates séchées en les recouvrant à peine d'eau chaude, 10 min. Pendant ce temps, détacher les fleurs du chou-fleur, laver, râper à petite grille (consistance de semoule). Réserver dans un saladier, puis couper en petits dés les tomates réhydratées et le concombre (enlever les pépins s'il y en a beaucoup). Dans le saladier, ajouter les dés de concombre et tomates, le maïs, la fleur de sel et assaisonner avec le vinaigre de cidre. Cuire les œufs mollets, pas plus de 5 minutes.", "Note : Note manuscrite en haut : « Chou-fleur cru : 1 – Salade de chou-fleur pomme verte et moutarde » (la recette 1 n'est pas sur cette photo). Photo = recette 2.", "Note : Note manuscrite : « Préparer le pesto : torréfier les noisettes au four. Puis piler. Ajouter l'origan, finir par l'huile d'olive et le sel. Écaler l'œuf et servir. »", "Note : Sur la fiche : « Chou-fleur cru : 1 – Salade de chou-fleur, pomme verte et moutarde » est annoncée en note mais n'est pas sur la photo."]}, {"titre": "Rôti de porc à la moutarde facile", "source": "cuisineaz.com", "portions": "", "type": "Viande", "ing": ["1,5 kg rôti de porc dans l'échine ou dans le filet", "4 carottes", "2 oignons", "1 bouquet garni (ou 1 cube)", "12 cl huile d'olive", "10 cl eau", "50 cl cidre (ou bière)", "3 c. à soupe moutarde", "60 cl crème fraîche", "sel, poivre"], "etapes": ["(1) Carottes en rondelles, oignons pelés et émincés. (2) Chauffer l'huile d'olive dans une cocotte, dorer le rôti de chaque côté, saler, poivrer. (3) Ajouter les légumes, le bouquet garni (ou cube), le cidre (ou la bière) et l'eau. Couvrir et laisser cuire à petit feu 1 h 30. Retirer le rôti, le tenir au chaud sur un plat. Passer au mixeur le jus de cuisson et les légumes, la moutarde et la crème fraîche (en deux fois). (4) Servir avec le rôti."]}, {"titre": "Pavé de mignon de porc mandarin cuit en basse température, jus d'herbes fraîches", "source": "blog Cahier Gourmand (cahiergourmand.canalblog.com, 2009)", "portions": "6 convives", "type": "Viande", "ing": ["1 beau filet mignon fermier ou 2 petits", "10 tranches très fines de poitrine fumée", "20 cl banyuls (ou porto)", "2 c. à soupe cognac", "3 oranges (jus)", "75 g beurre", "1 pincée cannelle", "1 pincée noix de muscade", "125 g pignons de pin", "50 g mâche nantaise", "3 tiges persil", "huile de noisette"], "etapes": ["Au fourneau : Préchauffer le four à 70 °C et y glisser le plat de cuisson. Parer le filet mignon, saler, poivrer. Le faire revenir de toutes parts jusqu'à formation d'une croûte (effet Maillard). Étaler les tranches de poitrine sur une planche, poser le filet dessus et rabattre la poitrine pour l'« emballer » ; ficeler. Remettre une noix de beurre dans la cocotte et faire revenir rapidement le filet. Placer le filet dans le plat en attente dans le four à 70 °C, cuire environ 1 h 30. Avec une sonde, la température intérieure ne doit pas dépasser 60 à 65 °C. Si retard : emballer dans de l'aluminium et baisser le four à 60 °C (patienter 1 heure de plus). Monter la température quelques minutes avant de passer à table. Retirer la ficelle et couper en larges tronçons. La couleur rosée est NORMALE.", "Sauce mandarin : Déglacer les sucs avec 3 c. à soupe d'eau. Ajouter le banyuls et porter à ébullition. Ajouter le cognac, la cannelle, la muscade, le zeste râpé d'une orange et le jus des 3 oranges. Baisser le feu, réduire de moitié. Réserver. Faire griller à sec les pignons de pin. Au moment de servir, monter la sauce avec le beurre.", "Jus d'herbes : Effeuiller la mâche et le persil, blanchir 2 min dans l'eau salée. Mixer avec un filet d'huile de noisette.", "Présentation : Placer un pavé de filet mignon, verser la sauce autour ainsi que les pignons torréfiés. Décorer d'un bouquet de mâche et de jus d'herbes."]}, {"titre": "Brochettes d'agneau, sauce yaourt, menthe et ail", "source": "épicurien (30.05.2009)", "portions": "4 personnes", "type": "Viande", "ing": ["400 g agneau taillé en gros dés dans le gigot", "2 yaourts nature non sucrés", "2 gousses d'ail épluchées et écrasées", "2 c. à café d'un mélange quatre-épices", "4 brins de menthe fraîche", "sel", "poivre noir du moulin", "Marinade", "jus d'un ½ citron", "2 c. à soupe huile d'olive", "1 c. à café coriandre en poudre", "1 c. à café cumin en poudre", "Suggestions", "« Si vous souhaitez présenter cette préparation en plat principal, multipliez les quantités par… » (texte coupé en bas de la photo", "suite non visible)"], "etapes": ["Ustensiles : piques à brochettes en métal.", "Marinade : mélanger dans un grand plat creux le jus de citron avec l'huile d'olive, la coriandre et le cumin. Saler et poivrer légèrement, y ajouter les dés de viande. Laisser mariner au réfrigérateur au moins 1 heure. Sauce au yaourt : mélanger dans un grand bol les yaourts avec l'ail écrasé, les quatre-épices et la menthe nettoyée et finement ciselée. Saler, poivrer, bien mélanger, réserver au réfrigérateur jusqu'au moment de servir. Brochettes : embrocher les dés de viande marinée, les griller sur le barbecue 5 à 8 min en les retournant constamment. Servir bien chaud avec la sauce et une salade verte ou du riz blanc."]}, {"titre": "Courge farcie au couscous, légume
