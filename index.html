te : Intro : « Un peu d'Asie, pas mal de douceur et beaucoup d'acidité dans cette salade tiède et croquante. »", "Note : Notes « Question de goût » (2 encadrés) : fromage blanc dans la vinaigrette = fraîcheur et douceur, associé à l'acidité du citron ; lait de coco avec des œufs = note exotique."]}, {"titre": "Gnocchis en reblochonade", "source": "« à table ! », p. 36", "portions": "6 pers", "type": "Plat", "ing": ["Les gnocchis", "40 cl de lait demi-écrémé", "150 g de fromage de chèvre frais (type bûche cendrée)", "100 g de beurre", "20 g de farine", "3 œufs entiers", "1/2 c. à c. rase de sel", "La reblochonade", "200 g de reblochon", "10 cl de vin blanc", "6 cl de crème liquide", "2 échalotes", "quelques feuilles de basilic", "50 g d'amandes effilées", "papier sulfurisé"], "etapes": ["Les gnocchis : gratter et enlever la cendre du chèvre frais coupé en rondelles. Faire chauffer le lait en ajoutant le chèvre, le beurre et le sel. Remuer pour faire fondre le fromage, puis porter à ébullition, incorporer la farine hors du feu, puis fouetter. Remettre sur le feu pour dessécher la pâte en fouettant vivement, un peu comme pour une pâte à choux. Verser la préparation dans un saladier et ajouter les œufs, 1 par 1. Couvrir et placer au réfrigérateur jusqu'à complet refroidissement.", "La reblochonade : dans une poêle, verser le vin blanc et la crème. Ajouter le reblochon coupé en cubes et débarrassé de sa croûte, et faire-le fondre. Ajouter les échalotes finement ciselées. Porter à ébullition, puis faire légèrement réduire à feu doux.", "La finition : faire blondir les amandes au four à 180 °C (th. 6) pendant 3 mn. Former des quenelles de gnocchis avec 2 cuillères à soupe plongées dans de l'eau. Disposer-les côte à côte sur une feuille de papier sulfurisé en les saupoudrant d'amandes. Passer-les sous le gril du four (position médiane) pendant 3 mn. Puis plonger les quenelles au milieu de la reblochonade qui finit de cuire dans la poêle. Enrober totalement les gnocchis de ce fromage fondu avant de servir. Terminer en saupoudrant les quenelles de basilic ciselé.", "Note : Intro : l'auteur aime jouer avec le fromage en cuisine ; ces gnocchis légers au bon goût de chèvre sont accompagnés d'une crème de reblochon réchauffée d'échalotes et parfumée au vin blanc.", "Note : Note « Question de goût » : on évite de faire cuire les gnocchis dans l'eau pour qu'ils donnent toute leur saveur ; ils sont à peine colorés et soufflés sous le gril du four."]}, {"titre": "Poulet rôti « crousti » aux céréales", "source": "« à table ! », p. 52", "portions": "6 pers", "type": "Viande", "ing": ["1 poulet fermier vidé (1,5 kg)", "1 branche de coriandre fraîche", "1 branche de basilic", "quelques feuilles d'estragon", "1 c. à s. d'huile d'olive", "le jus de 1/2 citron", "sel, poivre", "1 branche de thym frais effeuillée", "plat à gratin", "La garniture", "2 oignons coupés en quartiers", "4 pommes de terre charlottes", "4 tomates", "1 c. à s. de curcuma", "La panure", "40 g de flocons d'avoine", "2 c. à c. rases de sucre cassonade", "4 c. à s. d'huile d'olive", "1 c. à c. bombée de curcuma", "1 c. à s. rase d'herbes de Provence séchées", "2 c. à c. rases de sel. (⚠ liste lue à l'envers, ordre des lignes à vérifier)"], "etapes": ["La garniture : couper les légumes en deux, les mettre dans un plat à gratin rempli aux deux tiers d'eau avec le curcuma.", "La cuisson du poulet : garnir l'intérieur du poulet avec les herbes et l'huile d'olive, puis l'embrocher la volaille. Mélanger tous les ingrédients de la panure, puis badigeonner-en la peau du poulet. Tous les morceaux, sans exception, doivent être bien recouverts de ces céréales parfumées. Mettre au four et démarrer la cuisson à froid, position « tournebroche » à 200 °C (th. 7) pendant la première heure, puis à 180 °C pendant la 1/2 h suivante – compter 30 min de cuisson par livre. Surveiller la cuisson. Placer le plat à gratin sous le poulet afin d'en recueillir tout le jus. Une fois le poulet cuit, transvaser les légumes dans une casserole, ajouter le jus de citron et faites réduire le jus des légumes afin d'obtenir un jus plus épais et plus concentré. Saler et poivrer.", "Note : Intro : « Pour changer du poulet rôti du dimanche, voici une volaille qui déménage ! Entièrement recouverte de céréales parfumées au curcuma, elle est, en outre, garnie d'herbes fraîches et accompagnée de petits légumes cuits dans la lèchefrite avec le jus du poulet qui tombe goutte à goutte… »", "Note : Note « Question de goût » : les céréales apportent au poulet une texture croustillante pour le moins originale."]}, {"titre": "Épigramme d'agneau « top bon » au balsamique", "source": "« à table ! », p. 54", "portions": "6 pers", "type": "Viande", "ing": ["450 g d'épigramme d'agneau (soit environ 3 pièces)", "4 c. à s. d'huile d'arachide", "3 noix de beurre", "sel", "La purée de pommes de terre", "500 g de pommes de terre BF15 épluchées et lavées", "200 g de beurre coupé en petits cubes", "10 cl de lait", "sel et poivre", "L'assaisonnement", "15 cl de vinaigre balsamique", "1 pincée de sucre", "60 g de beurre froid coupé en petits morceaux", "2 branches de romarin effeuillées"], "etapes": ["La purée : couper les pommes de terre en petits dés de taille identique, plonger-les dans une casserole d'eau froide remplie à hauteur, faire cuire à feu vif. Pendant ce temps, couper le beurre et chauffer le lait. Égoutter les pommes de terre, passer-les (encore chaudes) au presse-purée dans un saladier. Ajouter la moitié du lait, mélanger au fouet, ajouter le beurre en 2 fois, puis rectifier la texture de la purée avec le restant du lait (plus ou moins épaisse selon votre goût), verser la purée dans un bol, puis fouettez-la pendant 3 min avec un batteur électrique (ne mixez surtout pas).", "L'agneau : saler à cru l'agneau, avant de le saisir côté gras pendant 4 min à feu moyen. En cuisant l'agneau d'abord côté gras, l'auteur évite d'agresser la chair de la viande qui se retrouverait directement au contact de la source de chaleur ; de plus, ça caramélise la matière grasse qui devient croustillante, alors que l'intérieur reste tendre. Au moment de retourner la viande, ajouter le romarin et poser l'agneau dessus, avant de le faire cuire côté chair pendant 1 min. Puis sortir la viande pour la faire reposer tout en la gardant au chaud. Après avoir jeté la graisse, remettre la poêle sur le feu pour déglacer les sucs de cuisson avec le vinaigre balsamique, le sel, le poivre et le sucre. Le tout doit bouillir pendant 1 min. Hors du feu, ajouter le beurre ainsi que le jus de la viande qui a fini de reposer. Monter la sauce en fouettant légèrement. Dresser l'agneau sur l'assiette et arroser avec le jus acidulé. Servir avec la purée de pommes de terre.", "Note : Intro : l'auteur adore l'épigramme d'agneau, morceau (la poitrine) peu connu, pourtant bon marché, à la fois tendre et croustillant.", "Note : Notes « Question de goût » : le poivre ne se met pas à cuire la viande (il dégage une amertume désagréable lorsqu'il cuit à feu vif) ; fouetter la purée lui permet de fondre sur la langue (légère, la purée s'évapore en bouche)."]}, {"titre": "Crumble de cabillaud aux oignons", "source": "« à table ! », p. 58", "portions": "4 pers", "type": "Poisson / fruits de mer", "ing": ["4 steaks de cabillaud (sans arête et sans la peau), de 120 g chacun environ", "sel et poivre", "Le crumble salé", "120 g de farine de froment", "100 g de beurre salé", "2 c. à c. d'origan", "Les oignons acidulés", "2 oignons blancs finement émincés", "1 bouillon de volaille aux petits légumes (« Royco Minute Soup », réalisé avec 2 sachets délayés dans 40 cl d'eau bouillante)", "6 c. à s. d'huile d'olive", "4 c. à s. de raisins secs", "2 c. à c. bombées de gingembre en poudre", "1 c. à c. de cumin en graines", "le jus de 1 citron", "papier sulfurisé", "4 ramequins (8 cm de diamètre) ou plat à gratin"], "etapes": ["Le crumble salé : mélanger la farine avec l'origan. Ajouter le beurre mou (sorti 1 h avant, à température ambiante) puis malaxer le tout. Étaler la pâte (sur 1 cm d'épaisseur) sur une feuille de papier sulfurisé, puis mettre-la au réfrigérateur pendant 1 h. Ce délai écoulé, faire chauffer le four à 200 °C (th. 6/7), puis émietter la pâte sur la même feuille de papier sulfurisé avant de la cuire 10 min.", "Les oignons acidulés : faire revenir les oignons finement émincés dans l'huile d'olive. Ajouter les raisins secs, puis faire suer à feu moyen. Au bout de 8 min, ajouter le bouillon. Prolonger la cuisson de 2 min, puis ajouter le gingembre en poudre, les graines de cumin et le jus de citron. Les oignons doivent rester légèrement croquants.", "Montage : disposer un lit d'oignons acidulés au fond des ramequins. Poser par-dessus un steak de cabillaud (salé et poivré). Recouvrir d'oignons acidulés, puis mettre le tout au four à 200 °C (th. 6/7) pendant 10 min. Laisser reposer quelques instants, puis saupoudrer les steaks de cabillaud avec un peu de crumble salé.", "Note : Intro : « Des saveurs orientales pour ce cabillaud particulièrement fondant et présenté dans des petits ramequins. Vous pouvez aussi le servir dans un unique plat à gratin pour la famille ou vos amis. »", "Note : Note « Question de goût » : raisins secs blonds (très gros et très moelleux en fin de cuisson) associés au fondant du cabillaud et au croquant des oignons."]}, {"titre": "Noisette d'agneau, garniture orientale", "source": "« exception », p. 70", "portions": "4 pers", "type": "Viande", "ing": ["600 g de filet d'agneau, désossé et roulé sur lui-même", "3 c. à s. d'huile d'arachide", "10 g de beurre", "2 oignons", "3 c. à s. de raisins blonds", "1 branche de thym frais effeuillée", "1 c. à c. d'herbes de Provence", "1 c. à c. de cumin en graines", "Réduction de vinaigre balsamique", "3 c. à s. de vinaigre balsamique", "1 c. à s. rase de sucre semoule", "sel et poivre", "La finition", "2 c. à c. rases de cannelle", "2 c. à c. rases de gingembre en poudre", "4 c. à s. rases de sucre semoule", "4 c. à s. de vin blanc", "3 c. à s. de jus de citron", "quelques grains de fleur de sel", "quelques pincées de cumin en poudre", "1 filet de vinaigre balsamique", "sel. (⚠ liste lue à l'envers, ordre à vérifier)"], "etapes": ["La cuisson de l'agneau : préchauffer le four à 210 °C (th. 7). Dans une cocotte (qui va au four), faire chauffer l'huile d'arachide et le beurre à feu moyen. Mettre-y l'agneau et caraméliser-le bien sur toutes les faces pendant 5 min ; la graisse qui l'entoure doit être bien croustillante. Puis ajouter les oignons finement émincés, les raisins, le thym, les herbes de Provence et les graines de cumin. Mélanger bien, puis mettre la cocotte au four pendant 15 min environ.", "La réduction de vinaigre balsamique : dans une casserole, mélanger le vinaigre balsamique et le sucre. Saler et poivrer. Démarrer à feu moyen, puis porter à ébullition. Faire réduire ainsi le vinaigre pendant 40 s. Laisser refroidir en penchant légèrement la casserole pour concentrer davantage la réduction qui devient sirupeuse.", "Sortir l'agneau du four et laisser-le reposer dans une assiette. Toujours hors du feu, ajouter dans la cocotte où ont cuit les oignons le gingembre, la cannelle, le sel, le sucre et le vin blanc. Découper le canon d'agneau en 4 belles tranches. Au fond d'une assiette, disposer un lit d'oignons, puis la noisette d'agneau. Recouvrir-la de jus de cuisson, puis saupoudrer de quelques grains de fleur de sel et de 1 pincée de cumin en poudre. Ajouter 1 filet de vinaigre balsamique réduit.", "Note : Intro : « Un grand classique que le mariage de l'agneau avec les épices. Ici, les saveurs orientales sont mêlées à un jus acidulé. Les oignons peuvent faire office de légumes, mais vous pouvez aussi servir l'agneau avec une fine graine de semoule. »", "Note : Note « Question de goût » : quel morceau choisir pour réaliser ces noisettes ? Le mieux est de demander à votre boucher du filet d'agneau, le morceau le plus tendre et le plus délicat de l'agneau (désossé, roulé et ficelé, il se présente comme un petit rôti : on appelle cela « un canon d'agneau »). Après cuisson, il ne reste plus qu'à le trancher en noisettes épaisses."]}, {"titre": "Crème lisse de foie gras et caramel de betterave de Claude Colliot", "source": "« exception », p. 74", "portions": "6 pers", "type": "Base / sauce", "ing": ["Le foie gras crémeux", "1 lobe de foie gras cru (400 g)", "18 cl de lait demi-écrémé", "sel et poivre", "Le caramel de betterave", "1 betterave", "100 g de sucre semoule", "2 c. à s. d'eau", "2 c. à s. de vinaigre de xérès", "Les pop-corn", "1 c. à s. de maïs pour pop-corn", "1 c. à s. d'huile d'olive", "2 c. à s. bombées de sucre cassonade"], "etapes": ["Les pop-corn : dans une sauteuse, faire revenir à feu moyen, le maïs dans l'huile d'olive et le sucre cassonade. Couvrir pendant 10 min jusqu'à ce que les grains de maïs aient tous éclaté.", "Le caramel de betterave : dans une casserole, faire cuire à feu moyen l'eau, le sucre et la betterave coupée en petits cubes, jusqu'à obtention d'un caramel blond teinté de rouge. Stopper alors la cuisson et ajouter, hors du feu, le vinaigre de xérès. Passer le caramel au chinois, sans pour autant écraser les cubes de betterave contre les parois de la passoire. Le caramel doit être bien lisse et bien rouge.", "Le foie gras crémeux : faire chauffer le lait dans une casserole sans jamais le faire bouillir. Saler et poivrer. À feu très doux, incorporer le foie gras coupé en morceaux ; il doit se ramollir mais ne doit surtout pas fondre. Verser ce mélange dans un récipient le plus profond et le moins large possible (un doseur, par exemple). Mixer-y le foie gras et le lait avec un mixer plongeant jusqu'à ce que l'ensemble devienne légèrement mousseux. Verser le foie gras crémeux dans une assiette plate légèrement creusée. Ajouter quelques pop-corn, puis quelques traits de caramel de betterave. Servir tiède."]}, {"titre": "Fondue ice party de Pascal Guerreau", "source": "« la cuisine de mes potes »", "portions": "6 pers", "type": "Dessert", "ing": ["La pâte à choux", "15 cl d'eau", "5 cl de lait demi-écrémé", "60 g de beurre", "2 pincées de sel", "110 g de farine", "1 c. à s. de sucre semoule", "3 gros œufs entiers", "– La sauce chocolat au praliné", "80 g de chocolat noir", "5 cl d'eau", "30 cl de lait demi-écrémé", "40 g de poudre de praliné", "2 c. à s. de crème fraîche épaisse", "1 gousse de vanille fendue et grattée", "– La sauce vanille-chocolat", "1 l de lait demi-écrémé", "6 jaunes d'œufs", "80 g de sucre semoule", "2 gousses de vanille fendues et grattées", "20 g de Maïzena", "30 g de beurre", "2 c. à s. de crème fraîche épaisse", "100 g de chocolat noir", "Matériel", "papier sulfurisé", "piques en bois"], "etapes": ["Les sauces au choix :", "La pâte à choux : préchauffer le four à 180 °C (th. 6). Faire chauffer, sans faire bouillir, l'eau et le lait avec le beurre et le sel. Puis, hors du feu, ajouter, au fur et à mesure, la farine et le sucre. Mélanger vigoureusement afin d'obtenir une pâte bien homogène. Remettre la casserole sur le feu pour dessécher la pâte et remuer énergiquement à la spatule pendant 5 mn à feu moyen. Puis ajouter, un par un, les œufs entiers. Sur une feuille de papier sulfurisé, former des petites boules de la grosseur d'une noix à l'aide de 2 c. à c. Mettre au four 25 mn et n'ouvrir pas la porte. Remplir les choux de glace ou de sorbet, puis piquer-le tout avec une pique en bois. Mettre les profiteroles au congélateur pour au moins 2 h.", "La sauce chocolat au praliné : pendant ce temps, confectionner la sauce de votre choix. Faire cuire, à feu doux, le chocolat dans l'eau. Remuez 3 mn, puis, une fois le chocolat fondu, ajouter le lait, la gousse de vanille et la poudre de praliné. Augmenter alors la puissance du feu, et laisser épaissir la sauce au chocolat en remuant au fouet pendant une dizaine de minutes.", "La sauce vanille-chocolat : fouetter le sucre et les jaunes d'œufs jusqu'à ce que le mélange blanchisse. Ajouter alors la Maïzena. Faire chauffer 1/2 l de lait avec les graines de vanille. Porter à ébullition, puis verser aussitôt le lait vanillé bouillant sur le mélange sucre / jaunes d'œufs en remuant bien. Transvaser alors le tout dans une casserole et reporter à ébullition. Fouetter vivement, puis retirer du feu. Incorporer le beurre froid, coupé en morceaux. Verser la sauce dans le poêlon et ajouter alors la crème fraîche. Dans une casserole, faire une ganache en faisant fondre le chocolat avec le lait restant. Verser au centre du poêlon la ganache au chocolat. En trempant et en remuant le chou dans cette sauce, cette dernière prendra un aspect marbré.", "Servir dans un poêlon à fondue posé sur la table. Ajouter, et seulement à ce moment-là, la crème fraîche.", "Note : Intro : 3 parfums minimum de glaces : vanille, noix de coco, caramel, café ou chocolat, banane, fraise, abricot, poire, framboise ou orange pour les sorbets. (liste lue en haut de page)"]}, {"titre": "Hamburger d'agrumes en gelée, riz au lait à l'infusion de menthe d'Angelo Musa", "source": "« la cuisine de mes potes »", "portions": "4 pers", "type": "Dessert", "ing": ["La gelée d'agrumes", "2 pamplemousses", "1 orange + 1 orange sanguine", "30 g de sucre semoule", "3 feuilles de gélatine", "20 cl de jus de pamplemousse", "7 cl de jus d'orange", "le jus de 1/2 citron", "Le riz au lait à l'infusion de menthe", "75 g de riz rond", "29 cl de lait entier", "30 g de sucre", "le jaune de 1 gros œuf (ou de 2 petits)", "12,5 cl de crème liquide fouettée", "une vingtaine de feuilles de menthe fraîche", "La tuile croustillante à l'orange", "60 g de beurre", "125 g de sucre", "30 g de farine", "5 cl de jus d'orange", "le zeste de 1 orange", "Matériel", "4 ramequins de 7 à 8 cm de diamètre", "papier sulfurisé"], "etapes": ["La gelée d'agrumes : peler les agrumes à vif pour en extraire de l'écorce, de leur peau et des petites nervures. Couper-les en 4, puis faire chauffer les 3 jus (orange, pamplemousse et citron) avec le sucre dans une casserole. À l'ébullition, ajouter les feuilles de gélatine préalablement trempées dans l'eau froide et soigneusement pressées. Verser la gelée obtenue dans des ramequins. Filmer et mettre-les au réfrigérateur pour au moins 2 h. (⚠ ordre des phrases à vérifier : agrumes en segments dans les ramequins ?)", "Le riz au lait à l'infusion de menthe : faire bouillir le lait, puis stopper la cuisson. Ajouter aussitôt les feuilles de menthe fraîche et le sucre. Couvrir et laisser infuser pendant 15 mn. Faire cuire le riz en démarrant la cuisson à l'eau froide, puis poursuivre la cuisson pendant 2 mn encore après le début de l'ébullition. Égoutter alors le riz, puis ajouter-le au lait bouillant et sucré dans lequel infuse la menthe. Lorsque le riz est cuit, ajoutez le(s) jaune(s) d'œuf(s) et mélangez énergiquement. Réserver au frais. 10 mn avant de servir, sortez le riz au lait et incorporez-y la crème liquide préalablement fouettée en chantilly.", "La tuile croustillante à l'orange : faire fondre le beurre dans une casserole, puis, dans un saladier, ajouter ce beurre fondu à l'ensemble des autres ingrédients. Mélanger au fouet. Préchauffer le four à 180 °C (th. 6), puis, sur une feuille de papier sulfurisé, former des petits tas de pâte à l'aide d'une c. à c. Arrêtez la cuisson dès que les tuiles ont une couleur bien blonde.", "Au moment de servir, démoulez les ramequins dans des assiettes à dessert. Posez alors une tuile à l'orange sur le dessus de la gelée. Terminez en formant – à l'aide d'une c. à s. – une quenelle de riz au lait à la menthe, que vous poserez délicatement sur la tuile."]}, {"titre": "Coulant au chocolat noir et à la fleur de sel", "source": "« snacking sweet », p. 100", "portions": "6 pers", "type": "Dessert", "ing": ["110 g de chocolat noir", "115 g de beurre", "2 gros œufs entiers", "80 g de sucre semoule", "60 g de farine", "quelques copeaux de chocolat noir râpé ou concassé", "quelques grains de fleur de sel"], "etapes": ["Préchauffer le four à 200 °C (th. 6/7), puis beurrer et fariner le moule. Faire fondre le chocolat et le beurre au bain-marie. Dans un saladier, mélanger les œufs entiers et le sucre. Puis ajouter la farine. Fouettez le tout et ajoutez le chocolat fondu. Mélanger bien, puis verser le tout dans le moule. Ajouter alors seulement les copeaux de chocolat. Mettre au four et faites cuire pendant 13 min. Laisser reposer avant de démouler, puis saupoudrer le gâteau de quelques grains de fleur de sel.", "NOTES MANUSCRITES de Lud (post-its violets/bleus collés sur la page, lecture à confirmer) : « Pour 12 coulants : 300 ml de sucre [sic, lu « 300 g de sucre » ?], 160 g de beurre salé, 5 œufs, 160 g de sucre, 140 g de farine » ; « Sauce caramel : 300 g de sucre, 3 cuillères à soupe d'eau, 30 g de beurre, 10 cl de crème » ; à gauche, post-it rose : « 150 g de sucre, 1,5 cuill. à soupe d'eau, 15 g de beurre, 5 cl de crème + 80 g de beurre, 3 œufs, 80 g de sucre, 95 g de farine » ; autre post-it (Baloise) : « Sauce caramel : 300 g de sucre / 3 cuill. à soupe d'eau / 30 g de beurre / 10 cl de crème » et « 30 g – 50 g – 60 g ; 3 œufs 220 g ; 90 g sucre 50 g… ; 105 farine 60 g ; 160 » (⚠ illisible en partie).", "Note : Intro : « Un grand classique dont on ne se lasse jamais. C'est cuit autour et c'est coulant au centre. »", "Note : Note « Question de goût » : on met le chocolat concassé dans la pâte : à l'état solide au démarrage de la cuisson, alors que le reste de la pâte sera cuit, le chocolat va à peine fondre : c'est ce qui donne cet aspect coulant."]}, {"titre": "Coulant au caramel et au beurre salé (version Lud, plus de caramel)", "source": "« snacking sweet », p. 100 (photo 253) + sauce caramel p. 157 (photo 257) – sauce augmentée par Lud", "portions": "6 pers", "type": "Dessert", "ing": ["Pour les coulants", "15 cl de sauce caramel (le livre indique 11 cl) – recette ci-dessous", "20 g de beurre", "40 g de beurre doux", "40 g de beurre salé", "60 g de sucre semoule", "2 œufs entiers", "70 g de farine", "beurre et farine pour les 6 ramequins (Ø 5 cm, h 5 cm)", "Sauce caramel (photo 257, inchangée)", "450 g de sucre semoule (ou en morceaux)", "7,5 cl d'eau", "45 g de beurre doux", "14 cl de crème liquide", "9 cl de lait demi-écrémé"], "etapes": ["Sauce caramel : dans une poêle en Téflon, faire cuire l'eau et le sucre. Stopper la cuisson en incorporant d'abord le beurre doux, puis, tout en fouettant, le mélange lait/crème préalablement chauffé. Gare aux éclaboussures ! (prép. 10 min, cuisson 5 min)", "Faire fondre les 2 beurres (+ 20 g de beurre) dans 15 cl de sauce caramel encore bien chaude.", "Dans un saladier, mélanger les 2 œufs entiers avec le sucre, puis la farine. Verser la sauce caramel sur ce mélange et fouetter le tout.", "Beurrer et fariner les ramequins. Verser la pâte jusqu'aux trois quarts.", "Enfourner à 220 °C (th. 7/8) pendant 6 min. Patienter 5 min avant de démouler (à l'aide d'une lame de couteau). Déguster encore chaud et coulant au centre.", "Note : Version Lud (9.10) : recette du livre inchangée, sauf la quantité de sauce caramel : 15 cl au lieu de 11 cl (≈ 150 ml pour 6, dérivé de ton post-it « 300 ml pour 12 »). Sucre de la pâte du livre (60 g), non augmenté → moins sucré que tes versions 160 g/12.", "Note : Beurre : le livre note 20 g + 40 g doux + 40 g salé (le 20 g est vraisemblablement le beurre de la sauce ou du moule : à vérifier sur la photo 253).", "Note : Calculs de Lud (non issus du livre) : feuille 258 pour 16 pièces (caramel 400 ml ; beurre salé 213 g ; 7 œufs ; sucre 213 g ; farine 253 g) ; post-its 12 coulants (300 ml de sauce, 160 g beurre salé, 5 œufs, 160 g sucre, 140 g farine) ; version à 3 œufs (80 g beurre, 80 g sucre, 95 g farine)."]}, {"titre": "Fondue de crêpes épaisses, jeux d'épices et de sucres", "source": "« total régression sweet », p. 122", "portions": "6 pers", "type": "Dessert", "ing": ["La pâte à crêpes", "1 l de lait demi-écrémé tiède", "450 g de farine", "12 œufs entiers", "2 jaunes d'œufs", "120 g de beurre fondu", "3,5 cl d'huile d'arachide", "le zeste de 1 citron", "le zeste de 1 orange", "5 cl de rhum", "40 g de sucre", "1 c. à c. rase de sel. (⚠ « 12 œufs entiers » lu sur photo pivotée, à vérifier", "quantité inhabituelle)"], "etapes": ["Les jeux de sucres : 150 g de chacun des sucres suivants : cassonade, sucre semoule (dans lequel on a mélangé les graines d'une gousse de vanille), sucre cuivré, sucre roux, sucre vergeoise, miel de sapin et sirop d'érable.", "Les jeux d'épices : 1 c. à s. de chacune des épices suivantes : cannelle en poudre, gingembre en poudre, 5 épices, cumin en poudre et fleur de sel.", "La pâte à crêpes : mélanger les poudres (farine, sucre, sel et les zestes d'orange et de citron), puis incorporer, en fouettant, les œufs entiers, les jaunes d'œufs, le lait tiède, le rhum et le beurre fondu tiède. Laisser reposer au moins 1 h.", "La cuisson des crêpes : dans une poêle en Téflon légèrement graissée (avec du papier absorbant imprégné d'huile d'arachide), faire cuire les crêpes à feu moyen. Elles doivent être épaisses d'au moins 0,5 cm. Faire colorer les 2 faces suffisamment pour cuire uniformément toute l'épaisseur de la crêpe.", "L'assaisonnement des crêpes : apporter sur la table les crêpes, et disposer, tout autour, les sucres et épices. Procéder alors comme pour une fondue : prenez des crêpes et garnissez-les, à votre goût, avec des différents sucres et des épices ou des zestes de citron et d'orange. Vous pouvez aussi les tremper dans différents chocolats ou les garnir d'herbes fraîches (coriandre, basilic, estragon et menthe).", "Note : Intro : « Sur le principe d'une fondue, je me sers des crêpes pour jouer avec les parfums et découvrir de nouvelles sensations, notamment en assaisonnant les crêpes de sucres d'épices ou de condiments à chaque fois différents. »", "Note : Note « Question de goût » : associations possibles pour parfumer vos crêpes : vergeoise, gingembre, estragon et citron ; cassonade, basilic, cannelle et orange ; ou bien menthe, miel et cumin."]}, {"titre": "Fruits rouges au basilic", "source": "« total régression sweet », ≈ p. 124-125", "portions": "6 pers", "type": "Dessert", "ing": ["Le jus de fraise", "450 g de fraises", "3 citrons verts", "90 g de sucre semoule", "1,5 feuille de gélatine", "1,5 c. à c. de liaison à la Maïzena (voir recette p. 156)", "La finition", "6 grappes de groseilles", "12 petites fraises entières", "6 framboises", "6 feuilles de basilic", "6 c. à c. de jus de coco (voir recette p. 157)", "6 verres à vodka"], "etapes": ["Le jus de fraise : écraser à la fourchette les fraises et le sucre. Ajouter le jus de citron vert, puis passer au chinois cette pulpe de fraises. Porter à ébullition le jus de fraise filtré pendant 1 mn, puis, hors du feu, écumer les impuretés remontées à la surface (dépôts blanchâtres). Faire une liaison à la Maïzena et verser cette dernière dans le jus de fraise bouillant. Ajouter à chaud la gélatine préalablement ramollie dans de l'eau froide. Porter de nouveau à ébullition, puis repasser une seconde fois ce jus de fraise gélifié au chinois afin d'obtenir un jus très limpide.", "La finition : laver les groseilles et les 12 petites fraises. Au fond d'un verre à vodka, disposer 1 grappe de groseilles, ainsi que 1 fraise équeutée et coupée en", "Verser du jus de fraise par-dessus, puis glisser 1 feuille de basilic le long de la paroi du verre, de sorte qu'elle soit complètement noyée. Terminer par 1 fraise entière, 1 framboise et 1 c. à c. de jus de coco. Mettre au réfrigérateur pendant 2 h pour faire prendre la gelée.", "Note : Intro : « Un concentré de fruits rouges qui pulse ! C'est acide, vivifiant et doux à la fois… Du bonheur pour l'été ! »", "Note : Note « Question de goût » : que peut-on faire de la pulpe de fraises qui reste ? Ne surtout pas la jeter ! Personnellement, je la récupère toujours pour aromatiser mon yaourt nature."]}, {"titre": "Cocajou", "source": "« total régression sweet »", "portions": "6 pers", "type": "Dessert", "ing": ["La gelée de Coca", "13 cl de Coca-Cola", "3 cl de jus de citron", "15 g de sucre semoule", "2 feuilles de gélatine + 3 cl de Coca-Cola", "La marinade", "2 pamplemousses", "15 cl de sirop à la vanille (voir recette p. 156)", "2 pincées de vanille en poudre", "2 petites pincées de cannelle en poudre", "2 c. à c. de jus de citron", "1 c. à c. de whisky", "1 c. à c. de liaison à la Maïzena (voir recette p. 156)", "La finition", "12 c. à c. de jus de coco (voir recette p. 157)", "quelques morceaux de biscuit breton écrasé grossièrement"], "etapes": ["La gelée de Coca : mélanger les 13 cl de Coca-Cola, le sucre et le jus de citron. Ajouter les feuilles de gélatine préalablement trempées dans 3 cl de Coca-Cola tiède et pressées. Passer au chinois et verser cette gelée encore liquide dans des verres à vodka jusqu'au tiers. Mettre au réfrigérateur pendant 2 h.", "La marinade : peler à vif 16 quartiers de pamplemousse en enlevant la peau et les nervures amères de l'agrume. Dans une casserole, faire bouillir pendant 1 mn le sirop à la vanille avec 4 quartiers de pamplemousse, la vanille en poudre, la cannelle, le jus de citron et le whisky. Lier à la Maïzena. Plonger les 12 autres quartiers de pamplemousse dans ce sirop tiède et laisser-les mariner pendant quelques minutes.", "La finition : dans un verre de gelée de Coca, glisser 2 quartiers de pamplemousse marinés. Ajouter 2 c. à c. de jus de coco et du biscuit breton écrasé par-dessus.", "Note : Intro : « J'associe cette gelée de Coca citronnée à du pamplemousse mariné dans du whisky parfumé à la cannelle. C'est hyper-tonique ! »", "Note : Note « Question de goût » : le goût du Coca gélifié est-il différent du Coca liquide ? Sa structure – et donc sa texture – est différente. D'une manière générale, il suffit de changer la texture d'un produit pour en changer totalement ou partiellement le goût."]}, {"titre": "Sirop à la vanille", "source": "« total régression sweet », p. 156-157 (planche BASICS) ; prép. 5 min, cuisson 5 min", "portions": "", "type": "Base / sauce", "ing": ["50 cl d'eau", "150 g de sucre semoule", "2 gousses de vanille", "le jus de 1 citron"], "etapes": ["Faire bouillir 20 s l'eau, le jus de citron, le sucre, les gousses de vanille fendues en 2 et grattées. Laisser infuser 30 min."]}, {"titre": "Liaison à la Maïzena", "source": "« total régression sweet », p. 156-157 (planche BASICS) ; prép. 2 min", "portions": "", "type": "Base / sauce", "ing": ["Maïzena et eau « tant pour tant » (ex. 2 c. à s. de Maïzena + 2 c. à s. d'eau froide)"], "etapes": ["Délayer la Maïzena dans l'eau froide. Verser ce mélange épais dans un liquide chaud (bouillon, sauce, jus…), porter à ébullition quelques secondes en fouettant : le liquide épaissit instantanément."]}, {"titre": "Sauce safran", "source": "« total régression sweet », p. 156-157 (planche BASICS) ; prép. 2 min", "portions": "", "type": "Base / sauce", "ing": ["3 c. à s. bombées de mayonnaise", "2 c. à s. de bon vinaigre de cidre", "0,2 g de safran (2 capsules de 0,1 g)"], "etapes": ["Mélanger vivement tous les ingrédients ; la préparation doit être semi-liquide (mayonnaise allégée possible)."]}, {"titre": "Compote de rhubarbe", "source": "« total régression sweet », p. 156-157 (planche BASICS) ; prép. 5 min, cuisson 15 min", "portions": "", "type": "Dessert", "ing": ["500 g de rhubarbe surgelée", "100 g de sucre semoule", "le jus de 1 citron", "7 cl d'eau"], "etapes": ["Cuire la rhubarbe à feu moyen avec l'eau, le jus de citron et le sucre 15 min, en remuant régulièrement."]}, {"titre": "Crumble aux Petits Lu", "source": "« total régression sweet », p. 156-157 (planche BASICS) ; prép. 10 min, cuisson 20 min", "portions": "", "type": "Dessert", "ing": ["70 g de beurre pommade", "30 g de sucre vergeoise", "100 g de biscuits Petits Lu (12 pièces)", "papier sulfurisé"], "etapes": ["Sortir le beurre plusieurs heures à l'avance. Malaxer beurre, sucre vergeoise et biscuits émiettés : pâte sableuse.", "Four à 160 °C (th. 5/6). Former un tas sur papier sulfurisé, aplatir à ≈ 5 mm.", "Cuire 15 à 20 min."]}, {"titre": "Vinaigrette balsamique", "source": "« total régression sweet », p. 156-157 (planche BASICS) ; prép. 2 min", "portions": "", "type": "Base / sauce", "ing": ["1/2 c. à c. de sel", "1/2 c. à c. de sucre", "1 pincée de curry", "1 tour de moulin à poivre", "4 c. à s. de vinaigre balsamique", "6 à 8 c. à s. d'huile d'olive"], "etapes": ["Mélanger tous les ingrédients en commençant par le sel, le sucre, le poivre et le curry. Possible de forcer en vinaigre ou en curry."]}, {"titre": "Pâte de tomate", "source": "« total régression sweet », p. 156-157 (planche BASICS) ; prép. 10 min, cuisson 12 min", "portions": "", "type": "Base / sauce", "ing": ["500 g de tomates non épépinées en quartiers", "3 c. à s. d'huile d'olive", "1 gros oignon émincé", "5 branches de basilic", "1 gousse d'ail dégermée hachée", "3 c. à s. de ketchup", "3 c. à c. de miel liquide", "2 c. à c. de vinaigre balsamique", "1 c. à s. légèrement bombée de curry", "2 c. à c. légèrement bombées d'herbes de Provence", "sel, poivre"], "etapes": ["Faire fondre l'oignon avec herbes de Provence et curry 2 min à feu doux.", "À feu moyen, ajouter tous les autres ingrédients, remuer 10 min ; la pulpe doit être bien réduite, puis mixer au robot."]}, {"titre": "Sauce caramel", "source": "« total régression sweet », p. 156-157 (planche BASICS) ; prép. 10 min, cuisson 5 min", "portions": "", "type": "Base / sauce", "ing": ["450 g de sucre semoule ou en morceaux", "7,5 cl d'eau", "45 g de beurre doux", "14 cl de crème liquide", "9 cl de lait demi-écrémé"], "etapes": ["Dans une poêle en Téflon, cuire l'eau et le sucre. Stopper la cuisson en incorporant d'abord le beurre doux, puis, en fouettant, le mélange lait/crème préalablement chauffé. Gare aux éclaboussures !", "Note : « 450 g » lu sur photo pivotée."]}, {"titre": "Bouillon de volaille", "source": "« total régression sweet », p. 156-157 (planche BASICS) ; prép. 10 min, cuisson 1 h", "portions": "", "type": "Curry / soupe", "ing": ["1 kg d'ailerons, cous ou carcasses de poulet", "3 c. à s. d'huile d'arachide", "2 l d'eau", "2 carottes", "1 poireau", "1 oignon", "1 c. à s. d'origan", "1 c. à c. de cumin en poudre", "1 branche de thym frais effeuillée", "1/2 c. à c. de graines de coriandre écrasées", "1 feuille de laurier", "1 c. à s. de gros sel"], "etapes": ["Éplucher les légumes, les couper en gros tronçons. Faire revenir les morceaux de poulet 5 min dans l'huile d'arachide.", "Une fois dorés, les mettre dans un faitout avec tous les ingrédients. Compter 1 h de cuisson à feu moyen et découvert, à partir de l'ébullition (pas plus : il devient amer). Écumer régulièrement.", "Filtrer une première fois, puis une seconde fois pour un bouillon très clair. Possible de le réduire pour concentrer les goûts.", "Note : Allergène : coriandre (graines)."]}, {"titre": "Pain rustique à la farine de châtaigne", "source": "p. 204", "portions": "1 miche", "type": "Autre", "ing": ["Pour les farines et le levain (sic", "« levain » dans le titre de la liste, mais la recette utilise de la levure) : 300 g de farine de seigle (T130 à T170)", "100 g de farine de châtaigne", "100 g de farine de blé (T65 ou T110)", "10 g de sel", "10 g de levure de boulanger fraîche (ou 5 g de levure sèche)", "32 cl d'eau tiède", "Optionnel", "1 c. à s. de miel", "50 g de noisettes, noix ou figues séchées hachées", "un peu de farine pour saupoudrer"], "etapes": ["La pâte : délayez la levure dans 10 cl d'eau tiède. Laissez reposer 10 min. Dans un saladier ou le bol d'un robot, mélangez les trois farines et le sel. Ajoutez le reste d'eau, la levure diluée, le miel (si utilisé) et les fruits secs. Pétrissez 10 à 15 min. La pâte reste un peu collante, c'est normal.", "La première levée (pointage) : couvrez d'un torchon humide. Laissez lever 2 h à température ambiante, jusqu'à doublement de volume.", "Le façonnage : dégazez légèrement. Formez une boule. Déposez-la sur une plaque farinée. Saupoudrez de farine de seigle ou de blé. Couvrez, laissez lever encore 1 h.", "La cuisson : préchauffez le four à 240 °C (th. 8). Placez un récipient d'eau chaude en bas du four pour générer de la vapeur. Enfournez le pain, baissez à 220 °C (th. 7-8), laissez cuire 35 à 40 min. Le pain est prêt quand il sonne creux sous la miche. Laissez refroidir sur une grille."]}, {"titre": "Boulettes de blettes à la ricotta (Nice)", "source": "Mes recettes (photos)", "portions": "4 pers", "type": "Finger food", "ing": ["500 g de blettes (feuilles + côtes)", "250 g de ricotta", "50 g de parmesan râpé", "1 œuf", "80 g de chapelure (à ajuster selon la texture)", "1 gousse d'ail hachée", "1 pincée de noix de muscade", "sel, poivre", "huile d'olive (pour la cuisson)"], "etapes": ["Les blettes : séparez les feuilles des côtes. Faites cuire les côtes dans une grande casserole d'eau bouillante salée 10 min. Ajoutez les feuilles, poursuivez 5 min. Égouttez soigneusement puis pressez les blettes pour éliminer un maximum d'eau. Hachez finement l'ensemble.", "La farce : dans un saladier, mélangez les blettes hachées avec la ricotta, le parmesan, l'ail, l'œuf et la chapelure. Ajoutez muscade, sel et poivre. Mélangez jusqu'à pâte homogène. Si la texture est trop humide, incorporez un peu de chapelure supplémentaire.", "Le façonnage : formez des boulettes de la taille d'une noix. Disposez-les sur une plaque recouverte de papier cuisson.", "La cuisson : chauffez un filet d'huile d'olive dans une grande poêle. Faites dorer les boulettes à feu moyen 3 à 4 min de chaque côté, jusqu'à ce qu'elles soient bien croustillantes.", "La dégustation : servez chaud, accompagné d'une sauce tomate maison ou d'une salade verte. Elles peuvent aussi se manger froides, façon antipasti."]}, {"titre": "Gâteaux d'omelette aux légumes traditionnels de Nice", "source": "Mes recettes (photos)", "portions": "4 pers", "type": "Plat", "ing": ["Pour les omelettes", "16 œufs", "1 petite courgette cuite", "1 petit poivron rouge cuit", "1 oignon doux cuit", "100 g de blettes ou d'épinards (cuits, bien essorés, hachés)", "sel, poivre", "huile d'olive", "Pour le dressage", "olives noires Taggiasche", "purée de basilic", "feuilles de basilic frais", "pointes ou pétales de fleurs de courgette", "fleur de sel (optionnel)"], "etapes": ["Les mini-omelettes : battez les œufs deux par deux avec sel et poivre. Dans chaque duo, incorporez un légume différent mixé ou finement haché : courgette, poivron, oignon, blettes. Chauffez un peu d'huile d'olive dans une petite poêle ou un cercle inox. Versez une préparation, laissez cuire à feu doux jusqu'à ce que l'omelette soit juste prise, sans coloration. Répétez pour chaque légume. Laissez refroidir à température ambiante.", "Le montage : découpez les omelettes à l'emporte-pièce pour obtenir des palets nets, de taille égale. Superposez-les (2 à 4 couches selon l'effet souhaité). Réservez au froid au moins 30 min.", "Le dressage : déposez un palet au centre de chaque assiette. Ajoutez autour quelques points de purée de basilic, olives noires, feuilles de basilic frais, pétales ou pointes de fleurs de courgette. Terminez par un filet d'huile d'olive de qualité et une pincée de fleur de sel."]}, {"titre": "Panisse (Nice)", "source": "Mes recettes (photos)", "portions": "8 pers", "type": "Finger food", "ing": ["2 l d'eau", "50 g d'huile d'olive", "600 g de farine de pois chiche tamisée", "huile de tournesol (pour la friture)", "sel, poivre"], "etapes": ["La pâte : dans une grande casserole, portez l'eau à ébullition avec l'huile d'olive et une pincée de sel. Versez la farine de pois chiche en pluie tout en fouettant vigoureusement pour éviter les grumeaux. Laissez cuire à feu doux sans cesser de remuer jusqu'à ce que la préparation épaississe et se détache des parois. Comptez environ 5 min de cuisson, en remuant à la spatule pour bien dessécher la pâte.", "Le façonnage : versez la pâte chaude dans un plat légèrement huilé, lissez la surface et filmez au contact pour éviter qu'une croûte ne se forme. Laissez refroidir complètement à température ambiante ou au frais, jusqu'à ce que la préparation soit bien prise.", "La cuisson : démoulez la panisse et découpez-la en bâtonnets de 1 à 2 cm d'épaisseur, comme de grosses frites. Chauffez un bain d'huile de tournesol et plongez les morceaux jusqu'à ce qu'ils soient bien dorés et croustillants. Égouttez sur du papier absorbant.", "Le service : salez, poivrez et servez bien chaud.", "Note : Intro : « Très populaire à Nice et Marseille, la panisse est d'origine ligure et piémontaise. On la retrouve sur tout le littoral méditerranéen. »"]}, {"titre": "Socca (Nice)", "source": "Mes recettes (photos)", "portions": "8 pers", "type": "Finger food", "ing": ["1,5 l (?) d'eau", "300 g de farine de pois chiche", "8 c. à s. d'huile d'olive", "1 c. à c. de sel fin", "poivre noir fraîchement moulu (au service). → ⚠ quantité d'eau et d'huile à vérifier (photo floue)"], "etapes": ["La pâte : dans un grand saladier, versez l'eau froide. Ajoutez la farine de pois chiche, l'huile d'olive et le sel. Fouettez vivement pour obtenir une pâte lisse sans grumeaux. Filtrez au chinois pour parfaire la texture.", "La cuisson : préchauffez le four à 280 °C (th. 10 ou fonction pizza). Chauffez une grande plaque ronde (idéalement en cuivre) bien huilée. Lorsque la plaque est très chaude, versez la pâte en une fine couche régulière (2 à 3 mm d'épaisseur maximum). Enfournez pour 5 min environ, jusqu'à ce que la surface soit bien dorée, avec quelques zones légèrement brûlées pour l'authenticité.", "Le service : dès la sortie du four, découpez la socca en morceaux irréguliers. Poivrez généreusement et servez immédiatement, encore chaude, croustillante à l'extérieur et moelleuse à l'intérieur.", "Note : Intro : « Street food emblématique niçoise, autrefois casse-croûte des pêcheurs et ouvriers, aujourd'hui plat populaire servi chaud et croustillant sur les marchés ou en apéritif. »"]}, {"titre": "Daube de poulpe au vin rouge (Nice)", "source": "Mes recettes (photos)", "portions": "4 pers", "type": "Poisson / fruits de mer", "ing": ["Pour la daube", "1 kg de poulpe frais (ou surgelé, décongelé)", "75 cl de vin rouge corsé (bandol, côtes-du-rhône)", "2 carottes", "2 oignons", "3 gousses d'ail", "2 branches de céleri", "1 bouquet garni (thym, laurier, persil)", "2 c. à s. de concentré de tomates", "1 c. à s. de farine", "10 cl d'huile d'olive", "100 g d'olives noires de Nice", "sel, poivre", "zeste d'orange (optionnel mais conseillé)", "Pour l'accompagnement", "polenta crémeuse, pommes de terre vapeur ou pâtes fraîches"], "etapes": ["Le poulpe mariné (à préparer la veille) : si poulpe frais, plongez-le 2 min dans de l'eau bouillante pour l'attendrir. Égouttez, laissez refroidir, découpez en morceaux de 4 à 5 cm. Dans un grand saladier, mélangez le poulpe avec le vin rouge, les carottes et oignons coupés en morceaux, l'ail écrasé, le céleri et le bouquet garni. Couvrez, laissez mariner 12 h au frais.", "La cuisson : égouttez le poulpe en conservant la marinade. Dans une cocotte, chauffez l'huile d'olive, faites revenir les morceaux de poulpe 5 min. Réservez. Dans la même cocotte, faites revenir les légumes de la marinade 10 min à feu doux. Ajoutez le concentré de tomates et la farine, mélangez bien. Remettez le poulpe, versez la marinade filtrée, ajoutez le bouquet garni, salez, poivrez. Couvrez, laissez mijoter 2 h 30 à feu doux.", "La finition : ajoutez les olives noires et un peu de zeste d'orange râpé 15 min avant la fin de la cuisson.", "Le service : servez bien chaud, avec polenta crémeuse, pommes de terre vapeur ou pâtes fraîches."]}, {"titre": "Tourte aux blettes (Nice) — version sucrée", "source": "Mes recettes (photos)", "portions": "6 à 8 pers", "type": "Dessert", "ing": ["Pour la pâte", "250 g de farine", "50 g de sucre", "1 pincée de sel", "1 œuf", "3 c. à s. d'huile d'olive", "un peu d'eau tiède", "Pour la garniture", "500 g de feuilles de blettes", "1 pomme râpée ou en petits dés", "50 g de raisins secs", "80 g de sucre", "30 g de pignons de pin (ou noix hachées)", "zeste de 1 citron ou 1 orange non traités", "1 à 2 c. à s. de rhum ou de fleur d'oranger (optionnel)", "1 œuf", "sucre glace (pour la finition)", "Matériel", "1 moule à tarte (Ø 24 à 26 cm)"], "etapes": ["La pâte : dans un saladier, mélangez farine, sucre et sel. Ajoutez l'œuf, l'huile d'olive et un peu d'eau tiède. Pétrissez jusqu'à pâte souple. Filmez, laissez reposer 30 min.", "La garniture : blanchissez brièvement les feuilles de blettes à l'eau bouillante, égouttez soigneusement et hachez finement. Mélangez avec la pomme, les raisins secs (préalablement trempés), le sucre, les pignons, le zeste, et si vous le souhaitez, le rhum ou la fleur d'oranger. Incorporez l'œuf pour lier le tout.", "Le montage : préchauffez le four à 180 °C (th. 6). Divisez la pâte en deux. Abaissez finement la première moitié et foncez un moule à tarte beurré. Versez la garniture. Recouvrez avec la deuxième abaisse, soudez bien les bords. Incisez légèrement le dessus et badigeonnez d'un peu d'huile d'olive.", "La cuisson : enfournez 45 à 50 min jusqu'à ce que la tourte soit bien dorée. Laissez tiédir avant de démouler.", "La finition : saupoudrez généreusement de sucre glace juste avant de servir. Se déguste tiède ou froide."]}, {"titre": "Pichade de Menton", "source": "Menton, p. 289", "portions": "4 pers", "type": "Plat", "ing": ["Pour la pâte", "250 g de farine", "10 g de levure de boulanger fraîche (ou 5 g de levure sèche)", "12 cl d'eau tiède", "3 c. à s. d'huile d'olive", "1 pincée de sel", "Pour la garniture", "500 g de tomates pelées (fraîches ou en boîte)", "2 gros oignons émincés", "2 gousses d'ail hachées", "1 c. à s. d'huile d'olive", "1 c. à s. d'origan séché", "10 filets d'anchois à l'huile", "olives noires de Nice", "sel, poivre"], "etapes": ["La pâte : délayez la levure dans l'eau tiède, laissez reposer 5 min. Dans un saladier, mélangez la farine et le sel, puis ajoutez le mélange à base de levure et l'huile d'olive. Pétrissez jusqu'à pâte souple et homogène. Couvrez d'un torchon, laissez lever 1 h à température ambiante.", "La garniture : faites revenir les oignons à feu doux dans l'huile d'olive jusqu'à ce qu'ils soient fondants. Ajoutez l'ail, les tomates concassées, l'origan, du sel et du poivre. Laissez mijoter 20 à 30 min jusqu'à obtention d'une sauce bien épaisse.", "Le montage et la cuisson : préchauffez le four à 200 °C (th. 6-7). Étalez la pâte sur une plaque huilée ou recouverte de papier cuisson. Répartissez la sauce tomate. Disposez les filets d'anchois et les olives noires. Enfournez 20 à 25 min, jusqu'à ce que la pâte soit dorée et croustillante.", "Note : Intro : « Une spécialité locale incontournable, entre pizza et pissaladière. »"]}, {"titre": "Épaule d'agneau confite à l'ail et au romarin, pommes mitraillées", "source": "Menton, p. 298", "portions": "4 pers", "type": "Viande", "ing": ["Pour l'agneau confit", "1 épaule d'agneau de 1,5 à 2 kg", "1 tête d'ail entière, non épluchée", "4 branches de romarin", "80 g d'huile d'olive", "20 cl de vin blanc", "20 cl de fond d'agneau", "sel, poivre", "Pour l'accompagnement", "pommes mitraillées (à ajouter dans la dernière demi-heure de cuisson)"], "etapes": ["L'épaule d'agneau : préchauffez le four à 150 °C (th. 5). Salez et poivrez généreusement l'épaule sur toutes ses faces. Dans une grande poêle, faites chauffer l'huile d'olive et faites dorer l'épaule 2 à 3 min de chaque côté. Déposez-la dans une cocotte ou un plat allant au four muni d'un couvercle. Ajoutez la tête d'ail coupée en deux autour de la viande et disposez les branches de romarin sur le dessus. Déglacez la poêle avec le vin blanc pour décoller les sucs. Ajoutez le fond d'agneau et versez le tout autour de l'épaule. (Cette étape peut être enrichie d'une cuillerée de miel de thym pour une touche plus douce.) Couvrez la cocotte (ou utilisez du papier aluminium) et enfournez pour 4 h, en arrosant la viande toutes les heures avec le jus de cuisson.", "La finition : retirez le couvercle pour la dernière demi-heure de cuisson afin de laisser caraméliser légèrement l'épaule. Ajoutez alors les pommes mitraillées autour de la viande. Servez l'agneau bien chaud, avec les gousses d'ail confites et les pommes dorées dans le jus. La viande, ultra-fondante, se détache simplement à la cuillère.", "Note : Intro : « Une épaule d'agneau, quelques aromates, un peu de patience… et vous êtes récompensé par une viande fondante qui se détache à la cuillère. »"]}, {"titre": "Gnocchi de Monalisa, crème de parmesan, truffe de Pierrot (Menton)", "source": "Mes recettes (photos)", "portions": "4 pers", "type": "Plat", "ing": ["Pour les gnocchis", "800 g de pommes de terre Monalisa", "200 g de farine", "1 jaune d'œuf", "40 g de parmesan râpé", "1 pincée de noix de muscade râpée", "sel, poivre", "Pour la crème de parmesan", "25 cl de crème liquide entière", "100 g de parmesan râpé", "poivre blanc", "Pour le jus de poulet", "2 ailes de poulet", "1 échalote", "1 gousse d'ail", "10 cl de vin blanc sec", "30 cl de fond de volaille", "1 c. à s. de beurre", "1 c. à s. d'huile d'olive", "Pour le dressage", "1 truffe noire (Tuber melanosporum)"], "etapes": ["Les gnocchis : faites cuire les pommes de terre avec la peau dans une eau salée frémissante 25 à 30 min. Égouttez-les, épluchez-les encore chaudes, puis passez-les au presse-purée sans trop travailler la pâte. Sur un plan de travail fariné, mélangez la purée avec la farine, le jaune d'œuf, le parmesan, la muscade, du sel et du poivre. Pétrissez rapidement jusqu'à obtention d'une pâte homogène. Divisez la pâte en boudins, découpez des morceaux de 4 à 5 cm, roulez-les légèrement et marquez-les à la fourchette ou à l'aide d'un ustensile à gnocchis. Plongez-les dans une eau bouillante salée et dès qu'ils remontent à la surface, égouttez-les. Réservez.", "Le jus de poulet : faites revenir les ailes de poulet avec l'échalote émincée et l'ail écrasé dans une casserole avec l'huile d'olive. Déglacez avec le vin blanc et laissez réduire de moitié. Ajoutez le fond de volaille et laissez mijoter 30 min. Filtrez, puis incorporez le beurre pour lier le jus. Réservez au chaud.", "La crème de parmesan : faites chauffer la crème râpée (sic : « la crème ») à feu doux. Ajoutez le parmesan râpé et mélangez jusqu'à obtention d'une crème lisse et nappante. Poivrez au goût et maintenez au chaud.", "La finition et le dressage : dans une poêle, glacez les gnocchis avec un filet d'huile d'olive. Répartissez-les dans des assiettes creuses, nappez de crème de parmesan, ajoutez quelques traits de jus de poulet et râpez la truffe noire au moment de servir."]}, {"titre": "Focaccia aux olives noires et au thym frais (Menton)", "source": "Mes recettes (photos)", "portions": "6 pers", "type": "Autre", "ing": ["Pour la pâte", "10 g de levure boulangère fraîche", "30 cl d'eau tiède", "500 g de farine (T55 ou T65)", "10 g de sel", "10 g de sucre", "6 cl d'huile d'olive", "Pour la garniture", "100 g d'olives noires dénoyautées", "quelques branches de thym frais (ou 1 c. à s. de thym séché)", "2 à 3 c. à s. d'huile d'olive", "fleur de sel"], "etapes": ["La pâte : dans un petit bol, délayez la levure dans 5 cl d'eau tiède. Laissez reposer 10 min. Dans un grand saladier ou le bol d'un robot, mélangez la farine, le sel et le sucre. Ajoutez la levure activée, le reste de l'eau tiède (25 cl) et l'huile d'olive. Pétrissez la pâte pendant 8 à 10 min jusqu'à ce qu'elle soit souple et élastique. Formez une boule, couvrez d'un linge propre et laissez lever 1 h 30 dans un endroit chaud, jusqu'à ce que la pâte double de volume.", "Le façonnage : huilez généreusement une plaque de cuisson. Placez des cercles en inox si vous souhaitez des portions individuelles. Boulez la pâte dans les cercles ou étalez-la uniformément. Couvrez et laissez pousser à nouveau 30 à 45 min.", "La cuisson : préchauffez le four à 200 °C (th. 6-7). Avec vos doigts, formez des creux dans la pâte. Répartissez les olives et saupoudrez de thym. Arrosez généreusement avec l'huile d'olive. Ajoutez une pincée de fleur de sel si vous le souhaitez. Enfournez pour 20 à 25 min, jusqu'à ce que la focaccia soit bien dorée.", "La finition : laissez tiédir sur une grille avant de servir.", "Note : Intro : « Originaire d'Italie, la focaccia est aussi très présente sur la Côte d'Azur, où elle est souvent garnie d'olives, d'herbes fraîches et d'huile d'olive. »"]}, {"titre": "Tarte au citron de Menton (Menton)", "source": "Mes recettes (photos)", "portions": "4 pers", "type": "Dessert", "ing": ["Pour la pâte sucrée", "250 g de farine", "125 g de beurre", "100 g de sucre glace", "1 œuf", "1 pincée de sel", "zeste de citron non traité (optionnel)", "Pour la crème au citron", "3 œufs entiers", "150 g de sucre", "12 cl de jus de citron de Menton (environ 3 beaux citrons)", "les zestes fins de 1 citron non traité"], "etapes": ["La pâte sucrée : mélangez la farine, le sucre, le sel et le beurre froid coupé en dés. Sablez la pâte, ajoutez l'œuf et formez une boule. Laissez reposer 1 h au frais. Préchauffez le four à 170 °C (th. 5-6). Abaissez la pâte, foncez un moule à tarte, piquez le fond et enfournez pour précuire 15 min.", "La crème au citron : fouettez les œufs avec le sucre sans les faire mousser. Ajoutez le jus de citron et les zestes. Mélangez bien. Versez dans le fond de tarte précuit.", "La cuisson : baissez la température du four à 140 °C (th. 4-5). Enfournez pour 25 à 30 min, jusqu'à ce que l'appareil soit pris mais encore légèrement tremblant au centre.", "La finition : laissez complètement refroidir, puis placez au frais."]}, {"titre": "Barbajuans", "source": "Menton, p. 294", "portions": "4 pers", "type": "Finger food", "ing": ["Pour la pâte", "250 g de farine", "1 pincée de sel", "50 g de beurre fondu", "1 œuf", "5 cl d'eau", "Pour la farce", "1 échalote finement hachée", "1 gousse d'ail hachée", "1 c. à s. d'huile d'olive", "200 g de blettes (ou épinards)", "100 g de ricotta (ou brousse de brebis)", "50 g de riz cuit", "50 g de parmesan râpé", "1 œuf", "sel, poivre, muscade", "Pour la cuisson", "huile de friture"], "etapes": ["La pâte : dans un saladier, mélangez la farine, le sel et le beurre fondu. Ajoutez l'œuf, puis versez l'eau progressivement jusqu'à obtenir une pâte souple. Pétrissez pendant 5 min. Filmez et laissez reposer à température ambiante pendant 30 min.", "La farce : faites revenir l'échalote et l'ail dans l'huile d'olive jusqu'à ce qu'ils deviennent translucides. Ajoutez les blettes finement hachées et laissez cuire environ 5 min, le temps qu'elles rendent leur eau. Égouttez soigneusement, puis mélangez avec la ricotta, le riz, le parmesan râpé et l'œuf battu. Assaisonnez de sel, de poivre et d'une pincée de muscade. Laissez tiédir.", "Le façonnage : étalez la pâte le plus finement possible sur un plan de travail fariné. Découpez des cercles d'environ 6 cm de diamètre. Déposez une petite cuillerée de farce au centre de chaque disque. Recouvrez avec un second disque et pressez bien les bords pour souder. Vous pouvez aussi les façonner en demi-lunes pour une forme plus traditionnelle.", "La cuisson : faites chauffer l'huile de friture à 170 °C. Plongez les barbajuans par petites quantités et laissez-les frémir jusqu'à ce qu'ils soient bien dorés et croustillants. Égouttez sur du papier absorbant.", "Le service : servez les barbajuans encore chauds. Vous pouvez, pour plus de gourmandise, les accompagner d'une crème de parmesan légèrement tiédie.", "Note : Intro : « Spécialité emblématique de Monaco, le barbajuan — littéralement « oncle Jean » en monégasque — est un beignet salé farci de blettes, de riz et de fromage, puis frit. Il se déguste chaud, souvent à l'apéritif ou en entrée. »"]},{"titre": "Mochi du Junes", "source": "Recette personnelle (repas d'invités)", "portions": "", "type": "Dessert", "ing": ["80 g de farine de riz gluant", "40 g de sucre", "140 g d'eau", "Maïzena (pour étaler la pâte)", "Garniture", "Glace", "Sésame", "Cacahuètes écrasées", "Chocolat chaud"], "etapes": ["Préparer la pâte à mochi avec la farine de riz gluant, le sucre et l'eau (mode de cuisson : à compléter).", "Étaler la pâte avec de la maïzena.", "Servir avec de la glace, du sésame, des cacahuètes écrasées et du chocolat chaud.", "Note : la pâte a été très difficile à étaler, même avec de la maïzena.", "Piste à tester (pas encore essayée, d'après deux sites de recettes) : moins d'eau, car la proportion ici (140 g d'eau pour 80 g de farine) est plus humide que dans ces recettes (environ autant d'eau que de farine, jusqu'à 1,2 fois) ; saupoudrer généreusement de maïzena ou de fécule la surface, les mains et le rouleau, et en remettre dès que ça colle ; laisser la pâte tiédir environ 5 min avant de l'étaler ; étaler en un seul sens, sur environ 0,6 cm."]}];
const mkExtra = () => EXTRA.map((d,i)=>{ const r=prep({key:'x'+(i+1), n:'+', user:false, titre:d.titre, meta:[ (d.source||'Recette ajoutée')+'  ·  '+d.type, d.portions?('Pour '+d.portions):'' ].filter(Boolean), ing:d.ing, etapes:d.etapes}); r.type=d.type; return r; });
let ALL = BASE.map(r=>prep({...r, key:'b'+r.n, user:false})).concat(mkExtra());
const REPAS = [{"id": "r1", "titre": "Repas pour 4 invités", "date": "", "invites": "4", "plats": [{"nom": "Crozets aux oignons et lardons", "detail": "Pour 4 : au moins 600 g de crozets, presque 1 kg d'oignons, 500 g de lardons."}, {"nom": "Apéro : chou-fleur, grenade et poulet au curry", "detail": "Poulet cuit simplement avec du curry. Quelques feuilles de roquette ajoutées. Sauce versée dessus : 1 citron entier (jus), sauce soja et un peu d'huile de sésame."}, {"nom": "Courge rôtie, ricotta et romarin", "detail": "Courge coupée en petits dés, 45 min au four. Ricotta au fond du plat, poivre, courge, romarin. Chapelure moulue maison parsemée dessus.", "note": "Il manquait quelque chose de croquant."}, {"nom": "Crevettes, pamplemousse et noix de cajou", "detail": "Crevettes avec une sauce soja et sauce de poisson."}, {"nom": "Mochi du Junes", "detail": "Pâte à mochi, glace, sésame, cacahuètes écrasées et chocolat chaud.", "note": "Pâte très difficile à étaler, même avec de la maïzena.", "recette": "Mochi du Junes"}]}];
let USERREPAS = [];
const REPAS_KEY='repas_invites';
try{ const rr=JSON.parse(localStorage.getItem(REPAS_KEY)||'[]'); if(Array.isArray(rr)) USERREPAS=rr; }catch(e){ USERREPAS=[]; }
function saveRepas(){ try{ localStorage.setItem(REPAS_KEY,JSON.stringify(USERREPAS)); return true; }catch(e){ return false; } }
let USERDOCS = [];
const STORE_KEY='recettes_ajoutees';
try{ const raw=JSON.parse(localStorage.getItem(STORE_KEY)||'[]'); if(Array.isArray(raw)) USERDOCS=raw; }catch(e){ USERDOCS=[]; }
function saveUserDocs(){ try{ localStorage.setItem(STORE_KEY,JSON.stringify(USERDOCS)); return true; }catch(e){ return false; } }

function rebuild(){
  const u = USERDOCS.map(d=>{ const r=prep({key:'u'+d.id, id:d.id, user:true, n:'+', titre:d.titre, meta:[ (d.source||'Ajoutée') +'  ·  '+(d.type||'Autre'), d.portions?('Pour '+d.portions):'' ].filter(Boolean), type:d.type||'Autre', ing:d.ing||[], etapes:d.etapes||[]}); r.type=d.type||'Autre'; return r; });
  ALL = BASE.map(r=>prep({...r, key:'b'+r.n, user:false})).concat(mkExtra()).concat(u);
}

let sauceFilter=null;    // libellé de sauce
let mode='cuisine';

try{ LIST=JSON.parse(localStorage.getItem('liste_courses')||'[]'); if(!Array.isArray(LIST)) LIST=[]; }catch(e){ LIST=[]; }
function saveList(){ try{ localStorage.setItem('liste_courses',JSON.stringify(LIST)); }catch(e){} }
const $=id=>document.getElementById(id);

function matches(r,s){ return s.kind==='id' ? r.terms.has(s.v) : r.text.includes(norm(s.v)); }
function current(){ return ALL.filter(r=>sel.every(s=>matches(r,s))); }
const selLabel = s => s.kind==='id' ? VOCID[s.v].label : s.v;
function has(s){ return sel.some(x=>x.kind===s.kind&&x.v===s.v); }
function toggle(s){ const i=sel.findIndex(x=>x.kind===s.kind&&x.v===s.v); if(i>=0) sel.splice(i,1); else sel.push(s); sauceFilter=null; render(); }

/* ---------- rendu ---------- */
function renderGroups(){
  const counts={}; for(const v of VOC) counts[v.id]=0;
  for(const r of ALL) for(const t of r.terms) counts[t]++;
  let html='';
  Object.entries(G).forEach(([g,info],i)=>{
    const list=VOC.filter(v=>v.g===g&&counts[v.id]>0);
    if(!list.length) return;
    html+=`<details class="grp" ${i<2?'open':''}><summary>${esc(info.label)}</summary><div class="chips">`+
      list.map(v=>`<button type="button" class="chip" style="--h:${info.h}" data-id="${v.id}" aria-pressed="${has({kind:'id',v:v.id})}">${esc(v.label)}<small>${counts[v.id]}</small></button>`).join('')+`</div></details>`;
  });
  $('groups').innerHTML=html;
}
function renderPicked(){
  $('picked').innerHTML = sel.map((s,i)=>`<button class="pill" type="button" data-i="${i}" aria-label="Retirer ${esc(selLabel(s))}">${esc(selLabel(s))} <b>×</b></button>`).join('') + (sel.length?`<button class="clear" type="button" id="clr">Tout effacer</button>`:'');
}
function renderStage(){
  const st=$('stage');
  if(!sel.length){
    st.innerHTML=`<div class="welcome"><h2>Qu'est-ce qu'on cuisine ce soir ?</h2><p>Touche un ingrédient ci-dessus. Tu verras d'abord les sauces possibles, puis les légumes qui vont avec, puis les recettes. Tu peux en combiner plusieurs.</p></div>`;
    return;
  }
  const R=current();
  // sauces
  const smap=new Map();
  for(const r of R) for(const s of r.sauces){ if(!smap.has(s)) smap.set(s,[]); smap.get(s).push(r); }
  const sauces=[...smap.entries()];
  // légumes
  const vc={}; const selIds=new Set(sel.filter(s=>s.kind==='id').map(s=>s.v));
  for(const r of R) for(const t of r.terms){ if(VOCID[t].g==='veg'&&!selIds.has(t)) vc[t]=(vc[t]||0)+1; }
  const vegs=Object.entries(vc).sort((a,b)=>b[1]-a[1]);
  // recettes
  const list = sauceFilter ? (smap.get(sauceFilter)||[]) : R;

  let h='';
  h+=`<section class="stall sauce"><h2>Sauces <em>${sauces.length}</em></h2><p class="hint">Touche une sauce pour voir la ou les recettes qui l'utilisent, juste en dessous.</p>`+
    (sauces.length? `<div class="cards">`+sauces.map(([s,rs],i)=>`<button type="button" class="card" data-s="${i}" aria-pressed="${sauceFilter===s}"><strong>${esc(s)}</strong><span>${esc(rs.slice(0,2).map(r=>r.titre).join(' · '))}${rs.length>2?' · +'+(rs.length-2):''}</span></button>`).join('')+`</div>`
    : `<p class="empty">Pas de sauce relevée dans ces recettes.</p>`)+`</section>`;
  h+=`<section class="stall veg"><h2>Légumes <em>${vegs.length}</em></h2><p class="hint">Les légumes qu'on retrouve avec ${esc(sel.map(selLabel).join(' + ').toLowerCase())}. Touche-en un pour l'ajouter.</p>`+
    (vegs.length? `<div class="vegs">`+vegs.map(([t,c])=>`<button type="button" class="vchip" data-v="${t}">${esc(VOCID[t].label)}<small>${c}</small></button>`).join('')+`</div>` : `<p class="empty">Aucun autre légume repéré.</p>`)+`</section>`;
  h+=`<section class="stall reci"><h2>Recettes <em>${list.length}${sauceFilter?' avec cette sauce':''}</em></h2>`+
    (list.length? `<div class="cards">`+list.map(r=>`<button type="button" class="card" data-k="${r.key}">${r.user?'<span class="tag newtag">ajoutée</span>':''}<strong>${esc(r.titre)}</strong><span>${esc(r.type)}${r.meta&&r.meta[1]?' · '+esc(r.meta[1].split(/\s*·\s*/)[0]):''}</span></button>`).join('')+`</div>` : `<p class="empty">Aucune recette avec cette combinaison. Retire un ingrédient.</p>`)+`</section>`;
  st.innerHTML=h;
  st._sauces=sauces;
}
function renderChrome(){
  document.querySelectorAll('.mode').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));
  const ol=$('openList'); ol.hidden = mode!=='courses';
  const n=merged().length;
  ol.textContent='Ma liste de courses'+(n?' ('+n+')':'');
  const bar=$('bar');
  if(mode==='courses' && sel.length){
    const parts=sel.map(selLabel).concat(sauceFilter?['sauce '+(sauceFilter.split(' : ')[1]||sauceFilter)]:[]);
    bar.innerHTML=`<div class="bar"><span>${esc(parts.join(' + '))}</span><button class="btn main" type="button" data-addsel>Ajouter à ma liste</button></div>`;
  } else bar.innerHTML='';
}
function renderMeals(){
  const all=REPAS.concat(USERREPAS);
  const cards=all.map(m=>`<button type="button" class="card" data-meal="${esc(m.id)}"><strong>${esc(m.titre)}</strong><span>${esc([m.date||'date non indiquée', m.invites?('pour '+m.invites):''].filter(Boolean).join(' · '))}</span><span>${esc((m.plats||[]).map(p=>p.nom).join(' · '))}</span></button>`).join('');
  $('stage').innerHTML=`<section class="stall meals"><h2>Repas d'invités <em>${all.length}</em></h2><p class="hint">Les menus que tu as servis à tes invités, pour t'inspirer la fois suivante.</p><div class="cards">${cards}</div><p style="margin-top:14px"><button class="btn main" type="button" data-addmeal>+ Ajouter un repas</button></p></section>`;
}
function openMeal(m){
  const plats=(m.plats||[]).map(p=>{
    const rec = p.recette ? ALL.find(r=>r.titre===p.recette) : null;
    return `<div class="plat"><h4>${esc(p.nom)}</h4>${p.detail?`<p>${esc(p.detail)}</p>`:''}${p.note?`<span class="nt">${esc(p.note)}</span>`:''}${rec?`<p style="margin-top:6px"><button class="btn ghost" type="button" data-openrec="${esc(rec.key)}">Voir la recette</button></p>`:''}</div>`;
  }).join('');
  const own=USERREPAS.some(x=>x.id===m.id);
  $('sheet').innerHTML=`<button class="btn ghost x" type="button" data-close>Fermer</button><h2>${esc(m.titre)}</h2><div class="meta">${esc([m.date||'date non indiquée', m.invites?('pour '+m.invites):''].filter(Boolean).join('  ·  '))}</div>${plats}${m.notes?`<p class="meta" style="margin-top:12px">${esc(m.notes)}</p>`:''}${own?`<p style="margin-top:18px"><button class="btn ghost" type="button" data-mealdel="${esc(m.id)}">Supprimer ce repas</button></p>`:''}`;
  $('dlg').showModal();
}
function openAddMeal(){
  $('sheet').innerHTML=`<button class="btn ghost x" type="button" data-close>Fermer</button><h2>Ajouter un repas d'invités</h2>
    <p class="meta">Un plat par ligne, sous la forme « Nom du plat : détails » (quantités, sauce, ce qui a manqué). Les repas ajoutés sont enregistrés sur cet appareil (dans ce navigateur).</p>
    <form class="add" id="mealForm">
      <label>Titre<input id="m_titre" required maxlength="140" autocomplete="off" placeholder="Dîner du 12 octobre"></label>
      <div class="row2"><label>Date<input id="m_date" maxlength="40" autocomplete="off" placeholder="facultatif"></label>
      <label>Nombre de personnes<input id="m_nb" inputmode="numeric" maxlength="3" autocomplete="off"></label></div>
      <label>Menu<textarea id="m_plats" required placeholder="Entrée : salade de crevettes, pamplemousse&#10;Plat : crozets aux oignons&#10;Dessert : mochi, glace"></textarea></label>
      <label>Notes (ce qu'il faut améliorer)<textarea id="m_notes" style="min-height:70px"></textarea></label>
      <div id="m_msg" class="meta" role="status"></div>
      <button class="btn main" type="submit">Enregistrer</button>
    </form>`;
  $('dlg').showModal();
}
function render(){
  $('count').textContent = ALL.length+' recettes';
  const inv = mode==='invites';
  document.querySelector('.search').hidden=inv; $('picked').hidden=inv; $('groups').hidden=inv;
  if(inv){ renderMeals(); renderChrome(); return; }
  renderGroups(); renderPicked(); renderStage(); renderChrome();
}

let DONE={};
try{ DONE=JSON.parse(localStorage.getItem('liste_done')||'{}')||{}; }catch(e){ DONE={}; }
function saveDone(){ try{ localStorage.setItem('liste_done',JSON.stringify(DONE)); }catch(e){} }
function ikey(l){ return norm(cleanLine(l)).replace(/\b(clair|claire|claires|legere|legeres|light)\b/g,'').replace(/\s+/g,' ').trim().split(' ').map(w=>w.replace(/s$/,'')).join(' '); }
function merged(){
  const m=new Map();
  LIST.forEach(e=>e.lines.forEach(l=>{
    const k=ikey(l.t); if(!k) return;
    if(!m.has(k)) m.set(k,{k,name:cleanLine(l.t)||l.t,uses:[]});
    m.get(k).uses.push({plat:e.label,t:l.t});
  }));
  return [...m.values()].sort((a,b)=>a.name.localeCompare(b.name,'fr'));
}
function openList(){
  const items=merged();
  const body = LIST.length ? items.map(it=>{
    const n=new Set(it.uses.map(u=>u.plat)).size;
    const det=it.uses.map(u=>u.t).filter(t=>norm(t)!==norm(it.name));
    return `<label class="li"><input type="checkbox" data-chk="${esc(it.k)}" ${DONE[it.k]?'checked':''}><span><b>${esc(it.name)}</b>${n>1?` <em class="cnt">${n} recettes</em>`:''}${det.length?`<small>${det.map(esc).join(' · ')}</small>`:''}</span></label>`;
  }).join('') + `<h3 style="margin-top:22px">Mes plats</h3>`+LIST.map((e,i)=>`<div class="entry"><h4><span>${esc(e.label)}</span><button class="rm" type="button" data-rmentry="${i}" aria-label="Retirer">Retirer ×</button></h4></div>`).join('')
    : '<p class="meta">Ta liste est vide. Choisis un ingrédient, une sauce et un légume, puis « Ajouter à ma liste ».</p>';
  $('sheet').innerHTML=`<button class="btn ghost x" type="button" data-close>Fermer</button><h2>Ma liste de courses</h2>${body}`+
    (LIST.length?`<p style="margin-top:18px"><button class="btn ghost" type="button" data-clearlist>Vider la liste</button></p>`:'');
  if(!$('dlg').open) $('dlg').showModal();
}
function addEntry(label,lines){
  lines=lines.filter(Boolean).map(t=>({t,done:false}));
  if(!lines.length) return;
  LIST.push({label,lines}); saveList(); renderChrome();
}
function addSelection(){
  const R=current();
  let sauceLines=[];
  if(sauceFilter){ const r=R.find(x=>x.sauceInfo&&x.sauceInfo[sauceFilter]); if(r) sauceLines=r.sauceInfo[sauceFilter].map(l=>l.trim()); }
  const mains=sel.map(selLabel);
  const label=mains.join(' + ')+(sauceFilter?' · sauce '+(sauceFilter.split(' : ')[1]||sauceFilter):'');
  addEntry(label, mains.concat(sauceLines));
  sel.length=0; sauceFilter=null; render();
  const b=$('openList'); b.classList.add('rolling'); setTimeout(()=>b.classList.remove('rolling'),600);
}
/* ---------- fiche ---------- */
function alertes(r){
  const txt=norm((r.ing||[]).join(' ')+' '+(r.etapes||[]).join(' '));
  const a=[];
  if(/mangue/.test(txt)) a.push('<b>Mangue</b> : à enlever. La recette se fait très bien sans.');
  if(/coriandre/.test(txt)) a.push('<b>Coriandre</b> : à remplacer par du persil plat ou de la menthe fraîche (quelques gouttes de citron vert rappellent le côté frais), ou à enlever.');
  if(/celeri.rave|celeri-rave/.test(txt)) a.push('<b>Céleri-rave</b> : à enlever.');
  return a.length?`<div class="alerte">${a.map(x=>`<p>${x}</p>`).join('')}</div>`:'';
}
function openSheet(r){
  const ing=r.ing.map(l=> isHeader(l) ? `<li class="h">${esc(l)}</li>` : `<li>${esc(l)}</li>`).join('');
  const steps=r.etapes.map(s=>`<li>${esc(s)}</li>`).join('');
  $('sheet').innerHTML=`<button class="btn ghost x" type="button" data-close>Fermer</button>
    <h2>${esc(r.titre)}</h2>
    <div class="meta">${esc((r.meta||[]).filter(Boolean).slice(0,2).join('  ·  '))}</div>
    ${alertes(r)}
    <h3>Ingrédients</h3><ul>${ing}</ul>
    <h3>Préparation</h3><ol>${steps}</ol>
    <p style="margin-top:14px"><button class="btn main" type="button" data-addrecipe="${esc(r.key)}">Ajouter à ma liste de courses</button></p>
    ${r.user?`<p style="margin-top:18px"><button class="btn ghost" type="button" data-del="${esc(r.id)}">Supprimer cette recette</button></p>`:''}`;
  $('dlg').showModal();
}
function openAdd(){
  const types=['Plat','Entrée','Viande','Poisson / fruits de mer','Salade','Dessert','Curry / soupe','Base / sauce','Finger food','Autre'];
  $('sheet').innerHTML=`<button class="btn ghost x" type="button" data-close>Fermer</button>
    <h2>Ajouter une recette</h2>
    <p class="meta">Un ingrédient par ligne. Une ligne avec « : » à la fin devient un intertitre (par exemple « Sauce : »).</p>
    <p class="meta">Les recettes que tu ajoutes sont enregistrées sur cet appareil (dans ce navigateur) : elles n'apparaissent pas sur tes autres appareils.</p>
    <form class="add" id="addForm">
      <label>Titre<input id="f_titre" required maxlength="140" autocomplete="off"></label>
      <div class="row2">
        <label>Type<select id="f_type">${types.map(t=>`<option>${t}</option>`).join('')}</select></label>
        <label>Source (livre, page)<input id="f_src" maxlength="140" autocomplete="off"></label>
      </div>
      <label>Pour combien de personnes ?<input id="f_por" inputmode="numeric" maxlength="3" autocomplete="off"></label>
      <label>Ingrédients<textarea id="f_ing" required placeholder="200 g de saumon&#10;2 c. à soupe d'huile d'olive&#10;Sauce :&#10;1 citron"></textarea></label>
      <label>Préparation (une étape par ligne)<textarea id="f_etp" placeholder="Couper le saumon en dés.&#10;Cuire 3 minutes."></textarea></label>
      <div id="f_msg" class="meta" role="status"></div>
      <button class="btn main" type="submit">Enregistrer</button>
    </form>${USERDOCS.length?`<p style="margin-top:14px"><button class="btn ghost" type="button" id="exportAdded">Copier mes ${USERDOCS.length} recette(s) ajoutée(s) (sauvegarde)</button></p>`:''}`;
  $('dlg').showModal();
}

/* ---------- événements ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.id){ toggle({kind:'id',v:t.dataset.id}); return; }
  if(t.dataset.i!==undefined && t.classList.contains('pill')){ sel.splice(+t.dataset.i,1); sauceFilter=null; render(); return; }
  if(t.id==='clr'){ sel.length=0; sauceFilter=null; render(); return; }
  if(t.dataset.v){ toggle({kind:'id',v:t.dataset.v}); return; }
  if(t.dataset.mode){ mode=t.dataset.mode; sauceFilter=null; render(); return; }
  if(t.dataset.openlist!==undefined){ openList(); return; }
  if(t.dataset.addsel!==undefined){ addSelection(); return; }
  if(t.dataset.addrecipe){ const r=ALL.find(x=>x.key===t.dataset.addrecipe); if(r){ addEntry(r.titre, r.ing.filter(l=>!isHeader(l))); $('dlg').close(); sel.length=0; sauceFilter=null; mode='courses'; render(); openList(); } return; }
  if(t.dataset.rmentry!==undefined){ LIST.splice(+t.dataset.rmentry,1); saveList(); renderChrome(); openList(); return; }
  if(t.dataset.clearlist!==undefined){ LIST=[]; DONE={}; saveList(); saveDone(); renderChrome(); openList(); return; }
  if(t.dataset.s!==undefined){
    const s=$('stage')._sauces[+t.dataset.s][0]; sauceFilter = sauceFilter===s?null:s; renderStage(); renderChrome();
    if(sauceFilter){
      const list=current().filter(r=>r.sauces.includes(s));
      if(mode==='cuisine' && list.length===1){ openSheet(list[0]); }
      else { const el=document.querySelector('.stall.reci'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }
    }
    return;
  }
  if(t.dataset.meal){ const m=REPAS.concat(USERREPAS).find(x=>x.id===t.dataset.meal); if(m) openMeal(m); return; }
  if(t.dataset.openrec){ const r=ALL.find(x=>x.key===t.dataset.openrec); if(r) openSheet(r); return; }
  if(t.dataset.addmeal!==undefined){ openAddMeal(); return; }
  if(t.dataset.mealdel){ if(t.dataset.sure!=='1'){ t.dataset.sure='1'; t.textContent='Confirmer : supprimer définitivement'; return; } USERREPAS=USERREPAS.filter(x=>x.id!==t.dataset.mealdel); saveRepas(); $('dlg').close(); render(); return; }
  if(t.dataset.k){ const r=ALL.find(x=>x.key===t.dataset.k); if(r) openSheet(r); return; }
  if(t.hasAttribute('data-close')){ $('dlg').close(); return; }
  if(t.dataset.del){ if(t.dataset.sure!=='1'){ t.dataset.sure='1'; t.textContent='Confirmer : supprimer définitivement'; return; } delRecipe(t.dataset.del); return; }
  if(t.id==='addBtn'){ openAdd(); return; }
  if(t.id==='exportAdded'){ const txt=JSON.stringify(USERDOCS,null,1); (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{ t.textContent='Copié. Colle-le dans un message ou un fichier pour le garder.'; }).catch(()=>{ t.textContent='Copie impossible sur cet appareil.'; }); return; }
  if(t.id==='dice'){
    t.classList.remove('rolling'); void t.offsetWidth; t.classList.add('rolling');
    const pool = sel.length ? current() : ALL; if(!pool.length) return;
    openSheet(pool[Math.floor(Math.random()*pool.length)]); return;
  }
});
document.addEventListener('change',e=>{
  const c=e.target; if(!c.dataset||!c.dataset.chk) return;
  DONE[c.dataset.chk]=c.checked; saveDone();
});
$('dlg').addEventListener('click',e=>{ if(e.target===$('dlg')) $('dlg').close(); });
$('q').addEventListener('keydown',e=>{
  if(e.key!=='Enter') return; e.preventDefault();
  const v=$('q').value.trim(); if(!v) return;
  const nv=norm(v);
  const hit=VOC.find(x=>norm(x.label)===nv||norm(x.label).startsWith(nv)||x.id===nv);
  const s = hit ? {kind:'id',v:hit.id} : {kind:'txt',v};
  if(!has(s)) sel.push(s); $('q').value=''; sauceFilter=null; render();
});
document.addEventListener('submit',e=>{
  if(e.target.id==='mealForm'){
    e.preventDefault(); const msg=$('m_msg');
    const plats=$('m_plats').value.split('\n').map(x=>x.trim()).filter(Boolean).map(l=>{ const k=l.indexOf(':'); return k>0 ? {nom:l.slice(0,k).trim(), detail:l.slice(k+1).trim()} : {nom:l}; });
    const m={id:'m'+Date.now().toString(36), titre:$('m_titre').value.trim(), date:$('m_date').value.trim(), invites:$('m_nb').value.trim(), plats, notes:$('m_notes').value.trim()};
    if(!m.titre||!plats.length){ msg.textContent='Il faut un titre et au moins un plat.'; return; }
    USERREPAS.push(m);
    if(!saveRepas()){ USERREPAS.pop(); msg.textContent='Enregistrement impossible : le navigateur refuse de garder les données (navigation privée ?).'; return; }
    $('dlg').close(); render(); return;
  }
  if(e.target.id!=='addForm') return; e.preventDefault();
  const msg=$('f_msg');
  const lines=s=>s.split('\n').map(x=>x.trim()).filter(Boolean);
  const doc={titre:$('f_titre').value.trim(), type:$('f_type').value, source:$('f_src').value.trim(), portions:$('f_por').value.trim(),
    ing:lines($('f_ing').value).map(l=>/:$/.test(l)?l.replace(/:$/,''):l), etapes:lines($('f_etp').value), created:Date.now()};
  if(!doc.titre||!doc.ing.length){ msg.textContent='Il faut un titre et au moins un ingrédient.'; return; }
  doc.id='l'+doc.created.toString(36);
  USERDOCS.push(doc);
  if(!saveUserDocs()){ USERDOCS.pop(); msg.textContent='Enregistrement impossible : le navigateur refuse de garder les données (navigation privée ?).'; return; }
  rebuild(); render(); $('dlg').close();
});
function delRecipe(id){
  USERDOCS = USERDOCS.filter(d=>d.id!==id); saveUserDocs(); rebuild(); render(); $('dlg').close();
}

/* ---------- démarrage ---------- */
rebuild(); render();
</script>


</body></html>
