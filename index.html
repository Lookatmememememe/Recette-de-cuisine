 couper en canapés de 2 cm de côté, poser sur chacun un carré de foie gras ; poivrer, saler, déposer un peu de granité.", "Note : Variante : tous les vins riches en sucre conviennent."]}, {"titre": "Bouillon dashi", "source": "livre japonais, p. 16 ; prép. 10 min, cuisson 15 min, repos 1 h 15", "portions": "4 pers", "type": "Curry / soupe", "ing": ["1 carré d'algue kombu de 10 cm de côté", "20 g de katsuobushi (bonite séchée en copeaux)", "60 cl d'eau froide"], "etapes": ["Mettre le kombu dans 60 cl d'eau froide, laisser reposer 1 h.", "Chauffer à feu moyen ; quand l'eau frémit, retirer le kombu.", "Ajouter les copeaux de bonite, faire bouillir, éteindre, infuser 15 min, filtrer.", "Note : Conseil : en préparer plus ; se conserve 1 semaine au réfrigérateur, plusieurs mois au congélateur ; existe prêt ou en poudre, le fait maison est meilleur."]}, {"titre": "Pâte à tempura", "source": "livre japonais, p. 17 ; prép. 10 min, repos 30 min", "portions": "4 pers", "type": "Plat", "ing": ["90 g de farine de blé", "1 pincée de sel", "1 œuf", "20 cl d'eau très froide (mise au congélateur)", "garniture : crevettes décortiquées, bâtonnets de légumes…", "huile de friture"], "etapes": ["Mettre l'eau au congélateur. Mélanger farine et sel ; battre l'eau très froide avec l'œuf et verser doucement sur la farine sans cesser de mélanger (pas de grumeaux). Pâte un peu plus liquide qu'une pâte à crêpes ; repos 30 min au réfrigérateur.", "Faire frémir l'huile ; tremper la garniture dans la pâte.", "Plonger les beignets dans l'huile, pas trop à la fois ; quand dorés, sortir à l'écumoire, papier absorbant, servir très chaud."]}, {"titre": "Huîtres aux fèves et au vinaigre de riz", "source": "p. 40 ⚠ n° de page partiellement coupé", "portions": "4 pers", "type": "Poisson / fruits de mer", "ing": ["10 radis roses", "10 brins de ciboulette", "10 cl de bouillon dashi (voir recette p. 16)", "5 cl de vinaigre de riz", "1 c. à soupe de sauce soja", "100 g de fèves décortiquées fraîches ou surgelées", "2 douzaines d'huîtres n° 3 bretonnes ou normandes", "poivre du moulin"], "etapes": ["Rincer et équeuter les radis, les râper finement, saupoudrer de sel fin, mettre dans un tamis et laisser égoutter le temps de préparer la suite.", "Rincer, sécher et ciseler très finement la ciboulette ; dans un bol, mélanger dashi, vinaigre de riz, sauce soja, ciboulette et poivre ; réserver.", "Porter une grande casserole d'eau à ébullition, plonger les fèves, compter ≈ 5 min de cuisson à la reprise de l'ébullition ; égoutter, réserver. Pincer les fèves une à une pour les débarrasser de leur peau (elles doivent être fondantes).", "Ouvrir les huîtres par la pointe sans casser la coquille, retirer la première eau, disposer sur des assiettes. Mettre 1 c. à café de sauce et saupoudrer de quelques fèves et d'une pincée de radis râpé. Servir aussitôt."]}, {"titre": "Riz aux légumes et au poulet", "source": "p. ≈ 46 ⚠ numéro de page coupé", "portions": "4 pers", "type": "Viande", "ing": ["Matériel", "tamis", "200 g de riz rond japonais", "2 carottes", "150 g de pleurotes", "2 oignons nouveaux", "12 brins de cerfeuil (ou de coriandre)", "200 g de blanc de poulet", "50 cl de bouillon dashi (voir recette p. 16)", "2 c. à soupe de sauce soja", "2 c. à soupe de mirin", "125 g de champignons enoki", "sel, poivre"], "etapes": ["Verser le riz dans un tamis, le rincer longuement à l'eau froide jusqu'à ce que l'eau soit translucide ; laisser reposer 30 min.", "Éplucher les carottes, les couper en tronçons puis en tranches avant de les recouper en bâtonnets de 2-3 mm de large. Retirer le pied terreux des pleurotes, les couper en tranches épaisses. Couper le blanc de poulet en lamelles de 3-4 mm d'épaisseur. Rincer et émincer finement les oignons nouveaux, effeuiller le cerfeuil (ou la coriandre), réserver. Couper le pied des champignons enoki.", "Dans une casserole, porter le dashi à ébullition avec la sauce soja, le poulet et le mirin. Écumer, ajouter les carottes et le riz ; porter à ébullition, laisser cuire à feu doux et à couvert 5 min. Ajouter les pleurotes, laisser cuire de nouveau à feu doux et à couvert ; les légumes doivent être moelleux et le riz avoir absorbé tout le liquide. Vérifier l'assaisonnement, mélanger, éteindre le feu et laisser reposer 5 à 7 min à couvert.", "Répartir dans des bols, saupoudrer de cerfeuil, d'oignon nouveau et de champignons enoki. Servir aussitôt."]}, {"titre": "Bouillon de champignons et riz", "source": "Mes recettes (photos)", "portions": "4 pers", "type": "Curry / soupe", "ing": ["1 botte de ciboulette", "2 œufs entiers extra-frais", "6 champignons de Paris", "6 shiitakés frais ou secs", "2 gros cèpes", "100 g de chanterelles ou de girolles", "100 g de mousserons", "50 cl de bouillon de légumes", "10 cl de bouillon dashi (voir recette p. 16)", "3 c. à soupe de sauce soja", "200 g de riz complet", "sel, poivre"], "etapes": ["Rincer et émincer finement la ciboulette. Battre les œufs en omelette dans un bol. Réserver.", "Rincer les champignons de Paris, retirer le pied terreux ; les couper, ainsi que les shiitakés, en 8 quartiers. Couper la pointe du pied des cèpes et les éplucher ; les rincer rapidement à l'eau froide avec un pinceau et les couper en petits morceaux. Idem pour les chanterelles et les mousserons.", "Mettre tous les champignons dans une grande poêle antiadhésive, chauffer à feu doux : ils perdent peu à peu leur eau de végétation.", "Poursuivre 10 min, puis ajouter le bouillon de légumes, le dashi et la sauce soja ; porter à ébullition, faire réduire d'un tiers ; vérifier l'assaisonnement, réserver.", "En même temps, cuire le riz complet selon les indications du paquet ; égoutter, rincer rapidement à l'eau chaude et mélanger au bouillon.", "Reporter le bouillon à frémissement, verser les œufs battus sans cesser de mélanger ; laisser cuire 1 à 2 min en mélangeant, répartir dans de grands bols, saupoudrer de ciboulette, servir aussitôt."]}, {"titre": "Tataki d'espadon", "source": "Mes recettes (photos)", "portions": "4 pers", "type": "Poisson / fruits de mer", "ing": ["400 g d'espadon", "jus de ½ pamplemousse", "½ botte de ciboulette", "6 feuilles de shiso", "2 cm de gingembre frais", "4 cm de daikon (ou radis blanc)", "sel, poivre"], "etapes": ["Retirer la peau du poisson et le gras entre la chair et la peau ; couper la chair en petits dés de 0,5 cm. Dans un saladier, mélanger le poisson avec 3 c. à soupe de jus de pamplemousse.", "Rincer et émincer finement la ciboulette et le shiso. Éplucher et râper le gingembre et le daikon.", "Égoutter rapidement le poisson, le mélanger à la ciboulette, au gingembre et au daikon ; rectifier l'assaisonnement.", "Répartir dans 4 bols, saupoudrer de feuilles de shiso émincées. Servir aussitôt ou conserver au frais."]}, {"titre": "Soupe miso au tofu", "source": "p. 58", "portions": "4 pers", "type": "Curry / soupe", "ing": ["10 g d'algue wakamé séchée", "1 oignon nouveau", "les fanes de 2 radis", "quelques pousses d'épinards", "200 g de tofu soyeux", "60 cl de bouillon dashi (voir recette p. 16)", "poivre"], "etapes": ["Faire tremper le wakamé dans de l'eau froide 20 min ; égoutter, couper en carrés de 1 cm.", "Rincer et émincer finement l'oignon nouveau, les fanes de radis et les pousses d'épinards. Couper le tofu en cubes de 1 cm et le répartir dans 4 bols.", "Porter le dashi à ébullition et le verser sur le tofu. Ajouter wakamé, herbes, oignon nouveau ; poivrer juste avant de servir.", "Note : Conseil : on peut remplacer une partie des herbes par des champignons enoki crus ou des shiitakés (ou pleurotes) cuits dans un bouillon ou revenus à la poêle."]}, {"titre": "Soupe claire au crabe", "source": "p. 60", "portions": "4 pers", "type": "Curry / soupe", "ing": ["arêtes et tête d'un grand poisson blanc (turbot, dorade, sole…)", "1 carré d'algue kombu de 10 cm", "10 cl de saké", "1 c. à soupe de katsuobushi (bonite séchée en copeaux)", "100 g de chair de crabe", "2 c. à soupe de sauce soja", "10 brins de cresson", "½ botte de ciboulette"], "etapes": ["Rincer longuement à l'eau froide les arêtes et la tête pour retirer toute trace de sang.", "Dans une grande casserole, mettre la tête, le kombu et le saké ; ajouter 1 l d'eau, porter à ébullition, baisser le feu, cuire à petits bouillons 20 min. Éteindre, ajouter la bonite, laisser reposer 20 min.", "Rincer et émincer le cresson et la ciboulette. Égoutter le crabe, le répartir dans 4 bols.", "Filtrer délicatement le bouillon (le garder clair), le verser dans une casserole, ajouter la sauce soja, porter à ébullition puis verser sur le crabe. Ajouter les herbes, servir aussitôt.", "Note : Conseil : meilleur avec un crabe cru cuit avec les arêtes, puis décortiqué. À savoir : au Japon, on assaisonne d'un peu de yuzukosho (pâte fermentée de piment vert, sel et yuzu), en épicerie japonaise."]}, {"titre": "Soupe au porc et aux légumes", "source": "p. 62", "portions": "4 pers", "type": "Curry / soupe", "ing": ["2 carottes", "5 cm de daikon (ou radis blanc)", "6 champignons shiitakés frais (à défaut pleurotes ou champignons de Paris)", "200 g de tofu soyeux", "½ botte de ciboulette", "200 g de filet mignon de porc", "2 c. à soupe d'huile végétale", "2 c. à soupe d'huile de sésame", "60 cl de bouillon dashi (voir p. 16)", "1 c. à soupe de pâte miso rouge", "1 c. à café de graines de sésame noir", "sel, poivre"], "etapes": ["Éplucher carottes et daikon, les couper en carrés de 0,5 cm. Retirer le pied des champignons, les émincer en tranches de 2-3 mm. Détailler le tofu en cubes de 0,5 cm. Rincer et émincer la ciboulette, réserver.", "Couper le porc en tranches de 2-3 mm puis chaque tranche en 2 morceaux. Dans une cocotte, chauffer les deux huiles ; quand elles fument, y faire revenir viande et légumes, bien dorer avant de verser le dashi. Couvrir d'eau, porter à ébullition, écumer, cuire à petits bouillons 12-15 min.", "Délayer la pâte miso dans un bol avec quelques c. à soupe de bouillon, reverser dans la cocotte, vérifier l'assaisonnement.", "Répartir dans de grands bols, ajouter le tofu, les graines de sésame noir et la ciboulette. Servir aussitôt."]}, {"titre": "Bouillon au poulet, crevettes et saumon", "source": "p. 64", "portions": "4 pers", "type": "Curry / soupe", "ing": ["8 grosses crevettes crues", "1 carcasse de poulet", "2 c. à soupe de saké", "2 c. à soupe de sauce soja", "2 carottes", "5 cm de daikon (ou radis blanc)", "6 champignons shiitakés frais (à défaut pleurotes ou champignons de Paris)", "1 citron vert", "2 pavés de saumon d'environ 150 g (sans la peau)", "2 blancs de poulet", "2 oignons nouveaux"], "etapes": ["Décortiquer les crevettes en laissant sur la queue le dernier anneau et les nageoires. Rincer longuement la carcasse de poulet sous l'eau froide pour retirer toute trace de sang.", "Dans une grande casserole à feu vif, mettre la carcasse et les carapaces des crevettes, couvrir largement d'eau, ajouter saké et sauce soja, porter à ébullition, baisser à feu moyen, cuire 45 min. Filtrer le bouillon.", "Pendant ce temps, éplucher carottes et daikon, les couper en carrés de 0,5 cm. Ôter le pied des champignons, les émincer en tranches de 2-3 mm. Peler le citron vert à vif (couper le bout rond, enlever toute la peau blanche) et lever les suprêmes en incisant le long des membranes. Réserver.", "Couper le saumon en lanières, détailler les blancs de poulet en médaillons. Séparer le blanc du vert des oignons, émincer ; réserver le vert pour la finition.", "Reporter le bouillon à ébullition, ajouter saumon, poulet, légumes, blanc des oignons, porter à frémissement, cuire à petits bouillons 15 min. Ajouter les crevettes, cuire encore 5 min. Éteindre, répartir dans de grands bols, saupoudrer du vert des oignons, répartir les suprêmes de citron vert, servir aussitôt.", "Note : Variantes : ajouter d'autres herbes (cerfeuil, coriandre) ; pour plus relevé, un peu d'huile de piment ou de gingembre frais haché dans le bouillon."]}, {"titre": "Nouilles soba au bœuf cru", "source": "p. 66", "portions": "4 pers", "type": "Plat", "ing": ["3 c. à soupe d'huile végétale", "400 g de filet de bœuf ou de cœur de rumsteck", "1 petite gousse d'ail", "3 cm de gingembre", "1 botte de ciboulette", "3 bouillons cubes de bœuf", "2 c. à soupe de sauce soja", "200 g de nouilles soba", "2 pincées de piment japonais (Ichimi Togarashi)", "sel, poivre", "À savoir", "les soba ressemblent à des spaghettis mais sont à base de farine de sarrasin", "se mangent froides, chaudes ou en soupe"], "etapes": ["Dans une grande poêle, chauffer l'huile jusqu'à ce qu'elle fume, dorer rapidement le bœuf sur toutes les faces avec sel et poivre. Éteindre, poser le bœuf sur une assiette froide, réserver la poêle.", "Éplucher et hacher finement l'ail et le gingembre. Rincer et émincer la ciboulette, la mélanger au gingembre.", "Dans une grande casserole d'eau bouillante, diluer les cubes de bouillon de bœuf et cuire les nouilles soba selon le paquet ; égoutter et rincer à l'eau chaude.", "Couper le bœuf en très fines tranches en conservant le jus. Dans la poêle réservée, faire revenir les nouilles avec l'ail et le piment pour les réchauffer ; quand elles fument, ajouter la sauce soja, mélanger, éteindre et verser le jus de bœuf.", "Répartir les nouilles dans de grandes assiettes, ajouter les fines tranches de bœuf, saupoudrer de ciboulette au gingembre. Servir aussitôt."]}, {"titre": "Nouilles udon au poulet et à l'œuf", "source": "p. ⚠ numéro non visible, ≈ 68", "portions": "4 pers", "type": "Viande", "ing": ["200 g de blancs de poulet", "2 c. à soupe de saké", "1 c. à soupe de sauce soja", "6 champignons shiitakés frais (à défaut pleurotes ou champignons de Paris)", "1 oignon nouveau", "½ botte de ciboulette", "300 g de nouilles udon", "1 l de bouillon dashi (voir p. 16)", "4 c. à soupe de pâte miso rouge", "4 jaunes d'œufs extra-frais", "sel, poivre"], "etapes": ["Couper le poulet en médaillons, le mélanger au saké et à la sauce soja, laisser mariner pendant la préparation.", "Retirer le pied des champignons, les émincer en tranches de 2-3 mm. Rincer et émincer l'oignon nouveau et la ciboulette, réserver.", "Cuire les udon al dente selon le paquet, égoutter, réserver.", "Porter le bouillon à ébullition, y ajouter le poulet avec sa marinade et les champignons ; cuire à petits bouillons 10 min.", "Délayer la pâte miso dans un bol avec une petite louche de bouillon, reverser dans la casserole, ajouter les nouilles, reporter à ébullition, vérifier l'assaisonnement.", "Répartir dans 4 grands bols, poser un jaune d'œuf au centre, saupoudrer de ciboulette et d'oignon. Servir aussitôt."]}, {"titre": "Curry de bœuf aux nouilles udon", "source": "p. 70", "portions": "4 pers", "type": "Plat", "ing": ["3 cm de gingembre frais", "2 gousses d'ail", "2 échalotes", "2 carottes", "½ botte de coriandre", "800 g de joue de bœuf ou de morceaux de viande de bœuf à braiser", "3 c. à soupe d'huile végétale", "1 citron vert", "2 c. à soupe de poudre de curry", "1 c. à soupe de sauce soja", "300 g de nouilles udon", "sel, poivre"], "etapes": ["Éplucher gingembre, ail, échalotes, carottes. Hacher finement le gingembre ; couper en fines tranches l'ail, les carottes, les échalotes. Effeuiller la coriandre. Presser le citron vert. Couper le bœuf en cubes de 2 cm.", "Dans une grande casserole, chauffer l'huile, saisir la viande ; quand elle est dorée de tous côtés, la retirer, ajouter carottes et échalotes, faire revenir 5 min en remuant. Ajouter ail, gingembre, jus de citron vert et curry ; poursuivre 1 à 2 min, remettre le bœuf.", "Enrober la viande de la garniture, couvrir largement d'eau, porter à ébullition, écumer, cuire à feu doux 3 h (viande toujours recouverte d'eau, très moelleuse en fin de cuisson). Ajouter la sauce soja, vérifier l'assaisonnement, réserver au chaud.", "Cuire les nouilles selon le fabricant ; en fin de cuisson, ajouter une petite louche d'eau de cuisson au curry ; égoutter les nouilles, les répartir dans de grands bols, couvrir de curry, saupoudrer de coriandre, servir.", "Note : Conseil : pour gagner du temps, bavette ou steak cuit saignant + bouillon de bœuf au curry pour cuire les légumes. À savoir : le curry (avec udon ou riz) est le plat le plus consommé au Japon ; tablettes de bouillon de curry en épicerie japonaise, ajoutées en fin de cuisson."]}, {"titre": "Ramen à la poitrine de porc et piment", "source": "p. 72", "portions": "4 pers", "type": "Viande", "ing": ["Matériel", "wok", "Bouillon", "2 cm de gingembre", "1 gousse d'ail", "1 échalote", "1 carotte", "1 carcasse de poulet", "1 c. à soupe de sauce soja", "5 cl de saké", "1 petit piment rouge", "sel, poivre", "Garniture", "300 g de nouilles ramen", "2 carottes", "1 poignée de haricots verts", "½ douzaine de mini-épis de maïs", "1 poignée de germes de soja", "200 g de poitrine de porc fraîche découennée et désossée", "½ botte de ciboulette", "2 c. à soupe de miso rouge", "huile de piment"], "etapes": ["Bouillon : éplucher gingembre, ail, échalote, carotte, couper en gros morceaux.", "Rincer la carcasse de poulet à l'eau froide (retirer toute trace de sang), la mettre dans une grande casserole, couvrir d'eau froide, porter à ébullition, écumer, ajouter les légumes, le piment, la sauce soja et le saké ; cuire à feu doux 1 h. Filtrer, vérifier l'assaisonnement.", "Pendant ce temps, cuire les nouilles ramen selon le paquet, réserver. Éplucher les carottes, les couper en bâtonnets de la taille des haricots ; couper les mini-épis en deux dans la longueur ; équeuter les haricots.", "Mettre carottes, haricots et maïs dans une casserole, couvrir d'eau froide salée, porter à ébullition, ajouter les germes de soja, cuire 1 min, égoutter, réserver. Rincer et émincer la ciboulette.", "Couper la poitrine de porc en fines tranches ; dans un wok (ou grande poêle), les faire dorer, ajouter les légumes, mélanger, verser le bouillon, porter à ébullition, cuire 10 min. Délayer le miso dans un bol avec 4 c. à soupe de bouillon, reverser dans le wok.", "Répartir les nouilles dans 4 grands bols, couvrir de bouillon de légumes et de porc, saupoudrer de ciboulette, ajouter quelques gouttes d'huile de piment. Servir aussitôt."]}, {"titre": "Ramen au porc et gingembre", "source": "p. 74", "portions": "4 pers", "type": "Viande", "ing": ["Matériel", "wok", "2 c. à soupe de saké", "2 c. à soupe de sauce soja", "2 c. à soupe d'huile végétale", "300 g d'épaule de porc", "4 cm de gingembre frais", "2 oignons nouveaux", "2 poignées de pousses d'épinards", "300 g de nouilles ramen", "Bouillon", "2 cm de gingembre", "1 gousse d'ail", "1 échalote", "1 carotte", "1 carcasse de poulet", "1 c. à soupe de sauce soja", "5 cl de saké", "sel, poivre"], "etapes": ["Préparer le bouillon comme dans la recette précédente (sans piment).", "Pendant ce temps, couper le porc en tranches fines ; éplucher et râper le gingembre ; dans un plat creux, mélanger porc, gingembre, saké et sauce soja ; laisser reposer 30 min.", "Séparer le vert du blanc des oignons, émincer. Dans une poêle, chauffer l'huile ; quand elle fume, dorer les tranches de porc de chaque côté ; les disposer dans le plat avec la marinade. Faire revenir le blanc des oignons 1 à 2 min, réserver.", "Dans un wok (ou casserole), porter le bouillon à ébullition avec le porc et le blanc des oignons ; ajouter les pousses d'épinards, cuire 1 min. En même temps, cuire les ramen selon le paquet, répartir dans 4 bols, ajouter le bouillon avec la viande, saupoudrer de vert d'oignons. Servir aussitôt.", "Note : Conseil : ajouter 1 demi-œuf dur par bol."]}, {"titre": "Fondue japonaise au bœuf", "source": "p. 76", "portions": "4 pers", "type": "Plat", "ing": ["Matériel", "caquelon et réchaud à fondue", "Sauce au citron vert", "1 citron vert", "1 c. à soupe de vinaigre de riz", "4 c. à soupe de sauce soja", "2 c. à soupe de mirin", "huile pimentée", "Sauce au sésame", "75 g de graines de sésame doré", "1 c. à café de sucre blanc en poudre", "10 cl de bouillon dashi (voir p. 16)", "3 c. à soupe de sauce soja", "2 c. à café de mirin", "2 c. à café de saké", "Bouillon", "3 oignons nouveaux", "3 poireaux crayons", "6 champignons shiitakés frais", "100 g de pleurotes", "½ botte de coriandre", "1 bloc de 200 g de tofu", "1 carré de dashi kombu de 10 cm", "½ daikon (ou radis blanc)", "1 botte de ciboulette", "600 g de filet de bœuf"], "etapes": ["Sauce au citron vert : presser le citron, le mélanger à tous les ingrédients de la sauce. Réserver au frais.", "Sauce au sésame : réduire les graines en poudre au mortier avec le sucre, ajouter les autres ingrédients, conserver au frais.", "Bouillon : rincer abondamment oignons et poireaux, tailler en tronçons de 5 cm. Rincer les champignons, retirer les pieds terreux, couper les têtes en deux ou en quatre.", "Effeuiller la coriandre, couper le tofu en gros cubes de 1 cm. Couper le bœuf en fines tranches (comme un carpaccio). Éplucher et râper finement le daikon. Rincer et émincer la ciboulette.", "Dans un caquelon, mettre de l'eau salée avec le carré de dashi kombu ; porter à frémissement, retirer l'algue. Ajouter champignons, oignons, poireaux, tofu et coriandre ; porter à ébullition, poser le caquelon sur un réchaud au centre de la table.", "Servir en même temps la viande, que chacun fait cuire dans le bouillon, avec les sauces, la ciboulette et le daikon ; servir les légumes au fur et à mesure de leur cuisson avec la viande.", "Note : Conseil : ajouter aussi rondelles de carottes, pousses de soja, chou chinois émincé…"]}, {"titre": "Soupe de palourdes", "source": "p. 80", "portions": "4 pers", "type": "Curry / soupe", "ing": ["0,5 l de palourdes", "1 petite poignée de pousses d'épinards", "50 g de pleurotes", "1 carré d'algue kombu de 10 cm", "1 c. à soupe de sauce soja", "sel, poivre", "À savoir", "le trempage fait perdre sable et sel aux palourdes", "recette aussi réalisable avec praires, coques, moules ou tellines"], "etapes": ["Mettre les palourdes à tremper dans de l'eau froide 6 h en changeant l'eau 1 ou 2 fois.", "Plonger les épinards 3-4 s dans l'eau salée bouillante, égoutter.", "Rincer les champignons, retirer les pieds terreux, couper les têtes en deux ou en quatre.", "Dans une casserole, mettre le kombu avec 60 cl d'eau froide, porter à frémissement, retirer l'algue, mettre les coquillages égouttés ; cuire 3-4 min, ajouter les champignons et la sauce soja, poursuivre 5-6 min.", "Éteindre, rectifier l'assaisonnement, ajouter les épinards. Répartir dans des bols, servir aussitôt."]}, {"titre": "Rouleaux d'épinards au sésame", "source": "p. 84", "portions": "4 pers", "type": "Plat", "ing": ["400 g d'épinards frais", "2 c. à soupe de graines de sésame", "2 c. à soupe de sauce soja", "2 c. à soupe de bouillon dashi (voir p. 16)", "gros sel de cuisine"], "etapes": ["Retirer la queue des épinards. Griller les graines de sésame à sec dans une poêle en remuant ; dès qu'elles crépitent, les retirer et laisser refroidir.", "Plonger les épinards dans l'eau salée bouillante, 30 s à la reprise de l'ébullition ; égoutter, plonger dans l'eau glacée, laisser 5 min, égoutter et presser fortement. Les mélanger dans un saladier avec la sauce soja et le dashi.", "Disposer les épinards sur une planche en boudin de 2-3 cm d'épaisseur, couper en morceaux de 3-4 cm (taille d'un maki), disposer sur assiette, saupoudrer de sésame grillé, servir aussitôt.", "Note : Conseil : accompagne tout plat de poisson ou de viande ; pour corser, ajouter roquette, cresson ou oseille."]}, {"titre": "Crudités de carotte et de daïkon", "source": "p. 86", "portions": "4 pers", "type": "Salade", "ing": ["1 daïkon (ou 1 radis blanc)", "3 carottes", "2 c. à soupe de sucre en poudre", "4 c. à soupe de vinaigre de riz", "1 c. à café de sauce soja", "2 c. à soupe de graines de sésame", "sel"], "etapes": ["Éplucher daïkon et carottes, les râper finement, les mettre dans un saladier, saupoudrer de sel fin, laisser reposer 1 h, puis égoutter dans un tamis et presser.", "Dans un saladier, délayer le sucre avec le vinaigre de riz et la sauce soja ; ajouter les légumes râpés, mélanger délicatement ; réfrigérer 1 nuit.", "Le lendemain, faire revenir les graines de sésame à sec dans une poêle en remuant ; dès qu'elles crépitent, les retirer, laisser refroidir.", "Répartir les crudités dans de petits bols, saupoudrer de sésame, servir.", "Note : Conseil : recette très simple, accompagne viandes grillées ou braisées ; carottes violettes ou blanches pour l'effet visuel."]}, {"titre": "Bouillon de navet aux crevettes et aux haricots", "source": "p. 88", "portions": "4 pers", "type": "Curry / soupe", "ing": ["100 g de haricots verts", "12 crevettes crues", "quelques tiges de ciboulette", "1 botte de petits navets blancs", "1 botte de petits navets boutons d'or", "1 l de bouillon dashi (voir p. 16)", "2 c. à soupe de sauce soja", "4 c. à soupe de saké"], "etapes": ["Équeuter les haricots. Décortiquer les crevettes en gardant le dernier anneau et la queue ; inciser le dos pour retirer le boyau noir. Rincer et émincer la ciboulette. Retirer les fanes des navets et les éplucher.", "Mettre les navets dans une casserole, couvrir d'eau froide, porter à ébullition, cuire 3-4 min, égoutter.", "Mettre les trois quarts du dashi dans une casserole, porter à ébullition, y cuire les haricots verts 5 min à la reprise de l'ébullition ; égoutter ; cuire les crevettes 2-3 min dans le bouillon.", "Égoutter les crevettes, mettre les navets à leur place ; ajouter de l'eau pour bien les couvrir, la sauce soja et le saké ; porter à ébullition, cuire 30 min à petits bouillons (cuits quand la pointe d'un couteau s'enfonce sans résistance).", "Remettre haricots et crevettes pour les réchauffer. Dans le même temps, chauffer le restant de dashi et y ajouter 10 cl du bouillon de cuisson.", "Répartir le dashi dans 4 grands bols, ajouter les légumes et les crevettes, saupoudrer de ciboulette.", "Note : Conseil : choisir des navets en botte (extra-frais, sans amertume)."]}, {"titre": "Salade de fèves et œufs de saumon", "source": "p. 90", "portions": "4 pers", "type": "Salade", "ing": ["5 cm de daïkon (ou radis blanc)", "1 citron jaune", "50 cl de bouillon dashi (voir p. 16)", "400 g de fèves fraîches écossées", "100 g de pousses d'épinards", "1 pointe de couteau de wasabi en pâte", "2 c. à soupe de sauce soja", "100 g d'œufs de saumon (ou de truite)"], "etapes": ["Éplucher le daïkon, le râper finement, saupoudrer de sel fin, réserver. Prélever la peau du citron et la détailler en fins bâtonnets.", "Mettre les zestes dans une casserole d'eau froide, porter à ébullition, égoutter ; renouveler deux fois : zestes confits.", "Porter le dashi à ébullition avec 30 cl d'eau, y jeter les fèves, 5 min à la reprise de l'ébullition ; égoutter en conservant le bouillon.", "Blanchir les pousses d'épinards 3-4 s dans le bouillon, égoutter rapidement. Presser les fèves une à une entre pouce et index pour séparer chair et peau.", "Dans un saladier, mélanger les fèves avec les zestes, le wasabi et la sauce soja. Répartir dans de jolis bols, ajouter 1 c. à café de pousses d'épinards, 1 c. à café de daïkon essoré, terminer par les œufs de saumon. Servir aussitôt ou conserver au frais.", "Note : Conseil : fèves surgelées déjà épluchées possibles."]}, {"titre": "Algues wakamé aux crevettes et au concombre", "source": "p. 92", "portions": "4 pers", "type": "Poisson / fruits de mer", "ing": ["3 cm de gingembre", "1 c. à café de sucre blanc en poudre", "1 c. à soupe de vinaigre de riz", "1 c. à soupe de sauce soja", "1 c. à soupe d'huile végétale", "1 c. à café d'huile de sésame", "1 petit concombre", "1 sachet d'algues wakamé (ou 1 belle poignée si fraîches)", "une douzaine de crevettes crues", "1 c. à soupe de graines de sésame", "½ avocat", "sel"], "etapes": ["Éplucher et hacher très finement le gingembre. Dans un bol, délayer le sucre avec le vinaigre, ajouter sauce soja et huiles. Réserver.", "Éplucher le concombre, l'émincer finement, saler, laisser reposer 30 min. Faire tremper les algues dans l'eau froide 30 min.", "Décortiquer les crevettes (garder le dernier anneau et la queue), inciser le dos pour retirer le boyau noir, cuire 2-3 min dans l'eau bouillante salée.", "Griller les graines de sésame à sec jusqu'à ce qu'elles crépitent, retirer.", "Presser concombre et algues entre les mains pour bien les essorer ; mettre dans un saladier, verser la vinaigrette au travers d'un tamis ; presser le gingembre pour récupérer le jus, mélanger. Passer une cuillère entre chair et peau de l'avocat, couper en cubes de 1 cm.", "Dresser dans de petits bols, poser dessus crevettes et dés d'avocat, saupoudrer de sésame.", "Note : Variante : langoustines, huîtres ou moules cuites à la place des crevettes."]}, {"titre": "Algues hijiki au porc grillé", "source": "p. 94", "portions": "4 pers", "type": "Viande", "ing": ["Matériel", "wok", "50 g d'algues hijiki en sachet", "200 g de filet mignon de porc", "4 cm de daïkon (ou radis blanc)", "1 carotte", "50 g de champignons enoki", "2 c. à soupe d'huile végétale", "1 c. à café de sucre en poudre", "2 c. à soupe de saké", "10 cl de bouillon dashi (voir p. 16)", "2 c. à soupe de sauce soja", "poivre"], "etapes": ["Faire tremper les algues dans l'eau froide 30 min ; égoutter en pressant fortement.", "Couper le filet mignon en gros « lardons ». Éplucher et râper le daïkon et la carotte. Rincer les champignons, retirer les pieds.", "Dans un wok (ou poêle), chauffer l'huile ; quand elle fume, dorer le porc sur tous les côtés. Saupoudrer de sucre, laisser caraméliser. Ajouter les algues, mélanger, cuire 3-4 min. Verser le saké, le dashi, la sauce soja ; poursuivre 10 min à feu doux en remuant souvent.", "Ajouter carotte et daïkon, mélanger, poivrer, vérifier l'assaisonnement. Répartir dans de petits bols, décorer de quelques champignons enoki. Servir aussitôt.", "Note : Variante : remplacer les enoki par de fins bâtonnets de gingembre blanchis une ou deux fois (eau froide → ébullition → égoutter ; goûter, renouveler si trop fort)."]}, {"titre": "Salade d'algues aux champignons enoki", "source": "p. 96", "portions": "4 pers", "type": "Salade", "ing": ["40 g de mélange d'algues séchées", "1 c. à soupe de graines de sésame", "50 g de tofu soyeux", "2 carottes", "1 tête de brocoli", "100 g de champignons enoki", "60 cl de bouillon dashi (voir p. 16)", "1 c. à soupe de vinaigre de riz", "1 c. à soupe de sauce soja", "1 c. à café d'huile de sésame", "2 c. à soupe d'huile végétale", "100 g de mesclun de jeunes pousses (si possible épinard, roquette, kale)", "poivre"], "etapes": ["Faire tremper les algues 30 min, égoutter, presser fortement. Griller les graines de sésame à sec jusqu'à ce qu'elles crépitent, retirer. Couper le tofu en cubes de 1 cm.", "Éplucher les carottes, les couper en bâtonnets de la taille de haricots verts. Retirer les tiges du brocoli (garder les fleurs). Couper le pied des champignons pour les séparer.", "Porter le dashi à ébullition avec 30 cl d'eau, y cuire les bâtonnets de carotte 10 min ; égoutter ; cuire dans le même bouillon les fleurs de brocoli 3-4 min à la reprise de l'ébullition ; égoutter.", "Dans un saladier, mélanger vinaigre de riz, sauce soja, 2 c. à soupe du bouillon de cuisson, les huiles et le poivre ; ajouter algues, mesclun, carottes, champignons et brocoli.", "Répartir dans de petits bols, décorer de cubes de tofu, saupoudrer de sésame, servir aussitôt.", "Note : Conseil : habituellement sans huile pour rester léger ; dans ce cas ajouter 1 c. à café de sucre dans la sauce pour compenser l'acidité du soja et du vinaigre."]}, {"titre": "Salade de tofu et œufs de saumon", "source": "p. 98", "portions": "4 pers", "type": "Salade", "ing": ["½ botte d'aneth", "½ botte de persil", "½ botte d'estragon", "½ botte de coriandre", "2 oignons nouveaux", "1 c. à soupe de sauce soja", "2 c. à soupe d'huile végétale", "200 g de tofu soyeux", "100 g d'œufs de saumon", "poivre"], "etapes": ["Effeuiller aneth, persil, estragon et coriandre ; rincer et émincer finement les oignons nouveaux.", "Dans un saladier, mélanger herbes, oignons, poivre, sauce soja et huile. Couper le tofu en cubes de 1 cm et l'ajouter délicatement aux herbes. Vérifier l'assaisonnement.", "Répartir dans des bols, décorer avec les œufs de saumon. Servir aussitôt ou garder au frais.", "Note : Conseil (auteur) : cuisine japonaise « perso » — salade d'herbes avec tofu et œufs de saumon."]}, {"titre": "Tofu frit et tartare d'algues", "source": "p. 100", "portions": "4 pers", "type": "Salade", "ing": ["15 g d'algues séchées (wakamé, nori, hijiki, aramé)", "200 g de tofu soyeux", "1 oignon nouveau", "quelques brins de cerfeuil", "2 c. à soupe de sauce soja", "2 c. à soupe de mirin", "1 pointe de couteau de gingembre haché", "huile pour la friture", "2 c. à soupe de farine de riz", "poivre"], "etapes": ["Faire tremper les algues dans l'eau froide 30 min.", "Couper le tofu en cubes de 2 cm, les poser sur du papier absorbant, recouvrir d'une autre couche de papier, poser dessus une planche à découper.", "Égoutter et essorer les algues entre les mains, les couper en petits morceaux. Rincer et émincer l'oignon nouveau ; effeuiller le cerfeuil.", "Dans un petit saladier, mélanger algues, soja, mirin, cerfeuil, gingembre, oignon et poivre ; vérifier l'assaisonnement, garder au frais.", "Chauffer l'huile à 190 °C (frémissante). Rouler les dés de tofu dans la farine de riz, les plonger un à un dans la friture 3-4 min, bien dorés.", "Les poser sur papier absorbant, répartir sur de petites assiettes, déposer une cuillère de tartare d'algues dessus. Servir immédiatement."]}, {"titre": "Salade de légumes verts au tofu et au sésame grillé", "source": "p. 102", "portions": "4 pers", "type": "Salade", "ing": ["Matériel", "mortier et pilon", "2 c. à soupe de graines de sésame", "200 g de tofu", "200 g de haricots verts", "1 tête de brocoli", "1 botte d'asperges vertes", "½ botte de ciboulette", "1 oignon nouveau", "100 g de pousses d'épinards", "25 cl de bouillon dashi (voir p. 16)", "3 c. à soupe de sauce soja", "3 c. à soupe d'huile végétale", "fleur de sel", "poivre"], "etapes": ["Griller le sésame à sec jusqu'à ce qu'il crépite, retirer. Couper le tofu en cubes de 1 cm.", "Équeuter les haricots. Couper les tiges du brocoli (garder les fleurs). Couper le pied sec des asperges et les éplucher jusqu'au début de la tête. Rincer et émincer ciboulette et oignon nouveau.", "Porter l'eau et le dashi à ébullition ; cuire les légumes un à un : asperges 10 min, haricots et brocoli 3-4 min à la reprise de l'ébullition ; plonger les épinards quelques secondes, égoutter.", "Dans un mortier, écraser le sésame avec une pincée de fleur de sel et le poivre.", "Dans un saladier, mélanger légumes, tofu, sauce soja et huile ; répartir dans des bols, saupoudrer de sésame. Servir aussitôt ou garder au frais.", "Note : Conseils : tout type de tofu (soyeux, plus ferme, aromatisé) ; brocoli remplaçable par du pak-choï."]}, {"titre": "Crudités de chou blanc", "source": "p. 106", "portions": "4 pers", "type": "Salade", "ing": ["½ petit chou blanc ou 1 chou chinois", "2 carottes", "2 c. à soupe de graines de sésame", "1 c. à café d'huile de sésame", "4 c. à soupe d'huile de tournesol", "2 c. à soupe de vinaigre de riz", "2 c. à soupe de sauce soja", "sel, poivre"], "etapes": ["Retirer les premières feuilles du chou, le couper en quatre, retirer le trognon, l'émincer le plus finement possible (robot : couteau éminceur). Éplucher et râper les carottes.", "Mettre chou et carottes dans un saladier, couvrir d'eau, ajouter ½ c. à café de sel, laisser reposer 30 min.", "Griller le sésame à sec jusqu'à ce qu'il crépite, retirer.", "Égoutter les légumes, les essorer à l'essoreuse à salade, mélanger avec les huiles, le vinaigre, la sauce soja, un peu de sel si besoin et du poivre. Disposer dans un plat, saupoudrer de sésame.", "Note : Conseil : pour la couleur, cerfeuil ou ciboulette ; pour corser, un peu de wasabi ou de gingembre haché."]}, {"titre": "Salade de concombre au crabe", "source": "p. 108", "portions": "", "type": "Salade", "ing": ["4 petits concombres ou concombres libanais", "½ c. à café de sel fin", "1 c. à soupe de graines de sésame", "½ daïkon (ou radis blanc)", "100 g de chair de crabe", "½ botte de ciboulette", "1 c. à café d'huile de sésame", "1 c. à soupe d'huile végétale", "1 c. à soupe de sauce soja"], "etapes": ["Facile. Pour 4 pers. Préparation 15 min, repos 1 h. Coût €.", "Éplucher les concombres, les émincer en rondelles de 2-3 mm, les mettre dans un saladier avec le sel fin, laisser reposer 30 min ; puis les placer dans un tamis et laisser de nouveau reposer 30 min.", "Pendant ce temps, griller le sésame à sec jusqu'à ce qu'il crépite, retirer.", "Éplucher le daïkon, l'émincer très finement à la mandoline ou à l'économe (tranches presque translucides). Rincer et émincer très finement la ciboulette. Égoutter le crabe, le mélanger à la ciboulette.", "Dans un saladier, mélanger daïkon, rondelles de concombre, huiles et sauce soja. Répartir dans de petits bols, décorer de crabe et de sésame. Servir aussitôt.", "Note : Conseil : prolonger le repos/égouttage du concombre ; du crabe frais est meilleur que la conserve."]}, {"titre": "Pot-au-feu de poisson", "source": "p. 130", "portions": "", "type": "Curry / soupe", "ing": ["4 petits poireaux", "4 oignons nouveaux", "4 petites pommes de terre de type ratte de Noirmoutier", "4 petites carottes fanes", "2 daïkon (ou radis blancs)", "100 g de champignons enoki", "200 g de pavés de saumon", "200 g de pavés de lotte", "1 l de bouillon dashi (voir p. 16)", "200 g de tofu", "sel, poivre"], "etapes": ["Facile. Pour 4 pers. Préparation 25 min, cuisson 1 h. Coût €€.", "Rincer et éplucher poireaux, oignons, pommes de terre, carottes. Éplucher le daïkon et le couper en tronçons de la taille des carottes. Couper le pied des champignons pour les séparer, réserver.", "Retirer la peau des poissons, les couper en gros cubes de 3 cm. Couper le tofu en carrés de 1 cm.", "Dans une grande casserole, porter le dashi à ébullition, ajouter carottes et pommes de terre, couvrir d'eau bouillante, cuire à petits bouillons 20 min. Ajouter poissons, tofu, oignons, poireaux, poursuivre 10 min. Vérifier l'assaisonnement, servir en répartissant légumes, poissons, tofu et bouillon ; décorer avec les champignons.", "Note : Conseil : ajouter épinards blanchis, chou chinois, brocoli, asperges, pois gourmands, shiitakés… ; pour corser le bouillon, un peu de pâte miso ; au Japon, souvent avec du poulet ou uniquement des boulettes de poisson."]}, {"titre": "Quenelles de poisson, champignons et épinards", "source": "p. 134", "portions": "", "type": "Poisson / fruits de mer", "ing": ["Matériel", "robot mixeur, panier vapeur", "400 g de filets de sole", "2 blancs d'œufs", "15 cl de crème liquide", "1 poignée de pousses d'épinards", "4 champignons shiitakés frais", "30 cl de bouillon dashi (voir p. 16)", "sel, poivre"], "etapes": ["DIFFICILE. Pour 4 pers. Préparation 20 min, cuisson 30 min. Coût €€.", "Une heure avant, mettre poisson, œufs et crème dans la partie la plus froide du réfrigérateur, ainsi que le bol et la lame du robot. Garnir un grand panier vapeur de papier sulfurisé perforé.", "Mixer les filets de poisson, verser doucement les blancs d'œufs puis la crème jusqu'à pâte homogène. Assaisonner légèrement.", "Avec 2 cuillères à soupe humides, former des quenelles de 3-4 cm de long, les disposer dans le panier, cuire à la vapeur 20 min.", "Pendant ce temps, plonger les épinards 4-5 s dans l'eau salée bouillante, égoutter, presser, répartir dans 4 grands bols.", "Rincer et éponger les champignons, couper le bout des pieds secs, émincer. Porter le dashi à ébullition.", "Disposer les quenelles sur les épinards, arroser de dashi, saupoudrer de champignons émincés. Servir aussitôt.", "Note : Variantes : shiitakés remplaçables par de fines lamelles de cèpes bouchons crus, champignons de Paris ou enoki."]}, {"titre": "Thon mariné aux agrumes et au sésame", "source": "p. 140", "portions": "", "type": "Poisson / fruits de mer", "ing": ["1 orange", "1 citron vert", "1 beau pavé de thon rouge d'environ 400 g", "1 c. à soupe de mirin", "1 c. à soupe de sauce soja", "3 pincées de piment en poudre japonais", "4 c. à soupe de bouillon dashi (voir p. 16)", "sel"], "etapes": ["Facile. Pour 4 pers. Préparation 20 min, repos 1 h, cuisson 10 min. Coût €€.", "Rincer les agrumes, râper la peau pour récupérer le zeste. Rouler le thon dans les zestes, laisser reposer 1 h à température ambiante.", "Griller le sésame à sec en remuant jusqu'à ce qu'il crépite, retirer, laisser refroidir.", "Peler les agrumes à vif au couteau (couper le bout rond, enlever toute la peau blanche) et lever les quartiers.", "Dans un bol, mélanger quartiers d'agrumes, mirin, sauce soja, piment et dashi. Réserver au frais.", "Dans une poêle antiadhésive très chaude avec un peu de sel, griller le pavé de thon sur tous les côtés, 10 min au total ; éteindre et laisser reposer 3-4 min dans la poêle.", "Couper en tranches de 1 cm, napper de sauce, saupoudrer de sésame. Servir aussitôt.", "Note : Variante : espadon ou mérou (garder le cœur cru)."]}, {"titre": "Anguille laquée", "source": "p. 142", "portions": "", "type": "Poisson / fruits de mer", "ing": ["1 c. à café de graines de sésame", "10 cl de sauce soja", "10 cl de mirin", "10 cl de saké", "1 kg de filets d'anguille", "3 c. à soupe de miel", "1 c. à soupe d'huile végétale", "Pour le riz", "200 g de riz rond japonais", "25 cl d'eau minérale", "1 carré d'algue kombu (facultatif)", "2 c. à soupe de sucre blanc en poudre", "1 c. à café de sel de mer", "3 c. à soupe de vinaigre de riz", "À savoir", "le plus difficile est de trouver de l'anguille (rare chez le poissonnier)", "à défaut, de l'anguille fumée", "le poissonnier peut en commander"], "etapes": ["Facile. Pour 4 pers. Préparation 20 min, repos 30 min, cuisson 15 min. Coût €€.", "Griller le sésame à sec en remuant ; dès qu'il crépite, retirer, laisser refroidir.", "Dans une petite casserole, verser sauce soja, mirin, saké et miel ; porter à ébullition, cuire 10-12 min à gros bouillons pour que la marinade réduise de moitié et épaississe.", "Préparer le riz (voir recette p. 14). Rincer et éponger les filets d'anguille, les couper en tronçons de 10 cm, retirer arêtes et peau.", "Dans une poêle, chauffer l'huile (presque fumante), dorer rapidement les tronçons des deux côtés ; napper de sauce, cuire à feu doux 5-7 min en arrosant sans cesse avec la marinade.", "Répartir le riz dans de grands bols, disposer les filets d'anguille dessus, saupoudrer de sésame avant de servir."]}, {"titre": "Pot-au-feu de bœuf", "source": "p. 156", "portions": "", "type": "Curry / soupe", "ing": ["600 g de bavette, de tende de tranche ou de rumsteck", "4 carottes", "2 oignons jaunes", "10 petites pommes de terre de type ratte de Noirmoutier", "3 c. à soupe d'huile végétale", "10 cl de bouillon dashi (voir p. 16)", "1 c. à soupe de sucre en poudre", "1 c. à soupe de saké", "4 c. à soupe de sauce soja", "2 c. à soupe de sauce mirin"], "etapes": ["Facile. Pour 4 pers. Préparation 20 min, cuisson 1 h. Coût €.", "Couper la viande en tranches de 1 cm. Éplucher carottes, oignons, pommes de terre. Émincer les oignons, couper les carottes en biais en tronçons de 5 cm.", "Dans une grande casserole, chauffer l'huile ; quand elle fume, dorer rapidement la viande des deux côtés ; la retirer, faire revenir oignons et carottes 3-4 min. Ajouter pommes de terre, viande, dashi, sucre, saké, sauce soja, mirin et couvrir d'eau.", "Porter à ébullition, écumer, cuire à feu doux et à couvert 30 min ; retirer le couvercle, poursuivre 20 min. La viande doit être très tendre, la pointe d'un couteau ne doit rencontrer aucune résistance dans les légumes. Vérifier l'assaisonnement, servir aussitôt.", "Note : Conseil : réalisable avec de l'échine de porc ; légumes verts (pois gourmands, petits pois) à ajouter 15 min avant la fin."]}, {"titre": "Tataki de bœuf", "source": "p. 158", "portions": "", "type": "Viande", "ing": ["400 g de filet de bœuf ou de cœur de rumsteck", "2 c. à soupe d'huile végétale", "2 carottes", "1 oignon nouveau", "1 daïkon (ou radis blanc)", "3 cm de gingembre frais", "1 botte de ciboulette", "3 c. à soupe de sauce soja", "1 c. à soupe de mirin", "1 c. à soupe de vinaigre de riz"], "etapes": ["Facile. Pour 4 pers. Préparation 20 min, cuisson 5 min, repos 30 min. Coût €€€.", "Badigeonner le bœuf d'huile. Préparer un saladier d'eau froide avec des glaçons. Dans une poêle très chaude, saisir la viande 1 à 2 min de chaque côté ; quand elle est bien colorée sur toutes les faces, la plonger 10 min dans l'eau glacée.", "Sortir la viande, l'éponger, réserver 20 min au réfrigérateur.", "Éplucher gingembre, carottes, oignon nouveau, daïkon. Émincer finement oignon nouveau et ciboulette. Râper finement daïkon et carottes. Couper le gingembre en très fins bâtonnets.", "Dans un saladier, mélanger carottes, daïkon et oignon nouveau ; ajouter sauce soja, mirin et vinaigre de riz. Couper le bœuf en tranches les plus fines possible.", "Sur de grandes assiettes, disposer un lit de légumes, couvrir de tranches de bœuf, décorer de ciboulette et de gingembre. Servir aussitôt."]}, {"titre": "Porc sauté au gingembre", "source": "p. 160", "portions": "", "type": "Viande", "ing": ["Matériel", "wok", "½ chou blanc", "2 poignées de germes de soja", "3 cm de gingembre frais", "1 botte de ciboulette", "500 g de poitrine de porc fraîche pas trop grasse", "4 c. à soupe de sauce soja", "2 c. à soupe de saké", "2 c. à soupe de mirin", "2 c. à soupe d'huile végétale", "poivre"], "etapes": ["Facile. Pour 4 pers. Préparation 20 min, repos 30 min, cuisson 20 min. Coût €.", "Retirer les feuilles abîmées du chou, l'émincer finement. Rincer et essorer les germes de soja. Éplucher le gingembre, le couper en fins bâtonnets. Rincer et émincer la ciboulette. Mettre les germes de soja dans une casserole d'eau froide, porter à ébullition, égoutter rapidement.", "Retirer la couenne et le cartilage de la poitrine, couper la viande en fines tranches, la mettre dans un saladier, ajouter sauce soja, saké, poivre, mirin et gingembre ; mélanger, laisser reposer 30 min à température ambiante.", "Égoutter la viande. Dans un wok (ou grande poêle), chauffer l'huile jusqu'à ce qu'elle fume ; dorer la viande sur tous les côtés, ajouter le chou blanc, poursuivre 8-10 min en mélangeant souvent.", "Ajouter la marinade et les germes de soja, mélanger, cuire encore quelques minutes pour réduire la sauce. Disposer sur un plat, saupoudrer de ciboulette, servir aussitôt.", "Note : Conseil : si la poitrine est trop grasse, prendre de l'échine (plus maigre) ; couper en fines tranches, bien faire griller et dorer avant d'ajouter la garniture."]}, {"titre": "Filet mignon mariné aux agrumes", "source": "p. 162", "portions": "", "type": "Viande", "ing": ["Matériel", "wok", "½ mandarine", "½ citron vert", "2 c. à soupe de sauce soja", "1 c. à soupe de saké", "2 c. à soupe de mirin", "2 oignons nouveaux", "1 botte de ciboulette", "1 filet mignon d'environ 400 g", "2 c. à soupe d'huile végétale", "200 g de nouilles soba"], "etapes": ["Facile. Pour 4 pers. Préparation 15 min, repos 40 min, cuisson 30 min. Coût €.", "Presser la demi-mandarine et le demi-citron vert, verser le jus dans un bol, ajouter sauce soja, saké, mirin. Rincer, éplucher et émincer finement l'oignon nouveau. Rincer la ciboulette, la couper en tronçons de 3-4 cm.", "Mettre la viande dans un plat, arroser de marinade, saupoudrer d'oignon nouveau ; laisser reposer 30 min à température ambiante.", "Préchauffer le four à 180 °C (th. 6). Égoutter la viande. Dans un wok (ou grande poêle), chauffer l'huile jusqu'à ce qu'elle fume, dorer la viande sur toutes ses faces en la badigeonnant de marinade.", "Quand elle est bien colorée, la mettre dans un plat et enfourner 20 min à 150 °C (th. 5). Éteindre le four, laisser reposer la viande 10 min. La sortir, la couper en fines tranches. Mélanger le jus avec 4 c. à soupe de marinade.", "Pendant ce temps, cuire les nouilles soba selon le fabricant, égoutter, mélanger avec la ciboulette.", "Disposer un lit de nouilles sur de grandes assiettes, couvrir de fines tranches de viande, arroser de sauce. Servir aussitôt.", "À savoir : traditionnellement cette sauce se prépare avec du yuzu (jus en bouteille en épicerie japonaise). Variante : poulet ou saumon."]}, {"titre": "Pot-au-feu de canard", "source": "p. 164", "portions": "", "type": "Curry / soupe", "ing": ["4 cm de gingembre frais", "1 daïkon (ou radis blanc)", "4 petits poireaux crayon", "8 petites carottes fanes", "12 shiitakés frais", "1 carcasse de poulet ou de canard", "4 c. à soupe de saké", "4 c. à soupe de sauce soja", "2 magrets de canard", "quelques brins de cerfeuil", "sel"], "etapes": ["Facile. Pour 4 pers. Préparation 20 min, cuisson 1 h. Coût €€€.", "Éplucher gingembre, carottes, daïkon ; rincer les poireaux. Couper le daïkon en tronçons de la taille des carottes. Retirer le pied terreux des champignons, les rincer rapidement. Couper le gingembre en fins bâtonnets. Effeuiller le cerfeuil.", "Rincer longuement la carcasse sous l'eau froide, la mettre dans une grande casserole, couvrir d'eau, ajouter saké et sauce soja, porter à ébullition, écumer, cuire 30 min. Ajouter carottes, gingembre, daïkon, poireaux et champignons ; poursuivre 30 min.", "Pendant ce temps, inciser en croisillons le gras des magrets et saler. 15 min avant la fin de cuisson du bouillon, chauffer une poêle à feu moyen, y mettre les magrets côté peau, cuire 5 min pour faire fondre le maximum de graisse.", "Retirer l'excédent de gras, retourner les magrets, poursuivre 5 min. Éteindre, retourner encore une fois et laisser reposer 2-3 min. Les couper en fines tranches en biais.", "Retirer la carcasse du bouillon ; répartir légumes et bouillon dans de grandes assiettes creuses, ajouter les tranches de magret, saupoudrer de cerfeuil.", "Note : Conseil : servir avec des nouilles udon ou soba cuites dans le bouillon."]}, {"titre": "Porc pané", "source": "p. 168", "portions": "", "type": "Viande", "ing": ["400 g de filet de porc", "2 œufs entiers", "100 g de farine", "100 g de chapelure japonaise", "10 cl d'huile végétale", "sel, poivre"], "etapes": ["Facile. Pour 4 pers. Préparation 15 min, cuisson 10 min. Coût €.", "Rincer et éponger la viande, la couper en tranches de moins de 1 cm d'épaisseur, inciser légèrement le gras pour qu'elle ne se rétracte pas.", "Dans une assiette creuse, battre les œufs avec sel et poivre ; farine dans une autre assiette, chapelure dans une troisième.", "Dans une grande poêle, chauffer l'huile à feu moyen ; passer les tranches une à une dans la farine, l'œuf puis la chapelure.", "Quand l'huile frémit, disposer le porc, 4-5 min (chapelure bien dorée), retourner, 4-5 min de plus. Servir chaud.", "Note : Conseil : plat phare, habituellement frit mais aussi bon grillé à la poêle avec de l'huile ; servi avec crudités de chou blanc (voir p. 106), moutarde, légumes au vinaigre ou pickles. À savoir : la chapelure japonaise (panko) est moins fine que celle des supermarchés (petits flocons, autre texture)."]}, {"titre": "Omelette japonaise", "source": "p. 172", "portions": "", "type": "Plat", "ing": ["6 œufs extra-frais", "4 c. à soupe de bouillon dashi (voir p. 16)", "1 c. à soupe de sucre en poudre", "1 c. à soupe de sauce soja", "3 c. à soupe d'huile végétale", "sel"], "etapes": ["Facile. Pour 4 pers. Préparation 10 min, cuisson 10 min. Coût €.", "Casser les œufs dans un bol, ajouter le dashi, le sucre, 1 pincée de sel et la sauce soja ; battre fortement au fouet.", "Dans une poêle antiadhésive, mettre 1 c. à soupe d'huile et l'étaler au papier absorbant ; bien chauffer la poêle, verser un quart des œufs.", "Quand les œufs commencent à prendre, lever la poêle pour rouler l'omelette sur un bord. Ajouter 1 c. à soupe d'huile (étalée au papier absorbant), verser un autre quart des œufs ; quand la 2e fournée est cuite, la rouler sur la précédente.", "Renouveler jusqu'à épuisement des œufs. Rouler l'omelette sur une planche, la couper en tronçons de 2-3 cm. Servir aussitôt.", "Note : Conseil : poêle carrée/rectangulaire spéciale, natte en bambou pour la forme rectangulaire ; servir avec sauce soja et daïkon râpé."]}, {"titre": "Galettes au bœuf et œufs frits", "source": "p. 178", "portions": "", "type": "Plat", "ing": ["1 cm de gingembre frais", "100 g de farine", "25 cl de bouillon dashi (voir p. 16)", "2 oignons nouveaux", "100 g de viande de bœuf (bavette, hampe, merlan ou poire)", "3 c. à soupe d'huile végétale", "4 pincées de piment japonais", "4 œufs extra-frais", "4 c. à café de copeaux de bonite séchée", "À savoir", "farine toute prête en épicerie japonaise (il suffit d'ajouter de l'eau)", "sauces spécifiques pour cette recette appelée okonomiyaki"], "etapes": ["Facile. Pour 4 pers. Préparation 20 min, cuisson 10 min. Coût €.", "Éplucher et râper finement le gingembre. Dans un saladier, mélanger au fouet farine, dashi et gingembre jusqu'à une pâte homogène de la texture d'une pâte à crêpes ; tamiser, laisser reposer.", "Rincer, éplucher et émincer les oignons nouveaux. Couper le bœuf en très fines tranches (carpaccio).", "Dans une grande poêle, étaler un peu d'huile au papier absorbant. Verser une petite louche de pâte pour un disque de 10 cm. Ajouter viande, oignons nouveaux et piment ; cuire 1 min à feu moyen, ajouter 1 œuf, saupoudrer de piment, cuire doucement pour que le blanc fige. Juste avant de servir, saupoudrer de copeaux de bonite, replier la crêpe en deux, servir aussitôt. Procéder de même jusqu'à épuisement de la pâte, en cuisant les galettes deux par deux."]}, {"titre": "L'assassin (gâteau au chocolat)", "source": "Mes recettes (photos)", "portions": "4 à 6 pers", "type": "Dessert", "ing": ["Présentation de l'auteur", "gâteau au chocolat « ultime », cœur très fondant malgré une cuisson longue", "l'originalité : un caramel au beurre salé à la place du simple sucre", "croûte fine, intérieur riche, dense, crémeux", "250 g de sucre", "150 g de beurre demi-sel", "180 g d'œufs (3 très gros œufs de 60 g)", "10 g de farine", "125 g de chocolat noir à 60 %"], "etapes": ["Mélanger œufs et farine au fouet électrique 5 min pour aérer et faire mousser.", "Mettre le sucre dans une casserole avec juste assez d'eau pour l'imbiber (≈ 50 g) ; veiller à ne pas avoir de sucre sur le bord (risque de cristallisation) ; ne mélanger à la cuillère qu'une fois le sirop bouillant, pas avant.", "Faire un caramel bien ambré, puis ajouter le beurre froid petit à petit hors du feu (le caramel refroidit à chaque ajout et intègre l'eau du beurre au lieu de l'évaporer) ; ça crépite puis se calme ; mélanger pour incorporer le beurre autant que possible.", "Mettre le mélange œufs-farine dans le bol d'un robot ; en fouettant à la plus basse vitesse, verser le caramel chaud en filet (pour éviter qu'il durcisse) : pâte très jolie, colorée.", "Faire fondre le chocolat (bain-marie ou micro-ondes) et le verser dans la pâte.", "Chemiser le moule de 15 cm (papier sulfurisé : un rond au fond + une bande de la hauteur du moule sur le pourtour). Verser la pâte presque jusqu'au bord (le gâteau gonfle beaucoup). Cuire 45 min à 145 °C. Le gâteau est cuit quand, en secouant très légèrement le moule, le centre tremble encore un peu comme une gelée ; il reprend en refroidissant.", "Laisser refroidir à température ambiante puis au frais 1 nuit avant de démouler. Couper de fines parts. Sortir du réfrigérateur au moins 20 min avant de servir.", "Coefficients multiplicateurs pour d'autres moules (base : moule de 15 cm) : 16 cm = 1,14 ; 18 cm = 1,44 ; 20 cm = 1,77 ; 22 cm = 2,15 ; 24 cm = 2,56. Exemple : 20 cm → 250 g de sucre × 1,77 = 442,5 g ; arrondir au chiffre simple à peser ; cuire un peu plus longtemps.", "Note : Conseil : préparer le caramel à partir d'un sucre imbibé (sirop) plutôt qu'un caramel à sec (coloration plus facile à contrôler)."]}, {"titre": "Pastéis de nata", "source": "p. 64-65, « Europe »", "portions": "22 pastéis", "type": "Dessert", "ing": ["Pâte feuilletée", "300 g de farine type 55", "140 g d'eau avec 1 pincée de sel", "190 g de matière grasse de cuisson ou de beurre sec", "Crème", "475 g de lait entier frais", "25 g de beurre doux", "1 bonne pincée de sel", "1 c. à café de vanille liquide", "25 g de Maïzena", "15 g de poudre de lait entier", "100 g de jaunes d'œufs", "40 g de blancs d'œufs", "200 g de sucre cuit à 112 °C avec 100 g d'eau", "1 morceau de pelure de citron jaune non traité (≈ 1 × 5 cm)", "1 bâton de cannelle", "Photos pas à pas", "1 étaler en rectangle 3× plus long que large", "2 plier en trois", "3 passer un peu d'eau au pinceau", "4 enrouler en boudin serré", "5 mettre un tronçon de pâte au fond du moule", "6 verser la crème dans les moules foncés"], "etapes": ["Crème : mélanger Maïzena et poudre de lait avec un peu de lait. Chauffer le reste du lait avec le beurre, la vanille et le sel. Dans une autre casserole, cuire sucre, eau, pelure de citron et cannelle à feu doux, porter le sirop à 112 °C. Quand le beurre est fondu et le lait frémissant, verser doucement en fouettant sur le mélange Maïzena-lait-poudre de lait. Battre blancs et jaunes comme pour une omelette, les ajouter à l'appareil. Ajouter le sirop (en retirant pelure de citron et cannelle). Cuire au bain-marie jusqu'à épaississement (10 min). Verser dans un récipient étroit et profond (surface d'évaporation minimale), laisser refroidir à température ambiante, puis 1 h au frais.", "Pâte : mélanger farine et eau, pétrir ≈ 10 min, repos 1 h sous film. Étaler en rectangle 2× plus long que large ; étaler le beurre de cuisson au centre en carré de la largeur de la pâte ; rabattre la pâte, ajuster les jointures ; étaler en rectangle 3× plus long que large ; plier en trois dans la longueur, tourner de 90°, étaler de nouveau (= 1 tour simple) ; refaire un tour simple ; étaler en grand rectangle ; mouiller au pinceau, enrouler sur la longueur en long boudin ; passer du beurre de cuisson sur le boudin pour éviter le dessèchement ; film étirable au contact, frais jusqu'à utilisation. Sortir la pâte ≥ 1 h avant. Étirer le boudin jusqu'à 3 cm de diamètre, couper des morceaux de 2,5 cm et les mettre dans les moules à pastéis légèrement graissés [⚠ suite de la méthode (enfoncer la pâte, remplir de crème, cuisson/four) non visible sur cette photo : voir photo 231 si elle suit].", "…moules à pastéis légèrement graissés avec de la bombe de démoulage (ou un peu de beurre de cuisson). Mettre un morceau de pâte à plat au fond du moule puis l'étaler en le tournant avec les pouces jusqu'au bord. Verser la crème dans chaque moule jusqu'à 3 mm du bord. Poser les moules sur une plaque à pâtisserie. Préchauffer le four à 240 °C, cuire les pastéis 15 à 20 min : la surface doit être caramélisée par endroits et bien gonflée. Sortir, démouler délicatement à l'aide d'un couteau, laisser refroidir une demi-heure avant de déguster."]}, {"titre": "Kouign-amann", "source": "p. ≈ 76-79, « Europe »", "portions": "6 à 8 pers", "type": "Dessert", "ing": ["210 g de farine (+ 50 g pour étaler)", "125 g d'eau tiède", "5 à 10 g de levure fraîche [annotation manuscrite : « ou ½ sachet de sèche à diluer dans 50 g d'eau tiède »]", "1 c. à café de sel", "200 g de beurre salé mou (sans cristaux de sel qui pourraient déchirer la pâte) + 25 g pour le moule + 25 g pour le dessus", "200 g de sucre (+ 25 g après cuisson)"], "etapes": ["Délayer la levure fraîche en l'émiettant dans un peu d'eau tiède prélevée dans les 125 g ; verser dans un récipient (bol de robot avec crochet, ou à la main).", "Ajouter sel et farine, mélanger ; verser le reste d'eau tiède en pétrissant. Pétrir le plus possible (≈ 10 min) pour une pâte lisse qui ne colle pas aux mains.", "Inciser une croix sur la pâte, poser un film étirable au contact, laisser gonfler 2 à 3 h [annotation manuscrite : « si on le veut plat → laisser 2 h 30 ; si on le veut gonflé → laisser 1 h 30 » — lecture à confirmer].", "Mettre sur le plan de travail tous les ingrédients dont les 50 g de farine pour étaler (pour ne pas ajouter trop de farine). Étaler la pâte au maximum (élastique, prend du temps) sur 30 × 50 cm en farinant avec les 50 g.", "Tartiner le beurre jusqu'à 1 cm du bord, en couche uniforme. Saupoudrer des 200 g de sucre, sans laisser d'endroit nu ; appuyer légèrement pour incorporer le sucre au beurre.", "Plier la pâte en trois dans la longueur puis en trois dans la largeur (en farinant plan et rouleau avec la farine pesée).", "Étaler très doucement pour ne pas écraser (le beurre et le sucre sortiraient « comme le dentifrice de son tube »), si trop difficile mettre 20 min au frais. Plier en trois dans la longueur, étaler, tourner de 90°, plier de nouveau (geste doux).", "Préchauffer le four à 180 °C. Beurrer un moule à manqué de 26 cm avec 25 g de beurre (papier sulfurisé au fond possible). Étaler le pâton à la taille du moule, le mettre dedans. Disposer les 25 g de beurre restants en morceaux sur le dessus. Tracer au couteau des croisillons.", "Enfourner 30-35 min. Sortir et laisser le gâteau « boire » le beurre sorti de la pâte ; dès qu'il est absorbé, démouler sur un plat, retourner (2e plat pour remettre les croisillons dessus). Saupoudrer des 25 g de sucre. Se garde 4-5 jours ou se congèle ; réchauffer 5-7 min à four chaud avant de manger.", "Note : Intro de l'auteur : première recette « un peu difficile » réalisée à 13-14 ans ; recette typiquement bretonne de Douarnenez (Finistère), inventée au XIXe siècle ; « kouign » = gâteau, « amann » = beurre.", "Note : Doublon : version blog (photos 98–103) écartée."]}, {"titre": "Spéculoos fins", "source": "p. 118-119, « Europe »", "portions": "", "type": "Dessert", "ing": ["Pâte", "170 g de vergeoise brune", "2 c. à café du mélange d'épices ci-dessus", "150 g de beurre doux très mou", "2 c. à soupe de lait", "260 g de farine"], "etapes": ["Pour une quarantaine de spéculoos fins. Préparation 20 min, cuisson 13-15 min, réfrigération 2 h minimum.", "Mélange d'épices pour spéculoos (à faire avec des measuring spoons, cuillères à ras) : 2 + 1/8 de c. à café de cannelle en poudre ; 1/4 de c. à café de gingembre en poudre ; 1/4 de c. à café de mélange 4 épices ; 1/8 de c. à café de cardamome en poudre ; 1/8 de c. à café d'anis en poudre.", "Mettre la vergeoise dans un large bol, ajouter les épices, bien mélanger.", "Ajouter le beurre très mou et le lait, mélanger jusqu'à obtenir une sorte de crème.", "Ajouter la farine d'un coup, mélanger rapidement jusqu'à homogénéité, sans insister.", "Ramener la pâte en boule, la mettre sur un film étirable, lui donner la forme d'une brique allongée (en la tapant sur le plan de travail). Réfrigérer au moins 2 h, voire une nuit.", "Préchauffer le four à 190 °C. Découper des tranches d'un peu moins de 5 mm, les déposer sur une plaque garnie de papier sulfurisé. Enfourner 13-15 min. Laisser refroidir sur une grille. Conserver dans une boîte parfaitement hermétique.", "Note : Notes de l'auteur : la vergeoise brune (et non le sucre roux) donne la saveur ; pas d'agent levant (le beurre aère ; une levure ferait perdre le motif au moulage) ; possible de préparer le double du mélange d'épices."]}, {"titre": "Craquants aux amandes et café", "source": "p. 114-115, « Europe »", "portions": "25 craquants", "type": "Dessert", "ing": ["150 g d'amandes avec leur peau", "250 g de sucre glace", "35 g de blanc d'œuf", "1 c. à soupe d'extrait de café liquide"], "etapes": ["Préchauffer le four à 180 °C. Mixer les amandes pour les broyer assez grossièrement ; les mettre dans un grand bol, ajouter sucre glace, blanc d'œuf et extrait de café ; bien mélanger. Sur une plaque garnie de papier sulfurisé, former 6 tas à la cuillère à café par plaque. Enfourner 12-15 min : ils gonflent, craquent et ne bougent plus (comme des cookies), creux et très croustillants. À déguster avec une glace ou un café ; conserver en boîte hermétique."]}, {"titre": "Flan parisien", "source": "« Europe », pages ≈ 100-101 ⚠ numéros illisibles", "portions": "", "type": "Dessert", "ing": ["Pâte fécule", "250 g de farine type 55", "50 g de fécule de pomme de terre", "225 g de beurre", "55 g de lait", "15 g de jaune d'œuf", "3 g de sel", "30 g de sucre", "Crème à flan", "180 g de sucre", "130 g de poudre à crème", "1 pointe de couteau de vanille en poudre", "160 g d'œufs", "60 g de jaunes d'œufs", "30 g de beurre doux", "1,3 l de lait demi-écrémé", "+ 135 g de sucre semoule"], "etapes": ["Pour un flan de 24 cm. Préparation 1 h, cuisson 40-50 min, réfrigération 30 min (pâte fécule) + 3 h (flan).", "Pâte (lisible, photo 236) : mettre le beurre froid en morceaux, la farine, la fécule, le sel et le sucre dans le bol d'un robot muni de la feuille (le « K ») — ou pétrir à la main — jusqu'à une poudre sableuse. Fouetter ensemble le jaune d'œuf et le lait, verser sur le sableux, mélanger jusqu'à homogénéité (la pâte paraît un peu molle, surtout s'il fait chaud). Film étirable, 30 min au frais. Étaler sur plan fariné ou papier sulfurisé sur 2 mm (par étapes ; si la pâte ramollit, la remettre quelques minutes au frais).", "Foncer un cercle à entremets de 24 cm posé sur une plaque garnie de papier sulfurisé. Bien plaquer la pâte sur le fond et sur le bord du cercle, enlever l'excédent en passant un couteau sur le haut du cercle, piquer le fond, réfrigérer jusqu'à utilisation. Préchauffer le four à 180 °C.", "Crème à flan : mettre les 180 g de sucre, la vanille en poudre et la poudre à crème dans un récipient. Ajouter les œufs et les jaunes pesés : casser 3 ou 4 œufs dans un bol, battre en omelette, verser en filet dans un récipient posé sur une balance jusqu'à 160 g d'œuf ; idem avec les jaunes (un jaune pèse entre 15 et 22 g) jusqu'à 60 g.", "Porter le lait avec le beurre et les 135 g de sucre à ébullition dans une grande casserole sur feu doux. Quand le lait bout, verser en filet sur le mélange œufs/poudre à crème en fouettant. Bien mélanger, puis remettre le tout dans la casserole.", "Laisser bouillir sur feu doux 3 à 4 minutes en mélangeant toujours au fouet. Verser toute la crème dans le cercle foncé (fond garni de pâte), lisser la surface à la spatule.", "Enfourner à 180 °C pendant 40-50 minutes en surveillant : le flan doit ressortir bien gonflé et coloré. Le laisser complètement refroidir (il retombe alors). Décercler soigneusement, mettre au frais au moins 3 heures avant de servir en tranches.", "Dernier conseil : pour un flan bien coloré, le cuire directement après avoir versé la crème dans la pâte. Pour une surface plus marbrée, plus claire, avec plus de nuances colorées : mettre le flan cru au réfrigérateur une nuit avec un film étirable posé au contact de la crème, puis l'enfourner le lendemain après avoir ôté le film, en prolongeant un peu la cuisson.", "Note : Notes de l'auteur : la poudre à crème (poudre type « crème pâtissière ») remplace la farine/fécule de maïs habituelle ; possible de remplacer par de la fécule de maïs à défaut ; la pâte fécule cuite est très friable, riche en beurre, presque feuilletée.", "Note : Note de l'auteur (colonne de gauche, photo 237) : la poudre à crème retient parfaitement l'humidité, d'où la consistance du flan ; on peut mettre de la fécule de maïs à la place ; la pâte fécule cuite est très friable, riche en beurre, presque feuilletée."]}, {"titre": "Tiramisu", "source": "p. 124-125, « Europe »", "portions": "4 à 6 pers", "type": "Dessert", "ing": ["500 g de mascarpone", "2 gros œufs", "80 g de sucre semoule", "30 g de sucre glace", "2 paquets de biscuits à la cuiller", "1 tasse de café bien fort", "2 à 3 c. à soupe d'amaretto", "cacao en poudre non sucré"], "etapes": ["Séparer jaunes et blancs. Fouetter les jaunes avec le sucre semoule (batteur électrique) pour les blanchir au maximum.", "Ajouter le mascarpone, continuer de fouetter en crème aérée (quasi-chantilly : donne la texture et la tenue).", "Dans un autre récipient, monter les blancs en neige très ferme en ajoutant à mi-parcours le sucre glace. Les incorporer délicatement au mascarpone à la maryse en soulevant.", "Préparer un café assez fort, y ajouter l'amaretto (2-3 c. à soupe pour une tasse). Tremper les biscuits un à un 4-5 s (bien imbibés, pas détrempés).", "Les placer serrés dans un plat de service de 18 × 24 cm, verser dessus la crème au mascarpone en étalant bien (ou petits ramequins individuels).", "Laisser reposer ≥ 3 h au réfrigérateur. Au dernier moment, saupoudrer de cacao au tamis (sur les ramequins ou après avoir servi une part).", "Note : Variantes de l'auteur : on peut doubler les proportions pour une 2e couche de biscuits et de crème ; version fruits : biscuits trempés dans un sirop au kirsch ou eau-de-vie + framboises entre les couches de crème (ou poires/pêches fraîches, brisures de sablés) ; version sans alcool : imbiber de café et ajouter des zestes d'orange finement hachés avant la crème."]}, {"titre": "Tuiles aux amandes", "source": "p. 130-131, « Europe »", "portions": "24 tuiles", "type": "Dessert", "ing": ["250 g d'amandes effilées", "140 g de blancs d'œufs (≈ 5 blancs)", "160 g de sucre", "50 g de beurre doux fondu", "30 g de farine"], "etapes": ["Dans un grand bol, mélanger amandes, sucre et farine, puis ajouter les blancs pesés (astuce : battre rapidement les blancs à la fourchette, sans les monter, pour « casser » leur texture glaireuse : ils coulent en filet et se pèsent mieux).", "Ajouter le beurre fondu, bien mélanger en pâte homogène.", "Réfrigérer 1 h.", "Préchauffer le four à 170 °C (chaleur tournante si possible). Plaque de 30 × 40 cm + papier sulfurisé de bonne qualité.", "Prélever 1 c. à soupe de pâte par tuile, 6 tuiles par plaque (pas plus) ; aplatir chacune le plus finement possible avec le dos d'une fourchette ou d'une cuillère, en forme ovale (plus elles sont fines et planes, plus la cuisson est régulière).", "Enfourner plaque par plaque 10-12 min en surveillant les premières fournées : bien dorées au centre comme sur les côtés.", "Sortir, décoller chaque tuile à la spatule, la poser aussitôt sur un rouleau à pâtisserie pour la forme définitive (ou manche à balai entre deux chaises, bouteilles allongées, plaque à baguettes retournée…).", "Note : Intro : l'auteur les sert avec ses crèmes glacées et sorbets (comme chez un glacier parisien). Variantes possibles : tuiles dentelle (photos 154-155) et tuile du mousse génépi (photos 88-90) → recettes différentes."]}, {"titre": "Clafoutis aux cerises", "source": "p. 148-149, « Europe »", "portions": "6 pers", "type": "Dessert", "ing": ["600 g de cerises dénoyautées (⚠ avec ou sans noyaux, au choix de l'auteur)", "70 g de poudre d'amandes", "80 g de Maïzena", "125 g de sucre glace", "1 pointe de couteau de vanille en poudre", "2 gros œufs", "350 ml de crème liquide entière", "25 g de beurre fondu + 25 g pour beurrer le plat"], "etapes": ["Préchauffer le four à 200 °C. Laver soigneusement les cerises (dénoyauter ou non).", "Appareil : mélanger sucre glace, Maïzena, poudre d'amandes et vanille dans un récipient ; ajouter les œufs, bien mélanger ; ajouter la crème et le beurre fondu.", "Beurrer le plat à clafoutis, placer les cerises, verser la pâte, enfourner 35 min. À déguster tiède ou froid.", "Note : Note de l'auteur : version plus riche que d'habitude (poudre d'amandes + crème) ; sans noyaux plus facile à déguster."]}, {"titre": "Mochi nature", "source": "p. 250-251, « Asie et Océanie »", "portions": "12 mochi", "type": "Dessert", "ing": ["150 g de farine de riz gluant", "40 g de sucre", "230 g d'eau", "fécule de pomme de terre (quantité non indiquée)"], "etapes": ["Méthode : mettre farine de riz gluant, sucre et eau dans un bol allant au micro-ondes, mélanger en pâte lisse (très fluide, c'est normal ; les grumeaux disparaissent seuls). Micro-ondes 600 W par tranches de 30 s en mélangeant bien à chaque fois ; en général 3-4 min, la pâte gonfle (aspect chewing-gum). Variante vapeur : bol dans un panier vapeur jusqu'à ce que la pâte gonfle. Saupoudrer de fécule (passe-thé) un plat ou le plan de travail, verser la pâte dessus, resaupoudrer de fécule (protège de la chaleur : on manipule la pâte chaude). Prendre un morceau de pâte dans une main, le presser dans la paume en le faisant sortir entre pouce et index pour obtenir une boule de la taille d'une balle de ping-pong (vite ; si ça chauffe, remettre de la fécule sur la main). Arracher la boule de l'autre main, la rouler dans la fécule, ôter l'excédent au pinceau souple si besoin, aplatir légèrement entre les paumes. Servir dans la journée ; conserver sous film étirable.", "Renvoi : « voir page 254, photos 1 à 4 » (non photographié)."]}, {"titre": "Pavlova", "source": "p. 278-279, « Asie et Océanie »", "portions": "6 à 8 pers", "type": "Dessert", "ing": ["Meringue", "4 blancs d'œufs à température ambiante", "220 g de sucre", "10 g de Maïzena", "10 g de vinaigre blanc", "Crème fouettée", "190 g de crème liquide entière", "160 g de mascarpone", "1 gousse de vanille", "50 g de sucre glace"], "etapes": ["Garniture : fruits rouges (fraises, framboises, myrtilles, mûres, groseilles…).", "Meringue (possible la veille) : monter les blancs en neige, ajouter le sucre progressivement à mi-parcours, fouetter en neige très ferme (on ne doit plus sentir les cristaux de sucre entre les doigts). Mélanger vinaigre blanc et Maïzena dans un petit bol, verser dans la meringue, battre encore 2-3 min.", "Préchauffer le four à 160 °C. Sur une plaque garnie de papier sulfurisé, poser un cercle à mousse (haut. 5 cm) de 18 à 20 cm de diamètre. Verser la meringue, la faire venir sur le bord intérieur du cercle, créer des vagues à la spatule (aspect irrégulier), retirer le cercle (ou dessiner un cercle au crayon sur le papier et « tartiner » la meringue à la spatule).", "Enfourner et baisser aussitôt le four à 110-120 °C. Cuire 1 h 15 à 1 h 30 : la meringue ne doit pas trop colorer mais être bien dure en surface. Sortir, laisser reposer jusqu'au service.", "Crème : crème liquide, mascarpone et bol au frais 1 h. Vider la gousse de vanille dans la crème, ajouter le sucre glace, fouetter jusqu'à voir les traces du fouet.", "Poser la meringue sur un plat, garnir de chantilly à la spatule (irrégulière), parsemer de fruits rouges, servir immédiatement."]}, {"titre": "Bouchées de thon rouge mi-cuit au sésame", "source": "« finger attitude », p. 10", "portions": "4 pers", "type": "Poisson / fruits de mer", "ing": ["1 gros pavé de thon rouge (env. 400 g)", "50 g de graines de sésame", "3 c. à s. d'huile d'arachide", "1 noix de beurre", "cure-dents", "4 petits ramequins (8 cm de diamètre)", "Purée d'avocat", "1 avocat bien mûr", "1 c. à c. d'huile de sésame grillé", "4 c. à s. d'huile d'olive", "quelques gouttes de vinaigre balsamique", "quelques gouttes de citron vert", "sel, poivre"], "etapes": ["Méthode : écraser l'avocat à la fourchette, ajouter le citron vert et l'huile de sésame, saler, poivrer, remplir 4 ramequins de cette purée, creuser-la en son centre et verser-y 1 c. à s. d'huile d'olive et quelques gouttes de vinaigre balsamique. Trancher le thon en gros cubes de 2 cm d'épaisseur, les piquer avec des cure-dents, les paner (une seule face) dans le sésame en les tenant par les cure-dents. Dans une poêle, saisir dans beurre + huile d'arachide pendant 2 min, la face panée des cubes de thon uniquement : les bouchées cuisent d'un seul côté et restent crues de l'autre. Conseil de l'auteur : manger ces bouchées de la façon suivante : plonger la cuillère dans la purée d'avocat, remplir bien le cube de thon, puis racler-le sur un cube de thon ; on doit avoir en bouche autant de guacamole que de thon (⚠ phrase finale lue à l'envers, formulation à vérifier)."]}, {"titre": "Pâte à gaufres à l'oignon rouge et aux amandes", "source": "« finger attitude », p. 10", "portions": "6 pers", "type": "Autre", "ing": ["Compote d'oignons rouges", "100 g d'oignons rouges finement ciselés", "1 bouillon de volaille et petits légumes de « Royco Minute Soup » (réalisé avec 1 sachet et 20 cl d'eau bouillante, voir recette p. 157) ou 20 cl de bouillon de volaille", "2 c. à s. d'huile d'olive", "2 c. à s. de vinaigre balsamique", "2 c. à c. rases de sucre", "1/2 c. à c. de vinaigre de xérès", "sel", "20 g de beurre", "2 c. à c. de liaison à la Maïzena (voir recette p. 157)", "Pâte à gaufre", "20 g d'amandes effilées", "40 g de beurre fondu", "17,5 cl de lait demi-écrémé", "2 œufs entiers", "125 g de farine", "1 c. à c. rase de sucre", "1 c. à c. rase de sel", "1 paquet de levure chimique", "1 oignon rouge finement ciselé", "2 jaunes d'œufs", "2 blancs", "gaufrier. (⚠ liste lue à l'envers", "quantité d'œufs/jaunes/blancs à vérifier : la liste mentionne « 2 œufs entiers » et « 2 jaunes d'œufs / 2 blancs »)"], "etapes": ["Méthode : Compote : délayer le bouillon aux petits légumes dans l'eau. À feu moyen, faire fondre pendant 10 min les oignons rouges finement ciselés à couvert dans l'huile d'olive sans jamais les faire colorer (ils doivent devenir transparents). Ajouter le vinaigre de xérès, le vinaigre balsamique, le sucre, du sel et le beurre, puis le bouillon de volaille à 2 fois. Faire réduire des deux tiers pendant 15 min à feu moyen. Lier avec la liaison à la Maïzena, puis mixer le tout. Gaufres : faire blondir les amandes effilées sur du papier sulfurisé au four à 180 °C (th. 6) pendant 3 min. Faire fondre le beurre. Séparer les blancs des jaunes. Mélanger les poudres (farine, sucre, sel, levure), puis ajouter le beurre fondu. Remuer bien. Battre les 2 blancs en neige pas trop fermes. Incorporer la compote d'oignons, l'oignon cru et la moitié des blancs en neige. Mélanger délicatement, avant d'ajouter la seconde moitié des blancs en neige et les amandes effilées grillées. Remuer une dernière fois et verser la pâte dans le gaufrier. Les gaufres sont cuites au bout de 5 min. Peuvent s'accompagner d'une salade ou d'un poisson."]}, {"titre": "Œufs coulants, soja et vinaigrette au fromage blanc", "source": "« finger attitude », p. 24", "portions": "6 pers", "type": "Entrée", "ing": ["6 gros œufs", "1 trait de vinaigre de vin", "La panure", "2 œufs entiers", "chapelure", "50 cl d'huile d'arachide", "La garniture", "40 g d'amandes effilées", "80 g de pâtissons au vinaigre doux (ou de cornichons) coupés en rondelles", "300 g de pousses de soja", "1/2 citron", "3 c. à c. de miel liquide", "3 c. à s. d'huile d'olive", "2 c. à s. de sauce soja (brune)", "quelques brins d'herbes fraîches ciselées (ciboulette, coriandre)", "La vinaigrette", "30 g de fromage blanc à 20 %", "4 c. à s. d'huile d'olive", "1/4 de jus de citron", "2 pincées de noix de coco râpée", "2 pincées de curry", "sel, poivre"], "etapes": ["Méthode : Cuisson des œufs mollets : verser le vinaigre dans une casserole remplie d'eau bouillante, puis mettre-y les œufs. Les faire cuire 5 min, puis les refroidir dans un saladier rempli d'eau froide et les écaler. Panure : préparer une assiette avec les œufs battus en omelette d'un côté, la chapelure de l'autre. Enrober les œufs mollets d'œufs battus, puis les rouler dans la chapelure afin qu'ils soient parfaitement recouverts. Plonger-les 2 min dans un bain de friture (bouillant) pour les faire dorer. Vinaigrette : pendant la cuisson des œufs, mélanger grossièrement avec une cuillère tous les ingrédients de la vinaigrette en évitant de trop mélanger l'huile d'olive et le fromage blanc (on doit voir une trace blanche au milieu d'un filet d'or). Réserver au réfrigérateur. Garniture : faire dorer à feu vif les amandes dans l'huile d'olive. Ajouter les pousses de soja et les rondelles de pâtisson. Au bout de 1 mn de cuisson, déglacer avec le miel, la sauce soja et le citron. Poursuivre la cuisson 1 mn supplémentaire afin de concentrer les goûts. Finition : au centre d'une assiette individuelle, dresser un lit de pousses de soja. Verser dessus 2 c. à c. de vinaigrette de fromage blanc. Poser 1 œuf mollet sur le soja, agrémenter de ciboulette et de 1 brin de coriandre. Inciser alors légèrement l'œuf afin que le jaune s'écoule langoureusement sur le lit de soja.", "No
