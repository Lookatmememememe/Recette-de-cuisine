e, mélanger à la spatule pour refroidir (ou feuille du robot). Ajouter 1 œuf, mélanger jusqu'à incorporation complète, puis le 2e œuf, jusqu'à préparation homogène : pâte lisse, brillante, avec de la tenue ; elle forme « un bec » au bout de la spatule.", "Pochage et cuisson : préchauffer le four à 180 °. Pâte à choux dans une poche munie d'une douille de 10 ; pocher 8 choux de 8/9 cm sur plaque recouverte de papier sulfurisé, poser un craquelin au-dessus de chaque chou en pressant légèrement. Sur une autre plaque, pocher 8 petits choux de 2/3 cm avec les petits craquelins. Enfourner 30/35 min en surveillant la coloration (petits choux : sortir après 10/15 min). Quand les choux sont dorés, entrouvrir la porte 10 s pour laisser l'humidité s'échapper ; les choux doivent être assez colorés pour ne pas retomber ; à la fin laisser les choux dans le four éteint pour les sécher. Sortir sur une grille, laisser refroidir complètement.", "Crème mousseline pralinée : beurre impérativement à température ambiante ; crème pâtissière sortie du frigo 30 min avant (même température que le beurre). Dans la cuve du robot, fouetter le beurre en petits morceaux jusqu'à une couleur ivoire. Détendre brièvement la crème pâtissière au fouet manuel. Fouet en marche, verser la crème pâtissière cuillère par cuillère sur le beurre. Continuer à battre 2-3 min à vitesse rapide. ⚠ Montage final (garniture, sucre glace, feuille d'or) : à lire sur photos suivantes.", "Verser la crème mousseline dans une poche avec une petite douille cannelée (pour garnir les choux) et mettre la poche au frais 1 h. Montage : dans une poche jetable sans douille, mettre quelques cuillères de praliné pur et couper le bout pour une petite ouverture. Percer les petits choux par le bas et les garnir de praliné. Couper le chapeau des grands choux (partie du haut), garnir les choux d'un peu de crème mousseline, puis enfoncer un petit chou garni de praliné dans le grand. Ajouter une deuxième couche de crème mousseline pour donner de la hauteur, puis poser le chapeau des choux sur la crème, appuyer légèrement sans écraser pour le faire tenir. Saupoudrer d'une fine pellicule de sucre glace, puis décorer de feuille d'or ou d'une noisette sur le chapeau. Le Paris-Brest doit reposer 2 h au frigo, puis 10 min à température ambiante juste avant dégustation."]}, {"titre": "Pâte à choux — les trois points clés", "source": "livre/magazine, p. 380 (auteur non lisible)", "portions": "4 à 6 pers", "type": "Autre", "ing": ["25 cl d'eau", "100 g de beurre", "150 g de farine fluide", "5 œufs", "2 pincées de sel"], "etapes": ["Préparation : porter l'eau à ébullition avec le beurre en petits morceaux et une pincée de sel. Dès que ça bout, retirer du feu, ajouter la farine, mélanger énergiquement à la spatule jusqu'à une pâte lisse. Remettre sur feu doux, assécher 1 min jusqu'à ce que la pâte se détache. Retirer du feu, ajouter 4 œufs un à un, bien incorporés. La pâte doit être souple, couler difficilement de la spatule, s'affaisser à peine en pointe ; si trop ferme, ajouter ½ œuf battu.", "Mise en forme : dresser les choux sur plaque anti-adhésive ou papier cuisson (poche à douille unie ou 2 cuillères trempées dans l'eau froide), bien espacés. Battre le dernier œuf avec une pincée de sel, badigeonner, rayer à la fourchette (dans la longueur pour éclairs, en croix pour formes rondes).", "Cuisson : four à 220 °C (th. 6-7), enfourner dès qu'ils sont formés. 15 à 20 min : gonflés et légèrement colorés. Baisser de 20 à 30 °C, sécher encore 15 min, four entrouvert. Avant cuisson : on peut saupoudrer de sucre en grains (chouquettes), amandes ou noisettes.", "Note : Bon à savoir : l'eau peut être remplacée (en tout ou moitié) par du lait pour des choux plus moelleux, mais la pâte à l'eau est plus sèche et plus réussie."]}, {"titre": "Profiteroles à la vanille et aux figues rôties", "source": "livre/magazine, p. 380", "portions": "6 pers", "type": "Dessert", "ing": ["pâte à choux (la moitié de la recette suffit)", "50 cl de glace à la vanille", "6 grosses figues", "30 g de noix en poudre", "30 g de beurre", "1 c. à soupe de miel"], "etapes": ["Préparer la pâte à choux, dresser 3 choux par personne. Après cuisson, découper un chapeau dans chaque chou (couteau-scie). Déposer une boule de glace dans chacun, remettre les chapeaux, réserver au congélateur (peu de temps avant de servir).", "Éplucher les figues, les couper en deux. Dans une poêle, mélanger pulpe de figue, beurre, noix en poudre et miel, cuire ≈ 5 min à feu moyen.", "Verser cette sauce tiède sur les profiteroles juste avant de servir."]}, {"titre": "Pain à la poêle (« Fait délicieux » — annotation manuscrite)", "source": "Papa en Cuisine (papaencuisine.com/pain-la-poele), impression du 24/05", "portions": "", "type": "Autre", "ing": ["400 g farine", "1 sachet de levure chimique", "25 cl d'eau tiède", "1 c. à café de sel"], "etapes": ["Mélanger les ingrédients secs.", "Ajouter l'eau, mélanger jusqu'à la formation d'une boule.", "Séparer la pâte en petites boules de 5 cm de diamètre environ.", "Les aplatir sur une hauteur de 1 cm.", "Les passer 3/4 minutes [⚠ « ¾ minutes » = 3-4 min] de chaque côté dans un peu d'huile bien chaude.", "Versions au fromage : suivre le tutoriel en photos (non copié).", "Note : Doublon : photo 45 (même source) écartée."]}, {"titre": "Brioches suédoises à la cannelle (« Kanelbullar »)", "source": "Del's Cooking Twist (delscookingtwist.com/fr/2014/01/13/swedish-cinnam", "portions": "", "type": "Autre", "ing": ["Brioches", "35 g levure fraîche", "100 g sucre", "30 cl lait", "1 gros œuf", "120 g beurre", "1 c. à café de sel", "1 c. à soupe de cardamome fraîchement moulue", "750 g farine", "Garniture", "120 g beurre à température ambiante", "50 g sucre", "2 c. à soupe de cannelle", "Glaçage", "1 gros œuf", "2 c. à soupe d'eau", "2 c. à soupe de perles de sucre"], "etapes": ["Émietter la levure dans un petit bol et la dissoudre dans quelques c. à soupe de lait. Faire fondre le beurre et verser le lait dedans. Ajouter tous les autres ingrédients et pétrir la pâte 10-15 min (important). Laisser reposer sous torchon environ 30 min à température ambiante.", "Étaler la pâte sur 3 mm d'épaisseur et 30 cm de large, étaler le beurre sur toute la surface, saupoudrer sucre et cannelle.", "Rouler la pâte dans le sens de la longueur, couper en 25 tranches, les placer sur papier sulfurisé ou, mieux, dans des caissettes de taille moyenne. Laisser lever sous torchon environ 1 h (jusqu'à doubler). Battre l'œuf et l'eau, badigeonner les brioches, ajouter les perles de sucre. Enfourner à 220 °C pendant 5-6 minutes, laisser refroidir sur une grille avant de servir."]}, {"titre": "Choux au citron meringués", "source": "blog « Ma Toque » — matoque.fr/choux-au-citron-meringues/ (article du ", "portions": "", "type": "Dessert", "ing": ["Crème citron", "240 g jus de citron", "80 g lait", "6 œufs", "260 g sucre", "50 g maïzena", "75 g beurre", "Pâte à choux", "125 g eau", "50 g beurre", "80 g farine T55", "2 œufs", "1 pincée de sucre", "1 pincée de sel", "Craquelin (Christophe Michalak)", "40 g beurre demi-sel à température ambiante", "50 g cassonade", "50 g farine", "Meringue", "3 blancs d'œuf", "110 g sucre glace", "60 g sucre", "1 pincée de sel", "Craquelin", "beurre en petits morceaux battu en pommade", "ajouter tous les ingrédients, malaxer en boule", "étaler entre deux feuilles de papier sulfurisé sur 2/3 cm [⚠ « 2/3 cm » comme dans le Paris-Brest : probablement mm]", "détailler en cercles du même diamètre que les choux (6/7 cm)", "replacer la feuille, laisser prendre au frais", "Pâte à choux", "(même méthode que photos 104–112) eau, sucre, sel, beurre en petits morceaux", "ébullition, hors du feu ajouter la farine d'un coup, mélanger vite sans grumeaux, remettre sur feu doux et dessécher quelques minutes", "film de pâte cuite au fond de la casserole = prête", "refroidir rapidement dans un cul-de-poule", "incorporer 1 œuf puis le 2e", "pâte lisse, brillante, forme « un bec »"], "etapes": ["Crème citron : verser le jus de citron et le lait dans une casserole, feu doux, porter à ébullition. Pendant ce temps, fouetter rapidement œufs et sucre (blanchir), ajouter la farine [lu « farine », ingrédient listé = maïzena : ⚠ à vérifier] et fouetter pour un appareil homogène. Quand le jus arrive à ébullition, verser la moitié sur le mélange, détendre au fouet, puis verser le tout dans la casserole sur feu moyen. Ne plus quitter le fouet (gratter les parois ; dessiner un 8). Quand la crème est prête (épaisse, frémit à la surface), battre encore 50 s et retirer du feu. Ajouter le beurre en petits morceaux, fouetter. Verser dans un cul-de-poule propre et sec, filmer au contact, percer le film à plusieurs endroits, plonger dans l'eau glacée, laisser reposer au frais 2 h.", "Pochage et cuisson : la pâte à choux ne doit pas trop être travaillée, enfourner assez vite. Préchauffer le four à 180 °. Pâte dans une poche, douille de 10 ; pocher sur plaque recouverte de papier sulfurisé, poser un craquelin au-dessus de chaque chou en pressant légèrement (sans écraser). Enfourner 30/35 min en surveillant la coloration. Quand les choux sont dorés, entrouvrir la porte 10 s pour laisser l'humidité s'échapper. Assez colorés pour ne pas retomber ; à la fin de la cuisson laisser les choux dans le four éteint pour les sécher. À la sortie, laisser refroidir complètement avant de percer le dessous. Détendre la crème citron au fouet si besoin, la verser dans une poche munie d'une petite douille et garnir les choux.", "Meringue : clarifier les œufs, verser les blancs avec la pincée de sel dans la cuve du robot ; monter en neige en ajoutant le sucre (en poudre) au fur et à mesure. Quand la meringue est ferme et brillante, ajouter le sucre glace en deux temps, mélanger très délicatement à la maryse. Tremper le dessus des choux dans la meringue, retirer délicatement pour former une extrémité en pointe (ou pocher la meringue avec une petite douille cannelée). Colorer la meringue au chalumeau, puis placer les choux au frais.", "(À fusionner avec lot_017 : une seule recette « Choux au citron meringués ».)", "Note : Astuce : pour un parfum de citron plus intense, zester les citrons, ajouter le zeste au jus dans la casserole avant ébullition, puis filtrer le jus avant de continuer la crème."]}, {"titre": "Lemon curd (Pierre Hermé)", "source": "notes manuscrites de Lud (lemon curd « Pierre Hermé »)", "portions": "≈ 50 macarons", "type": "Base / sauce", "ing": ["225 g d'œufs entiers", "240 g de sucre en poudre", "8 g de zeste de citron", "160 g de jus de citron", "350 g de beurre", "100 g de poudre d'amande"], "etapes": ["Mélanger sucre, zestes, jus de citron, œufs ; cuire au bain-marie jusqu'à 83-84 ° en remuant sans arrêt (« 75 ° sinon goût omelette ! »).", "Laisser refroidir à 60 ° et incorporer le beurre. Fouetter au mixeur plongeant pendant 5 min.", "Verser la crème dans un plat, filmer au contact et laisser reposer jusqu'au lendemain.", "Le lendemain, incorporer la poudre d'amande à la crème (note : « Pas sûr ! »).", "Note : Quantités de Pierre Hermé (colonne de gauche de ta fiche). Ta colonne de droite est une version réduite (×0,93, pour 210 g d'œufs) : œufs 210 g, sucre 224 g, zeste 7,4 g, jus 150 g, beurre 326 g, poudre d'amande 93 g.", "Note : Sur ta fiche le beurre (350 g) est barré, sans raison connue : gardé ici.", "Note : Version de comparaison collée par Lud (source non vérifiée, attribuée à Pierre Hermé) : 240 g de sucre, 4 citrons bio (zestes hachés finement + jus), 4 œufs, 300 g de beurre pommade. Zestes mélangés au sucre, œufs au fouet, jus ; bain-marie en fouettant ≈ 10 min jusqu'à épaississement (82 °, le fouet creuse des sillons) ; hors du feu, refroidir sous 60 °C en remuant de temps en temps ; ajouter le beurre pommade et mixer au blender (lisse et soyeux) ; mettre en pot, 2 h au frais.", "Note : Écart avec ta fiche : beurre 300 g (version collée) vs 350 g barré (ta fiche) ; pas de poudre d'amande ; 82 °C vs 83-84 °C."]}, {"titre": "Verrines façon tarte meringuée + crumble (quantités réduites)", "source": "notes manuscrites de Lud (« verrines façon tarte meringuée sur Pinterest »)", "portions": "", "type": "Dessert", "ing": ["Version testée : 75 ml de jus de citron + zestes", "2 œufs", "100 g de sucre en poudre", "50 g de beurre (« essayer sans le beurre »)", "Crumble : 50 g de farine", "50 g de sucre", "50 g de poudre d'amande", "50 g de beurre"], "etapes": ["Prélever les zestes des citrons, frotter zestes et sucre avec les mains. Mélanger sucre, zestes, jus, œufs ; cuire au bain-marie jusqu'à 83-84 ° en remuant (75 ° sinon goût omelette), refroidir à 60 °, incorporer le beurre, mixer 5 min, filmer au contact, réserver jusqu'au lendemain. (la meringue n'est pas décrite sur la fiche)", "Crumble : mélanger farine, sucre, poudre d'amande et beurre ; cuire 20-25 min à 150 °.", "Note : Même méthode que le lemon curd ci-dessus (flèche sur ta fiche), sans la poudre d'amande ; zestes frottés avec le sucre à la main d'abord. Version testée : 75 ml de jus + zestes, 2 œufs, 100 g de sucre, 50 g de beurre (« Essayer sans le beurre »).", "Note : Fiche : « Verrines façon tarte meringuée sur Pinterest ».", "Note : Le lemon curd = la crème au citron seule ; le crumble se met dessus dans les verrines (indication de Lud)."]}, {"titre": "Gaufres aux blancs d'œufs de Christophe Michalak", "source": "Quelques Grammes de Gourmandise (QGDG)", "portions": "3 gaufres", "type": "Dessert", "ing": ["Matériel", "gaufrier", "37,5 g blancs d'œufs (les blancs de 2 gros œufs)", "77,5 g farine T55", "0,5 pincée de sel fin", "82,5 g lait entier", "67,5 g beurre (barré)", "0,5 gousse de vanille", "7,5 g sucre semoule"], "etapes": ["Préchauffer le gaufrier.", "Mettre les blancs dans un récipient, à température ambiante.", "Dans un second cul-de-poule, mélanger la farine et le sel.", "Mettre le lait, le beurre coupé en petits dés et les graines de la gousse de vanille grattée dans une casserole ; tiédir à feu doux pour faire fondre le beurre.", "Verser le lait tiédi sur la farine en mélangeant (préparation assez épaisse : normal).", "Monter les blancs en neige en incorporant peu à peu le sucre, jusqu'au « bec d'oiseau ».", "Incorporer 1/3 des blancs montés à la préparation pour la détendre, puis le reste délicatement.", "Mettre dans une poche à douille pour remplir les cavités du gaufrier.", "Cuire les gaufres deux par deux environ 5 min en retournant le gaufrier (si possible) au bout de 3 min pour une cuisson homogène.", "Note : Source : Quelques Grammes de Gourmandise (QGDG). Dessert, cuisine française, végétarienne. Préparation 10 min, cuisson 15 min. Pour 3 gaufres.", "Note : Annotations manuscrites bleues de Lud (quantités pour une version plus grande) : blancs « 64 » ; farine « 132 g » ; lait « 140 » ; beurre « 50.30 » [⚠ lecture « 50 » ou « 30 » : à vérifier] ; sel, vanille, sucre non modifiés. Annotation rose : « Mettre 3 min une boule au gaufrier / 20 s »."]}, {"titre": "Verrines tiramisu au speculoos et au caramel beurre salé", "source": "PtitChef (ptitchef.com) ; prép. 30 min + repos 4 h", "portions": "6 verrines", "type": "Dessert", "ing": ["≈ 17 speculoos", "12 c. à soupe de caramel au beurre salé", "30 cl de café", "500 g de mascarpone", "100 g de sucre", "4 œufs", "Matériel : batteur électrique, 3 verres, 2 poches à douille (optionnel)"], "etapes": ["Séparer jaunes et blancs. Battre les jaunes avec le sucre jusqu'à texture crémeuse, ajouter le mascarpone.", "Battre les blancs en neige, les incorporer à la maryse, mettre dans une poche à douille.", "Pocher la crème au fond du verre. Couper les speculoos en deux, les imbiber de café, les déposer sur la crème.", "Recouvrir de crème puis de caramel beurre salé, biscuits imbibés, crème.", "Biscuits imbibés, caramel, puis crème pochée sur le dessus. Film alimentaire, 4 h minimum au frais.", "Parsemer de speculoos écrasés et planter un demi-speculoos dans la crème.", "Note : Lud : « Pour 8 verrines dans verres Nutella → trop grand. Faire dans des + petits ! Fini avec la poche à douille bleue ronde. »", "Note : Conseils : œufs remplaçables par de la crème ; gousse de vanille ; pincée de sel dans les blancs ; sac de congélation à la place de la poche ; mieux vaut laisser reposer une nuit. Accord vin : Barsac, Coteaux du Layon, Banyuls."]}, {"titre": "Caramel au beurre salé facile et rapide", "source": "PtitChef (ptitchef.com) ; prép. 5 min, cuisson 10 min", "portions": "12 parts", "type": "Base / sauce", "ing": ["80 g de sucre", "32 g de beurre demi-sel", "16 cl de crème liquide"], "etapes": ["Faire fondre et caraméliser le sucre dans une casserole à feu moyen (remuer la casserole).", "Ajouter le beurre d'un coup (éclaboussures), mélanger.", "Ajouter la crème, mélanger jusqu'à dissolution ; laisser bouillir puis épaissir une dizaine de minutes en remuant (liquide, il durcit en refroidissant).", "Verser dans un pot en verre propre, frais minimum 2 h.", "Note : Astuces : pas de beurre salé → beurre doux + petite c. à café de sel ; caramel plus épais → un peu moins de crème."]}, {"titre": "Baba au rhum (12 babas individuels)", "source": "blog « Ma Toque » — matoque.fr/baba-au-rhum/ (article du 20 oct", "portions": "", "type": "Dessert", "ing": ["Pâte", "200 g farine", "40 g sucre", "2 œufs", "60 g lait tiède", "12 g levure fraîche (levure boulangère)", "75 g beurre à température ambiante (de préférence à 82 % de M.G.)", "1 pincée de sel", "Sirop", "800 g eau", "400 g sucre", "200 g rhum"], "etapes": ["Crème chantilly : [liste coupée en bas de page]. ⚠ Préparation, cuisson, imbibage, chantilly : sur les photos suivantes (131+).", "Crème chantilly : 25 cl crème fleurette (entière) ; 30 g sucre glace ; 1 gousse de vanille. Montage : cerises bigarreaux ; fruits frais ; nappage blond ; gousse de vanille.", "Pâte à brioche : dans la cuve du robot verser sucre, farine, puis les œufs. Émietter la levure dans le lait tiède et mélanger en la délayant bien. Ajouter au reste dans la cuve, poser sur le socle du robot muni d'un crochet. Vitesse lente 5 min avant d'ajouter le sel. Incorporer le beurre mou coupé en morceaux, en plusieurs fois. Travailler 6/8 min de plus pour une pâte plus élastique (corner les bords si besoin). Couvrir d'un linge, laisser pousser 45/50 min en pièce à température ambiante, sans courant d'air. Beurrer les empreintes du moule à baba au pinceau. Travailler la pâte rapidement pour la dégazer, la verser dans une poche jetable sans douille, couper l'extrémité, garnir chaque empreinte jusqu'à 2/3 de la hauteur. Note manuscrite : « Couvrir le moule d'un linge et laisser lever une deuxième fois, pendant 30/60 min à temp. ambiante ». (Texte imprimé : laisser lever une deuxième fois 30/40 min à température ambiante.) Préchauffer le four à 180 °, enfourner 10/15 min en surveillant la coloration (annotation manuscrite « 12 min »).", "Sirop : verser eau et sucre dans une casserole, porter à ébullition, laisser frémir quelques minutes, retirer du feu, ajouter le rhum. À la sortie du four, démouler les babas, laisser tiédir sur une grille 5 min. Verser le sirop dans un récipient large (moule à gratin) et tremper les babas. Mieux : les laisser dans le sirop au frais toute la nuit, en les retournant plusieurs fois. Si tout le même jour : imbiber longuement les deux côtés. Le lendemain (ou après imbibage) : poser les babas à égoutter sur une grille, chauffer le nappage blond dans une casserole, napper chaque baba au pinceau. Réserver au frais pendant la crème.", "Crème chantilly : fouetter la crème liquide en chantilly, en ajoutant sucre glace et vanille à la fin, quand la crème est presque prête. Montage : chantilly dans une poche à douille cannelée, garnir le centre de chaque baba en tourbillonnant ; décorer de cerises bigarreaux, fruits frais ou gousse de vanille. Conserver au frais.", "Pour les gourmands : réserver le sirop d'imbibage au frais et en verser de nouveau sur le baba avant de servir. La chantilly peut être remplacée par une crème pâtissière vanille.", "(À fusionner avec lot_019 : une seule recette « Baba au rhum ».)"]}, {"titre": "Brioche feuilletée", "source": "fiche imprimée (blog non identifié → à vérifier ; mise en page type bl", "portions": "", "type": "Autre", "ing": ["510 g farine T45", "1 c. à café de sel", "40 g sucre", "15 cl lait", "20 g levure fraîche de boulangerie", "3 œufs", "50 g beurre à température ambiante", "300 g beurre pour le tourage", "sirop (30 g de sucre / 30 g d'eau)", "100 g sucre en grains"], "etapes": ["Faire bouillir l'eau et le sucre pour le sirop, laisser refroidir. Dans le bol du robot : sucre, œufs, lait et farine avec la levure émiettée dessus. Pétrir 5 min jusqu'à ce que la pâte forme une boule. Ajouter le sel et le beurre en dés. Pétrir jusqu'à ce que le beurre soit bien incorporé et la pâte lisse. Filmer au contact, laisser doubler de volume (1 h 30 pour l'auteur). Déposer sur papier sulfurisé, avec les mains farinées redonner une forme de boule en dégazant. Mettre au frais (frigo) pour stopper la levée et raffermir.", "Pendant ce temps, donner au beurre de tourage une forme rectangulaire de 20 × 25 cm (papier sulfurisé, rouleau), au frais (même température que la pâte). Étaler le pâton en rectangle de 45 sur 25 cm. Placer le beurre au centre, rabattre les 2 côtés dessus pour l'enfermer. Couture face à soi, étaler le pâton sur 60 à 70 cm. 1er tour : rabattre le tiers inférieur sur le milieu puis le tiers supérieur sur le milieu ; tourner de 90° (couture à gauche), au frais 20 min. Faire 3 tours au total, 20 min au frais entre chaque. Après les 3 tours, étaler en rectangle de 35 sur 45 cm. Parsemer de sucre en grains toute la surface sauf 3 cm en bas dans la longueur, passer le rouleau pour enfoncer les grains ; sur les 3 cm restants, badigeonner de sirop. Rouler le pâton en serrant pour former un boudin, bien appuyer sur la soudure (là où il y a le sirop). Transférer sur une plaque, soudure dessous, congeler 20 min pour faciliter la découpe. Graisser 2 moules à cakes. Prélever des tronçons de 45 mm environ, les placer dans les moules et laisser pointer à nouveau (environ 1 heure, la pâte doit doubler). Préchauffer le four à 180 °C et cuire environ 30 minutes."]}, {"titre": "Galettes (sarrasin) et Crêpes", "source": "Mes recettes (photos)", "portions": "", "type": "Autre", "ing": ["- V1", "200 g farine de sarrasin", "50 g farine blanche", "2 œufs", "1 c. à soupe de sel marin", "½ l d'eau", "50 g beurre fondu", "- V2", "500 g farine de blé noir", "1 l d'eau", "1 c. à soupe de gros sel", "- ✱ V3", "850 g farine de blé noir", "35 g sel de Guérande", "2 œufs (gros)", "25 cl de lait", "≈ 2 l d'eau fraîche", "- V4", "500 g farine de blé noir", "150 g farine blanche", "1 œuf", "2 c. à soupe d'huile", "2 c. à café de sel", "1 l ½ d'eau", "- ✱ V5", "500 g farine de blé noir", "100 g farine blanche", "1 œuf entier", "1 c. à café de sel", "+/- 2 l d'eau", "- (rose)", "1 kg de farine (⚠ premier chiffre barré/illisible, « ou 850 noir 150 blanche »)", "3 œufs", "sel", "1,5 à 2 L d'eau", "- V1", "250 g farine", "120 g beurre", "2 œufs + 1 jaune", "80 g sucre fin", "½ l de lait", "1 pincée de sel", "- V2", "2 œufs", "250 g farine", "½ l de lait", "1 pincée de sel", "- V3", "250 g farine", "50 cl de lait", "3 œufs", "75 g beurre", "sel", "- V4", "250 g farine", "4 œufs", "½ l de lait", "1 c. à soupe d'huile", "1 pincée de sucre vanillé", "- « Recette Carnot » (rose)", "300 g de sucre", "8 œufs", "700/800 g ou 1 kg de farine", "1 L de lait"], "etapes": ["**Galettes** (plusieurs versions écrites les unes sous les autres ; ✱ = versions marquées d'un astérisque par Lud) :", "**Crêpes** :"]}, {"titre": "Sushi gohan (riz vinaigré) et sauce Awasezu", "source": "fiche de stage imprimée (cuisine japonaise)", "portions": "", "type": "Base / sauce", "ing": ["5 tasses de riz (750 g)", "5 tasses d'eau", "Sauce Awasezu : 1 dl de vinaigre de riz", "5 c. à soupe de sucre", "1 1/3 c. à soupe de sel"], "etapes": ["Laver le riz jusqu'à eau claire, égoutter, laisser reposer 30 min (annotation : « dans la future eau de cuisson »).", "Dans une casserole, ajouter l'eau, porter à ébullition, réduire le feu, bouillir 10 min, arrêter le feu, laisser reposer 10 min. Ne jamais ouvrir le couvercle pendant la cuisson.", "Sauce Awasezu : chauffer vinaigre, sucre et sel.", "Verser le riz dans un hangiri (plat en bois) ou plat creux non métallique, mélanger à la sauce, refroidir à l'éventail (riz brillant), couvrir d'une serviette humide.", "Note : Garnitures selon possibilités : thon, saumon, daurade frais, crevettes, œufs de saumon, omelette japonaise, concombre, nori…"]}, {"titre": "Crevettes pour sushis", "source": "fiche de stage imprimée (cuisine japonaise)", "portions": "", "type": "Poisson / fruits de mer", "ing": ["crevettes", "3 c. à soupe de saké", "3 c. à soupe d'eau", "un peu de sel", "cure-dents"], "etapes": ["Enlever le boyau noir ; piquer un cure-dent sur le ventre, partant de la queue.", "Casserole : 3 c. à soupe de saké + 3 c. d'eau, un peu de sel, les crevettes ; cuire couvert 2-3 min ; refroidir.", "Enlever le cure-dent et la carapace, aplatir au couteau."]}, {"titre": "Gari (gingembre mariné)", "source": "fiche de stage imprimée (cuisine japonaise)", "portions": "", "type": "Base / sauce", "ing": ["gingembre frais", "sel", "3 c. à soupe de vinaigre de riz", "1 c. à soupe de sucre"], "etapes": ["Passer très finement le gingembre à la râpe.", "Cuire de l'eau avec du sel, ajouter le gingembre (annotation : 1 min), saisir rapidement, égoutter, sécher au papier ménage.", "Mélanger vinaigre de riz, sucre et un peu de sel dans un récipient, ajouter le gingembre."]}, {"titre": "Nigiri sushis", "source": "fiche de stage imprimée (cuisine japonaise)", "portions": "", "type": "Plat", "ing": ["riz vinaigré", "wasabi", "garnitures au choix (toro, ikura, uni, anago, akagai, ebi…)"], "etapes": ["Prendre un peu de riz vinaigré dans la main, former une forme oblongue.", "Mettre un peu de wasabi sur le riz, déposer la garniture, presser avec deux doigts, mettre en forme et servir."]}, {"titre": "Omelette japonaise (tamagoyaki)", "source": "fiche de stage imprimée (cuisine japonaise)", "portions": "", "type": "Entrée", "ing": ["5 œufs", "3 c. à soupe d'eau", "1 c. à soupe de mirin", "1 c. à soupe de saké", "1 1/2 c. à soupe de sucre", "1 c. à café de soja", "un peu de sel", "huile pour la poêle"], "etapes": ["Bien mélanger tous les ingrédients. Poêle huilée (essuyer au papier). Cuire avec la moitié de la préparation ; quand c'est un peu cuit, brouiller très légèrement à la spatule, plier l'omelette sur elle-même.", "Essuyer la place vide, glisser l'omelette dans la partie séchée ; ajouter une louche de préparation ; soulever la première part pour laisser glisser le jus ; replier (2e couche). Répéter jusqu'à épuisement du mélange.", "Sortir, déposer sur un rouleau de bambou, former à chaud, laisser refroidir, couper en bandes.", "Note : La recette du Miso shiru, annoncée au menu du stage, n'apparaît pas sur les photos."]}, {"titre": "Cake au saumon et à l'oseille (« Les Cakes de Sophie », p. 12)", "source": "livre « Les Cakes de Sophie » (Sophie Dudemaine ; ⚠ auteur non lisible", "portions": "", "type": "Entrée", "ing": ["3 œufs", "150 g farine", "1 sachet de levure", "10 cl huile de tournesol", "12,5 cl lait entier", "100 g gruyère râpé", "1 pavé de 200 g de saumon frais sans peau", "200 g d'oseille", "1 noix de beurre demi-sel", "2 pincées de sel", "2 pincées de poivre"], "etapes": ["Préchauffer le four à 180 °C (th. 6). Faire revenir les feuilles d'oseille lavées dans une poêle avec un peu de beurre 5 min ; découper le saumon en morceaux, le faire revenir 5 min avec l'oseille, saler, poivrer. Dans un saladier, fouetter les œufs, la farine et la levure ; incorporer petit à petit l'huile et le lait chaud ; ajouter le gruyère ; incorporer le mélange au saumon à la base. Verser dans un moule non graissé, cuire 45 min.", "Note : Variantes : au saumon et à l'estragon (50 g d'estragon frais à la place de l'oseille) ; au saumon et aux poireaux (2 blancs de poireau émincés revenus à la poêle à la place de l'oseille)."]}, {"titre": "Cake aux lardons et aux pruneaux", "source": "« Les Cakes de Sophie », p. 19, Printemps · Mars", "portions": "", "type": "Entrée", "ing": ["3 œufs", "150 g farine", "1 sachet de levure", "10 cl huile de tournesol", "12,5 cl lait entier", "100 g gruyère râpé", "200 g lardons fumés", "80 g pruneaux d'Agen", "1 pincée de sel", "2 pincées de poivre"], "etapes": ["Préchauffer le four à 180 °C (th. 6). Dans un saladier, travailler au fouet œufs, farine, levure, sel et poivre ; incorporer petit à petit l'huile et le lait préalablement chauffé ; ajouter le gruyère, mélanger. Faire rissoler les lardons sans matière grasse 5 min ; couper les pruneaux en morceaux et les mélanger aux lardons. Verser le tout dans un moule non graissé, cuire 45 min.", "Note : Annotation manuscrite : « Pour les petits moules en silicone carrés roses → doubler la dose. NE PAS FAIRE DANS LES PETITS MOULES. » (⚠ phrase ambiguë : « doubler la dose » puis « ne pas faire dans les petits moules » → à clarifier avec Lud).", "Note : Variante : aux lardons, aux pruneaux et aux noisettes : 200 g de lard coupé en morceaux, rissolé sans matière grasse, ajouter 50 g de pruneaux coupés et 50 g de noisettes concassées."]}, {"titre": "Cake aux artichauts et aux olives", "source": "« Les Cakes de Sophie », p. 30, Printemps · Avril", "portions": "", "type": "Entrée", "ing": ["3 œufs", "150 g farine", "1 sachet de levure", "10 cl huile de tournesol", "12,5 cl lait entier", "50 g gruyère râpé", "250 g fonds d'artichaut", "50 g olives vertes farcies au poivron", "1 jus de citron", "1 pincée de sel", "1 pincée de poivre"], "etapes": ["Mettre au four [⚠ imprimé « au four » ; sans doute « à cuire »] les fonds d'artichaut dans de l'eau bouillante citronnée 20 min, égoutter et sécher ; en mettre deux de côté et mixer le reste en purée. Dans un saladier, travailler au fouet œufs, farine, levure, sel, poivre ; ajouter le gruyère, mélanger ; incorporer petit à petit l'huile et le lait puis la purée d'artichauts. Verser la moitié de la pâte dans un moule en y insérant les olives et les fonds tranchés restants, puis couvrir avec le reste de pâte. Four 45 min. Astuce : olives dénoyautées si le temps presse. (Four à 180 °C non précisé pour cette fiche → ⚠.)"]}, {"titre": "Cake à la patate douce", "source": "« Les Cakes de Sophie », p. 32, Printemps · Avril", "portions": "", "type": "Entrée", "ing": ["4 œufs", "50 g farine", "10 cl lait entier", "20 g sucre semoule", "5 patates douces", "150 g raisins", "5 cl rhum", "½ c. à café de paprika"], "etapes": ["Préchauffer le four à 200 °C (th. 6-7). Faire tremper les raisins dans de l'eau tiède avec le rhum. Faire bouillir les patates, les éplucher, les écraser en fine purée. Incorporer à la purée paprika, sucre, farine et lait. Ajouter 2 œufs entiers un par un, puis 2 jaunes. Monter les blancs en neige, les mélanger à la préparation, ajouter les raisins égouttés. Verser dans le moule beurré et placer au bain-marie dans le four 40 min. Astuce : la grille du four sur laquelle on pose le moule doit toujours être froide, pour éviter le dessèchement de la pâte."]}, {"titre": "Cake au chocolat noir fondant", "source": "« Les Cakes de Sophie », p. 36, Printemps · Avril / Pâques", "portions": "", "type": "Dessert", "ing": ["2 œufs", "1 yaourt", "150 g farine", "170 g sucre semoule", "⅓ de sachet de levure", "10 cl huile de tournesol", "200 g chocolat noir à forte teneur en cacao"], "etapes": ["Préchauffer le four à 180 °C (th. 6). Travailler au fouet œufs et sucre jusqu'à blanchiment. Ajouter le yaourt, puis farine et levure ; incorporer petit à petit l'huile (pâte lisse sans grumeaux). Faire fondre le chocolat et le verser aussitôt dans la préparation, mélanger. Verser dans un moule beurré et fariné, four 35 min. Le cake doit rester fondant à l'intérieur.", "Note : Variantes : chocolat blanc et noisettes (150 g de chocolat blanc fondu à la place du noir + 80 g de noisettes entières) ; chocolat et oranges confites (100 g d'oranges confites en petits dés parsemés dans le moule) ; chocolat et poire (2 belles poires williams bien mûres épluchées, en morceaux, ajoutées à la base chocolat)."]}, {"titre": "Cake au chèvre et à la courgette (« Les Cakes de Sophie », p. 60, Été · Juillet) — PHOTO FLOUE", "source": "Mes recettes (photos)", "portions": "", "type": "Entrée", "ing": ["3 œufs", "150 g [⚠ « 150 » flou] farine", "1 sachet de levure", "8 cl [⚠ « 8 cl » flou] huile de tournesol", "12,5 cl lait entier", "100 g gruyère râpé", "200 g chèvre en bûche", "1 belle courgette", "2 c. à soupe huile d'olive", "1 bouquet de cerfeuil", "2 pincées de sel", "2 pincées de poivre"], "etapes": ["Préchauffer le four à 180 °C (th. 6). Couper la bûche de chèvre en morceaux, réserver. Dans une poêle, huile d'olive, courgette coupée en rondelles (lavée, non épluchée), faire rissoler à feu moyen 15 min ; retirer l'huile, rondelles sur papier absorbant. Dans un saladier, fouetter œufs, farine, levure, sel, poivre ; incorporer petit à petit l'huile et le lait préalablement chauffé ; ajouter le gruyère ; incorporer les courgettes, le chèvre et le cerfeuil ciselé. Verser dans un moule non graissé, four 45 min."]}, {"titre": "Cake au citron", "source": "« Les Cakes de Sophie », p. 76, Été · Août", "portions": "", "type": "Dessert", "ing": ["3 œufs", "170 g sucre semoule", "160 g farine", "⅓ de sachet de levure", "150 g beurre demi-sel", "2 citrons"], "etapes": ["Préchauffer le four à 180 °C (th. 6). Fouetter œufs et sucre jusqu'à blanchiment, incorporer farine et levure, ajouter le beurre fondu, mélanger. Laver les citrons, lever les zestes à l'économe, les émincer dans la longueur, les plonger 5 s dans de l'eau bouillante, égoutter, plonger dans l'eau glacée, égoutter et sécher. Presser les citrons, verser le jus dans la pâte avec les zestes, remuer délicatement à la spatule. Moule beurré et fariné, four 40 min.", "Note : Variantes : aux deux citrons (remplacer l'un des citrons jaunes par un citron vert) ; au pamplemousse (même recette avec un demi-pamplemousse)."]}, {"titre": "Cake à l'ananas et au rhum", "source": "« Les Cakes de Sophie », p. 79, Été · Août", "portions": "", "type": "Dessert", "ing": ["3 œufs", "170 g sucre semoule", "160 g farine", "⅓ de sachet de levure", "150 g beurre demi-sel", "½ ananas", "2 c. à soupe de rhum"], "etapes": ["Préchauffer le four à 180 °C (th. 6). Éplucher l'ananas et le couper en morceaux, ajouter 1 c. à soupe de rhum, laisser macérer le temps de préparer la pâte. Fouetter œufs et sucre, incorporer farine et levure, ajouter le beurre fondu, mélanger. Égoutter les morceaux d'ananas, en mixer la moitié et verser la purée dans la pâte, remuer délicatement et ajouter le reste de l'ananas. Moule beurré et fariné, cuire 45 min. À la sortie du four, arroser d'1 c. à soupe de rhum."]}, {"titre": "Cake au cheddar, au jambon, à la bière et à la moutarde", "source": "« Les Cakes de Sophie », p. 82, Automne · Septembre", "portions": "", "type": "Entrée", "ing": ["3 œufs", "150 g farine", "⅓ de sachet de levure", "10 cl huile de tournesol", "12,5 cl lait entier", "100 g gruyère râpé", "150 g jambon de Paris", "50 g cheddar", "1 c. à café de moutarde forte de Dijon", "5 cl de bière blonde", "1 pincée de sel", "1 pincée de poivre"], "etapes": ["Préchauffer le four à 180 °C (th. 6). Découper le jambon et le cheddar en morceaux, ajouter moutarde, bière, sel et poivre, laisser mariner 30 min. Dans un saladier, mélanger au fouet œufs, farine et levure ; incorporer petit à petit l'huile et le lait préalablement chauffé ; ajouter le gruyère, remuer ; incorporer le mélange jambon-cheddar. Moule non graissé, four 45 min.", "Note : Variante : au jambon, au gouda et au cumin (150 g de jambon, 50 g de gouda, une pincée de cumin en grains)."]}, {"titre": "Cake au chèvre, aux noix et aux raisins", "source": "« Les Cakes de Sophie », Automne · Octobre ; numéro de page non visibl", "portions": "", "type": "Entrée", "ing": ["3 œufs", "150 g farine", "⅓ de sachet de levure", "10 cl huile de tournesol", "12,5 cl lait entier", "100 g gruyère râpé", "200 g chèvre en bûche", "50 g noix", "50 g raisins de Corinthe", "1 pincée de sel", "1 pincée de poivre"], "etapes": ["Préchauffer le four à 180 °C (th. 6). Découper le chèvre en morceaux, concasser les noix, mouiller les raisins d'eau tiède. Fouetter œufs, farine, levure, sel, poivre ; incorporer petit à petit l'huile et le lait préalablement chauffé ; ajouter le gruyère ; mettre chèvre, noix et raisins égouttés dans la pâte, mélanger. Moule non graissé, four 45 min. Astuce : farine tamisée type 55 de préférence (évite les grumeaux)."]}, {"titre": "Cake au saumon fumé", "source": "« Les Cakes de Sophie », Hiver · Décembre ; numéro de page coupé « 12…", "portions": "", "type": "Entrée", "ing": ["3 œufs", "150 g farine", "1 sachet de levure", "10 cl huile de tournesol", "12,5 cl lait entier", "100 g gruyère râpé", "200 g saumon fumé", "10 brins de ciboulette", "1 pincée de sel", "2 pincées de poivre"], "etapes": ["Préchauffer le four à 180 °C (th. 6). Fouetter œufs, farine, levure, sel, poivre ; incorporer petit à petit l'huile et le lait préalablement chauffé (bien mélanger, éviter les grumeaux) ; ajouter le gruyère. Couper le saumon en lamelles, ciseler la ciboulette, mettre dans la pâte, mélanger. Moule non graissé, four 45 min. Astuce : laisser toujours refroidir le cake avant de le démouler."]}, {"titre": "Marbré fromage et spéculoos, fruits du mendiant", "source": "livre « … Recettes bistrot » (titre exact à vérifier), photo 152", "portions": "8 à 12 pers", "type": "Dessert", "ing": ["240 g de crottins de chèvre frais", "140 g de roquefort", "200 g de mozzarella (en pain)", "15 cl de crème liquide", "2 c. à soupe d'huile d'olive", "40 g d'abricots secs", "40 g de pruneaux dénoyautés", "40 g de figues séchées", "2 sachets de thé", "150 g environ de poudre de spéculoos (voir page 6 du livre)", "poivre"], "etapes": ["Les fruits secs : porter une petite casserole d'eau à ébullition. Hors du feu, faire infuser les sachets de thé quelques minutes. Retirer les sachets puis plonger les fruits secs pour les réhydrater ; les laisser gonfler quelques minutes, puis les égoutter et les éponger.", "Le marbré : découper la mozzarella en tranches d'environ 5 mm, les éponger sur du papier absorbant.", "Dans le bol du robot, malaxer d'abord le chèvre avec un peu de crème, puis le roquefort de la même façon. Poivrer et débarrasser les préparations dans 2 poches à pâtisserie (à défaut, les étaler à la spatule).", "Graisser légèrement les parois d'un petit moule à cake avec un peu d'huile d'olive. Saupoudrer uniformément le moule de poudre de spéculoos. Tapisser les parois avec les tranches de mozzarella taillées à la dimension du moule.", "Garnir le fond d'une première couche uniforme de fromage de chèvre. Recouvrir de fruits, en alternant figues, abricots et pruneaux. Saupoudrer de spéculoos. Presser légèrement du bout des doigts, puis déposer une couche de roquefort, suivie de fruits, de spéculoos, et terminer par une couche de chèvre. Saupoudrer de spéculoos.", "Recouvrir le moule de film alimentaire et mettre au réfrigérateur pendant 3 heures au moins. Démouler la terrine sur le plat de service, saupoudrer de spéculoos.", "Note : Préparation 30 min, cuisson 5 min, repos au moins 3 h."]}, {"titre": "Carré d'agneau en croûte de spéculoos, chutney banane-curry", "source": "Mes recettes (photos)", "portions": "", "type": "Dessert", "ing": ["4 carrés d'agneau de 3 côtes (manchonnés et détalonnés par le boucher)", "3 belles c. à soupe de moutarde", "chapelure de spéculoos (⚠ « 40 g » ou « 400 g » : à vérifier, voir page 6 du livre)", "sel, poivre", "Chutney banane-curry", "500 g de banane", "jus d'¼ de citron", "2 oignons blancs + 1 gousse d'ail", "1 c. à café de cassonade", "12 g de curry en poudre", "80 g de vinaigre de cidre", "2 g de poivre blanc en poudre", "3,8 g de sel", "3 c. à soupe d'huile d'olive", "Chutney", "éplucher et émincer finement les oignons et l'ail, faire revenir à petit feu dans une casserole avec l'huile d'olive et la cassonade pour les confire légèrement", "éplucher et couper les bananes en rondelles épaisses", "verser le vinaigre et le jus de citron sur les oignons, ajouter les bananes, le curry, le sel et le poivre", "bien mélanger, cuire à feu doux sans couvrir jusqu'à ce que le mélange épaississe", "débarrasser et laisser refroidir"], "etapes": ["Préparation 30 min, cuisson 30 min, pour 4 personnes.", "Carrés : saler, poivrer, les saisir sur chaque face dans une poêle avec un peu d'huile d'olive, réserver sur papier absorbant. Préchauffer le four à 210 °C. Au pinceau, badigeonner les carrés de moutarde sur toutes leurs faces ; recouvrir et imprégner généreusement de chapelure de spéculoos avec les mains. Déposer les carrés, os bien droits, dans un plat, enfourner 10 à 12 minutes selon l'épaisseur et la cuisson désirée ; à la sortie du four, recouvrir de papier d'aluminium et laisser reposer quelques minutes ; couper entre les côtes, servir avec le chutney."]}, {"titre": "Terrine choco-café, étages de spéculoos", "source": "Mes recettes (photos)", "portions": "", "type": "Dessert", "ing": ["20 cl crème liquide", "30 cl lait", "5 jaunes d'œufs", "⚠ « 525 g » [lecture à vérifier : valeur élevée] chocolat noir", "80 g sucre", "5 cl extrait de café", "30 spéculoos environ"], "etapes": ["Préparation 20 min, cuisson 7 min, repos au moins 4 h, pour 10 à 12 personnes (1 grande terrine).", "Crème choco-café : chauffer lait et crème à feu moyen jusqu'aux premiers frémissements. Pendant ce temps battre jaunes et sucre au fouet jusqu'à blanchiment. Verser le liquide chaud sur le mélange œufs-sucre, bien dissoudre. Remettre sur feu doux en mélangeant à la spatule 2 min environ jusqu'à ce que la crème nappe la spatule (attention : la crème ne doit surtout pas bouillir). Ajouter l'extrait de café, puis verser la crème dans un saladier sur le chocolat coupé en petits morceaux. Bien mélanger pour lisser.", "Montage : tapisser uniformément le fond de la terrine de spéculoos, couler dessus une fine couche de crème au chocolat, puis spéculoos, crème, ainsi de suite jusqu'à épuisement des ingrédients. Réfrigérateur 4 h au moins. Servir directement dans la terrine ou démouler sur un plat (tremper la terrine quelques secondes dans un fond d'eau bouillante pour faciliter le démoulage). Saupoudrer de poudre de spéculoos."]}, {"titre": "Tuiles dentelles au spéculoos, nage d'agrumes", "source": "Mes recettes (photos)", "portions": "", "type": "Dessert", "ing": ["Tuiles", "110 g sucre glace", "15 g vergeoise", "1 citron", "20 g farine", "60 g poudre de spéculoos", "30 g amandes effilées", "50 g beurre", "Nage d'agrumes", "5 oranges", "3 pamplemousses roses", "1 citron vert", "1 c. à soupe de miel"], "etapes": ["Préparation 25 min, cuisson 12 min, repos 40 min, pour 6 personnes (24 tuiles environ).", "Tuiles : réunir dans un saladier farine, sucre glace et poudre de spéculoos ; mélanger au fouet avec le jus du citron puis le beurre fondu ; débarrasser et laisser reposer au réfrigérateur 30 min environ. Nage : peler à vif oranges, pamplemousses et citron, lever les suprêmes, réserver le jus ; filtrer le jus, y mélanger le miel ; répartir les suprêmes dans des verrines/petits bols, arroser de leur jus, réserver au frais. Cuisson : four à 200 °C ; petites noisettes de pâte à la petite cuillère, bien espacées, sur plaque antiadhésive ou toile siliconée ; étaler finement en rond, saupoudrer d'amandes effilées ; enfourner 6 à 7 min environ ; laisser tiédir quelques instants sur la plaque avant de décoller à la spatule et de façonner « à cheval » sur un rouleau à pâtisserie. Servir les nages bien fraîches avec les tuiles."]}, {"titre": "Crème glacée à la cannelle", "source": "p. 10", "portions": "", "type": "Dessert", "ing": ["½ litre de lait", "50 ml de crème liquide", "5 jaunes d'œufs", "125 g de sucre", "2 c. à café de cannelle. Annotations manuscrites au crayon (version de Lud) : « 33 de lait / 30 ml »", "« 3 [jaunes] »", "« 75 g [sucre] »", "« ½ [c. à café de cannelle] » (⚠ lecture partielle, au crayon : à vérifier)"], "etapes": ["Préparation 10 min, cuisson 10-15 min, réfrigération 30 min, prise en glace ≈ 40 min. Niveau facile.", "Dans une casserole, verser lait, crème et cannelle, porter à ébullition, retirer du feu. Dans un saladier, blanchir jaunes et sucre au batteur ou au fouet ; ajouter progressivement le mélange lait-crème à la cannelle en fouettant bien ; verser dans la casserole ; remuer constamment à feu doux avec une cuillère en bois 5 à 10 min jusqu'à ce que la mousse ait disparu et que le mélange nappe la cuillère (ne pas faire bouillir). Passer au chinois, refroidir 30 min au réfrigérateur. Turbiner dans une sorbetière selon les instructions. Conseil : accompagnement idéal d'une tarte aux pommes."]}, {"titre": "Crème glacée à la lavande", "source": "livre de glaces, p. 12 ; prép. 10 min, cuisson 10-15 min, infusion 15 min, réfrigération 30 min, prise ≈ 40 min", "portions": "", "type": "Dessert", "ing": ["½ litre de lait", "50 ml de crème liquide", "5 jaunes d'œufs", "125 g de sucre", "1 c. à café de fleurs de lavande séchées"], "etapes": ["Verser lait, crème et lavande dans une casserole, porter à ébullition, ôter du feu, infuser 15 min, passer au chinois.", "Blanchir jaunes et sucre au fouet, ajouter le mélange lait-crème en fouettant, remettre dans la casserole, remuer à feu doux 5-10 min.", "Passer au chinois, refroidir 30 min au frigo, turbiner."]}, {"titre": "Crème glacée au caramel au beurre salé", "source": "livre de glaces ; prép. 15 min, cuisson 10-15 min, réfrigération 30 min, prise ≈ 40 min", "portions": "", "type": "Dessert", "ing": ["½ litre de lait", "50 ml de crème liquide", "5 jaunes d'œufs", "150 g de sucre (dont 80 g pour le caramel)", "60 g de beurre salé en petits morceaux"], "etapes": ["Porter lait et crème à ébullition, ôter du feu.", "Caramel brun dans une petite poêle avec 80 g de sucre, ajouter le beurre, mélanger ; ajouter le mélange lait-crème, mélanger.", "Blanchir jaunes et reste du sucre ; ajouter le mélange lait-crème au caramel, verser dans la casserole, remuer à feu doux 5-10 min.", "Passer au chinois, refroidir 30 min au frigo, turbiner.", "Note : Annotations manuscrites : « 75 », « 75 », « 225 » (sucre), « 90 » (beurre), « 120 g » : attribution incertaine (photo de côté), à vérifier."]}, {"titre": "Crème glacée à la verveine", "source": "p. 16", "portions": "", "type": "Dessert", "ing": ["½ litre de lait", "50 ml de crème liquide", "5 jaunes d'œufs", "125 g de sucre", "10 g de feuilles de verveine séchées"], "etapes": ["Préparation 10 min, cuisson 10-15 min, infusion 15 min, réfrigération 30 min, prise ≈ 40 min.", "verser lait et crème, porter à ébullition, retirer du feu, ajouter les feuilles de verveine, laisser infuser 15 min. Blanchir jaunes et sucre au fouet, ajouter progressivement le mélange lait-crème (feuilles ôtées) ; verser dans la casserole, remuer à feu doux 5 à 10 min jusqu'à ce que la mousse disparaisse et que le mélange nappe la cuillère (ne pas faire bouillir) ; passer au chinois, laisser refroidir 30 min ; turbiner. Variante : remplacer la verveine par la même quantité de tilleul."]}, {"titre": "Glace au yaourt", "source": "livre de glaces, p. 18 ; prép. 5 min, prise ≈ 40 min", "portions": "6 pers", "type": "Dessert", "ing": ["5 yaourts brassés nature", "25 cl de crème fraîche", "150 g de sucre en poudre"], "etapes": ["Mélanger yaourts, crème et sucre au fouet jusqu'à dissolution du sucre ; turbiner.", "Note : Conseil : même onctuosité qu'une crème glacée, vraiment moins calorique."]}, {"titre": "Crème glacée au lemon curd", "source": "livre de glaces ; prép. 15 min, cuisson 15-20 min, réfrigération 30 min, prise ≈ 40 min", "portions": "", "type": "Dessert", "ing": ["½ litre de lait", "50 ml de crème liquide", "5 jaunes d'œufs", "125 g de sucre", "Lemon curd : 100 g de sucre en poudre", "3 jaunes d'œufs", "zeste et jus de 3 citrons", "80 g de beurre"], "etapes": ["Lemon curd : blanchir œufs et sucre, ajouter beurre, zestes et jus, cuire au bain-marie 8-10 min en remuant, refroidir.", "Glace : porter lait et crème à ébullition ; blanchir jaunes et sucre ; incorporer le lait-crème ; remuer à feu doux 5-10 min ; passer au chinois, refroidir.", "Incorporer le lemon curd, turbiner."]}, {"titre": "Crème glacée à la réglisse", "source": "Mes recettes (photos)", "portions": "", "type": "Dessert", "ing": ["½ litre de lait", "50 ml de crème liquide", "5 jaunes d'œufs", "80 g de sucre", "4 bâtons de réglisse"], "etapes": ["Préparation 10 min, cuisson 10-15 min, infusion 15 min, réfrigération 30 min, prise ≈ 40 min.", "verser lait, crème et réglisse, porter à ébullition, retirer du feu, laisser infuser 15 min. Blanchir jaunes et sucre au batteur ; ajouter progressivement le mélange lait-crème ; verser dans la casserole, remuer à feu doux 5 à 10 min jusqu'à ce que la mousse ait disparu et que le mélange nappe la cuillère (ne pas faire bouillir) ; passer au chinois, refroidir 30 min au réfrigérateur ; turbiner. Conseil : ajuster le nombre de bâtons de réglisse selon le goût."]}, {"titre": "Crème glacée à la fraise Tagada", "source": "p. 22", "portions": "6 pers", "type": "Dessert", "ing": ["Matériel", "sorbetière", "½ litre de lait", "50 ml de crème liquide", "5 jaunes d'œufs", "70 g de sucre", "200 g de fraises Tagada"], "etapes": ["dans une casserole, verser lait, crème et 100 g de fraises Tagada, porter à ébullition en remuant régulièrement pour faire fondre toutes les fraises, puis retirer du feu. Dans un saladier, blanchir jaunes et sucre au batteur ou au fouet ; ajouter progressivement le mélange lait-crème à la fraise Tagada ; verser dans la casserole ; remuer à feu doux 5 à 10 min jusqu'à ce que la mousse ait disparu et que le mélange nappe la cuillère (un doigt passé dessus doit laisser une marque ; ne pas faire bouillir) ; passer au chinois, refroidir 30 min au réfrigérateur. Couper le reste des fraises Tagada en petits morceaux et les incorporer à la préparation ; turbiner. Variante : remplacer les fraises Tagada par des bananes en bonbons."]}, {"titre": "Crème glacée aux spéculoos", "source": "Mes recettes (photos)", "portions": "6 pers", "type": "Dessert", "ing": ["½ litre de lait", "50 ml de crème liquide", "5 jaunes d'œufs", "125 g de sucre", "200 g de chocolat", "150 g de spéculoos"], "etapes": ["verser lait, crème et chocolat en morceaux dans une casserole, porter à ébullition, retirer du feu, mélanger jusqu'à fonte complète du chocolat. Blanchir jaunes et sucre ; ajouter progressivement le mélange lait-crème au chocolat ; verser dans la casserole, remuer à feu doux 5 à 10 min jusqu'à ce que la mousse ait disparu et que le mélange nappe la cuillère (ne pas faire bouillir) ; passer au chinois, refroidir 30 min au réfrigérateur ; turbiner. Couper les spéculoos en petits morceaux et les ajouter à la crème glacée 5 min avant la fin de la prise en glace. Variante : remplacer les spéculoos par la même quantité d'Oreo®."]}, {"titre": "Sorbet au pamplemousse", "source": "p. 32, chapitre « Les sorbets »", "portions": "6 pers", "type": "Dessert", "ing": ["Matériel", "sorbetière", "5 pamplemousses (environ 700 ml de jus)", "150 g de sucre", "le jus de 1 citron"], "etapes": ["à l'aide d'un couteau bien aiguisé, couper les pamplemousses en deux et les presser, recueillir le jus dans un bol. Dans un grand saladier, verser le sucre, le jus de pamplemousse ainsi obtenu et le jus de citron ; à l'aide d'un fouet, mélanger jusqu'à dissolution complète du sucre. Turbiner 40 min selon les instructions du constructeur. Conseil : pamplemousses roses (plus doux que les jaunes, plus jolie couleur)."]}, {"titre": "Sorbet à la pastèque", "source": "livre de glaces, p. 36 ; prép. 10 min, prise ≈ 40 min", "portions": "6 pers", "type": "Dessert", "ing": ["½ pastèque", "180 g de sucre", "le jus de 1 citron", "Matériel : sorbetière, mixeur"], "etapes": ["Ôter l'écorce et épépiner la pastèque ; mixer finement la chair avec le sucre et le jus de citron.", "Turbiner 40 min selon les instructions.", "Note : Variante : melon charentais bien mûr."]}, {"titre": "Sorbet à la framboise", "source": "livre de glaces ; prép. 10 min, cuisson 5 min, réfrigération 30 min, prise ≈ 40 min", "portions": "6 pers", "type": "Dessert", "ing": ["1 kg de framboises", "200 g de sucre", "le jus de 1 citron"], "etapes": ["Chauffer à feu doux framboises et sucre jusqu'à ce que les fruits libèrent leur jus et le sucre soit dissous.", "Passer au chinois (graines), ajouter le jus de citron, refroidir 30 min au réfrigérateur ; turbiner.", "Note : Variante : mûres."]}, {"titre": "Sorbet Margarita", "source": "p. 42", "portions": "6 pers", "type": "Dessert", "ing": ["500 ml de crème fraîche", "120 ml de jus de citron vert", "30 ml de tequila", "40 ml de Cointreau", "150 g de sucre glace"], "etapes": ["dans un saladier, mélanger tequila, Cointreau, jus de citron vert et sucre glace jusqu'à dissolution complète ; incorporer la crème fraîche ; turbiner dans une sorbetière. Conseil : déposer une boule dans chaque verre avec une petite paille pour déguster la glace qui commence à fondre."]}, {"titre": "Sorbet à la rhubarbe", "source": "p. 44", "portions": "6 pers", "type": "Dessert", "ing": ["Matériel", "sorbetière, mixeur", "600 g de tiges de rhubarbe", "200 g de sucre", "le jus de 1 citron"], "etapes": ["éplucher la rhubarbe, la couper en petits tronçons ; les mettre dans une casserole avec le jus de citron, recouvrir de sucre ; chauffer à feu doux ≈ 15 min en remuant à la cuillère en bois jusqu'à obtention d'une compote ; passer au mixeur et laisser refroidir 30 min au réfrigérateur ; turbiner. Conseil : choisir de la rhubarbe bien rose pour une jolie couleur."]}, {"titre": "Sorbet au thym", "source": "p. 48", "portions": "6 pers", "type": "Dessert", "ing": ["300 g de sucre", "30 g de thym frais", "le jus de 1 citron", "750 ml d'eau"], "etapes": ["verser 750 ml d'eau dans une casserole, porter à ébullition ; retirer du feu, ajouter sucre, thym et jus de citron, remuer quelques instants à la cuillère en bois, couvrir, infuser 15 min environ ; ôter soigneusement les branches de thym, laisser refroidir 30 min au réfrigérateur ; turbiner. Conseil : idéal dégusté avec un fromage de chèvre."]}, {"titre": "Sorbet à l'avocat", "source": "livre de glaces, p. 50 ; prép. 5 min, prise ≈ 40 min", "portions": "6 pers", "type": "Dessert", "ing": ["4 avocats bien mûrs", "4 citrons verts", "80 g de sucre glace", "100 ml d'eau"], "etapes": ["Presser les citrons verts ; ôter noyaux et prélever la chair des avocats.", "Mixer avec le sucre, le jus des citrons verts et 100 ml d'eau ; turbiner.", "Note : Conseil : en tapas, avec des tacos."]}, {"titre": "Sorbet cosmopolitan", "source": "livre de glaces ; prép. 5 min, cuisson 5 min, réfrigération 20 min, prise ≈ 40 min", "portions": "6 pers", "type": "Dessert", "ing": ["300 ml de jus d'airelles", "200 ml de jus de pamplemousse", "100 ml de vodka", "150 g de sucre", "150 ml d'eau"], "etapes": ["Faire fondre le sucre dans 150 ml d'eau, réduire 5 min à feu doux, laisser refroidir.", "Mélanger jus de pamplemousse, jus d'airelles, vodka et sirop ; réfrigérer 20 min ; turbiner.", "Note : Conseil : réserver un peu de jus d'airelles, le verser dans 6 verres et déposer une boule de sorbet. Contient de l'alcool (vodka)."]}, {"titre": "Granité aux fraises et au vinaigre balsamique", "source": "livre de glaces, p. 62 (« Sans machine ») ; prép. 10 min, cuisson 3 min, prise 3 h 30", "portions": "6 pers", "type": "Dessert", "ing": ["400 g de fraises", "200 g de sucre en poudre", "50 ml de vinaigre balsamique", "200 ml d'eau", "Matériel : mixeur"], "etapes": ["Couper les fraises, les macérer avec le vinaigre 30 min.", "Faire fondre le sucre dans 200 ml d'eau à feu doux, laisser refroidir 30 min.", "Mixer fraises, vinaigre et sirop. Verser dans un bac à glace, congélateur 2 h.", "Gratter à la fourchette pour obtenir des cristaux ; répéter toutes les 30 min."]}, {"titre": "Panettone glacé", "source": "livre de glaces ; prép. 15 min, décongélation 15 min, prise 2 h", "portions": "6 pers", "type": "Dessert", "ing": ["1 panettone", "½ litre de glace au chocolat", "½ litre de glace à la vanille", "1 c. à café de cannelle", "2 c. à soupe de sucre glace", "Matériel : mixeur"], "etapes": ["Laisser ramollir les glaces 15 min à température ambiante.", "Retourner le panettone ; avec un long couteau, couper une tranche horizontalement (lame à 2 cm du bord, en faisant le tour sans perforer le haut), vider-le, mixer la moitié des miettes avec la cannelle.", "Remplir de glace à la vanille, verser les brisures à la cannelle, renouveler avec la glace au chocolat ; reposer le panettone sur sa base, envelopper de film, congélateur 2 h ; saupoudrer de sucre glace.", "Note : ⚠ Photo de côté : ordre des étapes à vérifier."]}, {"titre": "Granité de tomates au basilic", "source": "p. 64, « Sans machine »", "portions": "6 pers", "type": "Dessert", "ing": ["Matériel", "mixeur", "6 grosses tomates", "200 ml de jus de tomates", "1 bouquet de basilic", "2 c. à café de sucre"], "etapes": ["dans une casserole, faire fondre le sucre dans le jus de tomates à feu doux ; au bout de 3-4 min, ôter du feu et laisser refroidir 30 min. Faire bouillir un grand volume d'eau ; ôter la queue des tomates, inciser la peau à la base de chaque tomate en croix ; plonger 1 min dans l'eau bouillante, égoutter, peler ; couper en quartiers, retirer les pépins. Mixer la chair des tomates avec les feuilles de basilic et le jus de tomates sucré jusqu'à un purée très fine ; verser dans un bac à glace, congeler 2 h, jusqu'à ce que les bords commencent à givrer ; avec une fourchette, gratter le dessus pour obtenir des cristaux de glace ; répéter 3 fois, toutes les 30 min. Si préparé à l'avance, gratter à la fourchette une dernière fois avant de servir. Conseil : déguster avec quelques belles tranches de mozzarella de bufflonne."]}, {"titre": "Glace aux brisures de marrons glacés et chocolat chaud", "source": "p. 121", "portions": "6 pers", "type": "Dessert", "ing": ["Matériel", "sorbetière", "Glace", "6 jaunes d'œufs", "35 cl de lait frais entier", "15 cl de crème fleurette", "2 gousses de vanille", "115 g de sucre", "100 g de brisures de marrons glacés", "Chocolat chaud", "100 g de chocolat noir à 64 % de cacao minimum", "10 cl de lait frais entier", "10 cl de crème fraîche liquide"], "etapes": ["La veille, ouvrir les gousses de vanille dans le sens de la longueur, gratter l'intérieur ; mélanger graines et gousses avec le lait, la crème, la moitié du sucre ; porter à ébullition ; hors du feu, laisser infuser 30 min.", "À l'aide d'un fouet, travailler les jaunes d'œufs avec le reste de sucre jusqu'à blanchiment ; filtrer le lait, le verser sur les œufs ; reverser le tout dans une casserole, remettre sur le feu ; cuire sans cesser de remuer jusqu'à ce que la crème « nappe » la spatule (un doigt passé laisse une marque) sans bouillir ; verser immédiatement dans un saladier froid pour arrêter la cuisson ; laisser reposer une nuit au réfrigérateur.", "Le jour même, turbiner dans une sorbetière ; quand la glace est prise, ajouter les brisures de marrons glacés (en garder un peu pour la décoration).", "Chocolat chaud : dans une casserole, porter à ébullition le lait et la crème, ajouter le chocolat, mélanger.", "Dans de petites assiettes/tasses, mettre 1-2 boules de glace, entourer de chocolat chaud, saupoudrer de brisures de marrons.", "Note : Variantes : avec des pralines roses ou toutes autres confiseries (amandes, noisettes, noix de pécan…)."]}, {"titre": "Glace à la framboise, citron vert et gingembre", "source": "p. 181", "portions": "6 pers", "type": "Dessert", "ing": ["Matériel", "sorbetière, tamis", "Glace", "250 g de framboises", "25 cl de lait frais entier", "100 g de sucre", "1 c. à soupe d'eau-de-vie de framboise", "Pour le jus", "3 citrons verts", "2 cm de gingembre frais", "1 c. à soupe de miel"], "etapes": ["La veille, mixer les framboises, les passer au tamis. Dans une casserole, faire bouillir le lait avec le sucre, puis verser sur la purée de framboises ; ajouter l'eau-de-vie, laisser reposer une nuit au frais.", "Le jour même, faire prendre dans une sorbetière.", "Presser les citrons verts ; éplucher et râper le gingembre ; au micro-ondes, faire chauffer le miel pour qu'il soit liquide, ajouter le jus de citron et 1 c. à café de gingembre.", "Dans des coupes à champagne ou de jolis verres, mettre une boule de glace à la framboise, répartir le jus de citron au gingembre dessus. Conseil : ajouter un peu de chantilly à la vanille."]}, {"titre": "La fraise dans tous ses états", "source": "p. 161", "portions": "6 pers", "type": "Dessert", "ing": ["Matériel", "sorbetière, mixeur, tamis, batteur, 6 verrines"], "etapes": ["Glace : 500 g de fraises mara des bois ; 40 cl de lait entier ; 10 cl de crème fleurette ; 250 g de sucre de canne blanc. Coulis et chantilly : 250 g de fraises ; 10 cl de crème fraîche liquide ; 1 c. à soupe d'amandes effilées grillées (pour servir) ; 1 c. à soupe de sucre de canne blanc ; 1 c. à café de sucre glace.", "La veille, préparer la glace : porter à ébullition le lait, la crème et le sucre ; laisser refroidir ; laver et équeuter les fraises mara des bois, les réduire en purée au mixeur ; passer au tamis ; mélanger la purée au lait et fouetter afin de lier le tout ; quand le mélange est bien froid, réserver une nuit au réfrigérateur.", "Le jour même, faire prendre dans une sorbetière.", "Coulis : mixer les fraises, passer la purée au travers du tamis, diviser en deux ; mettre-en une moitié avec le sucre de canne dans une casserole, porter à ébullition, laisser refroidir, répartir dans le fond des verrines. À l'aide d'un batteur, mélanger la crème fraîche et le sucre glace, puis monter en chantilly ; verser alors la purée de fraises restante, mélanger un peu pour obtenir une chantilly striée de rouge.", "Dans chaque verrine, placer une boule de glace à la fraise ; couvrir de chantilly, saupoudrer d'amandes effilées avant de servir.", "Note : Variantes : peut s'adapter à d'autres fruits rouges (mûres, framboises) en augmentant légèrement la quantité de sucre pour les fruits plus acides."]}, {"titre": "Glace au café à l'irlandaise", "source": "p. 221", "portions": "6 pers", "type": "Dessert", "ing": ["Matériel", "sorbetière, batteur, 6 grandes tasses à café"], "etapes": ["Glace : 6 jaunes d'œufs ; 35 cl de lait entier ; 15 cl de crème fleurette ; 2 c. à café de café soluble (ou mieux, 2 expressos) ; 120 g de sucre de canne blanc. Chantilly et finition : 15 cl de crème fraîche liquide entière ; 20 cl de whisky ; 1 c. à soupe de cacao amer ; 2 c. à soupe de cassonade ; 1 c. à café de sucre glace [⚠ lecture des quantités de whisky/cassonade à vérifier].", "La veille, préparer la glace au café : verser le lait, la crème et la moitié du sucre dans une casserole, porter à ébullition. À l'aide d'un fouet, travailler les jaunes d'œufs avec le reste de sucre jusqu'à ce que le mélange blanchisse ; filtrer le lait, verser sur les œufs, reverser le tout dans une casserole et remettre sur le feu ; faire cuire sans cesser de remuer jusqu'à ce que la crème « nappe » la spatule (un doigt passé laisse une marque) ; verser dans un saladier froid pour arrêter la cuisson ; ajouter le café et fouetter ; laisser reposer une nuit au réfrigérateur.", "Le jour même, faire prendre la glace dans une sorbetière.", "À l'aide d'un batteur, monter en chantilly la crème fraîche avec le sucre glace ; quand la crème est bien épaisse, ajouter le cacao et garder au frais.", "Juste avant de servir, faire tiédir dans une casserole le whisky avec la cassonade (il ne doit surtout pas bouillir).", "Dans les tasses, répartir 6 boules de glace, arroser de whisky chaud et couvrir de chantilly au cacao.", "Note : Variantes : aussi bon avec de la glace au chocolat ou à la vanille ; whisky remplaçable par du rhum, de la vieille prune ou du cognac."]}, {"titre": "Sorbet à la pêche blanche", "source": "p. 321, « Les sorbets incontournables »", "portions": "6 pers", "type": "Dessert", "ing": ["Matériel", "sorbetière, mixeur, tamis, 6 petites assiettes à soupe"], "etapes": ["Pour les dés : 3 pêches jaunes ; 15 cl de vin blanc sec. Sorbet : 800 g de pêches blanches (environ 4) ; ½ citron jaune ; 15 cl d'eau ; 150 g de sucre.", "La veille, préparer le sorbet : ébouillanter les pêches blanches 30 s puis passer sous l'eau froide ; les éplucher et dénoyauter ; mixer la chair et passer la purée au travers d'un tamis. Dans une casserole, porter à ébullition l'eau et le sucre ; ajouter la purée de fruit et le jus du demi-citron ; laisser reposer une nuit.", "Le jour même, faire prendre dans une sorbetière.", "Ébouillanter les pêches jaunes 30 s puis passer sous l'eau froide ; éplucher et dénoyauter ; couper la chair en petits dés.", "Dans les assiettes, répartir les dés de pêches, arroser de vin blanc, puis poser au milieu de chaque assiette une boule de sorbet pêche blanche.", "Note : Conseil : présenter le sorbet dans de jolis bols. Variantes : remplacer le vin par du calvados et ajouter des pêches jaunes ou des pêches de vigne pour une salade de fruits."]}, {"titre": "Sorbet meringué au champagne rosé", "source": "Mes recettes (photos)", "portions": "8 pers", "type": "Dessert", "ing": ["Matériel", "sorbetière, batteur, thermomètre de cuisine (si possible)"], "etapes": ["Sorbet : 50 cl de champagne rosé ; 1 gousse de vanille ; ½ citron ; 250 g de sucre de canne blanc ; 25 cl d'eau minérale. Meringue italienne : 1 blanc d'œuf ; 40 g de sucre ; 2 c. à soupe d'eau.", "Ouvrir la gousse de vanille dans le sens de la longueur, gratter l'intérieur ; mélanger graines et gousse avec le jus du demi-citron, le sucre et l'eau. Porter à ébullition, laisser infuser 30 min, refroidir puis filtrer ; verser alors le champagne.", "Meringue : monter le blanc en neige assez ferme. Dans une casserole, mélanger le sucre et l'eau, cuire pour obtenir un caramel blanc (aux environs de 130 °C) ; tout en fouettant le blanc, verser dessus le caramel blanc, puis continuer de battre jusqu'à ce que le blanc soit à température ambiante ; incorporer alors délicatement cette meringue au sirop.", "Faire prendre dans une sorbetière.", "Servir dans de belles coupes à champagne.", "Note : Conseils : à servir avec des biscuits roses de Reims ; le champagne s'intègre mal au sorbet : fouetter toutes les heures le sorbet pendant qu'il est au congélateur jusqu'à ce qu'il s'homogénéise. Variante : champagne classique."]}, {"titre": "Sorbet citron vert en caïpirinha", "source": "p. 48", "portions": "6 pers", "type": "Dessert", "ing": ["Matériel", "sorbetière, couteau zesteur, 6 verres à cocktail", "16 cl de rhum blanc ou de cachaça", "8 cl de sirop de sucre de canne. Sorbet : 4 citrons verts (20 cl de jus)", "250 g de sucre", "37,5 cl d'eau"], "etapes": ["La veille : prélever le zeste de 2 citrons et presser la totalité. Mélanger le sucre et l'eau, porter à ébullition, ajouter le jus de citron, laisser bouillir 5 à 10 min ; éteindre le feu, ajouter les zestes, laisser infuser une nuit.", "Le jour même, filtrer le jus, le faire prendre dans une sorbetière.", "Dans un grand bol, mélanger le rhum et le sirop de sucre.", "Répartir le sorbet dans les verres, arroser de rhum sucré, servir aussitôt. Conseil : décorer avec des rondelles fraîches de citron vert et feuilles de menthe."]}, {"titre": "Glace au thym, cuillerées de piperade et amandes grillées (⚠ page non lue)", "source": "Mes recettes (photos)", "portions": "6 pers", "type": "Dessert", "ing": ["Matériel", "sorbetière, 6 jolies cuillères de service"], "etapes": ["Piperade : 1 tomate ; 1 poivron rouge ; 1 petit oignon ; 1 c. à soupe d'amandes effilées grillées ; 1 c. à soupe d'huile d'olive ; 1 pincée de piment d'Espelette ; fleur de sel, poivre du moulin. Glace : 6 jaunes d'œufs ; 35 cl de lait frais entier ; 15 cl de crème fleurette ; 115 g de sucre ; 2 branches de thym frais.", "Dans une casserole, verser lait, crème, la moitié du sucre, porter à ébullition ; hors du feu, ajouter le thym, laisser infuser 15 min (le goût du thym doit être prononcé ; sinon laisser infuser plus longtemps).", "À l'aide d'un fouet, travailler les jaunes avec le reste du sucre jusqu'à blanchiment ; filtrer le lait, verser sur les œufs, reverser dans une casserole, remettre sur le feu ; cuire sans cesser de remuer jusqu'à ce que la crème « nappe » une cuillère en bois ; verser dans un saladier froid pour arrêter la cuisson ; laisser reposer une nuit au réfrigérateur.", "Le jour même, faire prendre dans une sorbetière.", "Plonger la tomate 30 s dans l'eau bouillante, l'éplucher puis la couper en quatre, retirer les graines (ne garder que la chair). Ouvrir le poivron en deux, retirer les graines et les membranes blanches. Hacher le poivron, la tomate et l'oignon. Dans une poêle, faire chauffer l'huile d'olive ; verser l'oignon et le poivron et faire revenir 5 à 10 min sans cesser de remuer. Ajouter la tomate et laisser cuire, à couvert et à feu moyen, 5 min. Assaisonner de piment, de poivre et de sel. Laisser cuire à découvert 5 min de plus.", "Répartir la purée obtenue dans les cuillères. Ajouter une petite boule de glace, parsemer d'amandes grillées et servir aussitôt."]}, {"titre": "Glace au romarin et fromage de chèvre chaud", "source": "Mes recettes (photos)", "portions": "6 pers", "type": "Dessert", "ing": ["Matériel", "sorbetière"], "etapes": ["Garniture : 6 tranches de pain de campagne ; 6 fromages de chèvre (cabécou) ; 150 g de mesclun ; 2 c. à soupe d'huile d'olive ; 2 c. à soupe de vinaigre balsamique ; sel et poivre. Glace : 6 jaunes d'œufs ; 35 cl de lait frais entier ; 15 cl de crème fleurette ; 60 g de miel ; 60 g de sucre ; 2 branches de romarin frais.", "Dans une casserole, verser lait, crème, le miel et porter à ébullition. Hors du feu, ajouter le romarin et laisser infuser pendant 15 min ; si le goût du romarin n'est pas assez prononcé, laisser infuser plus longtemps.", "À l'aide d'un fouet, travailler les jaunes avec le sucre jusqu'à blanchiment ; filtrer le lait, le verser sur les œufs ; reverser dans une casserole, cuire sans cesser de remuer jusqu'à ce que la crème « nappe » une cuillère en bois ; verser immédiatement dans un saladier froid pour arrêter la cuisson ; laisser reposer une nuit au réfrigérateur.", "Le jour même, faire prendre le mélange dans une sorbetière.", "Mettre les fromages sur le pain et faire dorer sous le grill du four.", "Dans 6 assiettes, répartir le mesclun : mélanger l'huile et le vinaigre, le sel et le poivre, assaisonner la salade de vinaigrette, puis poser au centre de chaque assiette une tartine de chèvre chaud. Terminer en déposant une boule de glace au romarin."]}, {"titre": "Glace au potimarron, petit-suisse, pistaches grillées et sirop d'érable", "source": "p. 60", "portions": "6 pers", "type": "Dessert", "ing": ["Matériel", "sorbetière", "mixeur ou moulin à légumes muni d'une grille fine", "1 petit potimarron de 800 g", "10 cl de crème fraîche liquide", "6 petits-suisses", "6 c. à café de sirop d'érable", "3 c. à soupe de pistaches nature", "1 gousse de vanille", "100 g de cassonade", "1 c. à soupe de sucre glace", "sel"], "etapes": ["La veille, préparer la purée de potimarron : ôter l'écorce du potimarron et retirer les graines ; couper la chair en morceaux, les mettre dans une casserole avec une pincée de sel et un grand verre d'eau ; porter à ébullition, laisser cuire 10 à 15 min (le potimarron doit s'écraser à la fourchette sans résistance). Égoutter, passer au mixeur ou au moulin à légumes. Couper la gousse de vanille en deux, retirer les graines ; mélanger les graines au potimarron, ajouter la cassonade ; la purée doit être un peu liquide. Laisser reposer une nuit au réfrigérateur.", "Le jour même, monter la crème fraîche en chantilly avec le sucre glace ; quand elle est bien épaisse, mélanger-la à la purée de potimarron et laisser le mélange prendre dans une sorbetière.", "Dans une poêle, faire griller sans cesser de surveiller les pistaches ; dès qu'elles commencent à colorer, les retirer du feu et verser dans un grand plat froid.", "Sur des petites assiettes, démouler les petits-suisses ; poser au-dessus une petite boule de glace au potimarron, entourer de sirop d'érable et saupoudrer de pistaches grillées.", "Note : Variantes : présenter en verrine ; pistaches remplaçables par des amandes effilées ou des noisettes grillées."]}, {"titre": "Glace à la moutarde et gaspacho", "source": "p. 74, « Les glaces et sorbets originaux »", "portions": "6 pers", "type": "Dessert", "ing": ["Matériel", "sorbetière, mixeur"], "etapes": ["Gaspacho : 1 petite tranche de pain rassis ; 3 tomates cœur-de-bœuf ; 1 oignon nouveau ; ¼ de concombre ; 1 c. à soupe de vinaigre de Xérès ; 6 c. à soupe d'huile d'olive ; sel, poivre. Glace : 25 cl de lait frais ; 10 cl de crème fraîche liquide ; 1 c. à soupe de sucre ; 50 g de moutarde à l'ancienne ; sel, poivre.", "La veille, préparer la glace : dans une casserole, porter à ébullition le lait et la crème ; saler, poivrer, puis ajouter le sucre ; laisser reposer une nuit au réfrigérateur.", "Le jour même, ajouter la moutarde au mélange ; faire prendre dans une sorbetière puis garder au frais.", "Gaspacho : ébouillanter les tomates 30 s ; les éplucher et les couper en gros morceaux ; éplucher et couper en morceaux l'oignon et le concombre ; mixer tous les ingrédients du gaspacho pendant 3 à 4 min pour obtenir une soupe homogène et fine.", "Verser le gaspacho dans des bols ou des assiettes à soupe, poser au centre une boule de glace à la moutarde et servir aussitôt.", "Note : Conseil : ajouter dans le gaspacho une pointe de safran en poudre."]}, {"titre": "Sorbet pamplemousse, avocat et crabe", "source": "p. 78", "portions": "6 pers", "type": "Dessert", "ing": ["Matériel", "sorbetière, mixeur, tamis, 6 jolis verres"], "etapes": ["Garniture : 1 boîte de miettes de crabe ; ½ pamplemousse (pomelo) ; ½ avocat mûr ; 5 cl de crème fraîche liquide ; sel, poivre. Sorbet : 75 cl de jus de pamplemousse rose (environ 1,2 kg de pomelos) ; 1 citron ; 150 g de sucre.", "Sorbet : presser les pomelos et le citron puis verser le sucre ; s'assurer qu'il soit complètement dissous avant de passer le jus au travers d'un tamis ; passer à la sorbetière.", "Égoutter le crabe ; presser le demi-pamplemousse et mettre le jus dans un bol avec l'avocat, la crème fraîche, du sel et du poivre ; mixer le tout pour obtenir une sauce verte bien homogène.", "Dans les verres, disposer une couche de sauce à l'avocat, poser ensuite une boule de sorbet pamplemousse et saupoudrer de miettes de crabe.", "Note : Conseil : entrée originale et très fraîche ; pour en faire un dessert, ajouter 100 g de sucre en plus."]}, {"titre": "Sorbet orange, magret de canard fumé et huile de noix", "source": "p. 80", "portions": "6 pers", "type": "Dessert", "ing": ["Matériel", "sorbetière, tamis, 6 petites assiettes"], "etapes": ["Garniture : 1 magret de canard fumé tranché ; 6 c. à café d'huile de noix ; poivre du moulin. Sorbet : 75 cl de jus d'orange (environ 1 kg d'oranges) ; 1 citron ; 250 g de sucre.", "Presser les oranges et le citron puis verser le sucre dans le jus ; s'assurer que le sucre soit complètement dissous avant de passer le jus au travers d'un tamis.", "Faire prendre dans une sorbetière.", "Sur les assiettes, répartir en rosace les tranches de magret de canard, poivrer légèrement, poser au centre une petite boule de sorbet à l'orange ; arroser d'huile de noix et servir.", "Note : Conseil : entrée étonnante mais délicieuse. Variante : ajouter des segments d'orange (éplucher 2 oranges en retirant la peau et la membrane blanche, séparer les segments)."]}, {"titre": "Sorbet de fraises et tomates, concentré de balsamique, yaourt à l'huile d'olive", "source": "p. 82", "portions": "6 pers", "type": "Dessert", "ing": ["Matériel", "sorbetière, mixeur, moulin à légumes muni d'une grille fine", "1 yaourt à la grecque", "2 c. à soupe d'huile d'olive", "25 cl de vinaigre balsamique. Sorbet : 500 g de tomates", "150 g de fraises", "40 g de sucre"], "etapes": ["La veille, préparer le sorbet : ébouillanter les tomates 1 min, puis passer-les sous l'eau froide et ôter la peau. Nettoyer et équeuter les fraises, mixer les fraises et les tomates et le sucre puis passer le tout au moulin à légumes. Laisser reposer une nuit au réfrigérateur.", "Le jour même, faire prendre le mélange dans une sorbetière.", "Mélanger le yaourt et l'huile d'olive. Verser le vinaigre dans une casserole et faire réduire aux trois quarts pour obtenir un mélange sirupeux.", "Au centre de 6 assiettes, disposer une boule de sorbet, entourer d'un trait de yaourt, puis verser quelques gouttes de vinaigre sur le yaourt ; servir.", "Note : Conseil : tomates bien mûres et bien rouges. Variante : saupoudrer de quelques pignons de pin grillés."]}, {"titre": "Sorbet à la fraise au poivre long", "source": "p. 86", "portions": "6 pers", "type": "Dessert", "ing": ["Matériel", "sorbetière, mixeur, tamis, plaque à pâtisserie, papier sulfurisé, 6 verrines"], "etapes": ["Sorbet : 600 g de fraises ; ½ citron vert ; ¼ de gousse de poivre long ; 100 g de sucre ; 15 cl d'eau minérale. Crumble : 50 g de cassonade ; 50 g de beurre demi-sel ; 50 g d'amandes effilées ; 50 g de farine.", "La veille, préparer le sorbet : laver et équeuter les fraises, les mixer 3 à 4 min, passer la purée au tamis. Dans une casserole, porter à ébullition l'eau, le jus du demi-citron et le sucre. Ajouter la purée de fraises et laisser reposer une nuit au réfrigérateur.", "Le jour même, préchauffer le four à 190 °C (th. 6-7). Râper finement le quart de la gousse de poivre, l'ajouter à la purée puis faire prendre dans une sorbetière.", "Crumble : mélanger les ingrédients dans un saladier pour obtenir une pâte sableuse et homogène. Sur une plaque garnie de papier sulfurisé, étaler sur ≈ 0,5 cm d'épaisseur. Enfourner 15 min, la pâte doit être bien dorée. Sortir du four et retirer de la plaque.", "Dans chaque verrine, mettre une boule de sorbet et casser par-dessus des morceaux de crumble. Servir sans attendre.", "Note : Conseil : le poivre long est légèrement piquant ; goûter la purée au fur et à mesure avant d'ajouter le quart de la gousse."]}, {"titre": "Granité au porto, salade de melon et pastèque", "source": "p. 88", "portions": "6 pers", "type": "Dessert", "ing": ["Matériel", "cuillère parisienne", "1 melon de Cavaillon", "1/6 de pastèque", "2 brins de menthe. Granité : 20 cl de porto", "100 g de sucre", "20 cl d'eau minérale"], "etapes": ["Porter à ébullition l'eau et le sucre, laisser refroidir, puis verser le porto sans cesser de mélanger. Verser ce sirop dans un bac peu profond et mettre au congélateur 6 h ; toutes les heures, gratter la surface à la fourchette pour obtenir des cristaux.", "Avant de servir, couper le melon en deux, retirer les graines et, à la cuillère parisienne, réaliser des billes de melon et de pastèque.", "Répartir les billes dans des verres, couvrir de granité au porto, décorer d'une feuille de menthe.", "Note : Variantes : muscat ou autre vin doux (dans ce cas, augmenter de 5 cl la quantité de vin)."]}, {"titre": "Granité de monbazillac et canapés au foie gras", "source": "p. 92", "portions": "6 pers", "type": "Dessert", "ing": ["100 g de foie gras mi-cuit", "4 tranches de pain d'épice", "fleur de sel", "poivre du moulin. Granité : 25 cl de monbazillac", "60 g de sucre", "15 cl d'eau minérale"], "etapes": ["Granité : porter à ébullition l'eau et le sucre, laisser refroidir, verser le vin sans cesser de mélanger ; verser dans un bac peu profond, congélateur 6 h, gratter la surface à la fourchette toutes les heures.", "Découper le foie gras en tranches de 3-4 mm d'épaisseur puis en carrés de 2 cm de côté.", "Juste avant de servir, toaster légèrement le pain d'épice, le
