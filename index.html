<!doctype html><html><head><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="icon" type="image/png" href="/favicon.png"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<title>Mes recettes pas à pas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Concept : un étal de marché. Un ingrédient choisi, trois étals : sauces (safran), légumes (feuille), recettes (tomate). */
:root{
  --bg:#f1f5ff; --card:#ffffff; --ink:#14213d; --muted:#55638a; --line:#d5def5; --soft:#e6ecfc;
  --sauce:#d6168f; --sauce-bg:#ffe0f3; --sauce-ink:#6b0a47;
  --veg:#1f9d55; --veg-bg:#d9f5e3; --veg-ink:#0d4f2a;
  --reci:#2563eb; --reci-bg:#dbe7ff; --reci-ink:#12307a;
  --pick:#14213d; --pick-ink:#f1f5ff;
  --chip-bg:78% 90%; --chip-bd:60% 52%; --chip-tx:55% 20%;
  --shadow:0 2px 0 rgba(20,33,61,.08), 0 8px 20px rgba(20,33,61,.07);
  --f-display:'Fredoka',system-ui,sans-serif; --f-body:'Nunito',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1426; --card:#171f38; --ink:#e8edff; --muted:#9aa8d0; --line:#2a3560; --soft:#1f2a4d;
    --sauce:#ff5cc0; --sauce-bg:#45143a; --sauce-ink:#ffd3ee;
    --veg:#4fd68a; --veg-bg:#14392a; --veg-ink:#c3f5d8;
    --reci:#6ea0ff; --reci-bg:#172b5c; --reci-ink:#d3e2ff;
    --pick:#e8edff; --pick-ink:#0e1426;
    --chip-bg:35% 22%; --chip-bd:45% 55%; --chip-tx:70% 88%;
    --shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.25); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1426; --card:#171f38; --ink:#e8edff; --muted:#9aa8d0; --line:#2a3560; --soft:#1f2a4d;
  --sauce:#ff5cc0; --sauce-bg:#45143a; --sauce-ink:#ffd3ee;
  --veg:#4fd68a; --veg-bg:#14392a; --veg-ink:#c3f5d8;
  --reci:#6ea0ff; --reci-bg:#172b5c; --reci-ink:#d3e2ff;
  --pick:#e8edff; --pick-ink:#0e1426;
  --chip-bg:35% 22%; --chip-bd:45% 55%; --chip-tx:70% 88%;
  --shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 20px rgba(0,0,0,.25); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:20px 80px}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--reci);outline-offset:2px}

header.top{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:clamp(30px,7vw,44px);letter-spacing:-.01em}
h1 span{color:var(--reci)}
.sub{color:var(--muted);margin:4px 0 0;font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:800;font-family:var(--f-display);font-size:15px;box-shadow:0 3px 0 var(--ink);transition:transform .12s, box-shadow .12s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.main{background:var(--reci);color:#fff;border-color:var(--ink)}
.btn.ghost{box-shadow:none;border-width:1.5px;font-weight:700}
.dice{display:inline-block;width:1.1em;height:1.1em;vertical-align:-.18em;margin-right:6px}
.btn.rolling .dice{animation:roll .6s ease}
@keyframes roll{to{transform:rotate(360deg)}}

.search{display:flex;gap:8px;margin:14px 0 10px}
.search input{flex:1;min-width:0;border:2px solid var(--ink);border-radius:14px;background:var(--card);padding:11px 14px;font-weight:700}
.search input::placeholder{color:var(--muted);font-weight:600}

.picked{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 14px;min-height:8px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--pick);color:var(--pick-ink);border-radius:999px;padding:6px 8px 6px 14px;font-weight:800;border:0;animation:pop .25s ease}
.pill b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--pick-ink);color:var(--pick);font-size:14px;line-height:1}
@keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}
.clear{background:none;border:0;color:var(--muted);text-decoration:underline;font-weight:700}

details.grp{margin:0 0 8px;border-radius:16px}
details.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;padding:6px 2px;color:var(--ink)}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::before{content:"";width:10px;height:10px;border-right:3px solid var(--muted);border-bottom:3px solid var(--muted);transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
details.grp[open]>summary::before{transform:rotate(45deg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 8px}
.chip{border:2px solid hsl(var(--h) var(--chip-bd));background:hsl(var(--h) var(--chip-bg));color:hsl(var(--h) var(--chip-tx));border-radius:999px;padding:6px 12px;font-weight:800;font-size:15px;transition:transform .12s}
.chip:hover{transform:translateY(-2px) rotate(-1.5deg)}
.chip:active{transform:scale(.94)}
.chip small{opacity:.75;font-weight:700;margin-left:4px}
.chip[aria-pressed="true"]{background:var(--pick);color:var(--pick-ink);border-color:var(--pick)}

.stage{display:grid;gap:16px;margin-top:18px}
.stall{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);border-top:8px solid var(--c)}
.stall.sauce{--c:var(--sauce)} .stall.veg{--c:var(--veg)} .stall.reci{--c:var(--reci)}
.stall h2{font-size:22px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.stall h2 em{font-style:normal;font-family:var(--f-body);font-size:14px;font-weight:800;color:var(--muted)}
.stall .hint{margin:2px 0 12px;color:var(--muted);font-size:14px;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{border:0;text-align:left;border-radius:16px;padding:12px 14px;background:var(--soft);display:flex;flex-direction:column;gap:4px;min-width:0;transition:transform .12s}
.card:hover{transform:translateY(-2px)}
.card strong{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.card span{font-size:13px;color:var(--muted);font-weight:600;overflow-wrap:anywhere}
.sauce .card{background:var(--sauce-bg);color:var(--sauce-ink)} .sauce .card span{color:inherit;opacity:.8}
.reci .card{background:var(--reci-bg);color:var(--reci-ink)} .reci .card span{color:inherit;opacity:.8}
.card[aria-pressed="true"]{outline:3px solid var(--ink)}
.vegs{display:flex;flex-wrap:wrap;gap:8px}
.vegs .vchip{border:0;border-radius:999px;background:var(--veg-bg);color:var(--veg-ink);padding:7px 14px;font-weight:800}
.vegs .vchip small{opacity:.7;margin-left:5px}
.vegs .vchip:hover{transform:translateY(-2px) rotate(1.5deg)}
.empty{color:var(--muted);font-weight:600;margin:0}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--card);color:var(--ink);align-self:flex-start;margin-bottom:2px}
.newtag{background:var(--reci);color:#fff}
.welcome{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-top:6px}
.welcome p{margin:6px 0 0;color:var(--muted);font-weight:600}
.note{font-size:13px;color:var(--muted);margin-top:22px;font-weight:600}

.modes{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.mode{border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:9px 18px;font-family:var(--f-display);font-weight:600;font-size:16px}
.mode[aria-pressed="true"]{background:var(--reci);border-color:var(--reci);color:#fff}
.mode[data-mode="courses"][aria-pressed="true"]{background:var(--sauce);border-color:var(--sauce)}
.mode[data-mode="invites"][aria-pressed="true"]{background:var(--veg);border-color:var(--veg)}
.stall.meals{--c:var(--veg)}
.plat{border-top:2px solid var(--line);padding-top:10px;margin-top:10px}.plat h4{margin:0 0 2px;font-family:var(--f-display);font-weight:600;font-size:17px}.plat p{margin:2px 0}.plat .nt{color:var(--sauce-ink);background:var(--sauce-bg);border-radius:10px;padding:4px 10px;font-weight:700;font-size:14px;display:inline-block;margin-top:4px}
#openList{margin-left:auto}
.bar{background:var(--sauce-bg);color:var(--sauce-ink);border:2px solid var(--sauce);border-radius:16px;padding:10px 12px;margin:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:700}
.bar .btn.main{background:var(--sauce);border-color:var(--ink)}
.entry{border-top:2px solid var(--line);padding-top:10px;margin-top:10px}
.entry h4{margin:0 0 4px;font-family:var(--f-display);font-weight:600;font-size:17px;display:flex;justify-content:space-between;gap:8px}
.entry label{display:flex;gap:8px;align-items:flex-start;margin:3px 0;font-weight:600}
.entry input{margin-top:5px;accent-color:var(--sauce);width:18px;height:18px}
.entry input:checked+span{text-decoration:line-through;opacity:.5}
.li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-weight:600}.li input{margin-top:4px;accent-color:var(--sauce);width:20px;height:20px;flex:none}.li small{display:block;color:var(--muted);font-weight:600;font-size:13px}.li input:checked+span{text-decoration:line-through;opacity:.5}.cnt{font-style:normal;background:var(--sauce-bg);color:var(--sauce-ink);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:800;margin-left:6px}
.rm{border:0;background:transparent;color:var(--muted);font-weight:800;font-size:15px}
/* fiche */
.alerte{margin:12px 0;padding:10px 14px;border-radius:14px;background:var(--sauce-bg);color:var(--sauce-ink);border:2px solid var(--sauce)}.alerte p{margin:4px 0}
dialog{border:0;padding:0;background:transparent;max-width:min(680px,calc(100vw - 24px));width:100%;margin:auto;color:var(--ink)}
dialog::backdrop{background:rgba(10,20,14,.55)}
.sheet{background:var(--card);border-radius:24px;padding:20px 18px 22px;max-height:calc(100dvh - 32px);overflow:auto;border-top:10px solid var(--reci)}
.sheet h2{font-size:26px;margin-right:48px}
.sheet .x{position:absolute;right:12px;top:12px}
.sheet-wrap{position:relative}
.meta{color:var(--muted);font-weight:700;font-size:14px;margin:6px 0 14px}
.sheet h3{font-size:18px;margin:16px 0 6px;color:var(--reci)}
.sheet ul{margin:0;padding-left:20px} .sheet li{margin:2px 0}
.sheet li.h{list-style:none;margin-left:-20px;margin-top:10px;font-family:var(--f-display);font-weight:600;color:var(--muted)}
.sheet ol{margin:0;padding-left:22px} .sheet ol li{margin:6px 0}
form.add{display:grid;gap:10px;margin-top:12px}
form.add label{display:grid;gap:4px;font-weight:800;font-size:14px}
form.add input,form.add textarea,form.add select{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;font-weight:600}
form.add textarea{min-height:130px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.row2{grid-template-columns:1fr}}
@media (max-width:600px){
  body{padding-inline:12px;padding-block:14px 60px;font-size:15px}
  h1{font-size:30px}
  .sub{font-size:14px}
  header.top{margin-bottom:8px}
  .actions{width:100%}
  .actions .btn{flex:1 1 auto;justify-content:center;padding:10px 12px;min-height:44px}
  .modes{gap:6px}
  .mode{flex:1 1 auto;padding:10px 12px;min-height:44px}
  #openList{margin-left:0}
  .search input{padding:12px 14px;font-size:16px}
  .chip{padding:8px 12px;min-height:40px}
  .vegs .vchip{min-height:40px}
  .cards{grid-template-columns:1fr}
  .stall{padding:12px;border-radius:18px}
  .stall h2{font-size:20px}
  .sheet{padding:18px 14px 20px;border-radius:20px}
  .sheet h2{font-size:22px;margin-right:44px}
  .sheet .x{min-width:44px;min-height:44px}
  .btn.main{min-height:44px}
  .bar{flex-direction:column;align-items:stretch}
  .bar .btn{min-height:44px}
}
.warn{background:var(--sauce-bg);color:var(--sauce-ink);padding:10px 12px;border-radius:12px;font-weight:700;font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Mes recettes <span>pas à pas</span></h1>
      <p class="sub" id="count"></p>
    </div>
    <div class="actions">
      <button class="btn" id="dice" type="button"><svg class="dice" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="8.5" cy="8.5" r="1.7" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/></svg>Surprends-moi</button>
      <button class="btn main" id="addBtn" type="button">+ Ajouter une recette</button>
    </div>
  </header>

  <div class="modes" id="modes">
    <button type="button" class="mode" data-mode="cuisine">Je cuisine</button>
    <button type="button" class="mode" data-mode="courses">Je fais les courses</button>
    <button type="button" class="mode" data-mode="invites">Repas d'invités</button>
    <button type="button" class="btn" id="openList" data-openlist hidden></button>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Un ingrédient : saumon, courgette, tahini…" autocomplete="off" enterkeyhint="search">
  </div>
  <div class="picked" id="picked"></div>
  <div id="bar"></div>
  <div id="groups"></div>
  <div class="stage" id="stage"></div>
  <p class="note">Les sauces et les légumes sont repérés automatiquement dans les ingrédients de tes recettes. Les ingrédients sont recopiés tels qu'imprimés dans les livres.</p>
</div>

<dialog id="dlg"><div class="sheet-wrap"><div class="sheet" id="sheet"></div></div></dialog>

 4, "titre": "Lentilles, betterave & brousse", "meta": ["Authentiques Buddha Bowls  ·  Buddha bowl  ·  page ~24", "Pour 2  ·  préparation 10 min  ·  cuisson 20 min", "Protéine : Lentilles vertes 200 g + brousse 80 g  (par personne : 100 g lentilles + 40 g brousse)"], "ing": ["200 g de lentilles vertes", "4 petites betteraves cuites", "1 c. à soupe de basilic ciselé", "80 g de brousse", "1 c. à soupe d'huile d'olive", "8 radis", "4 poignées de roquette", "Graines de lin", "Sauce", "Le jus de 1 orange", "1 c. à soupe d'huile de lin", "3 c. à soupe d'huile d'olive", "Sel & poivre"], "etapes": ["Cuire les lentilles selon le paquet, égoutter et rafraîchir à l'eau froide.", "Couper les betteraves en dés ; mélanger la brousse avec l'huile d'olive et le basilic ; émincer les radis.", "Sauce : mélanger le jus d'orange et l'huile de lin, émulsionner avec l'huile d'olive, saler, poivrer.", "Composer les bowls, arroser de sauce et parsemer de graines de lin."]}, {"n": 10, "titre": "Thon, petit épeautre & framboises séchées", "meta": ["Authentiques Buddha Bowls  ·  Poke bowl  ·  page ~40", "Pour 2  ·  préparation 10 min  ·  cuisson 10 min", "Protéine : Thon rouge 200 g  (par personne : 100 g)"], "ing": ["140 g de petit épeautre", "200 g de thon rouge", "200 g de concombre", "12 framboises séchées", "3 c. à soupe de câpres", "Pluches de cerfeuil", "Sauce", "3 c. à soupe d'huile d'olive", "1 c. à soupe de vinaigre balsamique", "Sel & poivre"], "etapes": ["Cuire le petit épeautre selon le paquet, égoutter et rafraîchir à l'eau froide.", "Couper le thon en dés ; peler et épépiner le concombre puis le couper en dés ; hacher grossièrement les framboises séchées.", "Sauce : émulsionner tous les ingrédients.", "Composer les bowls, arroser de vinaigrette, ajouter du cerfeuil si on veut.", "Framboises séchées maison (facultatif) : four à 90 °C, framboises coupées en deux sur une plaque, 2 h de cuisson puis 1 h four éteint."]}, {"n": 5, "titre": "Houmous de petits pois, quinoa & sauce au citron confit", "meta": ["Authentiques Buddha Bowls  ·  Buddha bowl  ·  page ~26", "Pour 2  ·  préparation 15 min  ·  cuisson 20 min", "Protéine : Pois chiches 30 g + petits pois 130 g (houmous)  (par personne : 15 g pois chiches + 65 g petits pois)"], "ing": ["140 g d'orge perlé", "2 carottes", "1 courgette", "2 poignées de raisins secs", "Houmous", "½ c. à café de persil", "130 g de petits pois", "30 g de pois chiches en boîte", "1 gousse d'ail", "1 c. à soupe d'huile d'olive", "1 pincée de sel", "Sauce", "1 petit citron confit", "3 c. à soupe d'huile d'olive"], "etapes": ["Cuire l'orge perlé selon le paquet, égoutter et rafraîchir.", "Houmous : ciseler le persil, éplucher l'ail, tout mixer ; ajouter un peu d'eau pour une texture plus souple.", "Râper les carottes et la courgette.", "Sauce : mixer le citron confit coupé en deux avec l'huile d'olive jusqu'à obtenir une sauce lisse.", "Composer les bowls, ajouter les raisins secs et servir avec la sauce."]}, {"n": 6, "titre": "Halloumi, légumes rôtis & boulgour", "meta": ["Authentiques Buddha Bowls  ·  Buddha bowl  ·  page ~28", "Pour 2  ·  préparation 15 min  ·  cuisson 15 min", "Protéine : Halloumi 2 tranches  (par personne : 1 tranche)"], "ing": ["1 aubergine", "2 courgettes", "1½ c. à soupe d'huile d'olive", "140 g de boulgour", "¼ de poivron rouge", "2 tranches de halloumi", "4 brins de persil", "2 c. à soupe de pignons de pin", "Olives vertes dénoyautées", "Sel & poivre", "Sauce", "Le jus de ½ citron jaune", "3 c. à soupe d'huile d'olive", "½ c. à café de cumin en poudre", "Sel & poivre"], "etapes": ["Four à 180 °C. Couper aubergine et courgettes en fines rondelles, les huiler (1 c. à soupe), saler, poivrer, les étaler en une couche et rôtir 15 min.", "Cuire le boulgour selon le paquet, égoutter et rafraîchir.", "Épépiner le poivron et le couper en dés.", "Sauce : émulsionner tous les ingrédients.", "Griller le halloumi 2 min de chaque côté dans ½ c. à soupe d'huile chaude, puis le couper en deux.", "Composer les bowls, parsemer de pignons, d'olives et de persil, servir avec la sauce."]}, {"n": 7, "titre": "Patate douce rôtie, riz noir & houmous", "meta": ["Authentiques Buddha Bowls  ·  Buddha bowl  ·  page ~30", "Pour 2  ·  préparation 20 min  ·  cuisson 20 min", "Protéine : Pois chiches 80 g (houmous)  (par personne : 40 g pois chiches (faible apport))"], "ing": ["140 g de riz noir", "1 petite patate douce", "2 c. à soupe d'huile d'olive", "70 g de chou rouge", "2 poignées de pousses d'épinard", "40 g de noix de pécan", "Sel & poivre", "Houmous", "80 g de pois chiches en boîte", "Le jus de ½ citron jaune", "½ c. à soupe de purée de sésame", "½ gousse d'ail", "Sel & poivre", "Sauce", "3 c. à soupe d'huile d'olive", "2 c. à café de sirop d'érable", "1 c. à soupe de jus d'orange", "Sel & poivre"], "etapes": ["Four à 180 °C. Cuire le riz noir selon le paquet, en le gardant légèrement croquant ; rincer à l'eau froide.", "Couper la patate douce en gros cubes, huiler, saler, poivrer et rôtir en une couche 15 à 20 min.", "Hacher le chou rouge et les épinards.", "Houmous : éplucher l'ail et mixer tous les ingrédients.", "Sauce : émulsionner tous les ingrédients.", "Composer les bowls, ajouter les noix de pécan et la sauce."]}, {"n": 8, "titre": "Falafels, sauce au tahini & houmous de betterave", "meta": ["Authentiques Buddha Bowls  ·  Buddha bowl  ·  page ~32", "Pour 2  ·  préparation 30 min  ·  cuisson 30 min", "Protéine : Pois chiches 170 g (falafels) + 70 g (houmous)  (par personne : 120 g pois chiches)"], "ing": ["2 c. à soupe de graines de sésame", "2 c. à soupe d'huile d'olive", "100 g de chou rouge", "Le jus de 1 citron vert", "2 poignées de mâche", "Quelques brins de coriandre", "Falafels", "170 g de pois chiches en boîte", "½ oignon jaune", "½ botte de persil", "6 feuilles de menthe", "½ botte de coriandre", "1 c. à café de cumin en poudre", "1 gousse d'ail", "1 c. à café de sel", "½ c. à café de poivre moulu", "½ sachet de levure chimique", "1 c. à café de farine", "Houmous", "70 g de pois chiches en boîte", "140 g de betterave cuite", "50 g de fromage frais (ricotta, chèvre…)", "1 c. à soupe d'huile de pépins de raisin", "Sauce", "50 g de purée de sésame", "8 cl d'eau", "2 cl de jus de citron jaune", "½ c. à café de purée d'ail", "Sel & poivre"], "etapes": ["Four à 190 °C. Mixer les ingrédients des falafels en pâte légèrement granuleuse ; former 12 boules, les rouler dans le sésame, les huiler au pinceau.", "Les poser sur une plaque avec papier cuisson et cuire 30 min en les retournant en cours de cuisson (friteuse possible).", "Houmous : tout mixer.", "Ciseler le chou rouge et le mélanger à 1 c. à soupe d'huile d'olive et au jus de citron vert.", "Sauce : émulsionner tous les ingrédients.", "Composer les bowls avec la mâche, parsemer de coriandre et servir avec la sauce."]}, {"n": 9, "titre": "Houmous de fèves, asperges & pâtes de quinoa", "meta": ["Authentiques Buddha Bowls  ·  Buddha bowl  ·  page ~34", "Pour 2  ·  préparation 20 min  ·  cuisson 10 min", "Protéine : Fèves cuites 100 g + pois chiches 50 g (houmous)  (par personne : 75 g fèves et pois chiches)"], "ing": ["200 g d'asperges vertes", "1 c. à soupe d'huile d'olive", "200 g de pâtes de quinoa au persil", "10 amandes entières", "2 poignées d'épinards", "Graines de courge", "Sel & poivre", "Houmous", "100 g de fèves cuites", "50 g de pois chiches en boîte", "½ petit citron confit", "2 cl d'huile d'olive", "½ gousse d'ail", "1 c. à soupe d'eau", "Sauce", "4 c. à soupe d'huile d'olive", "½ gousse d'ail", "3 brins de persil", "Sel & poivre"], "etapes": ["Houmous : éplucher l'ail, tout mixer, assaisonner.", "Couper les asperges en deux dans la longueur et les faire revenir 4 à 5 min à la poêle chaude légèrement huilée.", "Sauce : éplucher l'ail et mixer tous les ingrédients.", "Cuire les pâtes de quinoa selon le paquet.", "Composer les bowls, ajouter les épinards, napper de sauce et parsemer d'amandes concassées et de graines de courge."]}, {"n": 11, "titre": "Thon façon thaï", "meta": ["Authentiques Buddha Bowls  ·  Poke bowl  ·  page ~42", "Pour 2  ·  préparation 10 min  ·  cuisson 4 min", "Protéine : Thon rouge 240 g  (par personne : 120 g)"], "ing": ["200 g de nouilles de riz", "100 g de mangue", "200 g de carottes", "2 oignons nouveaux", "240 g de thon rouge", "2 c. à soupe de mélange de menthe et coriandre ciselées", "50 g de cacahuètes", "Sauce", "2 c. à soupe d'huile d'olive", "1 c. à soupe de sauce soja claire", "½ c. à soupe de vinaigre de riz", "½ c. à soupe d'huile de sésame", "Le jus de ½ citron vert"], "etapes": ["Cuire les nouilles de riz selon le paquet, égoutter et rafraîchir.", "Couper la mangue en dés, râper les carottes, émincer les oignons, couper le thon en cubes, hacher grossièrement les cacahuètes.", "Sauce : émulsionner tous les ingrédients.", "Composer les bowls, napper de sauce, parsemer d'herbes ciselées et de cacahuètes hachées."]}, {"n": 16, "titre": "Ceviche de poisson, mangue & sauce coco", "meta": ["Authentiques Buddha Bowls  ·  Poke bowl  ·  page ~52", "Pour 2  ·  préparation 15 min  ·  cuisson 15 min", "Protéine : Poisson blanc 200 g (merlu, cabillaud…)  (par personne : 100 g)"], "ing": ["200 g de poisson blanc (merlu, cabillaud…)", "120 g de riz blanc", "½ concombre noa", "80 g de mangue", "2 poignées de pousses de betterave", "Flocons de piment rouge", "Sauce", "1 petit oignon frais", "Le jus de 2 citrons verts", "2 c. à soupe de lait de coco", "2 c. à soupe d'eau de coco", "2 c. à soupe de sauce nuoc-mâm"], "etapes": ["Sauce : éplucher et émincer l'oignon frais, puis émulsionner tous les ingrédients.", "Couper le poisson en dés, le mélanger à 1 c. à soupe de sauce et réserver au frais.", "Rincer le riz jusqu'à eau claire et le cuire 15 min à la vapeur (prolonger si besoin).", "Émincer le concombre, couper la mangue en dés.", "Composer les bowls avec les pousses de betterave, piment en flocons si on aime, et servir avec la sauce."]}, {"n": 12, "titre": "Crevettes sautées, riz vinaigré & avocat", "meta": ["Authentiques Buddha Bowls  ·  Poke bowl  ·  page ~44", "Pour 2  ·  préparation 10 min  ·  cuisson 15 min", "Protéine : Crevettes 16  (par personne : 8 crevettes)"], "ing": ["120 g de riz thaï", "2 c. à soupe de vinaigre de riz blanc", "2 c. à soupe de mirin", "1 c. à soupe de sucre", "½ c. à café de sel", "¼ de mangue (60 g)", "1 carotte", "8 radis", "1 avocat", "1 c. à soupe d'huile d'olive", "16 crevettes", "½ c. à café de piment de Cayenne en poudre", "140 g de maïs en boîte", "2 poignées de croûtons", "Sauce", "Le jus de 1 citron vert", "3 c. à soupe d'huile d'olive", "La pulpe et les grains de ½ fruit de la Passion", "Sel & poivre"], "etapes": ["Rincer le riz jusqu'à ce que l'eau soit claire, puis le cuire selon le paquet.", "Chauffer le vinaigre avec le mirin, le sucre et le sel jusqu'à dissolution ; verser sur le riz et mélanger délicatement.", "Couper la mangue en dés, les carottes en lamelles à l'économe, émincer les radis, couper l'avocat en deux.", "Dorer les crevettes à l'huile d'olive à la poêle ; poudrer de piment de Cayenne en fin de cuisson.", "Sauce : émulsionner tous les ingrédients.", "Composer les bowls, napper de sauce, ajouter le maïs et les croûtons."]}, {"n": 13, "titre": "Haddock fumé, lentilles vertes & œuf mollet", "meta": ["Authentiques Buddha Bowls  ·  Poke bowl  ·  page ~46", "Pour 2  ·  préparation 15 min  ·  cuisson 25 min", "Protéine : Haddock fumé 200 g  (par personne : 100 g haddock + 1 œuf)"], "ing": ["240 g de lentilles vertes", "½ échalote", "2 gros œufs", "200 g de haddock fumé", "½ c. à café d'huile d'olive", "4 poignées d'épinards", "4 brins de persil", "4 c. à soupe d'oignons frits", "Sauce", "Le jus de ½ citron jaune", "2 c. à soupe d'huile de pépins de raisin", "2 c. à soupe d'huile d'olive", "1 c. à café de moutarde", "Sel & poivre"], "etapes": ["Cuire les lentilles vertes selon le paquet.", "Sauce : émulsionner tous les ingrédients. Ciseler l'échalote.", "Laisser tiédir les lentilles, les mélanger à un peu de sauce et à l'échalote.", "Cuire les œufs 6 min dans l'eau bouillante salée, les refroidir à l'eau glacée, les écaler.", "Couper le haddock en lanières ; faire revenir les épinards 2 min à la poêle chaude huilée.", "Composer les bowls avec le reste de sauce, parsemer de persil et d'oignons frits."]}, {"n": 14, "titre": "Maquereau mariné, smashed grenailles & ail confit", "meta": ["Authentiques Buddha Bowls  ·  Poke bowl  ·  page ~48", "Pour 2  ·  préparation 15 min  ·  cuisson 40 min", "Protéine : Maquereau 4 filets  (par personne : 2 filets)"], "ing": ["240 g de pommes de terre grenailles", "5 g de gingembre frais", "Le jus de 2 citrons verts", "6 c. à soupe d'huile d'olive", "4 filets de maquereau", "2 têtes d'ail", "4 poignées de mâche", "Sel & poivre", "Sauce", "120 g de yaourt grec", "Le jus de 1 citron jaune", "1 c. à soupe d'huile d'olive", "Sel & poivre"], "etapes": ["Cuire les grenailles 15 à 20 min dans l'eau bouillante salée jusqu'à tendreté ; égoutter.", "Râper le gingembre et le mélanger au jus de citron vert et à 2 c. à soupe d'huile d'olive.", "Ôter la peau des filets de maquereau, les émincer, les enrober du mélange et les garder au frais.", "Four à 200 °C. Recouper le haut des têtes d'ail ; écraser légèrement les pommes de terre sur la plaque, les arroser de 2 c. à soupe d'huile, saler, poivrer ; ajouter l'ail avec 1 c. à soupe d'huile sur chaque tête ; enfourner 20 min.", "Sauce : émulsionner tous les ingrédients.", "Composer les bowls, ajouter la mâche et servir avec la sauce."]}, {"n": 15, "titre": "Calamars, riz noir & trévise", "meta": ["Authentiques Buddha Bowls  ·  Poke bowl  ·  page ~50", "Pour 2  ·  préparation 10 min  ·  cuisson 40 min", "Protéine : Anneaux de calamars 280 g  (par personne : 140 g)"], "ing": ["140 g de riz noir", "1 petite trévise", "10 champignons de Paris", "2 gousses d'ail", "2 c. à soupe d'aneth", "2 c. à soupe d'huile d'olive", "280 g d'anneaux de calamars", "10 câprons", "Sel & poivre", "Sauce", "Le jus de 1 citron vert", "1 c. à soupe de sauce soja", "3 c. à soupe d'huile d'olive"], "etapes": ["Cuire le riz noir selon le paquet, égoutter et rafraîchir.", "Sauce : émulsionner tous les ingrédients.", "Ciseler finement la trévise, couper les champignons en deux, hacher l'ail.", "Saisir les anneaux de calamars 4 à 5 min à feu vif dans l'huile d'olive en les retournant ; ajouter l'ail, cuire encore 1 min et retirer du feu.", "Composer les bowls, ajouter les câprons, l'aneth ciselé et napper de sauce."]}, {"n": 17, "titre": "Carpaccio de thon, tagliatelles à l'encre de seiche & mangue", "meta": ["Authentiques Buddha Bowls  ·  Poke bowl  ·  page ~54", "Pour 2  ·  préparation 10 min  ·  cuisson 10 min", "Protéine : Thon cru 220 g  (par personne : 110 g)"], "ing": ["40 g de radis noir", "220 g de thon cru", "200 g de mangue", "240 g de tagliatelles à l'encre de seiche", "Graines de sésame noir", "Quelques brins de cerfeuil", "Sauce", "Le jus de 3 citrons verts", "3 c. à soupe d'huile d'olive", "1 c. à soupe d'huile de pépins de raisin", "Sel & poivre"], "etapes": ["Sauce : émulsionner tous les ingrédients.", "Éplucher le radis noir et le couper en dés ; trancher le thon en lamelles, le mélanger à 2 c. à soupe de sauce et aux dés de radis, réserver au frais.", "Couper la mangue en dés ; cuire les tagliatelles selon le paquet.", "Composer les bowls, parsemer de sésame noir et de cerfeuil, napper du reste de sauce."]}, {"n": 18, "titre": "Tartare de saumon fumé, edamames & bok choy", "meta": ["Authentiques Buddha Bowls  ·  Poke bowl  ·  page ~56", "Pour 2  ·  préparation 15 min  ·  cuisson 10 min", "Protéine : Saumon fumé 140 g + edamames 120 g  (par personne : 70 g saumon fumé + 60 g edamames)"], "ing": ["140 g de saumon fumé", "1 c. à soupe de tartare d'algues", "10 shiitakes", "10 g de beurre demi-sel", "1 chou bok choy", "1 c. à soupe d'huile de sésame", "120 g d'edamames", "2 poignées de pousses de soja", "Graines de sésame", "Sauce", "Le jus de 1 citron vert", "3 c. à soupe d'huile d'olive", "2 c. à café d'huile de sésame", "1 c. à soupe de sauce soja"], "etapes": ["Hacher menu le saumon fumé et le mêler au tartare d'algues.", "Nettoyer les champignons, les couper en quatre et les faire revenir 5 min à la poêle chaude avec le beurre.", "Émincer le bok choy et le faire revenir 5 min à la poêle avec l'huile de sésame.", "Sauce : émulsionner tous les ingrédients.", "Composer les bowls avec les edamames, les pousses de soja et le sésame, servir avec la sauce."]}, {"n": 19, "titre": "Tartare de cabillaud, fenouil & soba", "meta": ["Authentiques Buddha Bowls  ·  Poke bowl  ·  page ~58", "Pour 2  ·  préparation 15 min  ·  cuisson 10 min", "Protéine : Poisson blanc 200 g (cabillaud, merlu…)  (par personne : 100 g)"], "ing": ["200 g de poisson blanc (cabillaud, merlu…)", "200 g de nouilles soba", "1 fenouil", "1 c. à soupe d'huile d'olive", "½ pomme granny-smith", "1 c. à soupe d'aneth", "Sauce", "1 échalote", "Le jus de 3 citrons verts", "4 c. à soupe d'huile d'olive", "Sel & poivre"], "etapes": ["Sauce : émincer finement l'échalote et émulsionner tous les ingrédients.", "Couper le poisson en dés, le mélanger à 2 c. à soupe de sauce et réserver au frais.", "Cuire les soba selon le paquet, égoutter et rafraîchir.", "Émincer le fenouil et le cuire 5 min à feu moyen dans l'huile d'olive pour l'attendrir ; émincer la pomme.", "Composer les bowls, parsemer d'aneth et napper du reste de sauce."]}, {"n": 21, "titre": "Chorizo, pois chiches & sauce au citron", "meta": ["Authentiques Buddha Bowls  ·  Déclinaison gourmande  ·  page ~64", "Pour 2  ·  préparation 15 min  ·  cuisson 3 min", "Protéine : Pois chiches 200 g + chorizo 100 g  (par personne : 100 g pois chiches + 50 g chorizo)"], "ing": ["200 g de pois chiches en boîte", "1 avocat", "26 tomates cerises", "1 petite échalote", "5 feuilles de basilic", "100 g de chorizo", "Sel & poivre", "Sauce", "Le jus de ½ citron jaune", "4 c. à soupe d'huile d'olive", "1 c. à café de cumin en poudre", "Sel & poivre"], "etapes": ["Rincer et égoutter les pois chiches ; peler l'avocat et l'émincer ; couper les tomates cerises en deux ; émincer finement l'échalote.", "Sauce : émulsionner tous les ingrédients.", "Couper le chorizo en tranches et le faire revenir 2 à 3 min à la poêle bien chaude.", "Composer les bowls, assaisonner, napper de sauce et parsemer de basilic ciselé."]}, {"n": 20, "titre": "Saumon pané au sésame, chou blanc & sauce à l'orange", "meta": ["Authentiques Buddha Bowls  ·  Déclinaison gourmande  ·  page ~62", "Pour 2  ·  préparation 20 min  ·  cuisson 10 min", "Marinade 1 h minimum", "Protéine : Dos de saumon 240 g  (par personne : 120 g)"], "ing": ["60 g de racine de gingembre", "1 c. à soupe de sauce nuoc-mâm", "240 g de dos de saumon", "200 g de nouilles pour ramen", "200 g de chou blanc", "8 brins de coriandre", "40 g de graines de sésame", "1 c. à soupe d'huile d'olive", "Sauce", "Le jus de ½ orange", "2 c. à café de sauce soja claire", "1 c. à soupe de vinaigre de riz", "1 c. à soupe d'huile neutre", "½ c. à soupe de purée de sésame"], "etapes": ["Presser le gingembre pour en récupérer le jus et le mêler à la sauce nuoc-mâm.", "Badigeonner le dos de saumon de ce mélange, l'emballer dans du film avec le reste de marinade et laisser 1 h minimum au frais.", "Cuire les nouilles pour ramen selon le paquet, égoutter et rafraîchir ; émincer finement le chou.", "Sauce : émulsionner tous les ingrédients.", "Déballer le saumon, le rouler dans le sésame et le saisir 2 min par face à la poêle chaude huilée ; laisser tiédir puis trancher (1 cm).", "Composer les bowls, napper de sauce et parsemer de coriandre."]}, {"n": 22, "titre": "Maquereau fumé au poivre, sarrasin grillé & courge", "meta": ["Authentiques Buddha Bowls  ·  Déclinaison gourmande  ·  page ~66", "Pour 2  ·  préparation 15 min  ·  cuisson 15 min", "Protéine : Filets de maquereau fumé au poivre 240 g  (par personne : 120 g)"], "ing": ["280 g de sarrasin grillé", "1 échalote", "300 g de courge butternut", "1 c. à soupe d'huile d'olive", "1 c. à café de cumin en poudre", "240 g de filets de maquereau fumé au poivre", "2 grosses poignées de pousses d'épinard", "4 brins de persil", "4 c. à soupe d'oignons frits", "Sel & poivre", "Sauce", "Le jus de ½ citron vert", "2 c. à soupe d'huile de pépins de raisin", "2 c. à soupe d'huile d'olive", "Sel & poivre"], "etapes": ["Cuire le sarrasin grillé selon le paquet, égoutter et rafraîchir.", "Émincer finement l'échalote et la mélanger au sarrasin.", "Couper la courge en dés et les faire revenir doucement 10 à 15 min dans l'huile d'olive jusqu'à tendreté ; ajouter le cumin, assaisonner.", "Émietter grossièrement le maquereau ; rincer les pousses d'épinard.", "Sauce : émulsionner tous les ingrédients.", "Composer les bowls, napper de sauce, parsemer d'oignons frits et de persil."]}, {"n": 23, "titre": "Bœuf sauté au paprika, riz complet & curry d'ananas", "meta": ["Authentiques Buddha Bowls  ·  Déclinaison gourmande  ·  page ~68", "Pour 2  ·  préparation 20 min  ·  cuisson 20 min", "Protéine : Bavette 260 g  (par personne : 130 g)"], "ing": ["140 g de riz complet", "½ oignon doux", "½ c. à café de cumin en poudre", "260 g de bavette", "2 c. à soupe d'huile d'olive (+ 1 c. à café)", "½ c. à café de paprika en poudre", "6 tranches d'ananas frais (ou en boîte)", "2 c. à café de moutarde à l'ancienne", "2 c. à café de concentré de tomate", "½ c. à café de curry en poudre", "1 c. à café de pâte de gingembre", "14 cl de jus d'ananas (récupéré dans la boîte, ou eau)", "4 brins de coriandre", "50 g de noix de cajou", "2 c. à soupe de noix de coco râpée", "Sel & poivre"], "etapes": ["Cuire le riz complet selon le paquet en le gardant légèrement croquant, égoutter et rafraîchir.", "Émincer l'oignon et le faire revenir 2 à 3 min dans l'huile d'olive ; ajouter le riz et le cumin, assaisonner, laisser refroidir.", "Couper la bavette en dés, la mélanger à 1 c. à café d'huile et au paprika, la saisir 2 à 3 min à la poêle chaude (elle doit rester saignante).", "Dans une autre poêle, dorer les tranches d'ananas 2 à 3 min par face avec 1 c. à soupe d'huile ; ajouter moutarde, concentré de tomate, curry, gingembre et jus d'ananas ; cuire à feu moyen jusqu'à ce que l'ananas soit tendre et le jus épais.", "Composer les bowls (riz froid, viande tiède, ananas), parsemer de noix de coco, coriandre et noix de cajou concassées."]}, {"n": 24, "titre": "Magret de canard, endives & coing", "meta": ["Authentiques Buddha Bowls  ·  Déclinaison gourmande  ·  page 70", "Pour 2  ·  préparation 15 min  ·  cuisson 10 min", "Protéine : Magret de canard fumé 120 g + ricotta 100 g  (par personne : 60 g magret + 50 g ricotta)"], "ing": ["140 g de boulgour", "1 c. à soupe de persil ciselé", "100 g de ricotta", "1 c. à soupe d'huile d'olive", "120 g de tranches de magret de canard fumé", "2 c. à soupe de jus d'orange", "1 coing", "15 g de beurre demi-sel", "1 endive", "10 noix", "2 c. à soupe de graines de courge", "Sel & poivre", "Sauce", "Le jus de ½ citron jaune", "4 c. à soupe d'huile d'olive", "2 c. à café de moutarde", "1 c. à café de miel"], "etapes": ["Cuire le boulgour selon le paquet, égoutter et rafraîchir.", "Mélanger la ricotta avec l'huile d'olive et le persil, assaisonner.", "Retirer le gras des tranches de magret ; ciseler l'endive et la mélanger au jus d'orange.", "Éplucher le coing, le couper en quatre et le faire revenir 6 à 8 min à feu moyen dans le beurre jusqu'à tendreté.", "Sauce : émulsionner tous les ingrédients.", "Composer les bowls, napper de sauce, ajouter les noix concassées et parsemer de graines de courge."]}, {"n": 25, "titre": "Riz de chou-fleur, épinards & poulet aux épices", "meta": ["Authentiques Buddha Bowls  ·  Déclinaison gourmande  ·  page ~72", "Pour 2  ·  préparation 15 min  ·  cuisson 10 min", "Protéine : Filet de poulet 200 g  (par personne : 100 g)"], "ing": ["200 g de chou-fleur", "1 c. à soupe de coriandre", "3 poignées de pousses d'épinard", "10 radis", "¼ de grenade", "200 g de filet de poulet", "1 c. à soupe d'huile d'olive", "1 c. à café de curry en poudre", "1 c. à café de graines de sésame", "2 c. à soupe de cacahuètes", "Sauce", "Le jus de ½ citron jaune", "3 c. à soupe d'huile d'olive", "½ c. à café de sauce soja", "Sel & poivre"], "etapes": ["Mixer les fleurettes de chou-fleur au robot en grosse poudre (riz de chou-fleur) ; y mêler la coriandre ciselée.", "Sauce : émulsionner tous les ingrédients.", "Ciseler les épinards et les mélanger à 1 c. à soupe de sauce ; couper les radis en fines lamelles ; égrainer la grenade.", "Émincer le poulet et le faire dorer à feu moyen à la poêle huilée ; ajouter le curry et le sésame.", "Composer les bowls, napper du reste de sauce, parsemer d'arilles de grenade et de cacahuètes concassées."]}, {"n": 26, "titre": "Fèves, viande des Grisons & abricots séchés", "meta": ["Authentiques Buddha Bowls  ·  Déclinaison gourmande  ·  page ~74", "Pour 2  ·  préparation 10 min  ·  cuisson 2 min", "Protéine : Viande des Grisons 8 tranches  (par personne : 4 tranches)"], "ing": ["200 g de fèves", "1 échalote", "100 g de feta", "4 poignées de pousses d'épinard", "4 abricots secs", "1 orange", "8 tranches de viande des Grisons", "Sauce", "Le jus de l'orange", "3 c. à soupe d'huile d'olive", "1 c. à café de pesto au basilic", "1 pincée de cumin en poudre", "Sel & poivre"], "etapes": ["Blanchir les fèves 2 min à l'eau bouillante salée, égoutter et rafraîchir.", "Ciseler l'échalote et les pousses d'épinard, émietter la feta, hacher les abricots.", "Couper 2 tranches d'orange et presser le reste pour la sauce ; émulsionner tous les ingrédients de la sauce.", "Composer les bowls, ajouter la viande des Grisons et servir avec le reste de sauce."]}, {"n": 32, "titre": "Moules, chorizo & riz sauvage", "meta": ["Authentiques Buddha Bowls  ·  Déclinaison gourmande  ·  page 86", "Pour 2  ·  préparation 10 min  ·  cuisson 20 min", "Protéine : Moules ×30 (+ chorizo 30 g)  (par personne : 15 moules)"], "ing": ["120 g de riz sauvage", "30 moules", "30 g de chorizo", "2 brins de céleri", "Sauce", "1 c. à soupe d'aneth", "Le jus de 1 citron vert", "3 c. à soupe d'huile d'olive", "Sel & poivre"], "etapes": ["Rincer le riz sauvage et le cuire selon le paquet.", "Cuire les moules à couvert dans une casserole avec un petit fond d'eau jusqu'à ouverture.", "Couper le chorizo en dés et le griller 1 min à la poêle chaude ; émincer le céleri.", "Sauce : ciseler l'aneth et émulsionner tous les ingrédients.", "Composer les bowls et servir avec la sauce."]}, {"n": 27, "titre": "À la mexicaine", "meta": ["Authentiques Buddha Bowls  ·  Déclinaison gourmande  ·  page ~76", "Pour 2  ·  préparation 15 min  ·  cuisson 5 min", "Protéine : Steaks hachés ×2  (par personne : 1 steak haché)"], "ing": ["1 avocat", "2 tomates cerises", "¼ d'oignon doux", "Le jus de ½ citron vert", "Tabasco®", "½ poivron jaune", "½ poivron rouge", "1 salade iceberg", "¼ d'oignon rouge", "1 petite gousse d'ail", "1 petit morceau de gingembre frais", "3 brins de coriandre", "2 steaks hachés", "1 c. à soupe d'huile d'olive", "Piments verts (facultatif)", "Sel & poivre", "Sauce", "Le jus de ½ citron vert", "2 c. à soupe d'huile d'olive", "Sel & poivre"], "etapes": ["Peler l'avocat, ôter le noyau et le mixer avec les tomates cerises et l'oignon doux ; ajouter le jus de citron vert, saler, poivrer et quelques gouttes de Tabasco.", "Couper les poivrons en dés, hacher la salade, émincer l'oignon rouge, hacher l'ail et le gingembre, ciseler la coriandre.", "Cuire les steaks hachés à la poêle chaude huilée en les émiettant ; ajouter l'ail et le gingembre, poursuivre la cuisson, puis la coriandre ; assaisonner.", "Sauce : émulsionner tous les ingrédients.", "Composer les bowls et arroser poivrons et salade de sauce."]}, {"n": 28, "titre": "Bibimbap", "meta": ["Authentiques Buddha Bowls  ·  Déclinaison gourmande  ·  page ~78", "Pour 2  ·  préparation 15 min  ·  cuisson 20 min", "Protéine : Filet de bœuf 240 g + 2 œufs  (par personne : 120 g bœuf + 1 œuf)"], "ing": ["140 g de riz thaï", "½ oignon jaune", "1 c. à soupe d'huile de sésame", "1 pincée de cumin en poudre", "2 petites carottes", "1 courgette", "1 c. à soupe d'huile d'olive", "240 g de filet de bœuf", "2 c. à soupe de sauce teriyaki", "1 c. à soupe de graines de sésame", "2 œufs", "1 noisette de beurre", "4 brins de coriandre", "Sel & poivre", "Sauce", "Le jus de ½ citron vert", "2 c. à soupe d'huile d'olive", "1 c. à soupe de sauce soja", "Sel & poivre"], "etapes": ["Rincer le riz jusqu'à eau claire et le cuire selon le paquet ; égoutter et rafraîchir.", "Émincer l'oignon et le faire revenir 3 min dans l'huile de sésame ; ajouter le riz, cuire 3 à 4 min en remuant, puis le cumin ; assaisonner.", "Couper carottes et courgette en dés et les faire revenir 3 min à l'huile d'olive ; assaisonner.", "Trancher le bœuf en lamelles, l'enduire de sauce teriyaki et de sésame, le saisir 30 s par face à la poêle très chaude.", "Sauce : émulsionner tous les ingrédients. Cuire les œufs au plat à la poêle légèrement beurrée.", "Composer les bowls, poser l'œuf dessus, parsemer de coriandre et napper de sauce."]}, {"n": 29, "titre": "Thon au sésame, écrasé de pommes de terre au citron & shiitakes", "meta": ["Authentiques Buddha Bowls  ·  Déclinaison gourmande  ·  page ~80", "Pour 2  ·  préparation 20 min  ·  cuisson 20 min", "Protéine : Thon rouge 220 g (2 tranches)  (par personne : 110 g)"], "ing": ["240 g de pommes de terre grenailles", "5 c. à soupe d'huile d'olive", "Le jus et le zeste de 1 citron jaune", "8 champignons shiitakes", "10 g de beurre", "200 g de brocoli", "1 c. à soupe de sauce soja", "220 g de thon rouge (2 tranches)", "3 c. à soupe de graines de sésame", "Sel & poivre"], "etapes": ["Éplucher les pommes de terre et les cuire environ 20 min dans l'eau bouillante salée ; égoutter, écraser à la fourchette avec 3 c. à soupe d'huile d'olive, le zeste et le jus du citron.", "Couper les shiitakes en quatre et les cuire à la poêle chaude beurrée ; assaisonner.", "Émincer très finement les fleurettes de brocoli à la mandoline et les mélanger à 1 c. à soupe d'huile d'olive et à la sauce soja.", "Huiler légèrement les tranches de thon, les enrober de sésame et les saisir 40 s par face à la poêle très chaude.", "Composer les bowls avec l'ensemble des préparations."]}, {"n": 30, "titre": "Salade César au kale & grenade", "meta": ["Authentiques Buddha Bowls  ·  Déclinaison gourmande  ·  page ~82", "Pour 2  ·  préparation 15 min  ·  cuisson 15 min", "Protéine : Filet de poulet 240 g  (par personne : 120 g)"], "ing": ["240 g de filet de poulet", "1 noisette de beurre demi-sel", "2 tranches de pain de campagne", "1 gousse d'ail", "½ grenade", "4 grandes feuilles de chou kale", "1 c. à soupe d'huile d'olive", "1 c. à café de vinaigre balsamique", "2 poignées de noisettes", "40 g de parmesan", "Sel & poivre", "Sauce", "1 yaourt", "1 c. à soupe de jus de citron jaune", "1 c. à soupe d'huile d'olive", "2 c. à café de moutarde à l'ancienne", "Sel & poivre"], "etapes": ["Cuire le filet de poulet à la poêle légèrement beurrée, assaisonner, couper en dés.", "Toaster le pain, le frotter à la gousse d'ail pelée et le couper en gros morceaux.", "Égrainer la grenade ; émincer le kale et le mélanger à l'huile d'olive et au vinaigre balsamique.", "Sauce : émulsionner tous les ingrédients. Concasser les noisettes, râper le parmesan.", "Composer les bowls, ajouter parmesan et noisettes, napper de sauce."]}, {"n": 31, "titre": "Kitchari", "meta": ["Authentiques Buddha Bowls  ·  Déclinaison gourmande  ·  page ~84", "Pour 2  ·  préparation 10 min  ·  cuisson 17 min", "Protéine : Lentilles corail 50 g  (par personne : 25 g lentilles corail (faible apport))"], "ing": ["4 carottes", "2 navets", "1 c. à soupe d'huile d'olive", "1 c. à café de graines de cumin", "1 c. à café de graines de moutarde", "1 c. à café de curcuma en poudre", "½ c. à café de gingembre en poudre", "100 g de riz basmati", "50 g de lentilles corail", "½ concombre noa", "Quelques brins de coriandre", "2 c. à soupe de noix de coco râpée", "Sauce", "1 yaourt", "Le jus de ½ citron jaune", "1 pincée de curry en poudre", "Sel & poivre"], "etapes": ["Éplucher carottes et navets, les couper en dés.", "Chauffer l'huile avec le cumin et la moutarde, y faire revenir les légumes 2 min ; ajouter curcuma et gingembre, puis le riz et les lentilles ; couvrir d'eau, porter à ébullition, couvrir et cuire 15 min à feu doux.", "Émincer finement le concombre. Sauce : émulsionner tous les ingrédients.", "Composer les bowls, parsemer de noix de coco et de coriandre, napper de sauce."]}, {"n": 33, "titre": "Omelette, nouilles ramen & shiitakes", "meta": ["Authentiques Buddha Bowls  ·  Déclinaison gourmande  ·  page ~88", "Pour 2  ·  préparation 15 min  ·  cuisson 10 min", "Protéine : Œufs ×2  (par personne : 1 œuf)"], "ing": ["200 g de nouilles pour ramen", "2 carottes de couleurs", "8 champignons shiitakes", "1 noisette de beurre", "2 œufs", "8 brins de coriandre", "20 cl de bouillon de légumes (facultatif)", "Sel & poivre", "Sauce", "Le jus de ½ citron vert", "2 c. à soupe d'huile d'arachide", "1 c. à soupe de sauce soja", "1 c. à café de beurre de cacahuètes", "1 c. à café de sauce chili"], "etapes": ["Cuire les nouilles pour ramen selon le paquet, égoutter et rafraîchir.", "Émincer finement les carottes ; nettoyer et émincer les shiitakes, les cuire à la poêle chaude avec le beurre, assaisonner.", "Battre les œufs, les assaisonner et les cuire en omelette fine dans une grande poêle.", "Sauce : émulsionner tous les ingrédients.", "Composer les bowls, parsemer de coriandre, servir avec la sauce (bouillon de légumes chaud par-dessus si on veut)."]}, {"n": 37, "titre": "Tartare de bœuf thaï, chou blanc & radis noir", "meta": ["Authentiques Buddha Bowls  ·  Déclinaison gourmande  ·  page ~96", "Pour 2  ·  préparation 15 min  ·  cuisson 8 min", "Protéine : Filet de bœuf 240 g  (par personne : 120 g)"], "ing": ["240 g de filet de bœuf", "140 g de boulgour", "200 g de chou blanc", "1 c. à soupe d'huile d'olive", "1 c. à soupe de jus de citron jaune", "2 poignées de cacahuètes", "Quelques brins de coriandre", "30 g de radis noir", "Sauce", "1 petit morceau de gingembre frais", "1 piment rouge", "Le jus de 1 citron vert", "3 c. à soupe d'huile d'olive", "1 c. à soupe de sauce soja"], "etapes": ["Sauce : hacher le gingembre et le piment, puis émulsionner tous les ingrédients.", "Couper la viande en dés, la mélanger à 2 c. à soupe de sauce et réserver au frais.", "Cuire le boulgour selon le paquet, égoutter et rafraîchir.", "Émincer et hacher finement le chou, le mélanger à l'huile d'olive et au citron jaune ; émincer le radis noir à la mandoline ; hacher les cacahuètes.", "Composer les bowls, parsemer de cacahuètes et de coriandre, servir avec le reste de sauce."]}, {"n": 34, "titre": "Sauté de porc, sauce moutarde & choux de Bruxelles", "meta": ["Authentiques Buddha Bowls  ·  Déclinaison gourmande  ·  page ~90", "Pour 2  ·  préparation 15 min  ·  cuisson 40 min", "Protéine : Échine de porc 220 g  (par personne : 110 g)"], "ing": ["20 choux de Bruxelles", "120 g de riz blanc", "½ oignon", "1 c. à soupe d'huile d'olive", "1 pincée de curry en poudre", "220 g d'échine de porc", "1 noisette de beurre demi-sel", "2 poignées de pousses de soja", "Graines de courge", "Sauce", "1 c. à soupe d'huile d'olive", "1 c. à soupe de moutarde à l'ancienne", "2 c. à café de moutarde", "Sel & poivre"], "etapes": ["Cuire les choux de Bruxelles à la vapeur jusqu'à tendreté, en les gardant un peu croquants.", "Cuire le riz selon le paquet, égoutter et rafraîchir.", "Émincer l'oignon et le faire revenir 2 min à la poêle huilée ; ajouter le riz, cuire 3 à 4 min en remuant, puis le curry ; assaisonner.", "Couper l'échine de porc en lamelles et la cuire à la poêle légèrement beurrée.", "Sauce : émulsionner tous les ingrédients.", "Composer les bowls, ajouter les pousses de soja, parsemer de graines de courge et napper de sauce."]}, {"n": 35, "titre": "Porc épicé, kimchi & riz parfumé", "meta": ["Authentiques Buddha Bowls  ·  Déclinaison gourmande  ·  page ~92", "Pour 2  ·  préparation 20 min  ·  cuisson 20 min", "Protéine : Échine de porc 240 g  (par personne : 120 g)"], "ing": ["120 g de riz basmati", "1 petit oignon", "½ c. à soupe d'huile de coco", "1 pincée de cumin en poudre", "6 radis", "½ gousse d'ail", "1 c. à café de gingembre frais", "1 piment rouge (facultatif)", "6 brins de coriandre", "240 g d'échine de porc", "Huile d'olive", "1 c. à café de sauce d'huître", "300 g de kimchi", "Sauce", "Le jus de 1 citron vert", "2 c. à soupe d'huile d'olive", "1 c. à soupe de sauce soja", "Sel & poivre"], "etapes": ["Rincer le riz jusqu'à eau claire. Émincer l'oignon et le faire revenir 2 min dans l'huile de coco (faitout) ; ajouter le riz et cuire 2 min en remuant.", "Couvrir d'eau à 1 cm au-dessus du riz, ajouter le cumin, porter à ébullition puis cuire doucement à couvert jusqu'à absorption (environ 15 min).", "Émincer les radis ; hacher l'ail et le gingembre ; ciseler le piment si on veut.", "Cuire l'échine de porc à la poêle huilée très chaude ; hacher la viande cuite au couteau, la mélanger à l'ail, au gingembre et à la coriandre ; ajouter le piment et la sauce d'huître, puis la resaisir 1 min en remuant.", "Sauce : émulsionner tous les ingrédients.", "Composer les bowls avec le kimchi et servir avec la sauce."]}, {"n": 36, "titre": "Œufs brouillés au curcuma, kale & haricots rouges", "meta": ["Authentiques Buddha Bowls  ·  Déclinaison gourmande  ·  page ~94", "Pour 2  ·  préparation 10 min  ·  cuisson 3 min", "Protéine : Œufs ×2 + haricots rouges cuits 220 g  (par personne : 1 œuf + 110 g haricots rouges)"], "ing": ["1 avocat", "1 fruit de la Passion", "4 branches de chou kale", "2 c. à café d'huile d'olive", "2 œufs", "2 c. à soupe de crème (végétale ou animale)", "½ c. à café de curcuma en poudre", "1 c. à café d'huile de colza", "220 g de haricots rouges cuits", "Sauce", "2 c. à soupe d'huile d'olive", "1 c. à soupe de graines de sésame", "1 c. à soupe de sauce soja", "1 c. à café d'huile de sésame", "Sel & poivre"], "etapes": ["Peler l'avocat et le couper en morceaux ; prélever la chair du fruit de la Passion.", "Émincer le kale et le faire revenir 1 min à la poêle bien chaude légèrement huilée.", "Battre les œufs avec la crème et le curcuma et les cuire à feu doux à la poêle légèrement huilée en remuant à la spatule.", "Sauce : émulsionner tous les ingrédients.", "Composer les bowls avec les haricots rouges et servir avec la sauce."]}, {"n": 38, "titre": "Keftas de poisson, semoule & fenouil", "meta": ["Authentiques Buddha Bowls  ·  Déclinaison gourmande  ·  page ~98", "Pour 2  ·  préparation 25 min  ·  cuisson 15 min", "Protéine : Poisson blanc 280 g (+ 1 jaune d'œuf)  (par personne : 140 g)"], "ing": ["120 g de semoule", "½ fenouil", "20 tomates cerises", "2 brins d'aneth", "½ oignon jaune", "1 c. à soupe d'huile d'olive", "Keftas", "4 feuilles de menthe", "2 brins de coriandre", "2 brins de persil", "280 g de poisson blanc", "1 jaune d'œuf", "¼ d'oignon doux", "1 c. à soupe de chapelure", "½ c. à café de cumin en poudre", "½ c. à café de sel", "2 pincées de poivre moulu", "2 c. à soupe d'huile d'olive", "Sauce", "Le jus de 1 citron vert", "3 c. à soupe d'huile d'olive", "1 pincée de sel"], "etapes": ["Cuire la semoule selon le paquet et l'égrainer. Sauce : émulsionner tous les ingrédients.", "Émincer le fenouil, couper les tomates cerises en deux.", "Faire revenir l'oignon haché 2 min à feu vif dans l'huile d'olive, ajouter les tomates, cuire encore 2 min, retirer du feu, assaisonner.", "Keftas : ciseler les herbes, hacher le poisson et l'oignon doux, tout mélanger, former 10 boulettes et les cuire 5 min de chaque côté à la poêle huilée.", "Composer les bowls, parsemer d'aneth et servir avec la sauce."]}, {"n": 39, "titre": "Brochettes de poulet au curry & sauce satay", "meta": ["Authentiques Buddha Bowls  ·  Déclinaison gourmande  ·  page ~100", "Pour 2  ·  préparation à café de pâte de curry rouge", "Sel & poivre"], "etapes": ["Cuire le riz semi-complet selon le paquet en le gardant légèrement croquant, égoutter et rafraîchir.", "Émincer très finement les fleurettes de brocoli à la mandoline, les mélanger à 2 c. à soupe d'huile et au jus de citron, assaisonner.", "Couper en dés le poivron ; émincer oignon et gingembre ; écraser l'ail ; couper les tomates en quatre et le poisson en gros morceaux.", "Faire revenir l'oignon 3 min dans 1 c. à soupe d'huile ; ajouter tomates, ail et gingembre, cuire 2 min, ajouter 10 cl d'eau et mijoter 5 min ; mixer en sauce lisse.", "Remettre la sauce dans la casserole, y mêler la pâte de curry rouge, plonger le poisson et cuire 4 à 5 min à feu doux.", "Composer les bowls et parsemer d'amandes hachées et de coriandre."]}, {"n": 41, "titre": "Nuggets de poulet & sauce à l'avocat", "meta": ["Authentiques Buddha Bowls  ·  Déclinaison gourmande  ·  page ~104", "Pour 2  ·  préparation 20 min  ·  cuisson 20 min", "Protéine : Blanc de poulet 200 g  (par personne : 100 g)"], "ing": ["120 g de riz semi-complet", "1 salade iceberg", "20 tomates cerises", "200 g de blanc de poulet", "2 c. à soupe de farine", "80 g de mangue", "1 œuf", "100 g de panko (chapelure japonaise)", "Huile d'arachide", "40 g de maïs en boîte", "2 c. à soupe d'oignons frits", "Sauce", "¼ d'avocat", "3 c. à soupe d'huile d'olive", "2 c. à café de sauce soja", "1 c. à soupe de jus d'orange"], "etapes": ["Cuire le riz semi-complet selon le paquet en le gardant ferme, égoutter et rafraîchir.", "Émincer la salade, couper les tomates en deux, la mangue en dés et le poulet en dés.", "Sauce : mixer tous les ingrédients jusqu'à texture lisse.", "Paner le poulet : passer les morceaux dans la farine, l'œuf battu, puis le panko.", "Les frire 3 à 4 min dans l'huile d'arachide (en deux fois si besoin) jusqu'à belle coloration ; égoutter sur papier absorbant.", "Composer les bowls avec le maïs égoutté, parsemer d'oignons frits et servir avec la sauce."]}, {"n": 42, "titre": "Crevettes panées, chou blanc & sauce au citron confit", "meta": ["Authentiques Buddha Bowls  ·  Déclinaison gourmande  ·  page 106", "Pour 2  ·  préparation 20 min  ·  cuisson 3 min", "Protéine : Crevettes crues décortiquées ×18  (par personne : 9 crevettes)"], "ing": ["½ avocat", "200 g de chou blanc", "½ concombre noa", "100 g de mangue", "2 c. à soupe de farine", "1 œuf", "100 g de panko (chapelure japonaise)", "18 crevettes crues décortiquées", "Huile d'arachide", "Graines de sésame", "Sauce", "1 petit citron confit", "3 c. à soupe d'huile d'olive"], "etapes": ["Sauce : mixer le citron confit coupé en deux avec l'huile jusqu'à texture lisse.", "Peler et trancher l'avocat, émincer le chou, couper le concombre en fines tranches et la mangue en dés.", "Paner les crevettes : farine, puis œuf battu, puis panko.", "Les frire 3 à 4 min dans l'huile d'arachide (en deux fois si besoin) ; égoutter sur papier absorbant.", "Composer les bowls, parsemer de sésame et servir avec la sauce."]}, {"n": 45, "titre": "Salade de bœuf aigre et épicée au riz grillé et à la coriandre", "meta": ["Livre thaï (titre non visible)  ·  Salade  ·  page 50", "Pour 4  ·  préparation 10 min  ·  cuisson 8 min", "Cuisson 6-8 min", "Protéine : Gîte de bœuf 400 g  (par personne : 100 g)"], "ing": ["400 g de gîte de bœuf", "2 longs piments rouges", "3 ciboules", "½ botte de coriandre", "12 feuilles de menthe", "Le jus de 3 citrons verts", "1 c. à café de cannelle en poudre", "1 c. à café de cumin en poudre", "1 c. à café de coriandre en poudre", "Poivre noir", "2 c. à soupe de sauce soja claire", "4 c. à soupe de riz grillé moulu (voir p. 15) ou graines de sésame grillées", "Sel"], "etapes": ["Assaisonner le bœuf de sel, poivre noir, cannelle, cumin et coriandre en poudre ; bien l'enrober.", "Griller la viande environ 6 à 8 min (gril, plancha ou barbecue) selon la cuisson voulue ; laisser reposer 5 min en gardant le jus, puis trancher.", "Dans un saladier, mélanger piments, ciboules, coriandre, menthe et jus de citron vert avec le bœuf et son jus, puis la sauce soja.", "Incorporer la moitié du riz grillé moulu (ou des graines de sésame), goûter, rectifier, puis ajouter le reste."]}, {"n": 43, "titre": "Crevettes tandoori, haricots à la coco & riz parfumé", "meta": ["Authentiques Buddha Bowls  ·  Déclinaison gourmande  ·  page 108", "Pour 2  ·  préparation 15 min  ·  cuisson 20 min", "Marinade 1 h minimum", "Protéine : Crevettes crues décortiquées ×18  (par personne : 9 crevettes)"], "ing": ["18 crevettes crues décortiquées", "1 oignon jaune", "1 c. à soupe d'huile d'olive", "120 g de riz basmati", "2 c. à café de graines de cumin", "240 g de haricots verts frais", "1 c. à soupe d'huile de coco", "2 c. à soupe de noix de coco râpée", "100 g d'ananas", "1 poignée de noix de cajou", "Sel & poivre", "Marinade", "3 c. à soupe de yaourt", "Le jus de 1 citron vert", "2 c. à soupe de miel", "2 c. à café de paprika", "2 c. à café de gingembre en poudre", "2 c. à café de coriandre en poudre", "1 gousse d'ail"], "etapes": ["Mélanger les ingrédients de la marinade (ail haché), en enrober les crevettes enfilées par 3 sur des piques en bois et laisser 1 h minimum au frais.", "Riz : émincer l'oignon, le faire revenir 3 min ; ajouter le riz, cuire 2 min en remuant ; ajouter le cumin, couvrir d'eau à 1 cm au-dessus (≈ 1,5 fois le volume du riz), porter à ébullition, baisser, couvrir, cuire 15 min.", "Couper les haricots verts et les faire revenir 5 min à l'huile de coco ; ajouter la noix de coco râpée jusqu'à légère coloration ; assaisonner.", "Griller les brochettes de crevettes 2 min de chaque côté à la poêle chaude ; couper l'ananas en morceaux.", "Composer les bowls et parsemer de noix de cajou hachées."]}, {"n": 44, "titre": "Rouleaux de printemps croustillants au poulet, piment et gingembre", "meta": ["Livre thaï (titre non visible)  ·  Finger food  ·  page 26", "Pour 4  ·  préparation 50 min  ·  cuisson 15 min", "Cuisson 15 min par fournée", "Protéine : Poulet haché 250 g (+ 2 œufs)  (par personne : ≈ 62 g)"], "ing": ["2 gousses d'ail", "1 piment rouge", "4 cm de gingembre", "200 g de pleurotes", "50 g d'oignon", "250 g de poulet haché", "4 ciboules", "2 œufs", "1 poignée de coriandre", "Sauce au piment doux (voir p. 206) ou sauce aigre au piment rouge (voir p. 202)", "1 c. à café de cinq-épices", "Poivre noir", "¼ c. à café de sel", "2 c. à soupe de sauce de poisson", "200 ml d'huile végétale", "Feuilles de riz pour rouleaux de printemps (3 par personne)"], "etapes": ["Faire revenir 2 min à feu moyen dans un peu d'huile l'ail, le piment et le gingembre, puis les pleurotes et l'oignon à feu vif jusqu'à dorure ; saler, poivrer.", "Mélanger dans un saladier le poulet haché, les ciboules, les œufs, la coriandre, le cinq-épices et la sauce de poisson ; ajouter les champignons et l'oignon. Tester une petite quantité en la faisant frire 1 à 2 min et rectifier l'assaisonnement.", "Former les rouleaux avec les feuilles de riz selon la technique décrite p. 24-25 du livre.", "Frire quelques rouleaux à la fois environ 5 min dans l'huile en les retournant, jusqu'à dorure ; égoutter sur papier absorbant et réchauffer l'huile 1 min entre deux fournées.", "Servir enveloppés de feuilles de laitue avec de la coriandre, à tremper dans la sauce au piment (p. 206 ou 202)."]}, {"n": 46, "titre": "Salade de poulet au sésame et au poivre blanc", "meta": ["Livre thaï (titre non visible)  ·  Salade  ·  page 58", "Pour 4  ·  préparation 10 min  ·  cuisson 5 min", "Pochage 20 min", "Protéine : Blancs de poulet sans la peau ×3  (par personne : ≈ ¾ blanc)"], "ing": ["4 brins de coriandre (tiges réservées)", "6 branches de céleri", "4 cm de gingembre", "3 blancs de poulet sans la peau", "2 gousses d'ail", "2 piments verts", "4 ciboules", "6 grains de poivre blanc", "1 c. à café de poivre blanc moulu", "2 c. à soupe de sauce de poisson", "2 c. à soupe de vinaigre de riz", "¼ c. à café de sel", "1 c. à café de sucre en poudre", "2 c. à soupe d'huile de sésame", "2 c. à soupe de graines de sésame"], "etapes": ["Pocher le poulet : porter de l'eau à ébullition avec les tiges de coriandre, 2 branches de céleri, les épluchures de gingembre et les grains de poivre blanc ; ajouter les blancs, reprendre l'ébullition, écumer, laisser frémir 5 min, couvrir, éteindre et laisser reposer 20 min. Sortir et laisser refroidir.", "Couper le reste du céleri en demi-lunes, le blanchir 10 s, rafraîchir à l'eau froide, égoutter.", "Mélanger dans un saladier l'ail, les piments, le gingembre, les ciboules, la sauce de poisson, le vinaigre, le sel, le sucre et le poivre blanc moulu ; laisser reposer.", "Trancher le poulet (≈ 1 cm × 3 cm), le mélanger au céleri et à l'huile de sésame, verser la sauce, laisser reposer 5 min.", "Griller à sec les graines de sésame 3 à 4 min à feu moyen jusqu'à dorure.", "Ajouter feuilles de coriandre et sésame, mélanger et servir."]}, {"n": 47, "titre": "Brochettes de bœuf thaïes au vinaigre pimenté", "meta": ["Livre thaï (titre non visible)  ·  Viande  ·  page 74", "Pour 4-6  ·  préparation 20 min  ·  cuisson 10 min", "Marinade 30 min", "Protéine : Bœuf tendre (rumsteck, aloyau ou faux-filet) 400 g  (par personne : 67–100 g)"], "ing": ["400 g de bœuf tendre (rumsteck, aloyau ou faux-filet)", "3 racines de coriandre", "3 cm de gingembre", "Vinaigre au piment rouge (voir p. 200)", "1 poignée de feuilles de coriandre", "20 grains de poivre blanc", "½ c. à café de cinq-épices en poudre", "¼ c. à café de curcuma en poudre", "½ c. à café de coriandre en poudre", "Poivre noir", "2 c. à soupe de sauce soja claire", "1 pincée de sel", "3-4 c. à soupe d'huile végétale", "Brochettes métalliques ou piques en bambou"], "etapes": ["Mélanger la sauce soja avec un peu de poivre noir, y enrober la viande et laisser mariner 30 min au frais.", "Piler au mortier les racines de coriandre, le sel et le poivre blanc en grains ; ajouter le gingembre et les autres épices, piler en pâte grossière.", "Enrober la viande marinée de cette pâte ; enfiler 3 à 4 morceaux par brochette.", "Chauffer l'huile à feu vif dans un wok et saisir les morceaux environ 2 min par côté jusqu'à dorure ; laisser reposer quelques minutes hors de l'huile.", "Servir avec le vinaigre au piment rouge (p. 200) et des feuilles de coriandre, avec une salade ou des nouilles."]}, {"n": 48, "titre": "Ailes de poulet parfumées au galanga", "meta": ["Livre thaï (titre non visible)  ·  Viande  ·  page 76", "Pour 4-6  ·  préparation 10 min  ·  cuisson 10 min", "Marinade 1 h ; cuisson 8-10 min", "Protéine : Ailes de poulet 700 g  (par personne : 117–175 g)"], "ing": ["2 gousses d'ail", "4 racines de coriandre", "2 longs piments verts", "4 cm de galanga (ou gingembre)", "700 g d'ailes de poulet", "1 c. à soupe de graines de coriandre broyées", "½ c. à café de cannelle en poudre", "½ c. à café de piment séché broyé", "¼ c. à café de cardamome en poudre", "2 c. à soupe de sauce de poisson", "1 c. à soupe de sucre de palme râpé", "Quartiers de citron vert (pour servir)", "Sauce au piment doux (voir p. 206)"], "etapes": ["Mélanger dans un grand saladier l'ail, les racines de coriandre, les piments, le galanga, les épices, la sauce de poisson et le sucre de palme.", "Y enrober les ailes de poulet et laisser mariner 1 h au frais.", "Chauffer très fort une plancha ou un barbecue et griller les ailes 8 à 10 min en les tournant toutes les 2 min ; vérifier la cuisson en en tranchant une.", "Servir avec des quartiers de citron vert et la sauce au piment doux (p. 206)."]}, {"n": 49, "titre": "Bavette épicée à la sauce piquante et acidulée", "meta": ["Livre thaï (titre non visible)  ·  Viande  ·  page 80", "Pour 4  ·  préparation 5 min  ·  cuisson 8 min", "Marinade 30 min ; cuisson 7-8 min", "Protéine : Steak (bavette) 200 g — tel qu'imprimé pour 4 pers.  (par personne : 50 g (quantité imprimée))"], "ing": ["200 g de steak (bavette)", "12 feuilles de menthe", "½ botte de coriandre", "1 portion de sauce aigre au piment rouge (voir p. 202)", "1 c. à café de coriandre en poudre", "½ c. à café de cardamome en poudre", "½ c. à café de noix de muscade râpée", "½ c. à café de piment séché broyé", "1 c. à café de gingembre en poudre", "Poivre noir", "1 c. à soupe d'huile végétale", "Sel"], "etapes": ["Mélanger toutes les épices dans un saladier, en frotter la viande et laisser mariner 30 min au frais.", "Chauffer un gril, une plancha ou une poêle ; saler la viande juste avant, la badigeonner d'huile et la griller 2 min, la retourner, 2 min encore, en répétant jusqu'à cuisson à point (≈ 7 à 8 min au total) ; laisser reposer 5 min en gardant le jus.", "Trancher la viande épais dans le sens contraire des fibres ; mélanger menthe et coriandre avec la sauce aigre au piment rouge (p. 202) et le jus de cuisson, en napper la viande ; ajuster avec un peu de sauce au piment.", "Servir avec une salade de chou aux noix de cajou grillées ou des légumes verts sautés à l'ail."]}, {"n": 50, "titre": "Sauté de bœuf au relish pimenté", "meta": ["Livre thaï (titre non visible)  ·  Viande  ·  page ~82", "Pour 4  ·  préparation 15 min  ·  cuisson 11 min", "Cuisson 9-11 min", "Protéine : Bœuf tendre 500 g  (par personne : 125 g)"], "ing": ["500 g de bœuf tendre", "3 c. à soupe de Nam Prik Pao (voir p. 208)", "150 g de haricots verts parés ou pois gourmands", "4 ciboules", "1 gros piment rouge moyennement fort", "1 poignée de germes de soja", "3 brins de menthe", "3 brins de coriandre", "Le jus de 1 citron vert", "2 c. à soupe d'huile végétale"], "etapes": ["Chauffer un wok à feu vif ; saisir le bœuf en trois fois dans l'huile, en remuant 2 à 3 min jusqu'à dorure, et le mettre de côté.", "Remettre toute la viande dans le wok à feu moyen avec le Nam Prik Pao et les haricots verts ; chauffer 2 min.", "Ajouter les ciboules et cuire 1 min : les légumes restent croquants.", "Ajouter piment, germes de soja, coriandre, menthe et jus de citron vert ; rectifier l'assaisonnement.", "Servir avec du riz vapeur ou des nouilles."]}, {"n": 54, "titre": "Thon grillé, sauce au basilic thaï", "meta": ["Livre thaï (titre non visible)  ·  Poisson / fruits de mer  ·  page 122", "Pour 4-6  ·  préparation 10 min  ·  cuisson 1 min", "Protéine : Thon 500 g (3 tranches)  (par personne : 83–125 g)"], "ing": ["2 piments rouges", "2 ciboules", "Le zeste râpé et le jus de 2 citrons verts", "500 g de thon coupé en 3 tranches", "2 brins de coriandre", "2 brins de basilic thaï (ou basilic commun)", "1 c. à soupe de graines de coriandre", "¼ c. à café de poivre noir moulu", "2 c. à soupe de sauce de poisson", "2 c. à café d'huile de sésame", "Huile végétale pour friture", "Sel"], "etapes": ["Griller à sec les graines de coriandre à feu moyen, puis les piler grossièrement.", "Mélanger tous les ingrédients de la sauce sauf le thon et les herbes ; réserver.", "Chauffer une poêle antiadhésive à feu vif avec un peu d'huile ; saler et poivrer les steaks de thon et les saisir 40 s par face.", "Les poser sur une planche, les trancher finement au couteau à pain et les disposer sur un plat.", "Napper de sauce et parsemer de coriandre et de basilic juste avant de servir."]}, {"n": 51, "titre": "Poulet caramélisé au piment", "meta": ["Livre thaï (titre non visible)  ·  Viande  ·  page 98", "Pour 4-6  ·  préparation 10 min  ·  cuisson 15 min", "Marinade 1 h", "Protéine : Pilons de poulet avec la peau ×8 à 12  (par personne : 2 pilons)"], "ing": ["8 à 12 pilons de poulet avec la peau", "1 portion de caramel au piment et au tamarin (voir p. 203)", "Quartiers de citron vert pour servir", "1 c. à café de cannelle en poudre", "½ c. à café de poivre blanc moulu", "½ c. à café de piment de la Jamaïque", "½ c. à café de coriandre en poudre", "½ c. à café de curcuma en poudre", "Poivre noir", "1 c. à soupe d'huile végétale", "Sel"], "etapes": ["Entailler 3 fois chaque pilon jusqu'à l'os pour que la marinade pénètre.", "Mélanger les épices avec un peu de poivre noir et l'huile, en enrober les pilons dans un plat et laisser mariner 1 h minimum au frais.", "Four à 200 °C. Poser les pilons sur un plat avec papier sulfurisé, saler et enfourner 10 min (aux trois quarts cuits).", "Les sortir, les napper de la moitié du caramel au piment et au tamarin (p. 203), et enfourner 5 min de plus.", "Servir avec des quartiers de citron vert et le reste du caramel."]}, {"n": 52, "titre": "Poisson grillé au curcuma", "meta": ["Livre thaï (titre non visible)  ·  Poisson / fruits de mer  ·  page 112", "Pour 4-6  ·  préparation 20 min  ·  cuisson 10 min", "Marinade 20 min ; cuisson 9-10 min", "Protéine : 1 poisson entier d'environ 1 kg (daurade, bar ou vivaneau)  (par personne : ≈ 170–250 g (poisson entier))"], "ing": ["2 citrons verts (+ quartiers supplémentaires)", "4 piments rouges", "2 tiges de citronnelle", "4 cm de gingembre", "4 échalotes", "1 poisson entier (daurade, bar ou vivaneau) d'environ 1 kg nettoyé (ou 4-6 petits poissons)", "1 c. à café de curcuma en poudre", "1 c. à café de sel", "200 ml de crème de coco"], "etapes": ["Peler à vif les citrons verts (sans peau blanche) et hacher finement la pulpe.", "Piler au mortier les piments et le sel, ajouter citronnelle et gingembre, puis échalotes et pulpe de citron vert, avec un peu de crème de coco, pour obtenir une pâte.", "La mélanger dans un saladier avec le reste de crème de coco et le curcuma.", "Inciser le poisson 3 fois en diagonale de chaque côté jusqu'à l'arête ; l'enduire de marinade et laisser 20 min au frais en le retournant de temps en temps.", "Poser le poisson sur une feuille d'aluminium pliée en deux sur un barbecue ou une plancha chaud ; griller 5 à 6 min par côté en l'arrosant de marinade.", "Servir aussitôt avec des quartiers de citron vert."]}, {"n": 53, "titre": "Sauté de cabillaud aux pois gourmands, au gingembre et au cinq-épices", "meta": ["Livre thaï (titre non visible)  ·  Poisson / fruits de mer  ·  page 116", "Pour 4  ·  préparation 10 min  ·  cuisson 8 min", "Protéine : Cabillaud 600 g  (par personne : 150 g)"], "ing": ["4 cm de gingembre", "200 g de pois gourmands", "2 gousses d'ail", "3 racines de coriandre", "1 piment rouge", "600 g de cabillaud (ou autre poisson à chair blanche et ferme)", "4 ciboules", "Le jus de 1 citron vert", "3 brins de coriandre", "1 c. à café de cinq-épices", "½ c. à café de coriandre en poudre", "½ c. à café de cannelle en poudre", "Poivre noir", "2 c. à soupe d'huile végétale", "1½ c. à soupe de sauce de poisson", "1 c. à soupe de sauce soja", "Sel"], "etapes": ["Chauffer un wok à feu moyen-vif ; faire revenir le gingembre 1 min dans la moitié de l'huile, ajouter les pois gourmands et les sauter 2 min ; saler, poivrer et les retirer.", "Dans le même wok, faire revenir 1 min ail, racines de coriandre et piment avec le reste d'huile ; ajouter le poisson saupoudré des épices, cuire 2 min jusqu'à dorure.", "Verser la sauce de poisson et la sauce soja, faire sauter jusqu'à ce que le liquide bouille.", "Remettre pois et gingembre, ajouter les ciboules, arroser de jus de citron vert et parsemer de coriandre."]}, {"n": 55, "titre": "Crevettes marinées au saté", "meta": ["Livre thaï (titre non visible)  ·  Poisson / fruits de mer  ·  page 124", "Pour 4-6  ·  préparation 10 min  ·  cuisson 10 min", "Marinade 1 h", "Protéine : Grosses crevettes décortiquées 1 kg  (par personne : 167–250 g)"], "ing": ["2 gousses d'ail", "2 tiges de citronnelle", "Le jus de 1 citron vert + quartiers", "1 kg de grosses crevettes décortiquées et déveinées", "½ c. à café de flocons de piment séché", "2 c. à soupe de cacahuètes mondées", "1 pincée de sel", "1 c. à soupe d'huile végétale", "1 c. à café de pâte de crevettes (voir p. 16)", "100 ml de crème de coco", "1 sachet de piques en bambou de 15 cm"], "etapes": ["Dorer les cacahuètes à sec dans une casserole à feu moyen-vif, puis les piler finement.", "Écraser l'ail avec le sel et les flocons de piment en pâte.", "Chauffer l'huile dans une casserole, y faire revenir la pâte d'ail et la pâte de crevettes ; ajouter le jus de citron vert et la crème de coco, laisser frémir 4 à 5 min, rectifier (piquant, sucré, salé, acidulé) et laisser refroidir.", "Y enrober les crevettes et mariner au moins 1 h au frais.", "Enfiler 3 ou 4 crevettes par pique en bambou trempée et les griller 2 à 3 min de chaque côté sur plancha ou barbecue chaud.", "Servir avec des quartiers de citron vert."]}, {"n": 56, "titre": "Curry orange au saumon", "meta": ["Livre thaï (titre non visible)  ·  Curry / soupe  ·  page 138", "Pour 4-6  ·  préparation 5 min  ·  cuisson 10 min", "Protéine : Filets de saumon 500 g  (par personne : 83–125 g)"], "ing": ["500 g de filets de saumon", "1 portion de pâte de curry orange (voir p. 195)", "1 botte d'asperges", "100 g de haricots verts", "1 piment rouge", "2 tiges de citronnelle", "3 feuilles de citron kaffir", "½ petite botte de coriandre", "Le jus de 2 citrons verts", "Poivre noir", "1 c. à soupe de sauce de poisson"], "etapes": ["Chauffer un gril à feu vif ; saler, poivrer les filets de saumon et les griller 2 min de chaque côté, juste pour les marquer (sans les cuire à cœur).", "Chauffer la pâte de curry orange (p. 195) dans une casserole à feu moyen ; y pocher les filets à feu doux environ 2 min, puis ajouter haricots verts et asperges et cuire 3 min de plus.", "Ajouter la moitié du piment, de la citronnelle et des feuilles de kaffir ; verser jus de citron vert et sauce de poisson pour équilibrer ; garnir du reste et de beaucoup de coriandre, servir avec du riz."]}, {"n": 57, "titre": "Poulet à la siamoise", "meta": ["Livre thaï (titre non visible)  ·  Viande  ·  page 84", "Pour 4-6  ·  préparation 20 min  ·  cuisson 10 min", "Protéine : Hauts de cuisse de poulet 400 g  (par personne : 67–100 g)"], "ing": ["400 g de hauts de cuisse de poulet", "3 racines de coriandre", "4 cm de gingembre", "3 gousses d'ail", "½ botte de coriandre", "20 grains de poivre blanc", "1 c. à soupe de graines de coriandre", "½ c. à café de curcuma en poudre", "1 c. à soupe de graines de cumin", "2 c. à soupe de sauce soja claire", "1 pincée de sel", "Piques en bois"], "etapes": ["Faire mariner le poulet dans la sauce soja.", "Piler au mortier les racines de coriandre, le sel et le poivre en grains ; ajouter gingembre, ail et épices et broyer en pâte grossière.", "Frotter le poulet de cette pâte et l'enfiler par 3 morceaux sur des piques.", "Griller les brochettes 2 min de chaque côté sur plancha ou barbecue, puis 3 à 4 min en les tournant (ou finir au four à 200 °C).", "Parsemer de coriandre et servir avec une salade de mangue verte si on veut."]}, {"n": 58, "titre": "Thon grillé au sésame, à la citronnelle et au gingembre", "meta": ["Livre thaï (titre non visible)  ·  Poisson / fruits de mer  ·  page 108", "Pour 4  ·  préparation 10 min  ·  cuisson 3 min", "Protéine : Thon 400 g (4 steaks)  (par personne : 100 g)"], "ing": ["3 cm de gingembre", "2 tiges de citronnelle", "Le zeste râpé et le jus de 3 citrons verts", "Le zeste râpé et le jus de 1 orange", "4 ciboules", "2 piments verts", "400 g de thon (4 steaks)", "10 feuilles de menthe", "3 brins de coriandre", "Poivre noir", "2 c. à soupe de sauce soja claire", "3 c. à soupe de graines de sésame", "1 c. à soupe d'huile végétale", "Sel"], "etapes": ["Mélanger dans un saladier gingembre, citronnelle, zestes et jus de citron vert et d'orange, sauce soja, ciboules et piments.", "Saler, poivrer les steaks de thon et les enrober de graines de sésame.", "Les saisir 90 s par face dans une poêle très chaude huilée.", "Les plonger dans la marinade avec la moitié des herbes.", "Servir nappés de marinade, parsemés du reste des herbes."]}, {"n": 59, "titre": "Calmars grillés à l'ail et au poivre", "meta": ["Livre thaï (titre non visible)  ·  Finger food  ·  page 36", "Pour 4  ·  préparation 10 min  ·  cuisson 3 min", "Protéine : Gros calmars ×3  (par personne : ≈ ¾ calmar)"], "ing": ["2 gousses d'ail", "3 petits piments verts", "4 cm de gingembre", "Le jus de 1 citron", "3 gros calmars", "½ c. à café de poivre blanc moulu", "2 c. à soupe de
